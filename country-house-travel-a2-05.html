<script type="application/json" id="lesson-data">{"title":"The Little Joys of Travelling","hero":"The Little Joys of Travelling","cabinet":"student-country-house.html","course":"country-house","level":"General English · A2+","key":"gostudy-country-house-travel-a2-05-v1","wordsKey":"gostudy-vocabulary-country-house-v1","preserve":"cloud","durationMinutes":50,"answerNamespace":"gostudy-country-house-travel-a2-05-v1","footer":"A2+ · General English · 50 minutes · Original GoStudy lesson","steps":[{"id":"irina-travel-a2-05-01","title":"01 · What makes a trip lovely?","minutes":6,"instruction":"WARM-UP · 6 min. Look at the three ideas. Choose your favourite and talk about your own travel habits. There are no right or wrong answers.","visual":{"kind":"cards","cards":[["🌊","By the sea","Fresh air and long walks","What do you enjoy by the sea?"],["🏘️","A new town","Small streets and cafés","Do you like exploring towns?"],["🌿","In nature","Quiet mornings outside","Where do you relax best?"]]},"source":["Let's talk: What kind of places do you enjoy visiting? Who do you usually travel with? Do you prefer a busy holiday or a quiet one?","Think of your last nice day away from home. Where did you go? What did you enjoy most?","TODAY · Talk about little travel pleasures and describe a happy trip using the Past Simple."],"teacherNotes":"Let the learner choose the direction of the conversation. Gently recycle went, stayed, saw, enjoyed. Aim for four or five full answers."},{"id":"irina-travel-a2-05-02","title":"02 · Six little travel pleasures","minutes":8,"instruction":"VOCABULARY · 8 min. Match each expression to its meaning. Then choose three you enjoy most and make your own sentences.","type":"match","items":[["walk around the old town",["visit shops only","explore the older streets of a place","go for a walk in the countryside"],1],["try local food",["eat dishes from that place","cook at home","buy food for the journey"],0],["enjoy the view",["look at the scenery with pleasure","look for a hotel","watch a film"],0],["find a quiet café",["choose a busy restaurant","visit a museum","discover a calm place for a drink"],2],["take photos",["buy postcards","use a camera or phone to keep memories","look at a map"],1],["spend time outdoors",["stay inside","be outside for a while","go shopping online"],1]],"source":["SAY IT NATURALLY · We walked around the old town. I tried local food. We enjoyed the view.","NOW SPEAK · Which two activities do you like to do first when you arrive in a new place? Why?"],"teacherNotes":"Keep pronunciation natural and slow. Elicit meaning from examples; let the student personalise three expressions. Do not introduce more target vocabulary."},{"id":"irina-travel-a2-05-03","title":"03 · A postcard from the sea","minutes":8,"instruction":"READING · 8 min. Read the friendly message. First answer: Was it a busy holiday or a relaxing one? Then choose the correct answers.","type":"choice","visual":{"kind":"alert","icon":"💌","title":"A short message from Emma","detail":"A happy weekend by the sea."},"source":["Hi Kate! Last month I went to a small town by the sea with my sister. We stayed in a cosy guesthouse (a small hotel) near the beach. On Saturday morning, we walked around the old town. There were colourful houses and little shops, but the streets were quiet.","At lunchtime, we found a quiet café and tried local food. I had fish and potatoes. It was simple and delicious. In the afternoon, we walked up a small hill and enjoyed the view of the sea. My sister took photos, but I put my phone away for a while.","On Sunday we spent time outdoors, read our books and had ice cream near the beach. We didn't have a busy schedule, and that was the best part. I came home relaxed and happy. Next time I'd like to stay one more day! Love, Emma.","AFTER READING · Which part of Emma's weekend would you enjoy? Explain in one or two sentences."],"items":[["Where did Emma and her sister stay?",["In a big hotel near the airport","In a small guesthouse near the beach","At a friend's apartment"],1],["What did they do on Saturday morning?",["They walked around the old town","They went swimming","They visited a big museum"],0],["Where did they enjoy the view?",["From a train","From their guesthouse","From a small hill"],2],["Why was the weekend special for Emma?",["They were very busy","They had time to relax","They bought many things"],1]],"teacherNotes":"Ask a gist question before the multiple choice. Keep the short personal follow-up; A2+ meaning and enjoyment are more important than speed."},{"id":"irina-travel-a2-05-04","title":"04 · How was your last trip?","minutes":7,"instruction":"GRAMMAR IN CONTEXT · 7 min. Notice the Past Simple in Emma's message. Choose the correct forms, then say two true sentences about your last trip.","type":"gap","source":["PAST SIMPLE · We stayed in a guesthouse. We tried local food. My sister took photos.","NEGATIVE · We didn't have a busy schedule. QUESTION · Did you enjoy the weekend?","REMEMBER · After did / didn't, use the base verb: Did you go? I didn't go. Say: I went, I saw, I took, I tried, I stayed."],"items":[["We ___ in a small guesthouse.",["stayed","stay","staying"],0],["I ___ local food on Saturday.",["try","tried","trying"],1],["My sister ___ lots of photos.",["taked","take","took"],2],["We ___ have a busy schedule.",["didn't","weren't","don't"],0],["___ you enjoy the view?",["Were","Did","Do"],1]],"teacherNotes":"Notice, practise, personalise. Briefly point out take → took and go → went. Ask the learner for two past-tense examples from real life."},{"id":"irina-travel-a2-05-05","title":"05 · Tell me more!","minutes":6,"instruction":"QUESTIONS & SPEAKING · 6 min. Choose natural Past Simple questions. Then ask your teacher three questions about a past trip.","type":"choice","source":["A GOOD CONVERSATION · Ask one question, listen to the answer and ask a short follow-up: Really? When was that? Did you like it?","YOUR TURN · Ask about a place, the food and one enjoyable moment. Answer three similar questions from your teacher."],"items":[["Choose the correct question.",["Where you did stay?","Where did you stay?","Where do you stayed?"],1],["Choose the correct question.",["Did you try local food?","Did you tried local food?","You did try local food?"],0],["Choose the correct question.",["What did you enjoyed?","What you enjoyed?","What did you enjoy?"],2]],"teacherNotes":"Do not let the multiple choice take more than two minutes. Use four minutes for a natural question-and-answer exchange."},{"id":"irina-travel-a2-05-06","title":"06 · The little things you love","minutes":6,"instruction":"FREE CONVERSATION · 6 min. Look at the pairs, choose the ideas you prefer and explain why. This is a relaxed conversation, not a test.","visual":{"kind":"cards","cards":[["☕","Morning","A quiet café","Or breakfast with a sea view?"],["🚶","Afternoon","A walk around town","Or time outdoors in a park?"],["📷","Memories","A few lovely photos","Or simply enjoy the moment?"]]},"source":["Which is more enjoyable for you: trying something new or returning to a favourite place?","Do you usually plan every day of a holiday, or do you like to decide in the morning?","What makes an ordinary day in a new place feel special? Try to use two expressions from today's vocabulary."],"teacherNotes":"The learner chooses any two or three prompts. The focus is personal meaning and fluency, not finishing every question."},{"id":"irina-travel-a2-05-07","title":"07 · A trip that made you smile","minutes":7,"instruction":"EXTENDED SPEAKING · 7 min. Tell your teacher about a pleasant trip or simply a lovely day in another place. Use the prompts to organise your story. Then write three short sentences to remember it.","type":"write","visual":{"kind":"alert","icon":"✨","title":"Your own happy memory","detail":"A real holiday, a weekend visit or a beautiful day out — any nice memory is welcome."},"source":["WHERE? Where did you go? Who went with you?","WHAT? What did you see, eat or do? Did you walk around? Did you take photos?","FEELING? What was your favourite part? Why did you enjoy it?","HELPFUL START · Last year / last month I went to… We stayed… I really enjoyed…","Speak naturally. You can use your own words — you don't need to include every prompt."],"teacherNotes":"Allow 60 seconds thinking and 3–4 minutes speaking with natural teacher follow-ups. The three sentences are a useful permanent note, not a formal writing task."},{"id":"irina-travel-a2-05-08","title":"08 · One nice thing to remember","minutes":2,"instruction":"WRAP-UP · 2 min. Finish with three quick answers. Celebrate clear communication, not perfect grammar.","visual":{"kind":"cards","cards":[["💛","One place","Where would you like to go again?","Say one reason."],["💬","One expression","Which travel phrase will you use?","Say a full sentence."],["🌟","One memory","What made your trip special?","Use the Past Simple."]]},"source":["TODAY YOU CAN · Describe a nice trip, ask Past Simple questions and use six natural travel expressions.","HOMEWORK · A short, friendly message about an enjoyable day away. No long essay."],"teacherNotes":"Use this final moment for specific, encouraging feedback and set the linked 12–15 minute homework."}]}</script>
