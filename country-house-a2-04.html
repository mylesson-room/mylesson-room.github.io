<script type="application/json" id="lesson-data">{"title":"A Sunday Picnic Plan","cabinet":"student-country-house.html","course":"country-house","level":"Country House · A2","key":"gostudy-country-house-a2-04-v1","wordsKey":"gostudy-vocabulary-country-house-v1","preserve":"cloud","durationMinutes":50,"steps":[{"id":"country-house-a2-04-0","title":"01 · A nice day outside","minutes":5,"instruction":"QUICK REVISION & LEAD-IN · 5 min. Tell your teacher two things you usually do at the country house and one thing you did last weekend.","source":["It is Sunday morning. Your family wants a picnic, but the weather may change. Look at the plan: there are four adults and two children.","Talk: Where do you like to have lunch outside? What food do you take? What do you do if it rains?","TODAY'S GOAL · Make a simple picnic plan, explain what you are going to do and change your plan if the weather changes."],"visual":{"kind":"cards","cards":[["🧺","Picnic","Six people","Everyone brings something."],["🌤️","Weather","Sunny now","Rain possible at 2 pm."],["🏡","Plan B","Country house","There is a table inside."]]},"teacherNotes":"5 min. Briefly recycle set the table, bring in, porch. Encourage full A2 sentences; model just one if needed."},{"id":"country-house-a2-04-1","title":"02 · Six useful picnic phrases","minutes":7,"instruction":"PRE-READING VOCABULARY · 7 min. Match the phrases to the meaning, then use two in your own plan.","type":"match","items":[["pack a picnic",["put food and things in a bag","open the windows","cook dinner"],0,""],["check the forecast",["call a neighbour","look at the expected weather","buy a new table"],1,""],["bring a blanket",["take something warm to sit on","wash the plates","move the car"],0,""],["find a shady spot",["look for a place away from the sun","wait for the bus","choose a very sunny place"],0,""],["set off",["stay home all day","start a journey","finish a meal"],1,""],["change the plan",["do something different from the first idea","buy more bread","sleep in the afternoon"],0,""]],"source":["SAY IT · We need to check the forecast. We're going to bring a blanket. We can change the plan if it rains."],"teacherNotes":"7 min. 6 productive lexical units; 3 min matching, 4 min mini-practice. Avoid adding extra target words."},{"id":"country-house-a2-04-2","title":"03 · A message from Anna","minutes":8,"instruction":"WHILE-READING · 8 min. Read Anna's message. First find the main plan; then answer the questions.","type":"choice","source":["Hi Irina! It's sunny now, so we're going to have a picnic near the lake. Let's set off at eleven. I'm going to pack sandwiches, fruit and water. Could you bring a blanket and some cups?","I checked the forecast this morning. It may rain after two o'clock, so we are going to eat before one. We can find a shady spot under the trees if it's very sunny. If the weather changes, we can have tea at the country house instead.","Please text me before ten if you cannot come. See you soon! Anna","AFTER READING · Tell your teacher which details are fixed and which could change."],"items":[["When are they planning to leave?",["At 11:00","At 14:00","At 10:00"],0,""],["What is Irina asked to bring?",["Sandwiches and fruit","A blanket and cups","A new table"],1,""],["Why will they eat before one?",["Anna needs to work","The lake closes","It may rain after two"],2,""],["What is their backup plan?",["Tea at the country house","A train journey","Lunch in a restaurant"],0,""]],"teacherNotes":"8 min. Read for gist before showing the questions. Follow each check with a spoken answer beginning 'They are going to…'."},{"id":"country-house-a2-04-3","title":"04 · What are you going to do?","minutes":8,"instruction":"LANGUAGE DISCOVERY · 8 min. Notice how Anna talks about intentions and plans, then practise.","source":["I am going to pack sandwiches. We are going to eat before one. They are not going to stay outside if it rains.","FORM · am / is / are + going to + base verb. Use it for plans and intentions.","SPEAK · Make two true sentences about your next weekend and one question for your teacher."],"type":"gap","items":[["I ___ bring some water.",["am going to","is going to","going"],0,""],["Anna ___ pack sandwiches.",["is going to","are going to","am"],0,""],["We ___ eat after two if it rains.",["isn't going to","aren't going to","not going"],1,""],["___ you going to bring a blanket?",["Is","Are","Am"],1,""],["They are going to ___ at eleven.",["left","leaving","set off"],2,""]],"teacherNotes":"8 min. Elicit the form from Anna's text. Explicitly contrast intention (going to) with uncertainty (may rain), then personalise."},{"id":"country-house-a2-04-4","title":"05 · Make the shopping list","minutes":6,"instruction":"GUIDED PRACTICE · 6 min. Choose the best items and explain your choices.","source":["SHOPPING BUDGET · You have 600 roubles and six people. You already have water and cups.","Basket A: sandwiches 350₽, apples 150₽, blanket from home 0₽. Total 500₽.","Basket B: pizza 500₽, juice 180₽, blanket from home 0₽. Total 680₽.","DISCUSS · Choose a basket, explain the budget and say who is going to bring each item."],"type":"choice","items":[["Which basket is within the 600₽ budget?",["Basket A","Basket B","Both baskets"],0,""],["Which sentence describes a plan correctly?",["We going to bring cups.","We are going to bring cups.","We are bring cups."],1,""],["What can you do if it rains?",["Have tea inside","Stay next to the lake for hours","Leave all food outside"],0,""]],"teacherNotes":"6 min. Don't spend more than 2 min on checks; spend 4 min on learner explanations and planning."},{"id":"country-house-a2-04-5","title":"06 · The weather changes","minutes":12,"instruction":"INDEPENDENT SPEAKING · 12 min. Make a plan with your teacher, then respond to a surprise.","source":["ROUND 1 · You are organising a picnic for six people. Tell your partner when you're going to set off, where you're going to sit and what everyone is going to bring. Ask at least two questions.","ROUND 2 · At 10:30, dark clouds appear. The forecast says heavy rain at noon. You have only 30 minutes to prepare an indoor lunch at the country house. Change the plan together.","CHECK · Use four target expressions and at least three sentences with going to. Finish with 'First…, then…, finally…'."],"visual":{"kind":"cards","cards":[["☀️","Round 1","Picnic by the lake","Agree on time, food and jobs."],["☔","Round 2","Rain before lunch","Organise an indoor alternative."]]},"teacherNotes":"12 min: 2 min plan, 4 min role-play, 4 min surprise, 2 min feedback. A2 success = clear plan plus questions, not perfect grammar."},{"id":"country-house-a2-04-6","title":"07 · Our plan in three sentences","minutes":4,"instruction":"WRAP-UP · 4 min. Say one thing you learned, one plan and one backup.","type":"write","source":["Write 3–4 short sentences: 'On Sunday, we're going to… First, I'm going to… If it rains, we're going to…'","HOMEWORK · Use the picnic expressions in a new message and make a short weekend plan."],"teacherNotes":"4 min. Correct one recurring form error; ask student to recall five or six expressions without looking."}]}</script>
