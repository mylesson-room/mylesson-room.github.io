function feedReading(){return card("Before the guests arrived","<p>Last Saturday, Nina and Max went to their country house. Nina opened the gate and Max took two boxes out of the car. They wanted to get the house ready before their friends arrived.</p><p>Nina swept the floor while Max put away the tools. Then they carried four chairs into the garden. At three o’clock, it started to rain, so they moved the chairs onto the porch. Nina found two blankets in a cupboard.</p><p>Their friends arrived at four and brought a cake. Everyone sat on the porch and listened to the rain. “Tomorrow we’re going to paint the gate,” said Max. “If it’s dry,” Nina laughed.</p>")+card("Put the story in order","<p>Что случилось раньше? Восстановите порядок трёх событий.</p><p>First, "+hwChoice("order1","Nina opened the gate",["their friends arrived","Nina opened the gate","it started to rain"])+".</p><p>Then, "+hwChoice("order2","it started to rain",["it started to rain","their friends arrived","Nina opened the gate"])+".</p><p>Finally, "+hwChoice("order3","their friends arrived",["Nina opened the gate","their friends arrived","it started to rain"])+".</p>");}

function installGapChecks(){function check(el){const v=el.value.trim(),ok=norm(v)===norm(el.dataset.gap);el.classList.toggle('correct',!!v&&ok);el.classList.toggle('incorrect',!!v&&!ok);$('#fb-'+el.id).textContent=!v?'':ok?'✓ Верно!':'Попробуйте ещё раз.';}$$('[data-gap]').forEach(el=>{el.addEventListener('blur',()=>check(el));el.addEventListener('change',()=>{state.answers[el.dataset.answer]=el.value;save();check(el);});el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();check(el);}});el.addEventListener('input',()=>{el.classList.remove('correct','incorrect');$('#fb-'+el.id).textContent='';});if(el.value.trim())check(el);});}
function installLesson(){installGapChecks();$$('[data-position]').forEach(b=>b.onclick=()=>{state.answers.position=Number(b.dataset.position);save();render();});$$('[data-feed-pick]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.feedPick),p=labPicks(),at=p.indexOf(i);if(at>=0)p.splice(at,1);else if(p.length<3)p.push(i);else{notify('Выберите не больше трёх видео. Можно снять выделение с другого.');return;}state.answers.feedPicks=p;save();const y=scrollY;render();scrollTo(0,y);});if($('#toggleExplore'))$('#toggleExplore').onclick=()=>{state.answers.explore=!state.answers.explore;save();const y=scrollY;render();scrollTo(0,y);};if($('#resetFeed'))$('#resetFeed').onclick=()=>{state.answers.feedPicks=[];state.answers.explore=false;save();render();};$('#exportBtn').hidden=true;}

const manualWord = $('#newWord');
const manualMeaning = $('#newMeaning');
const manualStatus = $('#dictStatus');
const manualCache = new Map();
let manualVersion = 0;
let manualTimer;
manualMeaning.addEventListener('input', () => {
  manualVersion++;
  clearTimeout(manualTimer);
  manualStatus.textContent = '';
});
function translateWhileTyping(event) {
  clearTimeout(manualTimer);
  const version = ++manualVersion;
  const query = manualWord.value.trim();
  manualMeaning.value = '';
  manualStatus.textContent = '';
  if (!query || event?.isComposing) return;
  const russian = /[а-яё]/i.test(query);
  const entry = state.words.find(word => norm(russian ? word.ru : word.en) === norm(query));
  const saved = russian ? entry?.en : entry?.ru;
  const immediate = saved || localTranslation(query) || manualCache.get(norm(query));
  if (immediate) {
    manualMeaning.value = immediate;
    return;
  }
  manualStatus.textContent = 'Переводим…';
  manualTimer = setTimeout(async () => {
    try {
      const result = await online(query);
      if (version !== manualVersion || manualWord.value.trim() !== query) return;
      manualCache.set(norm(query), result);
      manualMeaning.value = result;
      manualStatus.textContent = 'Перевод готов. Можно исправить перед сохранением.';
    } catch {
      if (version === manualVersion && manualWord.value.trim() === query) {
        manualStatus.textContent = 'Перевод недоступен. Можно ввести его вручную.';
      }
    }
  }, 300);
}
manualWord.addEventListener('input', translateWhileTyping);
manualWord.addEventListener('compositionend', translateWhileTyping);
manualMeaning.addEventListener('input', () => { manualVersion++; clearTimeout(manualTimer); manualStatus.textContent = ''; });
$('#wordForm').addEventListener('reset', () => {
  manualVersion++;
  clearTimeout(manualTimer);
  manualStatus.textContent = '';
});

const fmt=n=>Number.isFinite(n)?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'0:00';
function enhance(){const audio=document.getElementById('lessonAudio');if(!audio||audio.dataset.styled)return;audio.dataset.styled='1';audio.controls=false;audio.hidden=true;
const player=document.createElement('div');player.className='audio-player';player.innerHTML='<button type="button" class="audio-play" aria-label="Воспроизвести аудио">▶</button><div class="audio-track"><input type="range" min="0" max="100" step="0.1" value="0" aria-label="Позиция воспроизведения"><div class="audio-times"><span class="elapsed">0:00</span><span class="duration">0:48</span></div></div>';audio.after(player);
const button=player.querySelector('button'),range=player.querySelector('input');
const sync=()=>{button.textContent=audio.paused?'▶':'Ⅱ';button.setAttribute('aria-label',audio.paused?'Воспроизвести аудио':'Пауза');range.value=audio.duration?audio.currentTime/audio.duration*100:0;player.querySelector('.elapsed').textContent=fmt(audio.currentTime);if(Number.isFinite(audio.duration))player.querySelector('.duration').textContent=fmt(audio.duration);};

range.oninput=()=>{if(Number.isFinite(audio.duration))audio.currentTime=Number(range.value)*audio.duration/100;sync();};
['play','pause','ended','timeupdate','loadedmetadata','durationchange'].forEach(e=>audio.addEventListener(e,sync));sync();}
new MutationObserver(enhance).observe(document.getElementById('content'),{childList:true});enhance();
})();
