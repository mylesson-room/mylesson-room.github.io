<script type="application/json" id="lesson-data">{"title":"What's Going to Happen? · Homework","hero":"What's Going to Happen?","cabinet":"student-tiktok-a2.html","course":"tiktok-a2","level":"A2–A2+ · Grammar practice · 30–35 minutes","key":"gostudy-tiktok-a2-homework-v1","wordsKey":"gostudy-tiktok-a2-words-v1","preserve":"cloud","steps":[{"id":"future-hw-20261124-meaning","title":"01 · Match the situation","minutes":5,"instruction":"Match each sentence with its purpose.","visual":{"kind":"cards","cards":[["WILL","Решение сейчас","I'll get you some water.","Обещание / помощь: I'll help you.","Мнение: I think it will be sunny."],["BE GOING TO","План заранее","I'm going to visit my friends.","Намерение: I'm going to learn Spanish.","Видимые признаки: Look! It's going to rain."]]},"source":["Will + base verb. Negative: won't + base verb. Be going to: am/is/are + going to + base verb.","Both forms can sometimes be possible; choose the best option for the context."],"type":"match","items":[["I promise I'll call you tonight.",["A spontaneous decision","A plan made earlier","A promise","A prediction based on evidence","A personal prediction","An offer to help"],2],["I've already bought the tickets. I'm going to visit London.",["A spontaneous decision","A plan made earlier","A promise","A prediction based on evidence","A personal prediction","An offer to help"],1],["Look at that glass! It's going to fall.",["A spontaneous decision","A plan made earlier","A promise","A prediction based on evidence","A personal prediction","An offer to help"],3],["I think people will live longer in the future.",["A spontaneous decision","A plan made earlier","A promise","A prediction based on evidence","A personal prediction","An offer to help"],4],["Your bags look heavy. I'll carry them for you.",["A spontaneous decision","A plan made earlier","A promise","A prediction based on evidence","A personal prediction","An offer to help"],5],["Oh, we haven't got any milk! I'll buy some now.",["A spontaneous decision","A plan made earlier","A promise","A prediction based on evidence","A personal prediction","An offer to help"],0]],"teacherNotes":"1. A promise · 2. A plan made earlier · 3. A prediction based on evidence · 4. A personal prediction · 5. An offer to help · 6. A spontaneous decision"},{"id":"future-hw-20261124-predict","title":"02 · Look and predict","minutes":4,"instruction":"Look at the photographs. Complete with the full form of be going to. Write only the missing words.","html":"\u003csection class=\"material-card\" style=\"margin-bottom:18px;padding:14px\">\u003cfigure style=\"margin:0 0 12px\">\u003cimg src=\"https://images.pexels.com/photos/27548398/pexels-photo-27548398.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=900\" alt=\"Dark storm clouds\" loading=\"lazy\" decoding=\"async\" style=\"width:100%;max-height:230px;object-fit:cover;border-radius:12px\">\u003cfigcaption>\u003ca href=\"https://www.pexels.com/photo/clouds-27548398/\" target=\"_blank\" rel=\"noopener noreferrer\">Photo: Pexels\u003c/a>\u003c/figcaption>\u003c/figure>\u003cdiv class=\"gap-item unified-gap\" data-answer-row>\u003clabel class=\"field-label\" for=\"future-hw-20261124-predict-0\">1. Look at those dark clouds! It ___ (rain).\u003c/label>\u003cinput type=\"text\" id=\"future-hw-20261124-predict-0\" data-exercise-field=\"future-hw-20261124-predict-0\" data-expected=\"is going to rain\" autocomplete=\"off\" placeholder=\"Your answer\">\u003csmall class=\"feedback\" data-grade>\u003c/small>\u003c/div>\u003c/section>\u003csection class=\"material-card\" style=\"margin-bottom:18px;padding:14px\">\u003cfigure style=\"margin:0 0 12px\">\u003cimg src=\"https://images.pexels.com/photos/10348545/pexels-photo-10348545.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=900\" alt=\"Glass near the edge of a table\" loading=\"lazy\" decoding=\"async\" style=\"width:100%;max-height:230px;object-fit:cover;border-radius:12px\">\u003cfigcaption>\u003ca href=\"https://www.pexels.com/photo/clear-drinking-glass-on-the-edge-of-a-table-10348545/\" target=\"_blank\" rel=\"noopener noreferrer\">Photo: Pexels\u003c/a>\u003c/figcaption>\u003c/figure>\u003cdiv class=\"gap-item unified-gap\" data-answer-row>\u003clabel class=\"field-label\" for=\"future-hw-20261124-predict-1\">2. Be careful! The glass is on the edge of the table. It ___ (fall).\u003c/label>\u003cinput type=\"text\" id=\"future-hw-20261124-predict-1\" data-exercise-field=\"future-hw-20261124-predict-1\" data-expected=\"is going to fall\" autocomplete=\"off\" placeholder=\"Your answer\">\u003csmall class=\"feedback\" data-grade>\u003c/small>\u003c/div>\u003c/section>\u003csection class=\"material-card\" style=\"margin-bottom:18px;padding:14px\">\u003cfigure style=\"margin:0 0 12px\">\u003cimg src=\"https://images.pexels.com/photos/7034619/pexels-photo-7034619.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=900\" alt=\"Tired woman yawning while reading\" loading=\"lazy\" decoding=\"async\" style=\"width:100%;max-height:230px;object-fit:cover;border-radius:12px\">\u003cfigcaption>\u003ca href=\"https://www.pexels.com/photo/tired-lady-yawning-while-preparing-for-exams-at-home-7034619/\" target=\"_blank\" rel=\"noopener noreferrer\">Photo: Pexels\u003c/a>\u003c/figcaption>\u003c/figure>\u003cdiv class=\"gap-item unified-gap\" data-answer-row>\u003clabel class=\"field-label\" for=\"future-hw-20261124-predict-2\">3. She can hardly keep her eyes open. She ___ (fall asleep).\u003c/label>\u003cinput type=\"text\" id=\"future-hw-20261124-predict-2\" data-exercise-field=\"future-hw-20261124-predict-2\" data-expected=\"is going to fall asleep\" autocomplete=\"off\" placeholder=\"Your answer\">\u003csmall class=\"feedback\" data-grade>\u003c/small>\u003c/div>\u003c/section>\u003csection class=\"material-card\" style=\"margin-bottom:18px;padding:14px\">\u003cfigure style=\"margin:0 0 12px\">\u003cimg src=\"https://images.pexels.com/photos/3999307/pexels-photo-3999307.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=900\" alt=\"Football near a goal\" loading=\"lazy\" decoding=\"async\" style=\"width:100%;max-height:230px;object-fit:cover;border-radius:12px\">\u003cfigcaption>\u003ca href=\"https://www.pexels.com/photo/white-soccer-ball-on-green-grass-field-3999307/\" target=\"_blank\" rel=\"noopener noreferrer\">Photo: Pexels\u003c/a>\u003c/figcaption>\u003c/figure>\u003cdiv class=\"gap-item unified-gap\" data-answer-row>\u003clabel class=\"field-label\" for=\"future-hw-20261124-predict-3\">4. Imagine the ball is rolling towards the empty goal. It ___ (go in).\u003c/label>\u003cinput type=\"text\" id=\"future-hw-20261124-predict-3\" data-exercise-field=\"future-hw-20261124-predict-3\" data-expected=\"is going to go in\" autocomplete=\"off\" placeholder=\"Your answer\">\u003csmall class=\"feedback\" data-grade>\u003c/small>\u003c/div>\u003c/section>\u003cdetails data-teacher-only hidden>\u003csummary>Карточка преподавателя · Keys\u003c/summary>\u003cp>1. is going to rain · 2. is going to fall · 3. is going to fall asleep · 4. is going to go in\u003c/p>\u003c/details>"},{"id":"future-hw-20261124-choice","title":"03 · Make the right choice","minutes":6,"instruction":"Choose the best answer for the context.","type":"choice","items":[["I've already decided. I ___ a new phone next month.",["will buy","am going to buy"],1],["A: I can't open this bottle. B: Don't worry, I ___ you.",["will help","am going to help"],0],["I think our team ___ the match tomorrow.",["will win","is going to win"],0],["They've booked a hotel. They ___ the weekend in Paris.",["will spend","are going to spend"],1],["I promise I ___ anyone your secret.",["won't tell","am not going to tell"],0],["Look! That cyclist is about to hit a tree. He ___!",["will crash","is going to crash"],1],["A: What would you like to eat? B: Hmm... I ___ the chicken, please.",["will have","am going to have"],0],["She's bought all the ingredients. She ___ a cake tonight.",["will make","is going to make"],1],["I think this book ___ very popular one day.",["will be","is going to be"],0],["We've made our decision. We ___ to a bigger flat next year.",["will move","are going to move"],1]],"teacherNotes":"1. am going to buy · 2. will help · 3. will win · 4. are going to spend · 5. won't tell · 6. is going to crash · 7. will have · 8. is going to make · 9. will be · 10. are going to move"},{"id":"future-hw-20261124-dialogue","title":"04 · Finish the conversation","minutes":5,"instruction":"Complete each dialogue with your own idea using will or be going to.","html":"\u003csection class=\"material-card\" style=\"margin-bottom:14px;padding:14px\">\u003cstrong>Conversation 1\u003c/strong>\u003cp style=\"background:#edf3fc;padding:12px;border-radius:12px\">My phone is dead. I need to call my mum.\u003c/p>\u003cdiv class=\"gap-item unified-gap\" data-answer-row>\u003clabel class=\"field-label\" for=\"future-hw-20261124-dialogue-0\">Offer to help.\u003c/label>\u003cinput type=\"text\" id=\"future-hw-20261124-dialogue-0\" data-exercise-field=\"future-hw-20261124-dialogue-0\"  autocomplete=\"off\" placeholder=\"Your answer\">\u003csmall class=\"feedback\" data-grade>\u003c/small>\u003c/div>\u003c/section>\u003csection class=\"material-card\" style=\"margin-bottom:14px;padding:14px\">\u003cstrong>Conversation 2\u003c/strong>\u003cp style=\"background:#edf3fc;padding:12px;border-radius:12px\">Have you made any plans for Saturday?\u003c/p>\u003cdiv class=\"gap-item unified-gap\" data-answer-row>\u003clabel class=\"field-label\" for=\"future-hw-20261124-dialogue-1\">Tell your friend about a plan.\u003c/label>\u003cinput type=\"text\" id=\"future-hw-20261124-dialogue-1\" data-exercise-field=\"future-hw-20261124-dialogue-1\"  autocomplete=\"off\" placeholder=\"Your answer\">\u003csmall class=\"feedback\" data-grade>\u003c/small>\u003c/div>\u003c/section>\u003csection class=\"material-card\" style=\"margin-bottom:14px;padding:14px\">\u003cstrong>Conversation 3\u003c/strong>\u003cp style=\"background:#edf3fc;padding:12px;border-radius:12px\">Do you think life will be different in 2050?\u003c/p>\u003cdiv class=\"gap-item unified-gap\" data-answer-row>\u003clabel class=\"field-label\" for=\"future-hw-20261124-dialogue-2\">Make a prediction.\u003c/label>\u003cinput type=\"text\" id=\"future-hw-20261124-dialogue-2\" data-exercise-field=\"future-hw-20261124-dialogue-2\"  autocomplete=\"off\" placeholder=\"Your answer\">\u003csmall class=\"feedback\" data-grade>\u003c/small>\u003c/div>\u003c/section>\u003csection class=\"material-card\" style=\"margin-bottom:14px;padding:14px\">\u003cstrong>Conversation 4\u003c/strong>\u003cp style=\"background:#edf3fc;padding:12px;border-radius:12px\">Please don't forget my birthday!\u003c/p>\u003cdiv class=\"gap-item unified-gap\" data-answer-row>\u003clabel class=\"field-label\" for=\"future-hw-20261124-dialogue-3\">Make a promise.\u003c/label>\u003cinput type=\"text\" id=\"future-hw-20261124-dialogue-3\" data-exercise-field=\"future-hw-20261124-dialogue-3\"  autocomplete=\"off\" placeholder=\"Your answer\">\u003csmall class=\"feedback\" data-grade>\u003c/small>\u003c/div>\u003c/section>\u003csection class=\"material-card\" style=\"margin-bottom:14px;padding:14px\">\u003cstrong>Conversation 5\u003c/strong>\u003cp style=\"background:#edf3fc;padding:12px;border-radius:12px\">Why have you bought so much food?\u003c/p>\u003cdiv class=\"gap-item unified-gap\" data-answer-row>\u003clabel class=\"field-label\" for=\"future-hw-20261124-dialogue-4\">Explain your intention.\u003c/label>\u003cinput type=\"text\" id=\"future-hw-20261124-dialogue-4\" data-exercise-field=\"future-hw-20261124-dialogue-4\"  autocomplete=\"off\" placeholder=\"Your answer\">\u003csmall class=\"feedback\" data-grade>\u003c/small>\u003c/div>\u003c/section>\u003csection class=\"material-card\" style=\"margin-bottom:14px;padding:14px\">\u003cstrong>Conversation 6\u003c/strong>\u003cp style=\"background:#edf3fc;padding:12px;border-radius:12px\">Oh no! We've missed our bus!\u003c/p>\u003cdiv class=\"gap-item unified-gap\" data-answer-row>\u003clabel class=\"field-label\" for=\"future-hw-20261124-dialogue-5\">Make a spontaneous decision.\u003c/label>\u003cinput type=\"text\" id=\"future-hw-20261124-dialogue-5\" data-exercise-field=\"future-hw-20261124-dialogue-5\"  autocomplete=\"off\" placeholder=\"Your answer\">\u003csmall class=\"feedback\" data-grade>\u003c/small>\u003c/div>\u003c/section>\u003cdetails data-teacher-only hidden>\u003csummary>Карточка преподавателя · Keys\u003c/summary>\u003cp>1. I'll lend you my phone. · 2. I'm going to meet my friends. · 3. I think people will work less. · 4. I promise I won't forget. · 5. I'm going to have a party. · 6. I'll call a taxi.\u003c/p>\u003c/details>"},{"id":"future-hw-20261124-correct","title":"05 · Find and fix the mistake","minutes":5,"instruction":"Rewrite each sentence correctly. Your teacher will review your answers.","html":"\u003cdiv class=\"tip\">\u003cstrong>Grammar check\u003c/strong>\u003cp>will + verb · am/is/are going to + verb\u003c/p>\u003c/div>\u003cdiv class=\"gap-item unified-gap\" data-answer-row>\u003clabel class=\"field-label\" for=\"future-hw-20261124-correct-0\">1. She will to call you tomorrow.\u003c/label>\u003cinput type=\"text\" id=\"future-hw-20261124-correct-0\" data-exercise-field=\"future-hw-20261124-correct-0\"  autocomplete=\"off\" placeholder=\"Your answer\">\u003csmall class=\"feedback\" data-grade>\u003c/small>\u003c/div>\u003cdiv class=\"gap-item unified-gap\" data-answer-row>\u003clabel class=\"field-label\" for=\"future-hw-20261124-correct-1\">2. I going to buy a new dress.\u003c/label>\u003cinput type=\"text\" id=\"future-hw-20261124-correct-1\" data-exercise-field=\"future-hw-20261124-correct-1\"  autocomplete=\"off\" placeholder=\"Your answer\">\u003csmall class=\"feedback\" data-grade>\u003c/small>\u003c/div>\u003cdiv class=\"gap-item unified-gap\" data-answer-row>\u003clabel class=\"field-label\" for=\"future-hw-20261124-correct-2\">3. They are going visit their grandparents.\u003c/label>\u003cinput type=\"text\" id=\"future-hw-20261124-correct-2\" data-exercise-field=\"future-hw-20261124-correct-2\"  autocomplete=\"off\" placeholder=\"Your answer\">\u003csmall class=\"feedback\" data-grade>\u003c/small>\u003c/div>\u003cdiv class=\"gap-item unified-gap\" data-answer-row>\u003clabel class=\"field-label\" for=\"future-hw-20261124-correct-3\">4. He won't goes to work tomorrow.\u003c/label>\u003cinput type=\"text\" id=\"future-hw-20261124-correct-3\" data-exercise-field=\"future-hw-20261124-correct-3\"  autocomplete=\"off\" placeholder=\"Your answer\">\u003csmall class=\"feedback\" data-grade>\u003c/small>\u003c/div>\u003cdiv class=\"gap-item unified-gap\" data-answer-row>\u003clabel class=\"field-label\" for=\"future-hw-20261124-correct-4\">5. Do you going to watch this film?\u003c/label>\u003cinput type=\"text\" id=\"future-hw-20261124-correct-4\" data-exercise-field=\"future-hw-20261124-correct-4\"  autocomplete=\"off\" placeholder=\"Your answer\">\u003csmall class=\"feedback\" data-grade>\u003c/small>\u003c/div>\u003cdiv class=\"gap-item unified-gap\" data-answer-row>\u003clabel class=\"field-label\" for=\"future-hw-20261124-correct-5\">6. We will not to forget your birthday.\u003c/label>\u003cinput type=\"text\" id=\"future-hw-20261124-correct-5\" data-exercise-field=\"future-hw-20261124-correct-5\"  autocomplete=\"off\" placeholder=\"Your answer\">\u003csmall class=\"feedback\" data-grade>\u003c/small>\u003c/div>\u003cdiv class=\"gap-item unified-gap\" data-answer-row>\u003clabel class=\"field-label\" for=\"future-hw-20261124-correct-6\">7. My sister are going to study English.\u003c/label>\u003cinput type=\"text\" id=\"future-hw-20261124-correct-6\" data-exercise-field=\"future-hw-20261124-correct-6\"  autocomplete=\"off\" placeholder=\"Your answer\">\u003csmall class=\"feedback\" data-grade>\u003c/small>\u003c/div>\u003cdetails data-teacher-only hidden>\u003csummary>Карточка преподавателя · Keys\u003c/summary>\u003cp>1. She will call you tomorrow. · 2. I'm going to buy a new dress. · 3. They are going to visit their grandparents. · 4. He won't go to work tomorrow. · 5. Are you going to watch this film? · 6. We will not forget your birthday. · 7. My sister is going to study English.\u003c/p>\u003c/details>"},{"id":"future-hw-20261124-translate","title":"06 · Translate into English","minutes":5,"instruction":"Use will or be going to. Pay attention to the context.","html":"\u003cdiv class=\"gap-item unified-gap\" data-answer-row>\u003clabel class=\"field-label\" for=\"future-hw-20261124-translate-0\">1. Я собираюсь начать заниматься спортом. (Уже решила.)\u003c/label>\u003cinput type=\"text\" id=\"future-hw-20261124-translate-0\" data-exercise-field=\"future-hw-20261124-translate-0\"  autocomplete=\"off\" placeholder=\"Your answer\">\u003csmall class=\"feedback\" data-grade>\u003c/small>\u003c/div>\u003cdiv class=\"gap-item unified-gap\" data-answer-row>\u003clabel class=\"field-label\" for=\"future-hw-20261124-translate-1\">2. Думаю, завтра будет холодно.\u003c/label>\u003cinput type=\"text\" id=\"future-hw-20261124-translate-1\" data-exercise-field=\"future-hw-20261124-translate-1\"  autocomplete=\"off\" placeholder=\"Your answer\">\u003csmall class=\"feedback\" data-grade>\u003c/small>\u003c/div>\u003cdiv class=\"gap-item unified-gap\" data-answer-row>\u003clabel class=\"field-label\" for=\"future-hw-20261124-translate-2\">3. Не волнуйся, я тебе помогу.\u003c/label>\u003cinput type=\"text\" id=\"future-hw-20261124-translate-2\" data-exercise-field=\"future-hw-20261124-translate-2\"  autocomplete=\"off\" placeholder=\"Your answer\">\u003csmall class=\"feedback\" data-grade>\u003c/small>\u003c/div>\u003cdiv class=\"gap-item unified-gap\" data-answer-row>\u003clabel class=\"field-label\" for=\"future-hw-20261124-translate-3\">4. Посмотри на облака! Сейчас пойдёт дождь.\u003c/label>\u003cinput type=\"text\" id=\"future-hw-20261124-translate-3\" data-exercise-field=\"future-hw-20261124-translate-3\"  autocomplete=\"off\" placeholder=\"Your answer\">\u003csmall class=\"feedback\" data-grade>\u003c/small>\u003c/div>\u003cdiv class=\"gap-item unified-gap\" data-answer-row>\u003clabel class=\"field-label\" for=\"future-hw-20261124-translate-4\">5. Что ты собираешься делать на выходных?\u003c/label>\u003cinput type=\"text\" id=\"future-hw-20261124-translate-4\" data-exercise-field=\"future-hw-20261124-translate-4\"  autocomplete=\"off\" placeholder=\"Your answer\">\u003csmall class=\"feedback\" data-grade>\u003c/small>\u003c/div>\u003cdiv class=\"gap-item unified-gap\" data-answer-row>\u003clabel class=\"field-label\" for=\"future-hw-20261124-translate-5\">6. Обещаю, я не опоздаю.\u003c/label>\u003cinput type=\"text\" id=\"future-hw-20261124-translate-5\" data-exercise-field=\"future-hw-20261124-translate-5\"  autocomplete=\"off\" placeholder=\"Your answer\">\u003csmall class=\"feedback\" data-grade>\u003c/small>\u003c/div>\u003cdiv class=\"gap-item unified-gap\" data-answer-row>\u003clabel class=\"field-label\" for=\"future-hw-20261124-translate-6\">7. Мы собираемся купить новую машину. (Уже решили.)\u003c/label>\u003cinput type=\"text\" id=\"future-hw-20261124-translate-6\" data-exercise-field=\"future-hw-20261124-translate-6\"  autocomplete=\"off\" placeholder=\"Your answer\">\u003csmall class=\"feedback\" data-grade>\u003c/small>\u003c/div>\u003cdiv class=\"gap-item unified-gap\" data-answer-row>\u003clabel class=\"field-label\" for=\"future-hw-20261124-translate-7\">8. Ой, я забыла купить хлеб! Сейчас схожу в магазин.\u003c/label>\u003cinput type=\"text\" id=\"future-hw-20261124-translate-7\" data-exercise-field=\"future-hw-20261124-translate-7\"  autocomplete=\"off\" placeholder=\"Your answer\">\u003csmall class=\"feedback\" data-grade>\u003c/small>\u003c/div>\u003cdetails data-teacher-only hidden>\u003csummary>Карточка преподавателя · Keys\u003c/summary>\u003cp>1. I'm going to start exercising. · 2. I think it will be cold tomorrow. · 3. Don't worry, I'll help you. · 4. Look at the clouds! It's going to rain. · 5. What are you going to do this weekend? · 6. I promise I won't be late. · 7. We're going to buy a new car. · 8. Oh, I forgot to buy bread! I'll go to the shop now.\u003c/p>\u003c/details>"},{"id":"future-hw-20261124-write","title":"07 · My future","minutes":5,"instruction":"Write 6–8 sentences about your future.","type":"write","visual":{"kind":"cards","cards":[["3","My plans","I'm going to...","Three things you have already decided to do."],["2","My predictions","I think I will...","Two predictions about your future."],["1","My promise","I promise I will...","One promise to yourself."]]},"teacherNotes":"Accept natural alternatives. Check three plans, two predictions and one promise; correct verb forms and clear meaning."}],"contentVersion":"will-going-to-20261124-v1","overview":{"title":"What's Going to Happen?","level":"A2+","duration":35,"format":"Homework","goal":"Use will and be going to for decisions, plans, promises, offers and predictions."}}</script>
