<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7ff">
<meta name="robots" content="noindex,nofollow">
<title>Путешествия — тестовый урок · GoStudy</title>
<link rel="stylesheet" href="assets/gostudy-v1-lesson.css">
<style>
/* Пустая лаборатория визуальных уроков. Не содержит закрытых материалов или прогресса. */
.travel-lab{width:min(1080px,calc(100% - 36px));margin:clamp(22px,5vw,58px) auto}
.travel-lab__heading{display:flex;align-items:center;gap:12px;margin:0 0 20px}
.travel-lab__symbol{display:grid;place-items:center;width:50px;height:50px;border-radius:16px;background:#e5eeff;font-size:26px}
.travel-lab__heading small{display:block;color:#8190a8;font-size:12px;letter-spacing:.05em;font-weight:800}
.travel-lab__heading h1{margin:1px 0 0;font-size:clamp(28px,4vw,42px);letter-spacing:-1px;line-height:1.2}
.travel-lab__stage{
  display:grid;place-items:center;text-align:center;min-height:min(57vw,520px);
  padding:38px 24px;background:#fff;border:1px solid #e1e8f4;
  border-radius:24px;box-shadow:0 18px 46px #182e5309;
}
.travel-lab__stage p{max-width:460px;margin:0;font-size:clamp(21px,3vw,30px);line-height:1.4;font-weight:700;color:#52678b}
.travel-lab__back{display:inline-flex;align-items:center;min-height:44px;padding:10px 16px;border:1px solid #dde7f5;border-radius:12px;background:#fff;color:#284a83;font-weight:650;font-size:14px}
.travel-lab__back:hover{background:#f1f6ff}
@media(max-width:720px){
 .travel-lab__stage{min-height:55dvh;border-radius:19px}
 .travel-lab__heading{gap:9px}
 .travel-lab__symbol{width:45px;height:45px}
}
</style>
</head>
<body>
<header>
  <a class="brand lesson-brand" href="student-business-ai-finance.html" aria-label="GoStudy — кабинет Михаила"><img src="assets/gostudy-emblem.svg" alt="GoStudy"></a>
  <a class="travel-lab__back" href="student-business-ai-finance.html">← К кабинету</a>
</header>
<main class="travel-lab">
  <div class="travel-lab__heading">
    <span class="travel-lab__symbol" aria-hidden="true">✈</span>
    <div><small>ЭКСПЕРИМЕНТАЛЬНЫЙ УРОК</small><h1>Путешествия</h1></div>
  </div>
  <section class="travel-lab__stage" aria-label="Тестовая площадка будущего урока">
    <p>Тут проводим тестирование</p>
  </section>
</main>
</body>
</html>
