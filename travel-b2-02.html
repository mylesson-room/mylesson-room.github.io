<script>'use strict';
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key="gostudy-travel-b2-02-v1";let state={page:0,answers:{},words:[],dark:false};let storage=true;
try{const s=JSON.parse(GoStudyStorage.getItem(key)||'null');if(s&&typeof s==='object'){state={...state,...s};state.answers=s.answers&&typeof s.answers==='object'?s.answers:{};state.words=Array.isArray(s.words)?s.words.filter(w=>w&&typeof w.en==='string'&&typeof w.ru==='string'):[];}}catch(e){storage=false;}
const sharedWordKey="gostudy-travel-disruptions-b2-v1";
let lastWords = '';
function readSharedWords(){
  try {
    const shared = JSON.parse(GoStudyStorage.getItem(sharedWordKey) || '{}');
    if(Array.isArray(shared.words)) state.words = shared.words.filter(w=>w&&typeof w.en==='string'&&typeof w.ru==='string');
  } catch {}
  lastWords = JSON.stringify(state.words);
}
readSharedWords();
window.addEventListener('pageshow',()=>{readSharedWords();$('#wordCount').textContent=state.words.length;if($('#dictionary').open)renderWords();});
function save(){try{
  const currentWords = JSON.stringify(state.words);
  if(currentWords!==lastWords){
    const shared = JSON.parse(GoStudyStorage.getItem(sharedWordKey)||'{}');
    shared.words=state.words;
    GoStudyStorage.setItem(sharedWordKey,JSON.stringify(shared));
    lastWords=currentWords;
  }
  GoStudyStorage.setItem(key,JSON.stringify(state));}catch(e){storage=false;$('#storageNote').hidden=false;$('#storageNote').textContent='Saving unavailable. Export your answers and vocabulary before closing.';}$('#wordCount').textContent=state.words.length;}
let toastTimer;function notify(s){$('#toast').textContent=s;$('#toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),3200);}

const words = [
  ['a baggage tag','багажная бирка','The baggage tag shows where the suitcase should go.'],
  ['a reference number','номер обращения','Quote the reference number when you call back.'],
  ['to trace a bag','отследить багаж','The baggage desk can trace the bag using its tag.'],
  ['to confirm a delivery window','подтвердить интервал доставки','Could you confirm a delivery window for tomorrow?'],
  ['essential items','предметы первой необходимости','Keep receipts for any essential items you buy.'],
  ['to be entitled to','иметь право на','Ask what you may be entitled to under the policy.'],
  ['an estimate','ориентировочная оценка','An estimated arrival time can change.'],
  ['to follow up','связаться повторно','I’ll follow up if the bag hasn’t arrived by noon.']
];
const glossary=Object.fromEntries(words.flatMap(([en,ru])=>[[en,ru],[en.replace(/^(?:a|an|to) /,''),ru]]));
const norm=s=>s.toLowerCase().replace(/[’]/g,"'").replace(/^[\s.,!?;:]+|[\s.,!?;:]+$/g,'').replace(/\s+/g,' ');

function card(title,body){return '<article class="card"><h2>'+title+'</h2>'+body+'</article>';}
function hwChoice(id,answer,options){return '<select id="'+id+'" data-gap="'+answer+'" data-answer="'+id+'" aria-label="Пропуск '+id.replace('hw','')+'"><option value="">Выберите…</option>'+options.map(v=>'<option value="'+esc(v)+'" '+(state.answers[id]===v?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select><span class="feedback" id="fb-'+id+'" role="status"></span>';}
function installGapChecks(){function check(el){const v=el.value.trim(),ok=norm(v)===norm(el.dataset.gap);el.classList.toggle('correct',!!v&&ok);el.classList.toggle('incorrect',!!v&&!ok);$('#fb-'+el.id).textContent=!v?'':ok?'✓ Верно!':'Попробуйте ещё раз.';}$$('[data-gap]').forEach(el=>{el.addEventListener('blur',()=>check(el));el.addEventListener('change',()=>{state.answers[el.dataset.answer]=el.value;save();check(el);});el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();check(el);}});el.addEventListener('input',()=>{el.classList.remove('correct','incorrect');$('#fb-'+el.id).textContent='';});if(el.value.trim())check(el);});}
function addWord(en,ru){en=en.trim();ru=ru.trim();if(/[а-яё]/i.test(en)&&/[a-z]/i.test(ru)&&!/[а-яё]/i.test(ru)){[en,ru]=[ru,en];}if(!en||!ru){notify('Add a word and its translation.');return false;}const old=state.words.find(w=>norm(w.en)===norm(en));if(old)old.ru=ru;else state.words.push({en,ru});save();notify(old?'Translation updated.':'Word saved ✓');return true;}
function renderWords(){const list=$('#wordList');list.innerHTML=state.words.length?state.words.map((w,i)=>`<div class="dictrow"><div><strong>${esc(w.en)}</strong><p>${esc(w.ru)}</p></div><div><button type="button" class="small-button" data-speak-word>🔊 Прослушать слово</button> <button class="small-button" data-edit="${i}" aria-label="Edit ${esc(w.en)}">Edit</button> <button class="small-button" data-delete="${i}" aria-label="Delete ${esc(w.en)}">✕</button></div></div>`).join(''):'<p class="muted dict-empty">Пока пусто. Выделите слово в уроке или добавьте его выше.</p>';$$('[data-edit]').forEach(b=>b.onclick=()=>{const w=state.words[Number(b.dataset.edit)];cancelWordTranslation();$('#newWord').value=w.en;$('#newMeaning').value=w.ru;$('#newMeaning').focus();});$$('[data-delete]').forEach(b=>b.onclick=()=>{state.words.splice(Number(b.dataset.delete),1);save();renderWords();});}
function openDict(){window.getSelection()?.removeAllRanges();$('#translationPop').hidden=true;renderWords();$('#dictionary').showModal();}$('#dictBtn').onclick=openDict;$('#closeDict').onclick=()=>$('#dictionary').close();$('#wordForm').onsubmit=e=>{e.preventDefault();if(addWord($('#newWord').value,$('#newMeaning').value)){e.target.reset();renderWords();}};
$('#trainWords').onclick=openTraining;$('#closeTraining').onclick=()=>$('#trainingDialog').close();

function localTranslation(text){const n=norm(text);if(!/[а-яё]/i.test(n))return glossary[n]||'';const aliases={'загран паспорт':'passport','загранпаспорт':'passport','заграничный паспорт':'passport','посадочный талон':'boarding pass','ручная кладь':'hand luggage','место у окна':'window seat','место у прохода':'aisle seat'};if(aliases[n])return aliases[n];const found=Object.entries(glossary).find(([en,ru])=>ru.split(';').some(part=>norm(part)===n));return found?found[0]:'';}

const wordInput = $('#newWord');
const meaningInput = $('#newMeaning');
const wordStatus = $('#dictStatus');
const translationCache = new Map();
let translationTimer;
let translationVersion = 0;

function cancelWordTranslation() {
  clearTimeout(translationTimer);
  translationVersion++;
  wordStatus.textContent = '';
}

function translateWordInput(event) {
  cancelWordTranslation();
  const version = translationVersion;
  const query = wordInput.value.trim();
  meaningInput.value = '';
  if (event.isComposing || !/[a-zа-яё]/i.test(query)) return;

  const normalized = norm(query);
  const russian = /[а-яё]/i.test(query);
  const saved = state.words.find(word => norm(russian ? word.ru : word.en) === normalized);
  const translation = (russian ? saved?.en : saved?.ru) || localTranslation(query) || translationCache.get(normalized);
  if (translation) {
    meaningInput.value = translation;
    return;
  }

  wordStatus.textContent = 'Переводим…';
  translationTimer = setTimeout(async () => {
    try {
      const result = await online(query);
      if (version !== translationVersion || wordInput.value.trim() !== query) return;
      translationCache.set(normalized, result);
      meaningInput.value = result;
      wordStatus.textContent = '';
    } catch {
      if (version === translationVersion) wordStatus.textContent = 'Перевод недоступен. Можно ввести его вручную.';
    }
  }, 300);
}

wordInput.addEventListener('compositionend', translateWordInput);

}

  return card('Wait or make a backup plan?', '<p>Elena is meeting her friend at noon. She can stay at the guesthouse until 11:15 or ask reception to accept the bag and leave earlier.</p><ol class="talk-list"><li>Which option would you choose and why?</li><li>What would you confirm with reception before leaving?</li><li>If the bag didn’t arrive until the evening, how would you adapt your plans?</li></ol><p><b>Useful language:</b> <i>I’d rather… · The main drawback is… · If the bag hasn’t arrived by…, I’ll…</i></p>');
}
function recap(){
  return card('Your 60-second summary', '<p>Explain what happened to Elena’s bag, what she agreed with the airline and what she’ll do if the delivery is late. Use three phrases from the lesson.</p><p><a class="small-button" href="travel-b2-02-homework.html">Домашнее задание к уроку 2 →</a></p>');
}
const screens=[warmUp,vocabulary,reading,voicemail,practice,rolePlay,discussion,recap];
function render(){
  const [title,goal]=sections[state.page];
  $('#title').textContent=title;
  $('#goal').textContent=goal;
  $('#counter').textContent=(state.page+1)+' / '+sections.length;
  $('#prev').disabled=state.page===0;
  $('#next').textContent=state.page===sections.length-1?'К домашке →':'Далее →';
  $('#content').innerHTML=art[state.page]+screens[state.page]();
  $('#nav').innerHTML=sections.map(([name],i)=>'<button type="button" data-page="'+i+'" class="'+(i===state.page?'active':'')+'"><span>'+String(i+1).padStart(2,'0')+'</span>'+esc(name)+'</button>').join('');
  installGapChecks();
  $$('[data-page]').forEach(button=>button.onclick=()=>go(Number(button.dataset.page)));
  $$('[data-add]').forEach(button=>button.onclick=()=>{const [en,ru]=words[Number(button.dataset.add)];addWord(en,ru);});
  save();
}
function go(page){
  $('#lessonAudio')?.pause();
  $('#translationPop').hidden=true;
  $('#lessonMenu').close();
  state.page=page;
  render();
  $('#title').focus({preventScroll:true});
  window.scrollTo(0,0);
}
if (state.lessonLayout !== 2) {
  state.page = [0, 2, 3, 4, 5, 7][state.page] ?? 0;
  if (state.answers.hwCallback === 'Call to confirm the address and give the room number') {
    state.answers.hwCallback = 'Call to confirm the address and say who can sign for the bag';
  }
  state.lessonLayout = 2;
}
if(!Number.isInteger(state.page)||state.page<0||state.page>=sections.length)state.page=0;
$('#prev').onclick=()=>go(Math.max(0,state.page-1));
$('#next').onclick=()=>{if(state.page===sections.length-1)location.assign('travel-b2-02-homework.html');else go(state.page+1);};
$('#menuBtn').onclick=()=>{$('#lessonMenu').showModal();$('#menuBtn').setAttribute('aria-expanded','true');};
$('#closeMenu').onclick=()=>$('#lessonMenu').close();
$('#lessonMenu').onclose=()=>$('#menuBtn').setAttribute('aria-expanded','false');
render();
document.body.classList.toggle('dark',!!state.dark);
$('#themeBtn').onclick=()=>{state.dark=!state.dark;document.body.classList.toggle('dark',state.dark);save();};
if(location.hash==='#vocabulary')openDict();
if(location.hash==='#training')openTraining();
if(!storage){$('#storageNote').hidden=false;$('#storageNote').textContent='Ответы не удалось сохранить в этом браузере.';}
</script><script>
(()=>{
const fmt=n=>Number.isFinite(n)?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'0:00';
function enhance(){const audio=document.getElementById('lessonAudio');if(!audio||audio.dataset.styled)return;audio.dataset.styled='1';audio.controls=false;audio.hidden=true;
const player=document.createElement('div');player.className='audio-player';player.innerHTML='<button type="button" class="audio-play" aria-label="Воспроизвести аудио">▶</button><div class="audio-track"><input type="range" min="0" max="100" step="0.1" value="0" aria-label="Позиция воспроизведения"><div class="audio-times"><span class="elapsed">0:00</span><span class="duration">0:00</span></div></div>';audio.after(player);
const button=player.querySelector('button'),range=player.querySelector('input');
const sync=()=>{button.textContent=audio.paused?'▶':'Ⅱ';button.setAttribute('aria-label',audio.paused?'Воспроизвести аудио':'Пауза');range.value=audio.duration?audio.currentTime/audio.duration*100:0;player.querySelector('.elapsed').textContent=fmt(audio.currentTime);if(Number.isFinite(audio.duration))player.querySelector('.duration').textContent=fmt(audio.duration);};
button.onclick=()=>{if(audio.paused)audio.play().catch(()=>{audio.hidden=false;audio.controls=true;player.hidden=true;});else audio.pause();};
range.oninput=()=>{if(Number.isFinite(audio.duration))audio.currentTime=Number(range.value)*audio.duration/100;sync();};
['play','pause','ended','timeupdate','loadedmetadata','durationchange'].forEach(e=>audio.addEventListener(e,sync));sync();}
new MutationObserver(enhance).observe(document.getElementById('content'),{childList:true});enhance();
})();
</script><script>
function speakTravelTerm(term) {
  if (!term || !('speechSynthesis' in window)) return;
  const utterance = new SpeechSynthesisUtterance(term);
  utterance.lang = /[а-яё]/i.test(term) ? 'ru-RU' : 'en-GB';
  utterance.rate = 0.88;
  speechSynthesis.cancel();
  speechSynthesis.speak(utterance);
}
$('#speakSelected').disabled = !('speechSynthesis' in window);
$('#speakSelected').onclick = () => speakTravelTerm($('#selectedWord').textContent.trim());
document.addEventListener('click', event => {
  const word = event.target.closest('[data-speak-word]')?.closest('.word, .dictrow')?.querySelector('strong');
  if (word) speakTravelTerm(word.textContent.trim());
});
</script></body></html>
