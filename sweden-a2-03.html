<script type="application/json" id="lesson-data">{"title":"A Day Trip from Stockholm","cabinet":"student-sweden.html","course":"sweden-a2","level":"Travel in Sweden · A2","key":"gostudy-sweden-a2-03-v1","wordsKey":"gostudy-vocabulary-sweden-a2-v1","preserve":"cloud","durationMinutes":50,"hero":"A Day Trip from Stockholm","subtitle":"Sweden · Lesson 03","footer":"Travel in Sweden · Lesson 03 · A2","steps":[{"id":"sweden-03-0","title":"01 · Remember yesterday","minutes":5,"instruction":"SPEAK · 5 min. Pick up from your first day in Sweden. Use short sentences; your teacher asks follow-up questions.","source":["LAST TIME · You arrived in Sweden, found your hotel, ordered in a café and made a plan for a rainy afternoon.","SAY · Where did you go yesterday? What did you order? Was the weather good?","TODAY'S GOAL · Plan a short day trip, ask about a train, understand a change and choose a new plan.","SUPPORT · Yesterday I went to… / I had… / It was… / Tomorrow I'd like to…"],"visual":{"kind":"cards","cards":[["☕","Yesterday","A café by the water","What did you have?"],["🚆","Today","A train to a small town","Where would you like to go?"]]},"teacherNotes":"5 min. Recall 2 items from Lesson 02; accept a short story and elicit one simple follow-up per answer."},{"id":"sweden-03-1","title":"02 · Words at the station","minutes":8,"instruction":"VOCABULARY · 8 min. Match six useful expressions. Say one sentence about your own trip.","source":["ACTIVE VOCABULARY · timetable · platform · departure · delayed · single ticket · change trains","Use your own examples: 'What platform does the train leave from?' / 'Is the train on time?'"],"type":"match","items":[["timetable",["a list of departure times","a place to buy coffee","a train window"],0,""],["platform",["a room at the hotel","the place where you wait for a train","a large suitcase"],1,""],["departure",["the time a journey starts","the price of a ticket","the name of a café"],0,""],["delayed",["leaving later than planned","arriving early","travelling without a ticket"],0,""],["single ticket",["a ticket for one journey","a ticket for a whole year","a ticket for two people"],0,""],["change trains",["take a different train during the journey","move to another seat","cancel your holiday"],0,""]],"visual":{"kind":"route","stops":[["🕙","10:20","Platform 4","Train to Lindby (a fictional town)."],["🕚","11:05","Platform 2","Later train to Lindby."]]},"teacherNotes":"8 min. Six active items, each tied to the task. Prior lesson's 'return ticket' can be recycled in contrast to 'single ticket'."},{"id":"sweden-03-2","title":"03 · Check the timetable","minutes":8,"instruction":"READ & DECIDE · 8 min. Read the fictional station information. Check the facts, then explain what you would do.","source":["STOCKHOLM CENTRAL · Fictional practice timetable (not real travel information).","TRAIN A · To Lindby · 10:20 · Platform 4 · 90 SEK · direct · arrives 11:00.","TRAIN B · To Lindby · 11:05 · Platform 2 · 120 SEK · change trains once · arrives 12:00.","NOTICE · Train A is delayed by 25 minutes. New departure: 10:45. Platform 4 is unchanged.","DISCUSS · Which train would you choose now? Why? Is a direct train always better?"],"type":"choice","items":[["What is the new departure time for Train A?",["10:20","10:45","11:05"],1,""],["Which train costs 120 SEK?",["Train A","Both trains","Train B"],2,""],["Which train is direct?",["Train A","Train B","Neither train"],0,""],["Does the delay change Train A's platform?",["Yes, to platform 2","No, it stays platform 4","The notice does not say"],1,""]],"teacherNotes":"8 min. 3 min scan, 2 min comprehension, 3 min decision. Fictional timetable avoids accidental real-world travel misinformation."},{"id":"sweden-03-3","title":"04 · What do we have to do?","minutes":7,"instruction":"GRAMMAR IN CONTEXT · 7 min. Use 'have to' for a necessary action, 'don't have to' for something that is not necessary, and 'can' for an option.","source":["TRAIN RULES · You have to show your ticket when the inspector asks.","You don't have to print an e-ticket; you can show it on your phone.","You have to be on the correct platform. You can ask station staff for help.","MEANING · 'Don't have to' means 'it's not necessary'. It does not mean 'not allowed'.","SPEAK · What do you have to do before your next trip? What don't you have to do?"],"type":"gap","items":[["You ___ show your ticket if the inspector asks.",["have to","don't have to","has to"],0,""],["You ___ print an e-ticket. You can use your phone.",["have to","don't have to","has to"],1,""],["She ___ check the departure time before leaving.",["have to","don't have to","has to"],2,""],["You ___ ask for help if you cannot find the platform.",["can","can't to","have"],0,""]],"teacherNotes":"7 min. Explicitly contrast required/not necessary/possible. Don't introduce 'mustn't' as a fourth contrast at A2."},{"id":"sweden-03-4","title":"05 · A quick message","minutes":6,"instruction":"GUIDED WRITING · 6 min. Send a friendly update to someone waiting for you. Use the timetable and today's grammar.","source":["YOUR FRIEND · 'Hi! Are you on the 10:20 train? What time will you arrive?'","WRITE 3–4 SENTENCES · Tell your friend the train is delayed, give the new departure, say what you have to do and suggest a plan.","USEFUL START · 'Hi! My train is delayed. It leaves at… I have to… We can…'","AFTER WRITING · Read your message aloud. Your teacher asks one question."],"type":"write","teacherNotes":"6 min. Fluency-oriented, not sentence-by-sentence correction. Check one accurate timetable reference and one 'have to' form."},{"id":"sweden-03-5","title":"06 · At the ticket desk","minutes":11,"instruction":"ROLEPLAY · 11 min. Ask for travel information and solve a problem. Switch roles for round two.","source":["ROUND 1 · You are the traveller. Ask: 'What time does the train leave?' 'Which platform?' 'Is it direct?' 'How much is a single ticket?'","THE TEACHER is the station assistant. Answer with information from the fictional timetable. Say Train A is delayed.","ROUND 2 · The assistant says: 'Train A will leave at 11:30, not 10:45.' The traveller now has to choose between waiting and taking Train B.","DECIDE · Explain your choice using: 'I think… because…' / 'I have to…' / 'I don't have to…' / 'Can I…?'","SUCCESS CHECK · Ask three clear questions, understand a delay, respond politely and explain one decision."],"visual":{"kind":"cards","cards":[["🎫","Traveller","Ask for a ticket","Keep the conversation going."],["🚉","Station assistant","Explain a delay","Give clear times and options."]]},"teacherNotes":"11 min. 4 min Round 1, 4 min Round 2, 3 min feedback and second try. Teacher adapts speed; student must ask questions, not just choose answers."},{"id":"sweden-03-6","title":"07 · Your travel plan","minutes":5,"instruction":"WRAP-UP · 5 min. Create a short personal plan and check what you can now do in English.","source":["FINAL SPEAK · 'Tomorrow I want to visit… I will leave at… I have to… I don't have to… If my train is delayed, I can…'","REUSE · Include at least three new expressions from the station vocabulary.","SELF-CHECK · Can you ask about departure, platform and price? Can you explain a delay? Can you say what is necessary?","HOMEWORK · Read a short fictional train update, practise the six expressions and write a polite message about a change of plan."],"type":"write","teacherNotes":"5 min. 2 min production, 2 min feedback, 1 min assign homework. Assessment: successful independent travel inquiry, 3 target words, accurate necessity/option distinction."}]}</script>
