      "id": "warm-up",
      "title": "Would you trust AI with your money?",
      "label": "Let's talk · 7 min",
      "html": "<div class=\"tip\"><h2>Imagine this.</h2><p>Your bank app says: “Our AI can save you $150 every month.” Would you let it decide how to spend your money?</p></div>\n<div class=\"question-item\"><strong>1. What do you usually use your banking app for?</strong><textarea maxlength=\"3500\" data-exercise-field=\"warm1\" placeholder=\"I normally use it to…\"></textarea></div>\n<div class=\"question-item\"><strong>2. Which financial decisions would you let AI make?</strong><div class=\"options\"><label><input type=\"checkbox\" data-exercise-field=\"warm2a\"> Find expensive subscriptions</label><label><input type=\"checkbox\" data-exercise-field=\"warm2b\"> Recommend a savings plan</label><label><input type=\"checkbox\" data-exercise-field=\"warm2c\"> Decide whether I get a loan</label><label><input type=\"checkbox\" data-exercise-field=\"warm2d\"> Invest all my savings</label></div></div>\n<div class=\"question-item\"><strong>3. Why is it sometimes difficult to trust technology?</strong><textarea maxlength=\"3500\" data-exercise-field=\"warm3\" placeholder=\"I think… because…\"></textarea></div>"

      "id": "vocabulary",
      "title": "Money words that matter",
      "label": "Useful words · 8 min",
      "html": "<p>Learn six useful expressions. Then use them to talk about your own experience.</p>\n<div class=\"vocab\"><article><b>savings</b><p>money you keep for the future</p><span class=\"tiny\">I put 10% of my salary into savings.</span></article><article><b>fraud</b><p>a crime in which someone tricks you to take your money</p><span class=\"tiny\">The bank stopped a fraud attempt.</span></article><article><b>investment</b><p>money used to try to earn more money</p><span class=\"tiny\">Every investment has a risk.</span></article><article><b>loan</b><p>money you borrow and usually pay back with interest</p><span class=\"tiny\">She applied for a car loan.</span></article><article><b>risk</b><p>the possibility of something bad happening</p><span class=\"tiny\">AI can reduce some risks but create others.</span></article><article><b>reliable</b><p>someone or something you can trust</p><span class=\"tiny\">Is an AI chatbot a reliable financial adviser?</span></article></div>\n<div class=\"activity\"><h3>Fill in the gaps</h3><p>Use: savings · fraud · investment · loan · risk · reliable</p><div class=\"gap-item\" data-answer-row><label>1. The bank stopped a possible <input type=\"text\" data-exercise-field=\"gap0\" data-expected=\"fraud\" aria-label=\"Gap 1\" autocomplete=\"off\"> attempt.</label><p class=\"feedback\" data-grade></p></div>\n<div class=\"gap-item\" data-answer-row><label>2. She puts some of her salary into <input type=\"text\" data-exercise-field=\"gap1\" data-expected=\"savings\" aria-label=\"Gap 2\" autocomplete=\"off\">.</label><p class=\"feedback\" data-grade></p></div>\n<div class=\"gap-item\" data-answer-row><label>3. He took out a <input type=\"text\" data-exercise-field=\"gap2\" data-expected=\"loan\" aria-label=\"Gap 3\" autocomplete=\"off\"> to buy a car.</label><p class=\"feedback\" data-grade></p></div>\n<div class=\"gap-item\" data-answer-row><label>4. Every <input type=\"text\" data-exercise-field=\"gap3\" data-expected=\"investment\" aria-label=\"Gap 4\" autocomplete=\"off\"> can lose value.</label><p class=\"feedback\" data-grade></p></div>\n<div class=\"gap-item\" data-answer-row><label>5. There is always some <input type=\"text\" data-exercise-field=\"gap4\" data-expected=\"risk\" aria-label=\"Gap 5\" autocomplete=\"off\"> when we invest money.</label><p class=\"feedback\" data-grade></p></div>\n<div class=\"gap-item\" data-answer-row><label>6. I need a <input type=\"text\" data-exercise-field=\"gap5\" data-expected=\"reliable\" aria-label=\"Gap 6\" autocomplete=\"off\"> source before I trust financial advice.</label><p class=\"feedback\" data-grade></p></div><button type=\"button\" class=\"outline\" data-check-section>Check answers</button><p class=\"feedback\" data-section-score aria-live=\"polite\"></p></div>\n<div class=\"question-item\"><strong>Personalise it: Which two new words describe your financial life best?</strong><textarea maxlength=\"3500\" data-exercise-field=\"wordsPersonal\" placeholder=\"For me, …\"></textarea></div>"

      "id": "reading",
      "title": "Your bank has a new colleague. It isn't human.",
      "label": "Read & think · 10 min",
      "html": "\n<div class=\"article\"><p>Many banks now use artificial intelligence to study payments, find unusual activity and answer simple questions. For example, an AI system can notice a payment that looks different from a customer's normal spending. It can then warn the bank or ask the customer to check it.</p><p>AI can also help people understand their spending and plan their savings. However, the technology can make mistakes. An AI system might block a normal payment or give advice that does not fit someone's situation. A bank still needs people to explain important decisions and solve problems.</p><p>In 2026, financial regulators continued to study both the benefits and the risks of AI in banking. Their main question is not simply “Can AI do it?” but “How can people use AI safely?”</p><p class=\"tiny\">Adapted educational text based on the Bank of England and FCA 2026 AI survey. <a href=\"https://www.bankofengland.co.uk/report/2026/artificial-intelligence-in-uk-financial-services-2026\" target=\"_blank\" rel=\"noopener noreferrer\">Original research ↗</a></p></div>\n<fieldset class=\"question-item unified-question\" data-answer-row><legend>What can AI notice?</legend><div class=\"options\"><label><input type=\"radio\" name=\"reading0\" value=\"0\" data-exercise-field=\"reading0\" data-legacy-key=\"reading0-0\" data-expected=\"0\"> Payments that are different from normal spending</label><label><input type=\"radio\" name=\"reading0\" value=\"1\" data-exercise-field=\"reading0\" data-legacy-key=\"reading0-1\"> Only payments over $1,000</label><label><input type=\"radio\" name=\"reading0\" value=\"2\" data-exercise-field=\"reading0\" data-legacy-key=\"reading0-2\"> What a person is thinking</label></div><p class=\"result\" data-grade></p></fieldset>\n<fieldset class=\"question-item unified-question\" data-answer-row><legend>Why are humans still important?</legend><div class=\"options\"><label><input type=\"radio\" name=\"reading1\" value=\"0\" data-exercise-field=\"reading1\" data-legacy-key=\"reading1-0\" data-expected=\"1\"> They type faster than AI</label><label><input type=\"radio\" name=\"reading1\" value=\"1\" data-exercise-field=\"reading1\" data-legacy-key=\"reading1-1\"> They explain important decisions and fix problems</label><label><input type=\"radio\" name=\"reading1\" value=\"2\" data-exercise-field=\"reading1\" data-legacy-key=\"reading1-2\"> AI never makes mistakes</label></div><p class=\"result\" data-grade></p></fieldset>\n<fieldset class=\"question-item unified-question\" data-answer-row><legend>The text says AI is…</legend><div class=\"options\"><label><input type=\"radio\" name=\"reading2\" value=\"0\" data-exercise-field=\"reading2\" data-legacy-key=\"reading2-0\" data-expected=\"2\"> always safe</label><label><input type=\"radio\" name=\"reading2\" value=\"1\" data-exercise-field=\"reading2\" data-legacy-key=\"reading2-1\"> never useful</label><label><input type=\"radio\" name=\"reading2\" value=\"2\" data-exercise-field=\"reading2\" data-legacy-key=\"reading2-2\"> useful but not perfect</label></div><p class=\"result\" data-grade></p></fieldset><button type=\"button\" class=\"outline\" data-check-section>Check reading</button><p class=\"feedback\" data-section-score aria-live=\"polite\"></p>\n<div class=\"question-item\"><strong>Discussion: Should a bank explain when AI makes a decision about you?</strong><textarea maxlength=\"3500\" data-exercise-field=\"readExplain\" placeholder=\"Yes, because… / No, because…\"></textarea></div>"

      "id": "newsroom",
      "title": "Two real stories. One big question.",
      "label": "2026 news · 10 min",
      "html": "\n<div class=\"article\"><span class=\"pill\">News 1 · 2026</span><h3>Banks are using more third-party AI</h3><p>In a 2026 Bank of England and FCA survey, outside companies provided <b>39%</b> of reported AI systems, compared with <b>33%</b> in 2024. This means banks increasingly depend on technology made by other companies.</p><p class=\"tiny\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.bankofengland.co.uk/report/2026/artificial-intelligence-in-uk-financial-services-2026\">Read the original research ↗</a></p></div>\n<div class=\"article\"><span class=\"pill\">News 2 · 16 November 2026</span><h3>US regulator warns about AI in finance</h3><p>Federal Reserve Governor Michael Barr warned that AI may create problems for cybersecurity, trading and consumer protection. He said AI could bring risks as well as opportunities.</p><p class=\"tiny\"><a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.reuters.com/world/feds-barr-warns-ai-risks-financial-system-2026-11-16/\">Read Reuters reporting ↗</a></p></div>\n<div class=\"question-item\"><strong>1. What is the biggest advantage of AI for banks?</strong><textarea maxlength=\"3500\" data-exercise-field=\"newsBenefit\" placeholder=\"One advantage is…\"></textarea></div>\n<div class=\"question-item\"><strong>2. What could go wrong when several banks use similar AI systems?</strong><textarea maxlength=\"3500\" data-exercise-field=\"newsRisk\" placeholder=\"If…\"></textarea></div>\n<div class=\"question-item\"><strong>3. Which headline is more important for ordinary customers? Explain.</strong><textarea maxlength=\"3500\" data-exercise-field=\"newsCompare\" placeholder=\"In my opinion…\"></textarea></div>"

      "id": "grammar",
      "title": "If AI makes a mistake, what will happen?",
      "label": "If AI… · 7 min",
      "html": "\n<div class=\"tip\"><b>First Conditional</b><p>If + present simple, will + base verb.</p><p><b>If the bank detects fraud, it will send an alert.</b></p><p class=\"tiny\">Use it for a real possible future result. Avoid “If AI will make…” in the if-clause.</p></div>\n<fieldset class=\"question-item unified-question\" data-answer-row><legend>If AI ___ a strange payment, it will warn the bank.</legend><div class=\"options\"><label><input type=\"radio\" name=\"grammar0\" value=\"0\" data-exercise-field=\"grammar0\" data-legacy-key=\"grammar0-0\" data-expected=\"1\"> will find</label><label><input type=\"radio\" name=\"grammar0\" value=\"1\" data-exercise-field=\"grammar0\" data-legacy-key=\"grammar0-1\"> finds</label><label><input type=\"radio\" name=\"grammar0\" value=\"2\" data-exercise-field=\"grammar0\" data-legacy-key=\"grammar0-2\"> finding</label></div><p class=\"result\" data-grade></p></fieldset>\n<fieldset class=\"question-item unified-question\" data-answer-row><legend>If a chatbot gives bad advice, customers ___ trust.</legend><div class=\"options\"><label><input type=\"radio\" name=\"grammar1\" value=\"0\" data-exercise-field=\"grammar1\" data-legacy-key=\"grammar1-0\" data-expected=\"0\"> may lose</label><label><input type=\"radio\" name=\"grammar1\" value=\"1\" data-exercise-field=\"grammar1\" data-legacy-key=\"grammar1-1\"> lose will</label><label><input type=\"radio\" name=\"grammar1\" value=\"2\" data-exercise-field=\"grammar1\" data-legacy-key=\"grammar1-2\"> losing</label></div><p class=\"result\" data-grade></p></fieldset>\n<fieldset class=\"question-item unified-question\" data-answer-row><legend>If I ___ more money, I will save part of it.</legend><div class=\"options\"><label><input type=\"radio\" name=\"grammar2\" value=\"0\" data-exercise-field=\"grammar2\" data-legacy-key=\"grammar2-0\" data-expected=\"2\"> will earn</label><label><input type=\"radio\" name=\"grammar2\" value=\"1\" data-exercise-field=\"grammar2\" data-legacy-key=\"grammar2-1\"> earning</label><label><input type=\"radio\" name=\"grammar2\" value=\"2\" data-exercise-field=\"grammar2\" data-legacy-key=\"grammar2-2\"> earn</label></div><p class=\"result\" data-grade></p></fieldset><button type=\"button\" class=\"outline\" data-check-section>Check grammar</button><p class=\"feedback\" data-section-score aria-live=\"polite\"></p>\n<div class=\"question-item\"><strong>Make two predictions about AI and money using IF and WILL.</strong><textarea maxlength=\"3500\" data-exercise-field=\"predictions\" placeholder=\"If banks use more AI, …\"></textarea></div>"

    {
      "id": "decision",
      "title": "You're the head of a digital bank.",
      "label": "Your decision · 8 min",
      "html": "<p>Your team has $1 million to invest in ONE AI tool. You must choose an option, defend it and explain how to protect customers.</p>\n<div class=\"split\"><div class=\"tip\"><h3>A · Fraud detector</h3><p>Finds suspicious payments quickly. Sometimes it might stop real purchases.</p></div><div class=\"tip\"><h3>B · AI money coach</h3><p>Helps customers save. Sometimes its advice may be wrong.</p></div><div class=\"tip\"><h3>C · AI loan assistant</h3><p>Reviews loan applications faster. Some decisions may be unfair.</p></div><div class=\"tip\"><h3>D · AI investment assistant</h3><p>Suggests investments. Customers could lose money.</p></div></div>\n<div class=\"question-item\"><strong>1. Choose your tool. Why is it the best choice?</strong><select data-exercise-field=\"finalChoice\"><option value=\"\">Choose an option</option><option value=\"A\">A — Fraud detector</option><option value=\"B\">B — Money coach</option><option value=\"C\">C — Loan assistant</option><option value=\"D\">D — Investment assistant</option></select><textarea maxlength=\"3500\" data-exercise-field=\"finalWhy\" placeholder=\"We should choose… because…\" style=\"margin-top:10px\"></textarea></div>\n<div class=\"question-item\"><strong>2. What TWO rules will protect your customers?</strong><textarea maxlength=\"3500\" data-exercise-field=\"finalRules\" placeholder=\"First, a human must… Second, if AI…\"></textarea></div>\n<div class=\"question-item\"><strong>3. Pitch your idea in 60 seconds. Then answer your teacher's questions.</strong><p class=\"muted\">Useful phrases: Our main goal is… / The biggest risk is… / If we use this tool, we will… / We shouldn't let AI…</p></div>\n<div class=\"article\"><h3>Exit ticket</h3><p>Complete the sentence: “AI should help people with money, but it should never…”</p><textarea maxlength=\"3500\" data-exercise-field=\"exit\" placeholder=\"AI should never…\"></textarea></div>"
    }
