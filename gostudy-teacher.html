<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoStudy · Кабинет преподавателя</title>
<link rel="stylesheet" href="assets/gostudy-sync.css?v=3">
<script src="assets/gostudy-sync.js?v=14"></script>
<style>.teacher-course-links{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px}.teacher-course-links .pharma-lesson-shortcut{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border-radius:10px;background:#2368b0;color:#fff;text-decoration:none;font-weight:650}.teacher-course-links .pharma-lesson-shortcut:hover{background:#164f8d}</style>
<link rel="stylesheet" href="assets/gostudy-classroom.css?v=3">
</head>
<body class="cloud-account teacher-page">
<main>
  <header class="teacher-top"><strong>GoStudy</strong><nav class="teacher-course-links" aria-label="Уроки"><a href="student-travel-a2.html">Travel A2+</a><a class="pharma-lesson-shortcut" href="pharma-c1-03.html">Pharma C1 · Урок 3 →</a></nav></header>
  <h1>Кабинет преподавателя</h1>
  <p>Смотрите ответы учеников во время занятия и добавляйте слова в их словари.</p>
  <form id="teacher-login" method="post" hidden>
    <label for="teacher-email">Электронная почта</label>
    <input id="teacher-email" type="email" name="email" autocomplete="username" required>
    <label for="teacher-password">Пароль</label>
    <input id="teacher-password" type="password" name="password" autocomplete="current-password" required>
    <button type="submit">Войти</button>
  </form>
  <p id="teacher-status" role="status"></p>
  <section id="teacher-dashboard" hidden>
    <div class="teacher-controls"><label for="teacher-student">Ученик</label><select id="teacher-student"></select><button type="button" id="teacher-signout">Выйти</button></div>
    <section id="teacher-classroom" class="teacher-panel" hidden>
      <h2 id="teacher-classroom-title">Класс</h2>
      <ul id="teacher-classroom-lessons"></ul>
    </section>
    <div class="teacher-grid">
      <section class="teacher-panel">
        <h2>Ответы ученика</h2>
        <div id="teacher-answers">Загружаем ответы…</div>
      </section>
      <section class="teacher-panel">
        <h2>Словарь</h2>
        <form id="teacher-word" method="post" hidden>
          <label for="teacher-en">Слово или фраза</label>
          <input id="teacher-en" name="en" maxlength="150" required>
          <label for="teacher-ru">Перевод</label>
          <input id="teacher-ru" name="ru" maxlength="300" required>
          <button type="submit">Добавить ученику</button>
          <p id="teacher-word-status" role="status"></p>
        </form>
        <h3>Добавил ученик</h3><ul id="teacher-student-words"></ul>
        <h3>Задал преподаватель</h3><ul id="teacher-assigned-words"></ul>
      </section>
    </div>
  </section>
</main>
</body>
</html>
