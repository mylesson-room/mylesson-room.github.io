<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoStudy · Кабинет преподавателя</title>
<link rel="stylesheet" href="assets/gostudy-sync.css?v=d9356e89a210">
<script src="assets/gostudy-sync.js?v=114c8b497efb"></script>
<style>.teacher-course-links{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px}.teacher-course-links .pharma-lesson-shortcut{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border-radius:10px;background:#2368b0;color:#fff;text-decoration:none;font-weight:650}.teacher-course-links .pharma-lesson-shortcut:hover{background:#164f8d}</style>
<link rel="stylesheet" href="assets/gostudy-classroom.css?v=b9085c1b0b36">
<style>#teacher-add-student{margin-top:16px}#teacher-add-student summary{font-weight:700}#teacher-add-student form{max-width:420px;margin-top:12px}#teacher-add-student select{font:inherit;padding:9px}</style>
<link rel="stylesheet" href="assets/gostudy-cabinet.css?v=3729477e56d0">
</head>
<body class="cloud-account teacher-page">
<main>
  <header class="teacher-top"><strong>GoStudy</strong><a href="login.html">Общий вход GoStudy</a></header>
  <h1>Обучение</h1>
  <form id="teacher-login" method="post" hidden>
    <label for="teacher-email">Электронная почта</label>
    <input id="teacher-email" type="email" name="email" autocomplete="username" required>
    <label for="teacher-password">Пароль</label>
    <input id="teacher-password" type="password" name="password" autocomplete="current-password" required>
    <button type="submit">Войти</button>
  </form>
  <p id="teacher-status" role="status"></p>
  <section id="teacher-dashboard" hidden>
    <div class="teacher-roster-flat">
      <div class="teacher-section-tab">Ученики</div>
      <input id="teacher-student-search" type="search" placeholder="Поиск учеников" aria-label="Поиск учеников">
      <p id="teacher-student-count" class="teacher-count"></p>
    <details id="teacher-add-student" class="teacher-panel" hidden>
      <summary>✚ Добавить нового ученика</summary>
      <form method="post" autocomplete="off">
        <label for="teacher-new-email">Почта ученика</label>
        <input id="teacher-new-email" name="email" type="email" maxlength="254" required>
        <label for="teacher-new-password">Пароль для входа</label>
        <input id="teacher-new-password" name="password" type="password" minlength="10" maxlength="72" autocomplete="new-password" required>
        <label for="teacher-new-course">Курс</label>
        <select id="teacher-new-course" name="course" required></select>
        <button type="submit">Создать аккаунт и назначить курс</button>
      </form>
      <p id="teacher-add-student-status" role="status"></p>
      <a href="login.html">Общая ссылка на вход</a>
    </details>
      <div id="teacher-student-list"></div>
      <select id="teacher-student" hidden aria-label="Ученик"></select>
    </div>
    <details id="teacher-profile"><summary>Карточка ученика</summary>
    <section id="teacher-classroom" class="teacher-panel" hidden>
      <h2 id="teacher-classroom-title">Класс</h2>
      <article class="home-current" id="teacher-current-lesson"></article><details><summary>Все уроки</summary><ul id="teacher-classroom-lessons"></ul></details>
    </section>
    <div class="teacher-grid">
      <section class="teacher-panel">
        <h2>Ответы ученика</h2>
        <div id="teacher-answers">Загружаем ответы…</div>
      </section>
      <section class="teacher-panel">
        <h2>Словарь</h2>
        <form id="teacher-word" method="post" hidden>
          <label for="teacher-en">Слово или фраза</label>
          <input id="teacher-en" name="en" maxlength="150" required>
          <label for="teacher-ru">Перевод</label>
          <input id="teacher-ru" name="ru" maxlength="300" required>
          <button type="submit">Добавить ученику</button>
          <p id="teacher-word-status" role="status"></p>
        </form>
        <h3>Добавил ученик</h3><ul id="teacher-student-words"></ul>
        <h3>Задал преподаватель</h3><ul id="teacher-assigned-words"></ul>
      </section>
    </div>
    </details>
    <button type="button" id="teacher-signout">Выйти</button>
  </section>
</main>
</body>
</html>
