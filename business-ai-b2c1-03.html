<script type="application/json" id="lesson-data">{"title":"The Price of a Bad Decision: AI and Business Choices","cabinet":"student-business-ai.html","course":"business-ai","level":"Business English · B2–C1","key":"gostudy-business-ai-b2c1-03-v2","wordsKey":"gostudy-vocabulary-business-ai-v1","preserve":"cloud","durationMinutes":50,"steps":[{"id":"business-ai-b2c1-03-v2-0","title":"01 · Why do smart companies make costly choices?","minutes":5,"instruction":"WARM-UP · 5 min. Discuss how organisations decide where to invest. There are no roles to play.","source":["Imagine a company has money for just ONE major upgrade: an AI forecasting system or a warehouse redesign. Both sound promising, but neither is risk-free.","DISCUSS · Why are impressive forecasts sometimes misleading? What makes an AI recommendation trustworthy? When is the simpler solution the better one?","LESSON GOAL · Understand a business investment dilemma, discuss what the data does and does not show, and evaluate trade-offs without pretending to be a company executive."],"visual":{"kind":"cards","cards":[["🤖","AI forecasting","Better demand predictions?","Depends on data and implementation."],["🏭","Warehouse upgrade","Fewer delays and errors?","Requires construction and disruption."]]},"teacherNotes":"5 min. Open discussion. No pitches, assigned roles, acting or fictional personal objectives. Recycle 'outweigh' and 'attribute X to Y' from the previous lesson."},{"id":"business-ai-b2c1-03-v2-1","title":"02 · The language of difficult decisions","minutes":8,"instruction":"VOCABULARY · 8 min. Match eight useful expressions. Then give two examples from real business situations.","type":"match","items":[["trade-off",["a compromise between competing benefits","a guaranteed future profit","a legally required payment"],0,""],["opportunity cost",["the value of the best alternative you give up","the price listed on an invoice","the monthly cost of a subscription"],0,""],["sunk cost",["money already spent that cannot be recovered","money available for a new investment","the salary of a project manager"],0,""],["downside risk",["the potential for an unfavourable result","a certain increase in sales","the cost of a successful product"],0,""],["sensitivity analysis",["testing how conclusions change when assumptions change","checking employee attendance","analysing the tone of an advertisement"],0,""],["margin of error",["an indication of uncertainty in an estimate","a profit earned after tax","a discount offered to a customer"],0,""],["overconfidence",["being more certain than the evidence justifies","being cautious in a meeting","comparing two product features"],0,""],["human oversight",["people reviewing and supervising an automated system","a fully automated process with no review","the act of buying more hardware"],0,""]],"source":["SAY IT · What trade-off matters most? What opportunity cost might management ignore? How could human oversight reduce downside risk?","USE IN CONTEXT · 'The numbers look encouraging, but the margin of error makes the decision less obvious.'"],"teacherNotes":"8 min: 4 min matching, 4 min productive examples. Target eight B2–C1 expressions; avoid adding a second unrelated word list."},{"id":"business-ai-b2c1-03-v2-2","title":"03 · The €2 million question","minutes":9,"instruction":"READING · 9 min. Read the fictional investment briefing. Separate measured results from forecasts and assumptions.","source":["CASE STUDY · Northlake Foods operates 40 supermarkets. It has €2 million to invest next year. Two alternatives are being considered, and the board cannot fund both.","OPTION A: AI demand forecasting. An eight-store pilot was associated with a 6% reduction in unsold fresh food. The vendor predicts that a full rollout could save €540,000 annually. However, the pilot stores were chosen for unusually good data quality and the vendor's estimate excludes staff training and integration costs.","OPTION B: Warehouse redesign. A feasibility study projects €420,000 in annual savings from faster picking and fewer delivery errors. The estimate includes expected maintenance costs, but construction could interrupt deliveries for six weeks.","An independent analyst warns that neither projection is guaranteed. A sensitivity analysis suggests AI savings could fall to €260,000 if data quality is weaker across the remaining stores. The warehouse project could save only €300,000 if disruptions last longer than planned. Both estimates are hypothetical planning scenarios, not reported real-world outcomes.","QUESTION · What information would you need before deciding which proposal is stronger? Why is a small successful AI pilot not proof that every store will benefit?"],"type":"choice","items":[["Which evidence comes from an actual pilot in the case?",["A 6% reduction in unsold fresh food at eight stores","A guaranteed €540,000 annual profit","€420,000 in verified warehouse savings"],0,""],["Which cost is missing from the AI vendor's estimate?",["Maintenance costs for the warehouse","Staff training and integration","All food purchasing costs"],1,""],["Why is the eight-store AI pilot difficult to generalise?",["The stores had unusually good data quality","The stores had no fresh food","The pilot was carried out in every store"],0,""],["What could affect the warehouse projection?",["Construction disruption lasting longer than expected","An automatic increase in AI accuracy","The vendor's staff training estimate"],0,""]],"teacherNotes":"9 min: 2 gist, 3 detailed reading, 2 checking, 2 follow-up discussion. Explicitly distinguish forecast from measured pilot. Do not present hypothetical numbers as factual claims."},{"id":"business-ai-b2c1-03-v2-3","title":"04 · What do the numbers really prove?","minutes":6,"instruction":"CRITICAL THINKING · 6 min. Decide whether each conclusion is supported, contradicted or not established by the briefing.","type":"choice","source":["After each answer, explain which sentence supports your choice or what additional evidence would be needed."],"items":[["The pilot stores saw less unsold fresh food.",["Supported","Contradicted","Not established"],0,""],["The AI system will definitely save €540,000 per year across 40 stores.",["Supported","Contradicted","Not established"],2,""],["Warehouse redesign has no risk of disruption.",["Supported","Contradicted","Not established"],1,""],["Training and integration costs have already been included in the AI vendor's forecast.",["Supported","Contradicted","Not established"],1,""]],"teacherNotes":"6 min. Focus on separating evidence, interpretation and uncertainty. Ask for one counterexample to an overconfident claim."},{"id":"business-ai-b2c1-03-v2-4","title":"05 · Talking about uncertainty accurately","minutes":6,"instruction":"LANGUAGE FOCUS · 6 min. Make precise comparisons without claiming certainty.","source":["NOTICE · 'The pilot suggests a benefit, but…' · 'Savings could be lower if…' · 'We cannot conclude that…' · 'Although the projection is higher, the assumptions are less reliable.'","USEFUL STRUCTURES · may / might / could + base verb; provided that + condition; whereas / although to contrast.","DISCUSS · Why is 'AI will save €540,000' weaker reasoning than 'AI might save up to €540,000 under favourable conditions'?"],"type":"gap","items":[["The pilot ___ a benefit, but the result may not transfer to every store.",["proves forever","suggests","guarantees"],1,""],["The AI savings ___ be lower if the data is less reliable.",["could","must to","have"],0,""],["The warehouse estimate includes maintenance, ___ the AI forecast excludes some costs.",["unless","whereas","provided that"],1,""],["The project may succeed ___ sufficient training is provided.",["despite","provided that","whereas"],1,""],["We cannot ___ a future saving from one unusually favourable pilot.",["guarantee","guaranteed","guaranteeing"],0,""]],"teacherNotes":"6 min. Practice cautious claims and contrast. Elicit two spoken corrections of exaggerated statements rather than a grammar lecture."},{"id":"business-ai-b2c1-03-v2-5","title":"06 · When the assumptions change","minutes":6,"instruction":"DATA & DISCUSSION · 6 min. Use the fictional figures. Calculate differences and explain which assumptions matter.","source":["BASE SCENARIO · AI: €540,000 potential annual savings (before training/integration). Warehouse: €420,000 estimated annual savings (with maintenance).","CAUTIOUS SCENARIO · AI: €260,000 potential annual savings (before training/integration). Warehouse: €300,000 estimated annual savings (with maintenance).","DISCUSS · Why is comparing the two headline figures potentially misleading? What does a sensitivity analysis reveal that the base scenario hides?"],"type":"choice","items":[["What is the headline difference between the two base projections?",["€120,000","€260,000","€960,000"],0,""],["In the cautious scenarios, which projection is higher?",["AI by €40,000","Warehouse by €40,000","Both are equal"],1,""],["Why are the headline figures not fully comparable?",["The AI figure excludes some implementation costs","The warehouse has exactly twice as many stores","Both figures are guaranteed"],0,""]],"teacherNotes":"6 min. Calculations: 540−420=120; 300−260=40. Spend at least half the stage discussing assumptions and opportunity cost."},{"id":"business-ai-b2c1-03-v2-6","title":"07 · An interesting decision, not a personal mission","minutes":8,"instruction":"OPEN DISCUSSION · 8 min. Explore the ideas freely. No role-play, speeches, pitching or defending a fictional company.","source":["QUESTION 1 · Is investing in AI always the more innovative choice, or can improving an ordinary process be smarter?","QUESTION 2 · Which is more dangerous in this case: unreliable data, hidden implementation costs, or overconfidence about early results?","QUESTION 3 · How should a company balance AI recommendations with human oversight?","QUESTION 4 · Can an investment be reasonable even if it later fails? What is the difference between a bad outcome and a bad decision?","NEW DETAIL · Halfway through the discussion, imagine that a competitor announces a successful AI rollout. Should that change how Northlake evaluates its options? Why or why not?","LANGUAGE GOAL · Naturally use at least four expressions from stage 2 and two cautious claims from stage 5. The aim is a thoughtful conversation, not reaching one 'correct' decision."],"visual":{"kind":"cards","cards":[["📊","Evidence","What is known?","Separate results from assumptions."],["🤔","Uncertainty","What might change?","Look at different scenarios."],["🧠","Judgement","Where should people intervene?","Discuss human oversight."]]},"teacherNotes":"8 min. Keep it conversational. Offer two follow-up questions and request examples; do not ask learner to take a professional role, sell a proposal or win a debate."},{"id":"business-ai-b2c1-03-v2-7","title":"08 · One useful takeaway","minutes":2,"instruction":"WRAP-UP · 2 min. Finish with a simple personal reflection about the ideas, not a business deliverable.","type":"write","source":["Write 2–3 sentences: What is one useful idea from the case? Which two expressions could you use in future conversations about technology or business?","HOMEWORK · A new short case about AI in retail pricing and a brief opinion paragraph. No board memo or pretend executive task."],"teacherNotes":"2 min. Ask the student to recall the meaning of opportunity cost and one caution about AI data. No formal presentation."}],"version":"discussion-led-2026-11-17"}</script>
