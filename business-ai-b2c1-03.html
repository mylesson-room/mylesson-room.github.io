<script type="application/json" id="lesson-data">{"title":"When the AI Rollout Goes Wrong","cabinet":"student-business-ai.html","course":"business-ai","level":"Business English · B2–C1","key":"gostudy-business-ai-b2c1-03-v1","wordsKey":"gostudy-vocabulary-business-ai-v1","preserve":"cloud","durationMinutes":50,"steps":[{"id":"business-ai-b2c1-03-0","title":"01 · Would you stop the rollout?","minutes":5,"instruction":"REVISION & LEAD-IN · 5 min. Recall the pilot findings from the last lesson and set a decision threshold.","source":["A company has expanded an AI assistant from 600 weekly test tickets to 3,000. The tool drafts replies, and agents must review them before sending.","Your manager says, 'Speed is up, so we should scale again.' What questions would you ask before agreeing?","GOAL · Challenge a rollout using evidence, recommend a containment plan, and defend a conditional go/no-go decision."],"visual":{"kind":"cards","cards":[["📈","Efficiency","Faster responses","Does time saved equal value?"],["⚠️","Quality","Policy mistakes","Can reviewers catch them?"],["👥","Customers","Escalations","Who is affected?"]]},"teacherNotes":"5 min. Retrieve 'case mix', 'sign off on', 'caveat' and 'outweigh'. Ask for a measurable success criterion."},{"id":"business-ai-b2c1-03-1","title":"02 · Eight phrases for risk meetings","minutes":8,"instruction":"PRE-READING VOCABULARY · 8 min. Match eight useful expressions. Explain one realistic workplace example of each.","type":"match","items":[["flag a risk",["identify and draw attention to a problem","accept every warning","close a ticket automatically"],0,""],["roll back a change",["restore an earlier version","publish a new advert","increase the sample size"],0,""],["root cause",["the underlying reason for a problem","a helpful side effect","a popular opinion"],0,""],["safeguard",["a measure that reduces risk","a monthly sales target","a faster computer"],0,""],["false positive",["a warning that incorrectly identifies a problem","a successful payment","an error that reaches a customer"],0,""],["escalate an issue",["pass a problem to someone with greater authority","ignore the incident","publish a final report"],0,""],["go/no-go decision",["a formal choice to proceed or stop","a question about transport","the final design of a logo"],0,""],["remediation plan",["specific corrective actions and owners","a new advertising slogan","an estimated cost without evidence"],0,""]],"source":["SPEAK · A good safeguard prevents a mistake. A root cause is not the same as a symptom. A rollout can be paused or rolled back.","USE · Choose three expressions and describe how they might apply to an AI-supported customer-service team."],"teacherNotes":"8 min. Recognition first, then productive paraphrases. Eight active units for advanced level."},{"id":"business-ai-b2c1-03-2","title":"03 · Incident review: Friday release","minutes":9,"instruction":"READING FOR EVIDENCE · 9 min. Read the report, distinguish fact from interpretation, and identify what needs verification.","source":["INCIDENT REPORT · Northline Support · Friday, 17:30","On Thursday, the team released an updated AI reply template to 3,000 routine support tickets per week. Median draft time fell by 18%, but 14 of the first 280 sampled replies contained outdated wording about refund eligibility. Reviewers caught 12 before sending; two reached customers and were corrected later.","The quality dashboard initially flagged 35 potential policy errors, although manual investigation found 21 were false positives. The incident manager temporarily disabled automated draft suggestions for refunds but left billing-address updates enabled. No customer payment details were exposed.","A first investigation suggests the template relied on a policy file that had not been refreshed after Tuesday's rule change. This is not yet a confirmed root cause. Finance argues the efficiency gain is significant; Compliance says the existing safeguard failed because reviewers did not have a clear escalation rule.","The COO wants a decision by Monday: resume the full rollout, continue with billing-address changes only, or roll back the release. A proposed remediation plan includes validating the policy source, making policy checks mandatory and reviewing 200 consecutive drafts before any expansion.","DISCUSS · Which fact would you cite in a board meeting? What cannot yet be concluded?"],"type":"choice","items":[["How many policy errors reached customers?",["Two","Twelve","Fourteen"],0,""],["What is the status of the suspected root cause?",["Confirmed beyond doubt","A preliminary hypothesis","Not mentioned"],1,""],["Which activity remained enabled?",["Refund suggestions","Billing-address changes","All automated suggestions"],1,""],["What is the required sample before expansion?",["200 consecutive drafts","21 false positives","3,000 customer complaints"],0,""]],"teacherNotes":"9 min. Student should explain why 14 issues in 280 sampled drafts is not identical to all production volume; distinguish detected errors from customer impact."},{"id":"business-ai-b2c1-03-3","title":"04 · What can the evidence support?","minutes":6,"instruction":"CRITICAL READING · 6 min. Test conclusions without overclaiming.","type":"choice","source":["After each response, explain what evidence supports your answer or what additional evidence is needed."],"items":[["The 18% improvement proves the rollout is financially profitable.",["Supported","Not established","Contradicted"],1,""],["Some incorrect refund guidance reached customers.",["Supported","Not established","Contradicted"],0,""],["The outdated policy file is definitely the root cause.",["Supported","Not established","Contradicted"],1,""],["Stopping refund suggestions reduces exposure while investigation continues.",["Supported","Not established","Contradicted"],0,""]],"teacherNotes":"6 min. Elicit hedging: 'The evidence suggests…', 'It does not establish…', 'provided that…'."},{"id":"business-ai-b2c1-03-4","title":"05 · Conditional recommendations","minutes":6,"instruction":"LANGUAGE FOCUS · 6 min. Calibrate a recommendation using evidence, conditions and accountability.","source":["MODEL · 'The data suggests a speed benefit, but we should not resume refunds unless the source is validated.'","MODEL · 'I would support a limited rollout, provided that we introduce a mandatory policy check.'","NOTICE · 'Unless' names the minimum requirement; 'provided that' sets a condition; 'may' and 'suggests' avoid false certainty.","SPEAK · Reformulate: 'AI is safe. Roll it out everywhere.' Give a cautious recommendation with two conditions."],"type":"gap","items":[["We should not restart refunds ___ the policy file is validated.",["unless","although","whereas"],0,""],["The results ___ a benefit, but profitability is not established.",["prove","suggest","guarantee"],1,""],["A limited rollout is reasonable ___ every draft is checked.",["provided that","despite","even though"],0,""],["The dashboard included 21 ___, so not every alert represented a real error.",["root causes","false positives","remediation plans"],1,""],["The incident must be ___ to Compliance before release.",["escalated","misinterpreted","excluded"],0,""]],"teacherNotes":"6 min. Focus on precise hedge + condition, not a grab bag of grammar."},{"id":"business-ai-b2c1-03-5","title":"06 · Design the containment plan","minutes":6,"instruction":"GUIDED APPLICATION · 6 min. Choose a credible plan and defend it.","source":["OPTION A · Resume every ticket type on Monday; ask agents to be more careful.","OPTION B · Keep refund suggestions disabled, verify the policy source, add mandatory checks, appoint a risk owner and test 200 consecutive drafts.","OPTION C · Shut down all AI tools permanently, without further investigation.","SPEAK · Present your recommendation as 1 decision + 2 safeguards + 1 stop rule + 1 owner. Which metric would trigger a rollback?"],"type":"choice","items":[["Which option best contains the known risk while allowing controlled learning?",["Option A","Option B","Option C"],1,""],["Which is a testable stop rule?",["Stop if another incorrect refund policy reaches a customer","Stop if someone feels uncomfortable","Stop only when the whole budget is spent"],0,""]],"teacherNotes":"6 min. Student must explicitly distinguish containment from permanent strategy; elicit a measurable owner and threshold."},{"id":"business-ai-b2c1-03-6","title":"07 · The go/no-go meeting","minutes":8,"instruction":"INDEPENDENT SPEAKING · 8 min. You are the operations lead. Recommend a course of action to a sceptical COO.","source":["ROUND 1 · Give a 60-second recommendation. Mention the 18% speed improvement, the two customer-facing incidents, the unconfirmed root cause and the safeguards.","COO · Challenge: 'Why should I trust another test? What's the financial cost of pausing?'","ROUND 2 · New condition: the policy verification tool won't be ready until Wednesday. Update the go/no-go decision, remediation plan and communication to customers.","SUCCESS · Use at least five target expressions, state two conditions, identify an owner and specify the measurable trigger for rolling back."],"visual":{"kind":"cards","cards":[["🎤","Operations","Recommend","Explain evidence and conditions."],["🧑‍💼","COO","Challenge","Ask about risk, cost and timeline."]]},"teacherNotes":"8 min. Two-minute initial plan, 2-minute defence, 2-minute new condition, 2-minute feedback."},{"id":"business-ai-b2c1-03-7","title":"08 · The decision memo","minutes":2,"instruction":"WRAP-UP · 2 min. Give a 30-second executive summary.","type":"write","source":["Write two sentences: 'I recommend… provided that…' and 'We should roll back if…'","HOMEWORK · Write a short incident follow-up memo and recycle the eight risk expressions."],"teacherNotes":"2 min. Assessment: decision, one piece of evidence, one condition and one stop rule."}]}</script>
