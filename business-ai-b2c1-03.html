<body data-premium-feed="michael-v1" data-translate-engine="google-web-pilot" data-finance-live data-classroom-course="business-ai" data-classroom-lesson="business-ai-b2c1-03.html" data-preserve-workbook-progress data-live-script="assets/gostudy-finance-live.js">
<script type="application/json" id="lesson-data">{"title":"The Price of a Bad Decision: AI and Business Choices","cabinet":"student-business-ai.html","course":"business-ai","level":"Business English · B2–C1","key":"gostudy-business-ai-b2c1-03-v3","wordsKey":"gostudy-vocabulary-business-ai-v1","preserve":"cloud","durationMinutes":50,"steps":[{"id":"business-ai-b2c1-03-v3-0","title":"01 · Why do smart companies make costly choices?","minutes":5,"instruction":"WARM-UP · 5 min. Discuss how organisations decide where to invest. There are no roles to play.","source":["Northlake Foods has €2 million to invest. One option uses AI to forecast demand; the other redesigns warehouses. Both could help, but each relies on assumptions.","DISCUSS · When did a promising technology fail to deliver? Why might a small successful pilot mislead decision-makers?","How much should a company trust a forecast that has not yet been tested in real conditions?"],"visual":{"kind":"cards","cards":[["🤖","AI forecasting","Better demand predictions?","Depends on data and implementation."],["🏭","Warehouse upgrade","Fewer delays and errors?","Requires construction and disruption."]]},"teacherNotes":"5 min. Open discussion. No pitches, assigned roles, acting or fictional personal objectives. Recycle 'outweigh' and 'attribute X to Y' from the previous lesson."},{"id":"business-ai-b2c1-03-v3-1","title":"02 · The language of difficult decisions","minutes":8,"instruction":"VOCABULARY · 8 min. Match the eight expressions, then use at least four in your own explanations.","type":"match","items":[["trade-off",["a cost already incurred","a balance between competing benefits","a guaranteed return"],1,"Giving up one benefit to gain another."],["opportunity cost",["the price of the selected option","a fee payable next year","the value of the next-best alternative given up"],2,"What you forgo when you pick another option."],["sunk cost",["a non-refundable past expense","an expected future expense","a cost that changes with production"],0,"Already spent and not recoverable."],["downside risk",["the most optimistic outcome","the possibility of an unfavourable result","a problem already solved"],1,"How bad results could be."],["sensitivity analysis",["one fixed projection","a customer satisfaction survey","testing how outcomes vary as assumptions change"],2,"A range of assumptions reveals a range of results."],["forecast range",["a span of plausible predicted outcomes","a statistically guaranteed return","last year's actual earnings"],0,"It depends on modelling assumptions; it is not the same as a statistical margin of error."],["overconfidence",["careful uncertainty reporting","greater certainty than evidence justifies","asking for more data"],1,"The pilot may not represent all locations."],["human oversight",["automatically accepting the AI output","letting a model decide without appeal","people reviewing and challenging an AI recommendation"],2,"Human checks provide accountability."]],"source":["APPLICATION · Explain one opportunity cost of choosing AI, one downside risk of a warehouse redesign, and why sunk costs should not dictate future choices.","DISCUSS · How can human oversight reduce overconfidence? When might a wider forecast range matter?"],"teacherNotes":"8 min. 3 min matching and 5 min productive use. Contrast sunk cost and opportunity cost. Explain that forecast range is scenario-dependent, not a statistical margin of error."},{"id":"business-ai-b2c1-03-v3-2","title":"03 · The €2 million question","minutes":9,"instruction":"READING · 9 min. Read the fictional investment briefing. Separate measured results from forecasts and assumptions.","source":["CASE · Northlake Foods operates 40 supermarkets and can invest €2 million in one project. This is a trade-off: choosing one entails the opportunity cost of the other.","OPTION A — AI FORECASTING · An eight-store pilot was associated with 6% less unsold fresh food. The vendor predicts annual savings of €540,000 across the chain, but pilot stores had unusually reliable data. The estimate excludes staff training and integration costs. A sensitivity analysis suggests savings might be only €260,000 if data quality is lower elsewhere. Human oversight would still be needed.","OPTION B — WAREHOUSE REDESIGN · A feasibility study predicts €420,000 in annual savings from faster picking and fewer errors, including routine maintenance. Construction could disrupt deliveries for six weeks. Longer disruption could lower savings to €300,000.","CAUTION · Northlake already spent €120,000 on the AI pilot, a sunk cost. The analyst warns that overconfidence in the early result could hide downside risk. Both projects have forecast ranges, not guaranteed profits. These figures are fictional planning estimates, not real company results.","BEFORE THE QUESTIONS · Which option has stronger evidence? Which assumptions would you investigate first?"],"type":"choice","items":[["What was actually observed?",["6% less unsold fresh food in an eight-store AI pilot","€540,000 in confirmed savings across all stores","€420,000 in realised warehouse profit"],0,"A pilot association does not prove a chain-wide result."],["Which major cost is absent from the vendor's estimate?",["Warehouse maintenance","Training and system integration","The cost of last year's pilot"],1,"Implementation costs are excluded."],["Why shouldn't the €120,000 already spent determine the investment?",["It makes AI risk-free","It guarantees a return","It is a sunk cost, not evidence of future gains"],2,"Past non-refundable spending does not justify further spending."]],"teacherNotes":"9 min. Read for gist, then evidence. Ask why selected high-data-quality stores may not represent all 40 and what training costs do to comparisons."},{"id":"business-ai-b2c1-03-v3-3","title":"04 · Fix the misleading conclusions","minutes":7,"type":"write","instruction":"CRITICAL THINKING · 7 min. Rewrite three misleading claims using accurate evidence and cautious language.","source":["CLAIM A · 'The eight-store pilot proves AI will save €540,000 in every store.'","CLAIM B · 'We have already spent €120,000 on the AI pilot, so we must continue.'","CLAIM C · 'The two projections are directly comparable, because they both predict annual savings.'","CORRECT ALL THREE · Use expressions such as 'the evidence suggests', 'sunk cost', 'whereas' and 'provided that'.","DISCUSS · Which missing data would improve confidence in either option?"],"teacherNotes":"7 min. 3 min writing, 4 min explanation. Distinguish evidence from forecast, past spend from future cost, and included vs excluded implementation costs."},{"id":"business-ai-b2c1-03-v3-4","title":"05 · Say it more precisely","minutes":6,"instruction":"LANGUAGE PRACTICE · 6 min. Choose accurate wording, then correct two overconfident business claims aloud.","source":["Compare: 'AI will save €540,000' and 'AI could save up to €540,000 under favourable assumptions'.","Useful language: 'the evidence suggests…', 'could / might…', 'whereas…', 'provided that…' and 'we cannot conclude that…'.","DISCUSS · Why does conditional language improve, rather than weaken, the quality of business reasoning?"],"type":"gap","items":[["The pilot ___ a benefit, but the sample may not represent every store.",["guarantees","suggests","eliminates"],1,"A cautious reporting verb fits an unrepresentative pilot."],["Annual savings ___ drop if data quality is worse.",["will certainly","have to","could"],2,"Could introduces a conditional possibility."],["The warehouse forecast includes maintenance, ___ the AI figure excludes implementation.",["whereas","provided that","unless"],0,"Whereas contrasts different assumptions."],["Expansion might be reasonable ___ the company validates data across more stores.",["despite","provided that","rather than"],1,"Provided that introduces a condition."],["A past pilot expense alone does not ___ further investment.",["require","rule out","justify"],2,"A sunk cost is not a justification on its own."]],"teacherNotes":"6 min. 3 min interactive choices, 3 min spoken correction of the exaggerated claims."},{"id":"business-ai-b2c1-03-v3-5","title":"06 · Test the assumptions","minutes":5,"instruction":"DATA & DISCUSSION · 5 min. Compare forecasts and identify what the headline figures leave out.","source":["FAVOURABLE SCENARIO · AI: €540,000 a year before integration/training. Warehouse: €420,000 after routine maintenance.","CAUTIOUS SCENARIO · AI: €260,000 before integration/training. Warehouse: €300,000 after routine maintenance.","DISCUSS · Why do these figures not yet show which investment will produce the higher net benefit? Which two assumptions matter most?"],"type":"choice","items":[["The difference between the favourable headline estimates is…",["€120,000","€260,000","€960,000"],0,"€540k minus €420k."],["Under cautious assumptions, which projected saving is higher?",["AI by €40,000","Warehouse by €40,000","Neither"],1,"€300k minus €260k."],["What makes the headline comparison incomplete?",["The AI includes all costs","Both figures are actual results","The estimates include different costs"],2,"The AI excludes training/integration."]],"teacherNotes":"5 min. 1 min arithmetic, 4 min discussion of cost scope and forecast uncertainty.","visual":{"kind":"cards","cards":[["🤖","AI · favourable","€540k / year","Before implementation costs"],["🤖","AI · cautious","€260k / year","Before implementation costs"],["🏭","Warehouse · favourable","€420k / year","After maintenance"],["🏭","Warehouse · cautious","€300k / year","After maintenance"]]}},{"id":"business-ai-b2c1-03-v3-6","title":"07 · Evidence, judgement and AI","minutes":8,"instruction":"OPEN DISCUSSION · 8 min. Explore business decisions and AI without adopting fictional roles or defending a proposal.","source":["When an AI forecast looks impressive, what is the first question you would ask?","Can a conventional process improvement be more innovative than an AI investment?","What is the difference between an unlucky outcome and a badly reasoned decision?","When should a person override an AI forecast?","A competitor reports success with AI. Does this change the evidence or mainly create pressure to act?","Use four target expressions and two cautious claims naturally. There is no single correct choice."],"visual":{"kind":"cards","cards":[["📊","Evidence","What is known?","Separate results from assumptions."],["🤔","Uncertainty","What might change?","Look at different scenarios."],["🧠","Judgement","Where should people intervene?","Discuss human oversight."]]},"teacherNotes":"8 min. Natural conversation with examples. No role-play, mandatory pitch or fictional professional mission."},{"id":"business-ai-b2c1-03-v3-7","title":"08 · One useful takeaway","minutes":2,"instruction":"WRAP-UP · 2 min. Summarise two ideas you can explain without notes.","type":"write","source":["Write one sentence distinguishing sunk cost from opportunity cost, plus one cautious statement about an AI forecast.","Finish aloud: 'Before trusting an AI recommendation, I would check…'"],"teacherNotes":"2 min. Evaluate the distinction and one accurate conditional statement."}],"version":"revision-3"}</script>
