function briefing() {
  return card('Mia’s trip', '<p>It is Saturday. Mia and her friend want to go on a boat tour. Help them get ready, check their ticket and meet the guide.</p><p><b>Your goal:</b> tell Mia what to take, where to go and when to be there.</p><p>Would you like a day by the sea? What do you usually take?</p>');
}
function clues() {
  return card('Tap three things to pack',

function choiceTile(group,id,label) {
  const selected = (state.answers[group] || []).includes(id);
  return '<button class="small-button mission-action" type="button" data-sea-group="'+group+'" data-sea-id="'+id+'" aria-pressed="'+selected+'">'+esc(label)+'</button>';
}

function showResult(id, correct, success, retry) {
  const result = $('#'+id);
  result.textContent = correct ? '✓ '+success : retry;
  result.hidden = false;
}

$('#content').addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  const {seaGroup,seaId,seaCheck,harbourPlace} = button.dataset;
  if (seaGroup) {
    const items = new Set(state.answers[seaGroup] || []);
    if (items.has(seaId)) items.delete(seaId);
    else items.add(seaId);
    state.answers[seaGroup] = [...items];
    button.setAttribute('aria-pressed',String(items.has(seaId)));
    $('#'+seaGroup+'Result').hidden = true;
    save();
  }
  if (seaCheck === 'pack') {
    const items = state.answers.pack || [];
    showResult('packResult',items.length===3 && ['ticket','jacket','water'].every(id=>items.includes(id)),'Взяли билет, куртку и воду.','Сверь сумку с правилами экскурсии и прогнозом.');
  }
  if (seaCheck === 'ticket') {
    const items = state.answers.ticket || [];
    showResult('ticketResult',items.length===2 && items.includes('day') && items.includes('seats'),'Нужно поменять день на Saturday и указать 2 seats.','Сравни каждый пункт билета с бронированием.');
  }
  if (harbourPlace) {
    const path = state.answers.harbourPath || [];
    if (path.includes(harbourPlace) || path.length>=3) return;
    state.answers.harbourPath = [...path,harbourPlace];
    const item = document.createElement('li');
    item.textContent = places.find(place=>place[0]===harbourPlace)[1];
    $('#harbourPath').append(item);
    button.disabled = true;
    $('#pathResult').hidden = true;
    save();
  }
  if (button.hasAttribute('data-harbour-reset')) {
    state.answers.harbourPath = [];
    $('#harbourPath').replaceChildren();
    $('#pathResult').hidden = true;
    $$('[data-harbour-place]').forEach(place=>{ place.disabled=false; });
    save();
  }
  if (seaCheck === 'path') {
    showResult('pathResult',(state.answers.harbourPath || []).join(',')==='stop,kiosk,shop','Остановка → киоск → магазин мороженого.','Начни с места, где выходишь из автобуса. Затем найди место встречи.');
  }
});

function hwChoice(id,answer,options){return '<select id="'+id+'" data-gap="'+answer+'" data-answer="'+id+'" aria-label="Пропуск '+id.replace('hw','')+'"><option value="">Выберите…</option>'+options.map(v=>'<option value="'+esc(v)+'" '+(state.answers[id]===v?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select><span class="feedback" id="fb-'+id+'" role="status"></span>';}
function installGapChecks(){function check(el){const v=el.value.trim(),ok=norm(v)===norm(el.dataset.gap);el.classList.toggle('correct',!!v&&ok);el.classList.toggle('incorrect',!!v&&!ok);$('#fb-'+el.id).textContent=!v?'':ok?'✓ Верно!':'Попробуйте ещё раз.';}$$('[data-gap]').forEach(el=>{el.addEventListener('blur',()=>check(el));el.addEventListener('change',()=>{state.answers[el.dataset.answer]=el.value;save();check(el);});el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();check(el);}});el.addEventListener('input',()=>{el.classList.remove('correct','incorrect');$('#fb-'+el.id).textContent='';});if(el.value.trim())check(el);});}
function installLesson(){installGapChecks();}

function feedback(ci,qi){const id=`q${ci}-${qi}`,v=state.answers[id];if(v===undefined)return;const ok=Number(v)===CLIPS[ci].qs[qi][2];$('#fb-'+id).textContent=ok?'✓ Верно!':'Попробуйте ещё раз. Вернитесь к тексту или аудио.';$$(`[name="${id}"]`).forEach(el=>{el.closest('label').classList.toggle('correct',el.checked&&ok);el.closest('label').classList.toggle('incorrect',el.checked&&!ok);});}
function stop(){clearPractice();const a=$('#lessonAudio');if(a)a.pause();}
function render(){const p=pages[state.page];$('#pageLabel').textContent=`TRAVEL / ${String(state.page+1).padStart(2,'0')} · ≈ ${p[2]} MIN`;$('#title').textContent=p[0];$('#goal').textContent=p[1];$('#teacherTips').textContent=p[3];$('#counter').textContent=`${state.page+1} / ${pages.length}`;$('#prev').disabled=state.page===0;$('#next').textContent=state.page===pages.length-1?'Итог ✓':'Далее →';$('#content').innerHTML=missionArt[state.page] + [briefing,clues,route,port,decision,budget,debrief][state.page]();$('#nav').innerHTML=pages.map((p,i)=>`<button data-page="${i}" class="${i===state.page?'active':''}"><span>${String(i+1).padStart(2,'0')}</span>${esc(p[0])}</button>`).join('');$$('[data-page]').forEach(b=>b.onclick=()=>go(Number(b.dataset.page)));$$('[data-answer]').forEach(el=>el.oninput=()=>{state.answers[el.dataset.answer]=el.value;save();});$$('[data-can]').forEach(el=>el.onchange=()=>{state.answers[el.dataset.can]=el.checked;save();});$$('[data-add]').forEach(b=>b.onclick=()=>{const w=words[Number(b.dataset.add)];addWord(w[0],w[1]);});$$('[data-q]').forEach(el=>{const [ci,qi]=el.dataset.q.split(':').map(Number);el.onchange=()=>{state.answers[`q${ci}-${qi}`]=Number(el.value);save();feedback(ci,qi);};feedback(ci,qi);});if($('#checkGaps'))$('#checkGaps').onclick=()=>$$('[data-gap]').forEach(el=>{const ok=norm(el.value)===norm(el.dataset.gap);el.classList.toggle('correct',ok);el.classList.toggle('incorrect',!ok);$('#fb-'+el.id).textContent=ok?'✓ Correct.':'Попробуйте ещё раз. Можно открыть таблицу-подсказку.';});if($('#speed'))$('#speed').onchange=e=>$('#lessonAudio').playbackRate=Number(e.target.value);if($('#lessonAudio'))$('#lessonAudio').onerror=()=>notify('Audio unavailable. Open the script to practise together.');installLesson();document.body.classList.toggle('dark',!!state.dark);save();}
function go(i){stop();$('#translationPop').hidden=true;if($('#lessonMenu').open)$('#lessonMenu').close();state.page=i;render();$('#title').focus({preventScroll:true});window.scrollTo({top:0,behavior:'smooth'});}
$('#prev').onclick=()=>go(Math.max(0,state.page-1));$('#next').onclick=()=>state.page<pages.length-1?go(state.page+1):notify('Урок завершён. Можно вернуться к любому разделу.');$('#themeBtn').onclick=()=>{state.dark=!state.dark;document.body.classList.toggle('dark',state.dark);save();};$('#menuBtn').onclick=()=>{$('#lessonMenu').showModal();$('#menuBtn').setAttribute('aria-expanded','true');};$('#closeMenu').onclick=()=>$('#lessonMenu').close();$('#lessonMenu').onclose=()=>$('#menuBtn').setAttribute('aria-expanded','false');
function addWord(en,ru){en=en.trim();ru=ru.trim();if(/[а-яё]/i.test(en)&&/[a-z]/i.test(ru)&&!/[а-яё]/i.test(ru)){[en,ru]=[ru,en];}if(!en||!ru){notify('Add a word and its translation.');return false;}const old=state.words.find(w=>norm(w.en)===norm(en));if(old)old.ru=ru;else state.words.push({en,ru});save();notify(old?'Translation updated.':'Word saved ✓');return true;}
function renderWords(){const list=$('#wordList');list.innerHTML=state.words.length?state.words.map((w,i)=>`<div class="dictrow"><div><strong>${esc(w.en)}</strong><p>${esc(w.ru)}</p></div><div><button type="button" class="small-button" data-speak-word>🔊 Прослушать</button> <button class="small-button" data-edit="${i}" aria-label="Edit ${esc(w.en)}">Edit</button> <button class="small-button" data-delete="${i}" aria-label="Delete ${esc(w.en)}">✕</button></div></div>`).join(''):'<p class="muted dict-empty">Пока пусто. Выделите слово в уроке или добавьте его выше.</p>';$$('[data-edit]').forEach(b=>b.onclick=()=>{const w=state.words[Number(b.dataset.edit)];$('#newWord').value=w.en;$('#newMeaning').value=w.ru;$('#newMeaning').focus();});$$('[data-delete]').forEach(b=>b.onclick=()=>{state.words.splice(Number(b.dataset.delete),1);save();renderWords();});}
function openDict(){window.getSelection()?.removeAllRanges();$('#translationPop').hidden=true;renderWords();$('#dictionary').showModal();}$('#dictBtn').onclick=openDict;$('#closeDict').onclick=()=>$('#dictionary').close();$('#wordForm').onsubmit=e=>{e.preventDefault();if(addWord($('#newWord').value,$('#newMeaning').value)){e.target.reset();renderWords();}};

function translateWhileTyping(event) {
  clearTimeout(manualTimer);
  const version = ++manualVersion;
  const query = manualWord.value.trim();
  manualMeaning.value = '';
  manualStatus.textContent = '';
  if (!query || event?.isComposing) return;
  const saved = state.words.find(word => norm(word.en) === norm(query))?.ru;
  const immediate = saved || localTranslation(query) || manualCache.get(norm(query));
  if (immediate) {
    manualMeaning.value = immediate;
    return;
  }
  manualStatus.textContent = 'Переводим…';
  manualTimer = setTimeout(async () => {
    try {
      const result = await online(query);
      if (version !== manualVersion || manualWord.value.trim() !== query) return;
      manualCache.set(norm(query), result);
      manualMeaning.value = result;
      manualStatus.textContent = 'Перевод готов. Можно исправить перед сохранением.';
    } catch {
      if (version === manualVersion && manualWord.value.trim() === query) {
        manualStatus.textContent = 'Перевод недоступен. Можно ввести его вручную.';
      }
    }
  }, 300);
}
