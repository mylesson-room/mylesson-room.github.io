const busNotices = [["cafe","Station café","The café is open until 18:00."],["bus","Travel desk","The replacement bus leaves from the main entrance of the library."],["train","Rail update","The train to Northbay is now leaving from Platform 2."]];

function briefing() {
  return card('Your mission', '<p>It is 14:00. You are at the station and your usual ferry has been cancelled. Get to Beacon Island before the hostel closes at <b>17:30</b>.</p><div class="word-grid"><div class="word"><h3>Budget</h3><p>£35 in total. Keep at least £5 in reserve.</p></div><div class="word"><h3>Goal</h3><p>Check the latest information, choose a route and send a short update to the hostel.</p></div></div><p>Tell your teacher what you will check first and why.</p><details><summary>Нужна фраза?</summary><p>First, I need to find out… · The most important thing is…</p></details>');
}

function clues() {
  const selected = state.answers.busMessage;
  const feedback = selected === 'bus'
    ? '✓ Верно. Автобус отправляется от главного входа в библиотеку.'
    : selected ? 'В этом сообщении нет места отправления автобуса. Попробуй другую карточку.' : '';
  return card('Where does the bus leave from?',
    '<p>Выбери одно сообщение, которое подсказывает, куда идти на автобус.</p><div class="word-grid">' +
    busNotices.map(([id, title, copy]) =>
      '<article class="word"><strong>' + esc(title) + '</strong><p>' + esc(copy) +
      '</p><button class="small-button" type="button" data-bus-notice="' + id +
      '" aria-pressed="' + (selected === id) + '" aria-label="Выбрать сообщение ' + esc(title) +
      '">Выбрать</button></article>'
    ).join('') + '</div><p id="busNoticeResult" class="mission-result" role="status"' +
    (feedback ? '' : ' hidden') + '>' + esc(feedback) + '</p>') +
    card('What do you still need to know?',
      '<p>Скажи, куда ты пойдёшь. Затем задай два вопроса о дороге и следующем пароме. Ответы выяснишь на следующей странице.</p>' +
      '<details><summary>Подсказка</summary><p>The bus leaves from…<br>How long does it take to walk there?<br>What time does the next ferry leave?</p></details>');
}

function route() {
  return card('Your card · Traveller', '<p>The bus leaves from the library at <b>14:20</b>. You are at the station at <b>14:00</b>. You know the hostel deadline, but your teacher has the walking time and the ferry timetable.</p><p>Ask in English: <i>How long does it take to walk to the library? What time does the next ferry leave? How much is the fare?</i></p><details><summary>Карточка преподавателя / самостоятельная проверка</summary><p>Station → library: 8 minutes on foot. Replacement bus: £8, 14:20–15:05. Ferry: £12, 16:00–16:30. The port screen currently shows Pier B. Allow 10 minutes to walk from the island pier to the hostel.</p><p>Если ученик на уроке с преподавателем, сначала попросите его задать вопросы, затем откройте карточку.</p></details>') +
    card('Build the route in three steps', '<p>Choose where to go first, then the two connections.</p>' +
    hwChoice('route1','Walk to the library',['Wait at the station','Walk to the library','Walk to the hostel']) +
    hwChoice('route2','14:20 replacement bus',['14:20 replacement bus','15:30 ferry','17:45 train']) +
    hwChoice('route3','16:00 ferry',['15:30 ferry','17:45 train','16:00 ferry']) +
    '<p>Tell your partner your expected arrival time and total fare.</p>');
}

function decision() {
  const selected = state.answers.choice;
  const options = [
    ['bus','Bus + ferry','£20 · hostel 16:40','You get to the hostel at 16:40. £15 remains, including your £5 reserve.'],
    ['taxi','Taxi across the bridge','£34 · hostel 16:50','You arrive on time. You have £1 left, so you cannot keep your £5 reserve.'],
    ['train','Late train across the bridge','£24 · hostel 17:45','You have £11 left. Check-in closes 15 minutes before you arrive. You would need to contact the hostel.']
  ];
  const outcome = options.find(option => option[0] === selected)?.[3] || 'Выбери маршрут, чтобы увидеть результат.';
  return card('Go back to the moment of choice', '<p>Imagine you can still choose any of these routes at 14:00. Tap one to see what happens.</p><div class="word-grid">'+options.map(([id,title,details])=>
    '<article class="word"><h3>'+esc(title)+'</h3><p>'+esc(details)+'</p><button class="small-button" type="button" data-route-choice="'+id+'" aria-pressed="'+(id===selected)+'">Выбрать маршрут</button></article>'
  ).join('')+'</div><p id="routeOutcome" class="mission-result" role="status">'+esc(outcome)+'</p><p>Explain why your route works or what you would change. If you choose a different route now, compare the two outcomes.</p>');
}

function budget() {
  const items = [['sandwich','Sandwich',6],['water','Water',2],['charger','Phone charger',8],['postcard','Postcard',3]];
  const selected = state.answers.basket || [];
  const sum = items.filter(([id])=>selected.includes(id)).reduce((total,item)=>total+item[2],0);
  const left = 15 - sum;
  return card('Build your basket', '<p>You took the bus and ferry. You have £15 left. Buy water and at least one other item, and keep £5 in reserve. Your phone is at 12%.</p><div class="word-grid">'+items.map(([id,name,price])=>
    '<article class="word"><h3>'+name+' · £'+price+'</h3><button class="small-button" type="button" data-basket="'+id+'" aria-pressed="'+selected.includes(id)+'">Добавить / убрать</button></article>'
  ).join('')+'</div><p class="mission-result" role="status">Spent: £'+sum+' · Left: £'+left+' · '+(left>=5?'Reserve covered':'Reserve too low')+'</p><p id="basketResult" role="status"></p><button class="primary" type="button" data-basket-check>Проверить корзину</button><p>Explain the trade-off: <i>I’m getting … because … . If my phone dies, I’ll … .</i></p>');
}

function debrief() {
  return card('Send a 45-second update', '<p>Leave a spoken message for the hostel. Say what happened, where you are now, when you will arrive and what you will do if the plan changes again.</p><div class="word-grid"><div class="word"><h3>Past</h3><p>Our original ferry was cancelled.</p></div><div class="word"><h3>Plan</h3><p>I’m taking the 16:00 ferry.</p></div><div class="word"><h3>Backup</h3><p>If the ferry is late, I’ll call you.</p></div></div><p><a class="primary" href="travel-b1-03-homework.html">Открыть домашнее задание →</a></p><p><a href="student-travel-b2.html">Вернуться в кабинет</a></p>') + vocabulary();
}

function updateMission(control) {
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
  if (control) $('#content').querySelector(control)?.focus({preventScroll:true});
}

$('#content').addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  if (button.dataset.busNotice) {
    state.answers.busMessage = button.dataset.busNotice;
    updateMission('[data-bus-notice="' + button.dataset.busNotice + '"]');
  }
  if (button.dataset.order !== undefined) {
    const selected = state.answers.portOrder || [];
    const index = Number(button.dataset.order);
    if (selected.includes(index)) return;
    state.answers.portOrder = [...selected, index];
    const row = document.createElement('li');
    row.textContent = actions[index];
    $('#portOrder').append(row);
    button.disabled = true;
    $('#orderResult').textContent = '';
    save();
  }
  if (button.hasAttribute('data-order-reset')) {
    state.answers.portOrder = [];
    $('#portOrder').replaceChildren();
    $$('[data-order]').forEach(choice => { choice.disabled = false; });
    $('#orderResult').textContent = '';
    save();
  }
  if (button.hasAttribute('data-order-check')) {
    const selected = state.answers.portOrder || [];
    $('#orderResult').textContent = selected.length === 4 && correctOrder.every((id,i)=>id===selected[i])
      ? '✓ Верно. Сначала уточни причал и время, затем иди к нему.'
      : 'Проверь, что нужно сделать до выхода на новый причал и что можно сделать только после прибытия.';
  }
  if (button.dataset.routeChoice) {
    state.answers.choice = button.dataset.routeChoice;
    updateMission('[data-route-choice="'+button.dataset.routeChoice+'"]');
  }
  if (button.dataset.basket) {
    const selected = new Set(state.answers.basket || []);
    const id = button.dataset.basket;
    if (selected.has(id)) selected.delete(id);
    else selected.add(id);
    state.answers.basket = [...selected];
    updateMission('[data-basket="'+id+'"]');
  }
  if (button.hasAttribute('data-basket-check')) {
    const selected = state.answers.basket || [];
    const prices = {sandwich:6,water:2,charger:8,postcard:3};
    const cost = selected.reduce((total,id)=>total+prices[id],0);
    $('#basketResult').textContent = selected.includes('water') && selected.length >= 2 && cost <= 10
      ? '✓ Вода, ещё одна покупка и резерв на месте.'
      : 'Добавь воду и ещё хотя бы одну вещь. На покупки можно потратить не больше £10.';
  }
});

async function online(text){if(new TextEncoder().encode(text).length>450)throw Error('Выделите более короткую фразу (до 450 байт).');const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);try{const response=await fetch('https://api.mymemory.translated.net/get?'+new URLSearchParams({q:text,langpair:/[а-яё]/i.test(text)?'ru|en':'en|ru'}),{signal:controller.signal,credentials:'omit',referrerPolicy:'no-referrer'});if(!response.ok)throw Error('Сервис временно недоступен. Введите перевод вручную.');const d=await response.json();if(Number(d.responseStatus)!==200||!d.responseData?.translatedText)throw Error('Перевод недоступен. Возможно, исчерпан лимит. Введите перевод вручную.');const doc=new DOMParser().parseFromString(d.responseData.translatedText,'text/html');return doc.documentElement.textContent;}finally{clearTimeout(timeout);}}

const manualWord = $('#newWord');
const manualMeaning = $('#newMeaning');
const manualStatus = $('#dictStatus');
const manualCache = new Map();
let manualVersion = 0;
let manualTimer;
manualMeaning.addEventListener('input', () => {
  manualVersion++;
  clearTimeout(manualTimer);
  manualStatus.textContent = '';
});
function translateWhileTyping(event) {
  clearTimeout(manualTimer);
  const version = ++manualVersion;
  const query = manualWord.value.trim();
  manualMeaning.value = '';
  manualStatus.textContent = '';
  if (!query || event?.isComposing) return;
  const saved = state.words.find(word => norm(word.en) === norm(query))?.ru;
  const immediate = saved || localTranslation(query) || manualCache.get(norm(query));
  if (immediate) {
    manualMeaning.value = immediate;
    return;
  }
  manualStatus.textContent = 'Переводим…';
  manualTimer = setTimeout(async () => {
    try {
      const result = await online(query);
      if (version !== manualVersion || manualWord.value.trim() !== query) return;
      manualCache.set(norm(query), result);
      manualMeaning.value = result;
      manualStatus.textContent = 'Перевод готов. Можно исправить перед сохранением.';
    } catch {
      if (version === manualVersion && manualWord.value.trim() === query) {
        manualStatus.textContent = 'Перевод недоступен. Можно ввести его вручную.';
      }
    }
  }, 300);
}
manualWord.addEventListener('input', translateWhileTyping);
manualWord.addEventListener('compositionend', translateWhileTyping);
$('#wordForm').addEventListener('reset', () => {
  manualVersion++;
  clearTimeout(manualTimer);
  manualStatus.textContent = '';
});

$$('[data-turn]').forEach(b=>b.onclick=()=>playTurn(Number(b.dataset.turn),false));$('#pausePractice').onclick=()=>playTurn(0,true);$('#stopPractice').onclick=()=>{clearPractice();a.pause();$('#turnStatus').textContent='Остановлено.';};
}
let training=null;
function shuffle(list){const a=list.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function trainingSetup(){training=null;$('#trainingBody').innerHTML='<h3>Тренировать мои слова</h3><p class="muted">Вспомните перевод, откройте ответ и отметьте, удалось ли вспомнить. Сложные слова повторим ещё раз.</p>'+(state.words.length?'<p>Слов в словаре: '+state.words.length+'</p><label class="field-label" for="trainingCount">Сколько слов?</label><select id="trainingCount"><option value="5">5 слов'+(state.words.length<5?' (доступно '+state.words.length+')':'')+'</option><option value="10">10 слов'+(state.words.length<10?' (доступно '+state.words.length+')':'')+'</option><option value="all">Все слова</option></select><label class="field-label" for="trainingDirection">Направление</label><select id="trainingDirection"><option value="en">English → Русский</option><option value="ru">Русский → English</option></select><div class="dict-actions"><button class="primary" id="startTraining">Начать тренировку</button></div>':'<p>Сначала добавьте хотя бы одно слово в словарь.</p><button class="primary" id="backToWords">Добавить слова</button>');if($('#startTraining'))$('#startTraining').onclick=()=>{const count=$('#trainingCount').value;const list=shuffle(state.words).slice(0,count==='all'?state.words.length:Number(count));training={list,queue:list.map(w=>({w,review:false})),index:0,direction:$('#trainingDirection').value,remembered:new Set(),missed:new Set(),reviewed:0};renderTraining();};if($('#backToWords'))$('#backToWords').onclick=()=>{$('#trainingDialog').close();openDict();};}
function openTraining(){stop();$('#translationPop').hidden=true;if($('#dictionary').open)$('#dictionary').close();trainingSetup();$('#trainingDialog').showModal();}
function renderTraining(){const t=training,entry=t.queue[t.index];if(!entry){const known=t.remembered.size;$('#trainingBody').innerHTML='<h3>Тренировка завершена ✓</h3><p>Слов в тренировке: <b>'+t.list.length+'</b></p><p>Вспомнил с первой попытки: <b>'+known+'</b></p><p>Потребовали повторения: <b>'+t.missed.size+'</b></p><p class="muted">Сложные слова были показаны повторно. Это самооценка, а не автоматическая проверка.</p><div class="dict-actions"><button class="primary" id="againTraining">Ещё тренировка</button><button class="small-button" id="returnDictionary">В словарь</button></div>';$('#againTraining').onclick=trainingSetup;$('#returnDictionary').onclick=()=>{$('#trainingDialog').close();openDict();};return;}const w=entry.w;$('#trainingBody').innerHTML='<p class="muted">'+(entry.review?'Повторение сложного слова':'Слово '+(t.index+1)+' из '+t.list.length)+'</p><div class="training-card"><h2>'+esc(t.direction==='en'?w.en:w.ru)+'</h2><p id="trainingAnswer" hidden>'+esc(t.direction==='en'?w.ru:w.en)+'</p><button class="primary" id="revealTraining">Показать перевод</button></div><div id="trainingGrade" class="dict-actions" hidden><button class="primary" id="rememberTraining">✓ Вспомнил</button><button class="small-button" id="repeatTraining">↻ Ещё повторить</button></div>';$('#revealTraining').onclick=()=>{$('#trainingAnswer').hidden=false;$('#revealTraining').hidden=true;$('#trainingGrade').hidden=false;};function grade(remember){if(!entry.review){if(remember)t.remembered.add(norm(w.en));else{t.missed.add(norm(w.en));t.queue.push({w,review:true});}}else if(!remember){t.queue.push({w,review:true});}t.index++;renderTraining();}$('#rememberTraining').onclick=()=>grade(true);$('#repeatTraining').onclick=()=>grade(false);}

(()=>{
const fmt=n=>Number.isFinite(n)?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'0:00';
function enhance(){const audio=document.getElementById('lessonAudio');if(!audio||audio.dataset.styled)return;audio.dataset.styled='1';audio.controls=false;audio.hidden=true;
const player=document.createElement('div');player.className='audio-player';player.innerHTML='<button type="button" class="audio-play" aria-label="Воспроизвести аудио">▶</button><div class="audio-track"><input type="range" min="0" max="100" step="0.1" value="0" aria-label="Позиция воспроизведения"><div class="audio-times"><span class="elapsed">0:00</span><span class="duration">0:42</span></div></div>';audio.after(player);
const button=player.querySelector('button'),range=player.querySelector('input');
const sync=()=>{button.textContent=audio.paused?'▶':'Ⅱ';button.setAttribute('aria-label',audio.paused?'Воспроизвести аудио':'Пауза');range.value=audio.duration?audio.currentTime/audio.duration*100:0;player.querySelector('.elapsed').textContent=fmt(audio.currentTime);if(Number.isFinite(audio.duration))player.querySelector('.duration').textContent=fmt(audio.duration);};
button.onclick=()=>{if(audio.paused)audio.play().catch(()=>{audio.hidden=false;audio.controls=true;player.hidden=true;});else audio.pause();};
range.oninput=()=>{if(Number.isFinite(audio.duration))audio.currentTime=Number(range.value)*audio.duration/100;sync();};
['play','pause','ended','timeupdate','loadedmetadata','durationchange'].forEach(e=>audio.addEventListener(e,sync));sync();}
new MutationObserver(enhance).observe(document.getElementById('content'),{childList:true});enhance();
})();
</script><script>
const speakSelected = $('#speakSelected');
speakSelected.disabled = !('speechSynthesis' in window);
speakSelected.addEventListener('click', () => {
  const phrase = $('#selectedWord').textContent.trim();
  if (!phrase || !('speechSynthesis' in window)) return;
  const utterance = new SpeechSynthesisUtterance(phrase);
  utterance.lang = /[а-яё]/i.test(phrase) ? 'ru-RU' : 'en-GB';
  utterance.rate = 0.88;
  speechSynthesis.cancel();
  speechSynthesis.speak(utterance);
});
</script><script>
document.addEventListener('click', event => {
  const button = event.target.closest('[data-speak-word]');
  if (!button || !('speechSynthesis' in window)) return;
