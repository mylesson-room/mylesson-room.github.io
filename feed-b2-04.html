function grammar(){
 return card('Degrees of certainty','<p><b>Might have + past participle</b> — возможное объяснение. <b>Must have + past participle</b> — сильный вывод из улик. <b>Can’t have + past participle</b> — свидетельства против версии.</p><p>The same photo was published three years ago. It '+hwChoice('hwG1','can’t have been taken',['might take','can’t have been taken','must have taken'])+' this morning.</p><p>The poster hasn’t replied. They '+hwChoice('hwG2','might have made',['can’t have made','might have made','must make'])+' a mistake, but we don’t know.</p><p>The original and the new copy are identical, including a scratch on the film. They '+hwChoice('hwG3','must have come',['must have come','can’t have come','might coming'])+' from the same photograph.</p>');
}
function rolePlay(){
 return card('You run the school news account','<div class="role-grid"><article class="role"><h3>Reporter</h3><p>A dramatic picture is getting attention. Explain what you can verify and what you still need to check.</p></article><article class="role"><h3>Editor</h3><p>Ask about the source and date. Decide whether to hold the post, publish it with context, or issue a correction.</p></article></div><p><i>We can confirm … · The picture might have been … · Before we publish, we need …</i></p><p>Swap roles and agree on a two-sentence correction.</p>');
}
function finish(){
 return card('What would you tell a friend?','<p>Explain why a real photo can mislead. Name two checks you would do before sharing and one thing the checks might not tell you.</p><p><a class="small-button" href="feed-b2-04-homework.html">Домашнее задание к уроку 4 →</a></p>');
}
