<script type="application/json" id="lesson-data">{"title":"AI in Finance","cabinet":"student-business-ai-finance.html","course":null,"labels":[{"label":"Warm-up","minutes":5},{"label":"Vocabulary","minutes":10},{"label":"Reading","minutes":10},{"label":"Language practice","minutes":8},{"label":"Decision lab","minutes":10},{"label":"Role-play","minutes":8},{"label":"Final discussion","minutes":4}],"vocab":[["cash flow forecast","A prediction of how much money will enter and leave a business","прогноз денежных потоков"],["liquidity","The ability to meet financial obligations when they are due","ликвидность"],["credit risk","The possibility that a borrower will fail to repay money","кредитный риск"],["early warning sign","An indication of a potential problem before it becomes serious","ранний признак проблемы"],["outlier","A data point that is very different from the usual pattern","аномальное значение"],["forecast accuracy","How closely predictions match actual results","точность прогноза"],["risk exposure","The extent to which a business could be affected by a possible loss","подверженность риску"],["stress test","An analysis of how a business would perform under difficult conditions","стресс-тест"]],"reading":[["Why was the AI forecast different from the traditional forecast?",["It considered additional payment behaviour and risk signals.","It ignored sales data.","It automatically changed the company's accounting records."],0],["Which development supported the AI's prediction?",["A sudden increase in revenue.","A major customer's financial difficulties.","A new government regulation."],1],["Why did the company avoid the cash shortage?",["The AI transferred additional funds.","Its sales doubled unexpectedly.","The finance team took preventive action after investigating."],2],["What is the central lesson of the case?",["AI is always more accurate than people.","AI can highlight risks, while people must assess and act on them.","Traditional financial analysis is no longer necessary."],1]],"gaps":[["The company performed a ______ to understand how a recession might affect its finances.","stress test"],["A sudden increase in late customer payments may be an ______ of financial difficulties.","early warning sign"],["Before using the model, we need to evaluate its ______ against actual financial results.","forecast accuracy"],["High debt levels and uncertain revenues can increase the company's ______.","risk exposure"],["The company needs sufficient ______ to pay its suppliers on time.","liquidity"],["One unusually large transaction appeared as an ______ in the data.","outlier"]],"key":"gostudy-business-ai-finance-b2-02-v1","wordsKey":"gostudy-business-ai-shared-v1","advice":{"cut":"Immediate cuts may preserve liquidity but could unnecessarily damage growth if the forecast proves wrong.","investigate":"Investigating while preparing contingency measures can balance caution and business continuity. Act quickly if evidence confirms the risk.","ignore":"Ignoring the forecast avoids immediate disruption but may leave too little time to respond to a cash shortage."},"pages":["\u003csection id=\"page-0\" class=\"page active\">\u003cdiv class=\"panel\">\u003cdiv class=\"activity-head\">\u003cdiv class=\"activity-icon\">◉\u003c/div>\u003cdiv class=\"activity-titles\">\u003ch2>1. Let's talk\u003c/h2>\u003c/div>\u003c/div>\u003cp class=\"lead\">Look at the AI prediction and discuss the questions. Support your opinions with examples.\u003c/p>\u003cdiv class=\"warmup-scene\">\u003cdiv class=\"scene-top\">\u003cspan class=\"scene-badge\">✦ NORTHBRIDGE AI REPORT\u003c/span>\u003cspan class=\"scene-live\">● Updated just now\u003c/span>\u003c/div>\u003cdiv class=\"scene-chart\">\u003cdiv class=\"scene-copy\">\u003csmall>Forecasted cash balance\u003c/small>\u003cstrong>€65,000\u003c/strong>\u003cspan>▼ 35% below safety threshold\u003c/span>\u003c/div>\u003csvg viewBox=\"0 0 330 110\" role=\"img\" aria-label=\"Illustrative declining cash forecast\">\u003cdefs>\u003clinearGradient id=\"cashfade\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\">\u003cstop stop-color=\"#86dce9\" stop-opacity=\".40\"/>\u003cstop offset=\"1\" stop-color=\"#86dce9\" stop-opacity=\"0\"/>\u003c/linearGradient>\u003c/defs>\u003cpath d=\"M0 30 C35 20 44 48 77 41 S137 28 159 58 S216 54 239 76 S302 80 330 99 L330 110 L0 110Z\" fill=\"url(#cashfade)\"/>\u003cpath d=\"M0 30 C35 20 44 48 77 41 S137 28 159 58 S216 54 239 76 S302 80 330 99\" fill=\"none\" stroke=\"#0ab5cf\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003ccircle cx=\"330\" cy=\"99\" r=\"6\" fill=\"#0ab5cf\" stroke=\"white\" stroke-width=\"3\"/>\u003c/svg>\u003c/div>\u003cdiv class=\"scene-footer\">\u003cspan>⚠ Potential liquidity risk in 60 days\u003c/span>\u003cb>Review forecast ↗\u003c/b>\u003c/div>\u003c/div>\u003col class=\"questions\">\u003cli>Would you trust AI to predict your company's financial future?\u003c/li>\u003cli>Which financial decisions should never be made by AI alone?\u003c/li>\u003cli>Can AI identify risks that experienced financial analysts might miss?\u003c/li>\u003cli>Would you invest in a company that relies heavily on AI-generated financial forecasts?\u003c/li>\u003c/ol>\u003cdiv class=\"tip\">\u003cb>Useful language\u003c/b>\u003cp>I would be reluctant to rely on AI because…\u003cbr>One potential advantage is…\u003cbr>Human oversight is essential when…\u003c/p>\u003c/div>\u003c/div>\u003c/section>","\u003csection id=\"page-1\" class=\"page\">\u003cdiv class=\"panel\">\u003cdiv class=\"activity-head\">\u003cdiv class=\"activity-icon\">Aa\u003c/div>\u003cdiv class=\"activity-titles\">\u003ch2>2. Financial vocabulary\u003c/h2>\u003c/div>\u003c/div>\u003cp class=\"lead\">Match the eight financial terms with their definitions. \u003c/p>\u003cdiv id=\"vocab\">\u003c/div>\u003cp id=\"vocabScore\" class=\"feedback\" aria-live=\"polite\">\u003c/p>\u003c/div>\u003c/section>","\u003csection id=\"page-2\" class=\"page\">\u003cdiv class=\"panel\">\u003cdiv class=\"activity-head\">\u003cdiv class=\"activity-icon\">▤\u003c/div>\u003cdiv class=\"activity-titles\">\u003ch2>3. Read & analyse\u003c/h2>\u003c/div>\u003c/div>\u003cp class=\"lead\">Read this fictional business case, then answer the questions.\u003c/p>\u003cdiv class=\"reading-layout\">\u003carticle class=\"article\">\u003cspan class=\"case\">CASE STUDY · NORTHBRIDGE RETAIL\u003c/span>\u003ch3>An AI system predicted a cash shortage. Was it right?\u003c/h3>\u003cp>Northbridge Retail, a medium-sized European company, had experienced steady revenue growth for three years. However, despite increasing sales, the company regularly struggled with cash flow.\u003c/p>\u003cp>Its finance department introduced an AI-powered forecasting system. The software analysed historical sales, supplier payments, seasonal trends and customer payment behaviour.\u003c/p>\u003cp>Within two weeks, the system identified a potential liquidity problem. It predicted that the company's available cash could fall below €100,000 within the next 60 days. Surprisingly, the traditional financial forecast had shown no serious problems.\u003c/p>\u003cp>The AI model highlighted three early warning signs: several large customers were paying invoices later than usual, inventory costs had increased, and sales growth was slowing in one important market.\u003c/p>\u003cp>The finance director, Emma Collins, was initially sceptical. She believed the system might be overreacting to temporary changes. Rather than accepting the prediction immediately, her team investigated the data. They discovered that one major customer was experiencing financial difficulties and had delayed several payments.\u003c/p>\u003cp>Northbridge negotiated new payment terms with suppliers, postponed a non-essential investment and contacted customers with overdue invoices. Six weeks later, the company avoided the predicted cash shortage.\u003c/p>\u003cp>However, the finance director emphasised an important distinction: the software had identified a risk, but human judgement was responsible for evaluating the evidence and choosing how to respond. The company continued using AI for forecasting, but all major financial decisions still required human approval.\u003c/p>\u003c/article>\u003caside class=\"case-column\">\u003cdiv class=\"signal-card\">\u003cdiv class=\"signal-emoji\">📉\u003c/div>\u003cb>Liquidity alert\u003c/b>\u003cspan>The AI predicts cash will drop below a critical threshold.\u003c/span>\u003cstrong>&lt; €100,000\u003c/strong>\u003csmall>Over the next 60 days\u003c/small>\u003c/div>\u003cdiv class=\"signal-card\">\u003cdiv class=\"signal-emoji\">◷\u003c/div>\u003cb>Payment delays\u003c/b>\u003cspan>Major clients are taking longer to settle invoices.\u003c/span>\u003cstrong>Early warning\u003c/strong>\u003c/div>\u003cdiv class=\"signal-card\">\u003cdiv class=\"signal-emoji\">✓\u003c/div>\u003cb>Human decision\u003c/b>\u003cspan>Finance teams verify the data and make the final call.\u003c/span>\u003cstrong>Human oversight\u003c/strong>\u003c/div>\u003c/aside>\u003c/div>\u003ch3 class=\"question-heading\">Answer the questions\u003c/h3>\u003cdiv id=\"reading\">\u003c/div>\u003cp id=\"readingScore\" class=\"feedback\" aria-live=\"polite\">\u003c/p>\u003c/div>\u003c/section>","\u003csection id=\"page-3\" class=\"page\">\u003cdiv class=\"panel\">\u003cdiv class=\"activity-head\">\u003cdiv class=\"activity-icon\">✎\u003c/div>\u003cdiv class=\"activity-titles\">\u003ch2>4. Use the language\u003c/h2>\u003c/div>\u003c/div>\u003cp class=\"lead\">Complete the sentences using expressions from the vocabulary section.\u003c/p>\u003cdiv id=\"gaps\">\u003c/div>\u003cp id=\"gapsScore\" class=\"feedback\" aria-live=\"polite\">\u003c/p>\u003c/div>\u003c/section>","\u003csection id=\"page-4\" class=\"page\">\u003cdiv class=\"panel\">\u003cdiv class=\"activity-head\">\u003cdiv class=\"activity-icon\">▥\u003c/div>\u003cdiv class=\"activity-titles\">\u003ch2>5. Financial decision lab\u003c/h2>\u003c/div>\u003c/div>\u003cp class=\"lead\">You are the Finance Director. The company's minimum comfortable cash balance is \u003cb>€100,000\u003c/b>.\u003c/p>\u003cdiv class=\"decision-metrics\">\u003cdiv>\u003csmall>Cash safety target\u003c/small>\u003cb>€100,000\u003c/b>\u003cspan>Minimum comfortable cash\u003c/span>\u003c/div>\u003cdiv>\u003csmall>Expected forecast\u003c/small>\u003cb>€65,000\u003c/b>\u003cspan>Projected in 60 days\u003c/span>\u003c/div>\u003cdiv>\u003csmall>Potential funding gap\u003c/small>\u003cb>€35,000\u003c/b>\u003cspan>To restore target balance\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"chart\">\u003cdiv class=\"chart-row\">\u003cspan>Optimistic\u003c/span>\u003cdiv class=\"track\">\u003cdiv style=\"width:90%;background:#4aaf91\">\u003c/div>\u003c/div>\u003cb>€180,000\u003c/b>\u003c/div>\u003cdiv class=\"chart-row\">\u003cspan>Expected\u003c/span>\u003cdiv class=\"track\">\u003cdiv style=\"width:32.5%;background:#6971df\">\u003c/div>\u003c/div>\u003cb>€65,000\u003c/b>\u003c/div>\u003cdiv class=\"chart-row\">\u003cspan>Pessimistic\u003c/span>\u003cdiv class=\"track negative\">\u003cdiv style=\"width:20%;background:#df7c77\">\u003c/div>\u003c/div>\u003cb>−€40,000\u003c/b>\u003c/div>\u003csmall>Illustrative cash positions after 60 days. The pessimistic scenario implies a shortfall.\u003c/small>\u003c/div>\u003col class=\"questions\">\u003cli>Which scenario concerns you most, and why?\u003c/li>\u003cli>How much additional cash is required to reach the target in the expected scenario?\u003c/li>\u003cli>Should the company cut spending immediately or investigate further?\u003c/li>\u003cli>What additional data would you request?\u003c/li>\u003c/ol>\u003ch3>Make your decision\u003c/h3>\u003cdiv id=\"decision\" class=\"choices\">\u003clabel>\u003cinput type=\"radio\" name=\"decision\" value=\"cut\"> Reduce spending immediately\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"decision\" value=\"investigate\"> Investigate and prepare contingency measures\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"decision\" value=\"ignore\"> Ignore the forecast until the shortage occurs\u003c/label>\u003c/div>\u003cp id=\"decisionAdvice\" class=\"tip\" aria-live=\"polite\">Choose a strategy to reveal its possible consequences.\u003c/p>\u003clabel class=\"field-label\" for=\"decisionNotes\">Explain your decision\u003c/label>\u003ctextarea id=\"decisionNotes\" data-save=\"decisionNotes\" placeholder=\"I would recommend… because…\">\u003c/textarea>\u003c/div>\u003c/section>","\u003csection id=\"page-5\" class=\"page\">\u003cdiv class=\"panel\">\u003cdiv class=\"activity-head\">\u003cdiv class=\"activity-icon\">◎\u003c/div>\u003cdiv class=\"activity-titles\">\u003ch2>6. CEO meeting\u003c/h2>\u003c/div>\u003c/div>\u003cp class=\"lead\">The CEO believes the finances are under control. Your task is to secure approval for two preventive measures.\u003c/p>\u003cdiv class=\"role-grid\">\u003cdiv class=\"role\">\u003cdiv class=\"role-icon\">01\u003c/div>\u003ch3>Finance Director\u003c/h3>\u003cp>Explain the risk, present the figures, defend your interpretation and recommend concrete actions.\u003c/p>\u003c/div>\u003cdiv class=\"role\">\u003cdiv class=\"role-icon\">02\u003c/div>\u003ch3>CEO\u003c/h3>\u003cp>Challenge the model's reliability, question the cost and ask what would happen if the forecast is wrong.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"tip\">\u003cb>Useful expressions\u003c/b>\u003cp>According to the latest forecast…\u003cbr>There is a significant risk that…\u003cbr>We should take into account…\u003cbr>I would recommend implementing…\u003cbr>We should avoid relying solely on…\u003c/p>\u003c/div>\u003clabel class=\"field-label\" for=\"roleNotes\">Notes from the discussion\u003c/label>\u003ctextarea id=\"roleNotes\" data-save=\"roleNotes\" placeholder=\"My main argument…\">\u003c/textarea>\u003c/div>\u003c/section>","\u003csection id=\"page-6\" class=\"page\">\u003cdiv class=\"panel\">\u003cdiv class=\"activity-head\">\u003cdiv class=\"activity-icon\">◌\u003c/div>\u003cdiv class=\"activity-titles\">\u003ch2>7. Your opinion\u003c/h2>\u003c/div>\u003c/div>\u003cp class=\"lead\">A company follows an AI-generated financial forecast and loses €2 million. The model was supplied by an external provider.\u003c/p>\u003cdiv class=\"tip\">\u003cb>Who should be accountable?\u003c/b>\u003cp>The CFO who approved the decision? The software provider? The analysts who failed to question the forecast? Or should responsibility be shared?\u003c/p>\u003c/div>\u003cp>Give a \u003cb>60-second opinion\u003c/b> and use at least three new financial expressions.\u003c/p>\u003ctextarea data-save=\"finalOpinion\" aria-label=\"Your final opinion\" placeholder=\"In my view, responsibility should…\">\u003c/textarea>\u003c/div>\u003c/section>"],"hero":"Can AI predict a financial crisis before it happens?","footer":"Original lesson material · Fictional Northbridge Retail case.","exerciseIds":{"vocab":["finance2-vocab-01","finance2-vocab-02","finance2-vocab-03","finance2-vocab-04","finance2-vocab-05","finance2-vocab-06","finance2-vocab-07","finance2-vocab-08"],"reading":["finance2-reading-01","finance2-reading-02","finance2-reading-03","finance2-reading-04"],"gaps":["finance2-gap-01","finance2-gap-02","finance2-gap-03","finance2-gap-04","finance2-gap-05","finance2-gap-06"],"decision":"finance2-decision-01","decisionNotes":"finance2-decision-reasoning-01","roleNotes":"finance2-case-notes-01","finalOpinion":"finance2-final-opinion-01","writing":"finance2-writing-01","warmup":["finance2-warmup-trust","finance2-warmup-scope","finance2-warmup-signals","finance2-warmup-investment"]},"homeworkPrompt":"Write a 140–180 word email to a CEO. Describe the potential benefits of AI forecasting, two major risks, your implementation recommendation and why human oversight matters.","externalHomework":"business-ai-finance-b2-02-homework.html","warmupQuestions":["Would you trust AI to predict your company's financial future?","Which financial decisions should never be made by AI alone?","Can AI identify risks that experienced financial analysts might miss?","Would you invest in a company that relies heavily on AI-generated financial forecasts?"]}</script>
