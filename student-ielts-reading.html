<script>
/* Preserve all existing IELTS words without deleting the legacy browser records. */
(function(){
'use strict';
const keys=['gostudy-ielts-reading-01-v1','gostudy-ielts-reading-02-v1','gostudy-ielts-reading-03-v1','gostudy-ielts-reading-04-v1'],target=keys[0];
try{
const read=k=>JSON.parse(localStorage.getItem(k)||'{}')||{};
const main=read(target);const all=new Map();
for(const key of keys){const s=read(key);for(const w of Array.isArray(s.words)?s.words:[]){const id=String(w?.en||'').trim().toLowerCase();if(id&&!all.has(id))all.set(id,{en:w.en,ru:String(w.ru||'')});}}
const current=Array.isArray(main.words)?main.words:[];if(all.size>current.length){main.words=[...all.values()];localStorage.setItem(target,JSON.stringify(main));}
}catch(error){console.warn('Legacy vocabulary merge skipped');}
const homework=document.getElementById('assignment');if(homework)homework.setAttribute('aria-hidden','true');
})();
</script>
