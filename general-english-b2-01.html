<script type="application/json" id="lesson-data">{"title":"The Hidden Cost of Convenience","cabinet":"student-general-english-b2.html","course":"general-english-b2","labels":[{"label":"Warm-up","minutes":5},{"label":"Vocabulary in context","minutes":8},{"label":"Reading and inference","minutes":10},{"label":"Language practice","minutes":8},{"label":"Hidden costs in daily life","minutes":6},{"label":"Real-life discussion","minutes":9},{"label":"Wrap-up","minutes":4},{"label":"Homework","minutes":15}],"vocab":[["trade-off","A situation in which gaining one benefit means giving up another","компромисс; необходимость чем-то пожертвовать"],["upfront cost","Money you need to pay at the beginning of an arrangement","первоначальные затраты"],["hidden cost","An expense or difficulty that is not obvious at first","скрытые издержки"],["cut back on","To reduce how much you use or spend on something","сократить расходы или потребление"],["get into the habit of","To begin doing something regularly","выработать привычку"],["shift the burden","To make another person deal with a difficulty or responsibility","переложить нагрузку"],["in the long run","Over a long period rather than immediately","в долгосрочной перспективе"],["worth the effort","Valuable enough to justify the time or work involved","стоящий затраченных усилий"]],"reading":[["Why did Maya start questioning the promise of easy delivery?",["Her app stopped accepting payments.","Paying for convenience still meant disruptions for her and her neighbours.","Her neighbours refused to use online services."],1],["What changed during the collection-point trial?",["She stopped ordering online completely.","The collection point began opening 24 hours a day.","Collecting parcels became part of Maya’s journey home."],2],["Which detail shows that one solution was not suitable for everyone?",["A nurse’s shift and an older neighbour’s mobility made collection difficult.","The delivery company refused to use the building entrance.","No residents wanted a collection point."],0],["What was the compromise at the end?",["Ban doorstep delivery in the whole building.","Use collection for routine orders while keeping doorstep delivery available.","Make every resident pay for express delivery."],1]],"gaps":[["Maya ______ order nearly everything to her door. (A past habit that changed.)","used to"],["Maya is ______ picking up parcels after work now. (The routine feels normal.)","used to"],["At first, she found it difficult to ______ the new collection hours. (Become accustomed.)","get used to"],["She gradually ______ collecting parcels on her way home. (Became accustomed.)","got used to"],["Some neighbours were already ______ receiving deliveries at their doors. (Accustomed to.)","used to"]],"key":"gostudy-general-english-b2-01-v2","wordsKey":"gostudy-vocabulary-general-english-b2-v1","advice":{"cut":"That might cut costs, but whose needs would it overlook? Give one specific example.","investigate":"This offers flexibility. How could residents make sure the extra work is shared fairly?","ignore":"This preserves familiar habits. Which hidden costs remain, and for whom?"},"pages":["\u003csection id=\"page-0\" class=\"page active\">\u003cdiv class=\"panel\">\u003cdiv class=\"activity-head\">\u003cdiv class=\"activity-icon\" aria-hidden=\"true\">◉\u003c/div>\u003cdiv class=\"activity-titles\">\u003ch2>1. Convenience: what is the real price?\u003c/h2>\u003c/div>\u003c/div>\n\u003cp class=\"lead\">Think about an app or service that makes your life easier. Sometimes we save time but pay in another way.\u003c/p>\n\u003col class=\"questions\">\n\u003cli>Which service has genuinely saved you time recently? What did you give up in exchange?\u003c/li>\n\u003cli>Have you ever paid for convenience and later regretted it?\u003c/li>\n\u003cli>Who might be doing extra work when we choose the easiest option for ourselves?\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"tip\">\u003cp>\u003cstrong>Today’s goal:\u003c/strong> explain the hidden costs of everyday conveniences, compare how habits change, and use at least five of the eight lesson expressions in a natural discussion.\u003c/p>\u003cp>Useful starters: “I used to…” · “It’s worth it when…” · “The trade-off is…”\u003c/p>\u003c/div>\n\u003c/div>\u003c/section>","\u003csection id=\"page-1\" class=\"page\">\u003cdiv class=\"panel\">\u003cdiv class=\"activity-head\">\u003cdiv class=\"activity-icon\" aria-hidden=\"true\">Aa\u003c/div>\u003cdiv class=\"activity-titles\">\u003ch2>2. Eight expressions that change the conversation\u003c/h2>\u003c/div>\u003c/div>\n\u003cp class=\"lead\">Match each expression to its meaning. Then use \u003cstrong>at least three expressions\u003c/strong> to talk about situations you know.\u003c/p>\n\u003cdiv id=\"vocab\">\u003c/div>\u003cp id=\"vocabScore\" class=\"feedback\" aria-live=\"polite\">\u003c/p>\n\u003cdiv class=\"tip\">\u003cp>\u003cstrong>Try these questions:\u003c/strong> What hidden cost can appear when ordering groceries online? When is paying an upfront cost worth the effort? How can a company shift the burden onto its customers?\u003c/p>\u003cp>Challenge: explain the difference between a \u003cem>trade-off\u003c/em> and a \u003cem>hidden cost\u003c/em>.\u003c/p>\u003c/div>\n\u003c/div>\u003c/section>","\u003csection id=\"page-2\" class=\"page\">\u003cdiv class=\"panel\">\u003cdiv class=\"activity-head\">\u003cdiv class=\"activity-icon\" aria-hidden=\"true\">▤\u003c/div>\u003cdiv class=\"activity-titles\">\u003ch2>3. Read, understand and look beyond the story\u003c/h2>\u003c/div>\u003c/div>\n\u003cp class=\"lead\">\u003cstrong>Before you read:\u003c/strong> Would a parcel collection point make life easier or harder? Think of two people who might answer differently.\u003c/p>\n\u003carticle class=\"article\">\u003ch3>The time we save, and the work we pass on\u003c/h3>\n\u003cp>When Maya moved into her new apartment, she used to have almost everything delivered straight to her door. The extra charge seemed like a fair trade-off for the time she saved. But one busy week she paid for express delivery and still spent twenty minutes helping couriers find the entrance. Her neighbour even left an online meeting to accept a parcel. These were hidden costs that the app never mentioned.\u003c/p>\n\u003cp>Maya suggested a one-month trial: routine parcels would go to a collection point near the station. There was no upfront cost to join, and people could still choose doorstep delivery when needed. At first, Maya assumed that collecting parcels would be inconvenient. Then she got into the habit of stopping at the collection point on her way home. By the second week, she had got used to the new routine. She could cut back on express delivery fees without losing much time.\u003c/p>\n\u003cp>However, the same trade-off was not fair for everyone. One nurse finished work after the collection point closed, and an older resident found the walk difficult. They were used to having parcels delivered to the door. A strict collection-only policy would simply shift the burden from couriers to residents who had fewer alternatives.\u003c/p>\n\u003cp>In the long run, the building kept a flexible system: collection for most routine parcels, doorstep delivery when necessary, and better entrance directions for couriers. Maya concluded that the change was worth the effort, not because it was perfect, but because it made the costs and choices more visible.\u003c/p>\u003c/article>\n\u003ch3 class=\"question-heading\">Check your understanding\u003c/h3>\n\u003cdiv id=\"reading\">\u003c/div>\u003cp id=\"readingScore\" class=\"feedback\" aria-live=\"polite\">\u003c/p>\n\u003cdiv class=\"tip\">\u003cp>\u003cstrong>After reading — explain, don’t just choose:\u003c/strong> Why could the collection point feel more convenient to Maya but less convenient to the nurse? Who benefits from the final compromise? Which sentence best expresses the article’s main idea?\u003c/p>\u003c/div>\n\u003c/div>\u003c/section>","\u003csection id=\"page-3\" class=\"page\">\u003cdiv class=\"panel\">\u003cdiv class=\"activity-head\">\u003cdiv class=\"activity-icon\" aria-hidden=\"true\">✎\u003c/div>\u003cdiv class=\"activity-titles\">\u003ch2>4. Used to: from noticing to speaking\u003c/h2>\u003c/div>\u003c/div>\n\u003cp class=\"lead\">Look at the story: what was normal for Maya before, what feels normal now, and how did she adapt?\u003c/p>\n\u003cdiv class=\"tip\">\n\u003cp class=\"grammar-example\">\u003cstrong>used to + base verb\u003c/strong> — a past habit that changed: \u003cem>She used to have everything delivered.\u003c/em>\u003c/p>\n\u003cp class=\"grammar-example\">\u003cstrong>be used to + noun/-ing\u003c/strong> — something is familiar: \u003cem>She is used to collecting parcels.\u003c/em>\u003c/p>\n\u003cp class=\"grammar-example\">\u003cstrong>get used to + noun/-ing\u003c/strong> — a process of adaptation: \u003cem>She got used to the new routine.\u003c/em>\u003c/p>\n\u003c/div>\n\u003cp class=\"lead\">Complete the five sentences. Then change two of them so that they are true about your life.\u003c/p>\n\u003cdiv id=\"gaps\">\u003c/div>\u003cp id=\"gapsScore\" class=\"feedback\" aria-live=\"polite\">\u003c/p>\n\u003cdiv class=\"tip\">\u003cp>\u003cstrong>Personalise:\u003c/strong> Name one service you used to use, a new routine you are getting used to, and one thing you are already used to doing. What changed, and why?\u003c/p>\u003c/div>\n\u003c/div>\u003c/section>","\u003csection id=\"page-4\" class=\"page\">\u003cdiv class=\"panel\">\u003cdiv class=\"activity-head\">\u003cdiv class=\"activity-icon\" aria-hidden=\"true\">▥\u003c/div>\u003cdiv class=\"activity-titles\">\u003ch2>5. A second look: who pays for convenience?\u003c/h2>\u003c/div>\u003c/div>\n\u003cp class=\"lead\">Now apply the idea beyond the article. A small apartment building has 30 flats. Couriers often wait outside, the nearest collection point closes at 7 p.m., and not everyone can carry heavy parcels.\u003c/p>\n\u003col class=\"questions\">\n\u003cli>Which hidden cost would each option create for the people involved?\u003c/li>\n\u003cli>Which group might be overlooked if everyone follows one rule?\u003c/li>\n\u003cli>Which idea seems fairest, and what would improve it?\u003c/li>\n\u003c/ol>\n\u003cdiv id=\"decision\" class=\"choices\">\n\u003clabel>\u003cinput type=\"radio\" name=\"decision\" value=\"cut\"> Use a collection point for every delivery\u003c/label>\n\u003clabel>\u003cinput type=\"radio\" name=\"decision\" value=\"investigate\"> Offer collection for routine orders but preserve doorstep delivery\u003c/label>\n\u003clabel>\u003cinput type=\"radio\" name=\"decision\" value=\"ignore\"> Keep doorstep delivery as the only option\u003c/label>\n\u003c/div>\n\u003cp id=\"decisionAdvice\" class=\"tip\" aria-live=\"polite\">Choose an option to reveal a follow-up question.\u003c/p>\n\u003clabel class=\"field-label\" for=\"decisionNotes\">Explain one hidden cost and one trade-off in your own words\u003c/label>\n\u003ctextarea id=\"decisionNotes\" data-save=\"decisionNotes\" placeholder=\"One hidden cost is… The trade-off is…\">\u003c/textarea>\n\u003c/div>\u003c/section>","\u003csection id=\"page-5\" class=\"page\">\u003cdiv class=\"panel\">\u003cdiv class=\"activity-head\">\u003cdiv class=\"activity-icon\" aria-hidden=\"true\">◎\u003c/div>\u003cdiv class=\"activity-titles\">\u003ch2>6. Real-life discussion: convenience under the microscope\u003c/h2>\u003c/div>\u003c/div>\n\u003cp class=\"lead\">Discuss genuine experiences and opinions. No fictional roles or negotiations are needed.\u003c/p>\n\u003col class=\"questions\">\n\u003cli>Have you ever subscribed to a service to save time, only to spend more time managing it?\u003c/li>\n\u003cli>Are food delivery, online shopping and AI assistants making people more independent or more dependent?\u003c/li>\n\u003cli>What hidden costs do free apps create for our attention, privacy or habits?\u003c/li>\n\u003cli>When does a service that is technically convenient stop being worth the effort?\u003c/li>\n\u003cli>Would you cut back on any convenience in the long run? What would make the change realistic?\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"tip\">\u003cp>\u003cstrong>Speaking challenge:\u003c/strong> use at least five target expressions and one example of \u003cem>used to / be used to / get used to\u003c/em>. Support your views with real examples, not just one-word answers.\u003c/p>\u003c/div>\n\u003clabel class=\"field-label\" for=\"roleNotes\">Useful examples or new ideas from the discussion (optional)\u003c/label>\n\u003ctextarea id=\"roleNotes\" data-save=\"roleNotes\" placeholder=\"A service I’ve changed my mind about is…\">\u003c/textarea>\n\u003c/div>\u003c/section>","\u003csection id=\"page-6\" class=\"page\">\u003cdiv class=\"panel\">\u003cdiv class=\"activity-head\">\u003cdiv class=\"activity-icon\" aria-hidden=\"true\">◌\u003c/div>\u003cdiv class=\"activity-titles\">\u003ch2>7. Wrap-up: what can you actually use?\u003c/h2>\u003c/div>\u003c/div>\n\u003cp class=\"lead\">\u003cstrong>Without looking back:\u003c/strong> explain \u003cem>trade-off\u003c/em> and \u003cem>shift the burden\u003c/em> in your own words.\u003c/p>\n\u003col class=\"questions\">\n\u003cli>Complete aloud: “I used to…, but now I’m used to…”\u003c/li>\n\u003cli>Use one more expression from the lesson in a natural sentence.\u003c/li>\n\u003cli>What is one idea from the article you agree or disagree with? Why?\u003c/li>\n\u003c/ol>\n\u003clabel class=\"field-label\" for=\"finalOpinion\">Write two or three sentences to summarise your view\u003c/label>\n\u003ctextarea data-save=\"finalOpinion\" aria-label=\"Your final opinion\" placeholder=\"In the long run, I think… One hidden cost is…\">\u003c/textarea>\n\u003c/div>\u003c/section>","\u003csection id=\"page-7\" class=\"page\">\u003cdiv class=\"panel\">\u003cdiv class=\"activity-head\">\u003cdiv class=\"activity-icon\" aria-hidden=\"true\">✉\u003c/div>\u003cdiv class=\"activity-titles\">\u003ch2>8. Homework: how have your habits changed?\u003c/h2>\u003c/div>\u003c/div>\n\u003cp class=\"lead\">Choose \u003cstrong>one\u003c/strong> of the following. Write 140–180 words using at least \u003cstrong>four target expressions\u003c/strong> and one correct form of \u003cem>used to / be used to / get used to\u003c/em>.\u003c/p>\n\u003cdiv class=\"tip\">\u003cp>\u003cstrong>Option A · Opinion:\u003c/strong> Is convenience making everyday life better, or are its hidden costs becoming too high? Give two concrete examples and acknowledge a different point of view.\u003c/p>\u003cp>\u003cstrong>Option B · Personal story:\u003c/strong> Describe a service you used to rely on, how your routine changed, what you got used to, and whether the change was worth the effort in the long run.\u003c/p>\u003c/div>\n\u003cp>Suggested structure: opening idea → first example → second example or contrast → concluding view.\u003c/p>\n\u003ctextarea id=\"homework\" data-save=\"homework\" style=\"min-height:260px\" placeholder=\"I used to…&#10;&#10;However…\">\u003c/textarea>\u003cdiv class=\"homework-tools\">\u003cspan id=\"wordCount\">0 words · Target: 140–180\u003c/span>\u003cbutton class=\"outline\" onclick=\"copyHomework()\">Copy message\u003c/button>\u003c/div>\n\u003c/div>\u003c/section>"],"hero":"The Hidden Cost of Convenience","version":"methodology-20261117","answerNamespace":"general-b2-v2:"}</script>
