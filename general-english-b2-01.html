<script type="application/json" id="lesson-data">{"title":"The Hidden Cost of Convenience","cabinet":"student-general-english-b2.html","course":"general-english-b2","labels":[{"label":"Warm-up","minutes":5},{"label":"Vocabulary","minutes":9},{"label":"Reading","minutes":9},{"label":"Language practice","minutes":8},{"label":"Decision lab","minutes":7},{"label":"Role-play","minutes":7},{"label":"Final discussion","minutes":5},{"label":"Homework","minutes":15}],"vocab":[["trade-off","A situation in which gaining one benefit means giving up another","компромисс между преимуществами"],["upfront cost","The amount you pay at the beginning","первоначальные затраты"],["hidden cost","A cost that is easy to miss when you make a decision","скрытые издержки"],["cut back on","To use, buy or spend less of something","сократить потребление или расходы"],["get into the habit of","To start doing something regularly","взять за привычку"],["shift the burden","To move a responsibility or difficulty onto someone else","переложить ответственность или нагрузку"],["in the long run","Over a long period of time rather than immediately","в долгосрочной перспективе"],["worth the effort","Good enough to justify the work or time needed","стоит усилий"]],"reading":[["What first made Maya pay attention to the app’s practical costs?",["She realised several neighbours had tried to use her door.","She paid a higher fee while still spending time on someone else’s delivery problems.","She found that collecting parcels was more expensive."],1],["Why was Maya surprised by the collection point?",["It offered to bring parcels to her apartment.","It was open only at weekends.","Collecting the parcels was easier to fit into her routine than expected."],2],["Why did the pilot scheme fail to suit everyone?",["Some residents could not easily fit the opening hours or the walk into their lives.","Residents were not allowed to collect parcels for their neighbours.","The app stopped working in the building."],0],["What solution did residents choose in the end?",["Ban doorstep delivery for everyone.","Use a collection point for routine deliveries and keep doorstep delivery as an option.","Keep the doorstep service and ask couriers to work longer."],1],["What is the main point of the article?",["Technology always saves less time than it claims.","Cheaper services are usually less convenient.","A convenient service deserves a closer look at who does the extra work."],2]],"gaps":[["Before the trial, Maya ______ order deliveries to her door. (Past habit · use “use”)","used to"],["Maya is ______ collecting her parcels after work now. (It feels normal · use “used”)","used to"],["Most people eventually ______ the shorter collection hours. (Became accustomed · use “get”)","got used to"],["I can’t ______ checking several apps just to track one parcel. (Become accustomed · use “get”)","get used to"],["Which expression means “over a long period of time”? Write it here.","in the long run"],["If you want to spend less on deliveries, you could ______ express orders. (Use new vocabulary.)","cut back on"]],"key":"gostudy-general-english-b2-01-v1","wordsKey":"gostudy-vocabulary-general-english-b2-v1","advice":{"cut":"This reduces unnecessary trips. How would it work for residents who cannot reach the collection point?","investigate":"This keeps both options open. Decide who sets up and monitors the system.","ignore":"This protects flexibility. Consider whether the extra work for couriers and neighbours will continue."},"pages":["\u003csection id=\"page-0\" class=\"page active\">\u003cdiv class=\"panel\">\u003cdiv class=\"activity-head\">\u003cdiv class=\"activity-icon\" aria-hidden=\"true\">◉\u003c/div>\u003cdiv class=\"activity-titles\">\u003ch2>1. Let’s talk\u003c/h2>\u003c/div>\u003c/div>\u003cp class=\"lead\">Think of an app or service you regularly use to save time.\u003c/p>\u003col class=\"questions\">\u003cli>When did you last pay extra to make something easier? Was it worth it?\u003c/li>\u003cli>What small inconvenience would you accept to save money or help someone else?\u003c/li>\u003cli>When a service saves your time, who might be doing the extra work?\u003c/li>\u003c/ol>\u003cdiv class=\"tip\">\u003cp>I used to…\u003cbr>The biggest advantage for me is…\u003cbr>It’s worth it when…\u003c/p>\u003c/div>\u003c/div>\u003c/section>\n","\u003csection id=\"page-1\" class=\"page\">\u003cdiv class=\"panel\">\u003cdiv class=\"activity-head\">\u003cdiv class=\"activity-icon\" aria-hidden=\"true\">Aa\u003c/div>\u003cdiv class=\"activity-titles\">\u003ch2>2. Match the expressions\u003c/h2>\u003c/div>\u003c/div>\u003cp class=\"lead\">Match the eight expressions with their definitions. Pick two and give a real example for each.\u003c/p>\u003cdiv id=\"vocab\">\u003c/div>\u003cp id=\"vocabScore\" class=\"feedback\" aria-live=\"polite\">\u003c/p>\u003c/div>\u003c/section>\n","\u003csection id=\"page-2\" class=\"page\">\u003cdiv class=\"panel\">\u003cdiv class=\"activity-head\">\u003cdiv class=\"activity-icon\" aria-hidden=\"true\">▤\u003c/div>\u003cdiv class=\"activity-titles\">\u003ch2>3. Read and infer\u003c/h2>\u003c/div>\u003c/div>\u003cp class=\"lead\">Read about a building that changed the way it receives deliveries. Then choose the best answers.\u003c/p>\u003carticle class=\"article\">\u003ch3>The time we save, and the work we pass on\u003c/h3>\n\u003cp>When Maya moved into her new apartment, she used to get nearly everything delivered to her door. The extra charge seemed reasonable. Then one week she paid for express delivery and still spent twenty minutes helping three different couriers find the entrance. On Friday, her neighbour had to leave a meeting to take in a parcel for her. Maya began to see a hidden cost that her delivery app never showed.\u003c/p>\n\u003cp>She suggested a one-month trial to the building’s residents. Instead of having every parcel delivered to their doors, they would send routine orders to a collection point near the station. At first she thought she would have to make a special trip every time. But she started picking up her parcels on the way home, and within two weeks she had got used to it. The upfront cost was zero, and she stopped paying for several express deliveries a month.\u003c/p>\n\u003cp>For other residents, the trade-off looked different. The collection point closed before one nurse finished her shift, and an older resident found the walk difficult. Both had been used to receiving parcels at the door. A single rule would have shifted the burden from couriers to people who had few other options.\u003c/p>\n\u003cp>The residents kept the collection point as the default for routine orders and left doorstep delivery available to anyone who wanted it. They also put clearer delivery directions in the building app. Maya still used doorstep delivery on busy weeks. What had changed was that she could say who was saving time, who was doing the extra work, and when the convenience was worth paying for.\u003c/p>\u003c/article>\u003ch3 class=\"question-heading\">Answer the questions\u003c/h3>\u003cdiv id=\"reading\">\u003c/div>\u003cp id=\"readingScore\" class=\"feedback\" aria-live=\"polite\">\u003c/p>\u003c/div>\u003c/section>\n","\u003csection id=\"page-3\" class=\"page\">\u003cdiv class=\"panel\">\u003cdiv class=\"activity-head\">\u003cdiv class=\"activity-icon\" aria-hidden=\"true\">✎\u003c/div>\u003cdiv class=\"activity-titles\">\u003ch2>4. Talk about changing habits\u003c/h2>\u003c/div>\u003c/div>\u003cdiv class=\"tip\">\u003cp class=\"grammar-example\">\u003cstrong>used to + infinitive\u003c/strong> · a past habit that has changed. \u003cem>I used to order every meal online.\u003c/em>\u003c/p>\u003cp class=\"grammar-example\">\u003cstrong>be used to + noun or -ing\u003c/strong> · something feels normal. \u003cem>I’m used to cooking after work.\u003c/em>\u003c/p>\u003cp class=\"grammar-example\">\u003cstrong>get used to + noun or -ing\u003c/strong> · something gradually starts to feel normal. \u003cem>I got used to shopping on Sundays.\u003c/em>\u003c/p>\u003c/div>\u003cp class=\"lead\">Complete the sentences. Then tell your teacher one thing you are getting used to.\u003c/p>\u003cdiv id=\"gaps\">\u003c/div>\u003cp id=\"gapsScore\" class=\"feedback\" aria-live=\"polite\">\u003c/p>\u003c/div>\u003c/section>\n","\u003csection id=\"page-4\" class=\"page\">\u003cdiv class=\"panel\">\u003cdiv class=\"activity-head\">\u003cdiv class=\"activity-icon\" aria-hidden=\"true\">▥\u003c/div>\u003cdiv class=\"activity-titles\">\u003ch2>5. Choose a delivery policy\u003c/h2>\u003c/div>\u003c/div>\u003cp class=\"lead\">Your building has 30 flats. Delivery drivers often wait outside, some residents work until late, and the nearest collection point closes at 7 p.m.\u003c/p>\u003col class=\"questions\">\u003cli>For each option, who gains time and who takes on more work?\u003c/li>\u003cli>What condition would make your preferred policy fairer?\u003c/li>\u003c/ol>\u003cdiv id=\"decision\" class=\"choices\">\u003clabel>\u003cinput type=\"radio\" name=\"decision\" value=\"cut\"> Set a collection point as the only option\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"decision\" value=\"investigate\"> Offer a collection point for routine orders and keep doorstep delivery\u003c/label>\u003clabel>\u003cinput type=\"radio\" name=\"decision\" value=\"ignore\"> Keep doorstep delivery for every order\u003c/label>\u003c/div>\u003cp id=\"decisionAdvice\" class=\"tip\" aria-live=\"polite\">Choose a policy to see a question to discuss.\u003c/p>\u003clabel class=\"field-label\" for=\"decisionNotes\">Your decision and one trade-off\u003c/label>\u003ctextarea id=\"decisionNotes\" data-save=\"decisionNotes\" placeholder=\"The main trade-off is…\">\u003c/textarea>\u003c/div>\u003c/section>\n","\u003csection id=\"page-5\" class=\"page\">\u003cdiv class=\"panel\">\u003cdiv class=\"activity-head\">\u003cdiv class=\"activity-icon\" aria-hidden=\"true\">◎\u003c/div>\u003cdiv class=\"activity-titles\">\u003ch2>6. Negotiate with a neighbour\u003c/h2>\u003c/div>\u003c/div>\u003cp class=\"lead\">Agree on a one-month trial and decide how you’ll tell whether it worked.\u003c/p>\u003cdiv class=\"role-grid\">\u003cdiv class=\"role\">\u003ch3>Resident A\u003c/h3>\u003cp>You work from home. Couriers regularly ring your bell for other residents. You want fewer interruptions and clearer instructions.\u003c/p>\u003c/div>\u003cdiv class=\"role\">\u003ch3>Resident B\u003c/h3>\u003cp>You work late and sometimes collect heavy orders for your parent. You need a dependable way to get them delivered.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"tip\">\u003cp>I can see why you’d prefer that.\u003cbr>Would you be willing to try…?\u003cbr>That would work for me as long as…\u003c/p>\u003c/div>\u003clabel class=\"field-label\" for=\"roleNotes\">Write down your agreement\u003c/label>\u003ctextarea id=\"roleNotes\" data-save=\"roleNotes\" placeholder=\"We agreed to…\">\u003c/textarea>\u003c/div>\u003c/section>\n","\u003csection id=\"page-6\" class=\"page\">\u003cdiv class=\"panel\">\u003cdiv class=\"activity-head\">\u003cdiv class=\"activity-icon\" aria-hidden=\"true\">◌\u003c/div>\u003cdiv class=\"activity-titles\">\u003ch2>7. Give a 60-second opinion\u003c/h2>\u003c/div>\u003c/div>\u003cp class=\"lead\">“If a service saves me time, the price is all I need to consider.” Do you agree?\u003c/p>\u003cp>Give a real example, explain a trade-off, and acknowledge one reason someone might disagree. Use at least two expressions from the lesson.\u003c/p>\u003ctextarea data-save=\"finalOpinion\" aria-label=\"Your final opinion\" placeholder=\"I partly agree because…\">\u003c/textarea>\u003c/div>\u003c/section>\n","\u003csection id=\"page-7\" class=\"page\">\u003cdiv class=\"panel\">\u003cdiv class=\"activity-head\">\u003cdiv class=\"activity-icon\" aria-hidden=\"true\">✉\u003c/div>\u003cdiv class=\"activity-titles\">\u003ch2>8. Write a message to your neighbours\u003c/h2>\u003c/div>\u003c/div>\u003cp class=\"lead\">Write a 140–180 word message suggesting a small change in your building, workplace or community. Explain the problem, a hidden cost, and how you would run a fair trial. Use at least three expressions from the lesson and one form of \u003cem>used to\u003c/em>.\u003c/p>\u003ctextarea id=\"homework\" data-save=\"homework\" style=\"min-height:260px\" placeholder=\"Hi everyone,&#10;&#10;I’d like to suggest…\">\u003c/textarea>\u003cdiv class=\"homework-tools\">\u003cspan id=\"wordCount\">0 words · Target: 140–180\u003c/span>\u003cbutton class=\"outline\" onclick=\"copyHomework()\">Copy message\u003c/button>\u003c/div>\u003c/div>\u003c/section>\n"],"hero":"The Hidden Cost of Convenience"}</script>
