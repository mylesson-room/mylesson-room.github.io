<script>
'use strict';
const CLIPS=[{"title":"At the hotel","lines":[["Receptionist","Hello! How can I help you?"],["Lena","Hi. I have a booking for two nights. My name is Lena Park."],["Receptionist","Yes, a single room. Can I see your passport, please?"],["Lena","Of course. What time is breakfast?"],["Receptionist","From seven to ten. Your room is on the second floor."],["Lena","Thank you. Is there a bus stop nearby?"],["Receptionist","Yes. Turn left outside the hotel. It is next to the café."]],"qs":[["How many nights is Lena staying?",["One","Two","Three"],1],["Where is her room?",["On the first floor","On the second floor","Next to the café"],1],["Where is the bus stop?",["Next to the café","In the hotel","At the station"],0]]},{"qs":[["How did Lena travel?",["By bus","By train","By plane"],1],["Why did she call the hotel?",["The train was late","She lost her suitcase","She wanted breakfast"],0],["What are her plans for Sunday?",["A museum","A long walk by the river","A market"],1]]}];
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key='gostudy-travel-a2plus-v1';let state={page:0,answers:{},words:[],dark:false};let storage=true;
try{const s=JSON.parse(GoStudyStorage.getItem(key)||'null');if(s&&typeof s==='object'){state={...state,...s};state.answers=s.answers&&typeof s.answers==='object'?s.answers:{};state.words=Array.isArray(s.words)?s.words.filter(w=>w&&typeof w.en==='string'&&typeof w.ru==='string'):[];}}catch(e){storage=false;}
function save(){try{GoStudyStorage.setItem(key,JSON.stringify(state));}catch(e){storage=false;$('#storageNote').hidden=false;$('#storageNote').textContent='Saving unavailable. Export your answers and vocabulary before closing.';}$('#wordCount').textContent=state.words.length;}
let toastTimer;function notify(s){$('#toast').textContent=s;$('#toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),3200);}
const words=[["a ticket","билет","I bought a ticket online."],["a return ticket","билет туда и обратно","A return ticket, please."],["a platform","платформа","The train leaves from platform four."],["a suitcase","чемодан","My suitcase is small."],["a booking","бронирование","I have a booking for two nights."],["check in","заселиться; зарегистрироваться","Can we check in now?"],["a single room","одноместный номер","I booked a single room."],["a map","карта","Can I have a map, please?"],["late","поздно; с опозданием","The train was twenty minutes late."],["nearby","поблизости","Is there a café nearby?"]];
const glossary={"ticket":"билет","return ticket":"билет туда и обратно","platform":"платформа","suitcase":"чемодан","booking":"бронирование","check in":"заселиться; зарегистрироваться","single room":"одноместный номер","map":"карта","late":"поздно; с опозданием","nearby":"поблизости"};
const norm=s=>s.toLowerCase().replace(/[’]/g,"'").replace(/^[\s.,!?;:]+|[\s.,!?;:]+$/g,'').replace(/\s+/g,' ');

const pages=[["A weekend away","Travel by train and check in at a hotel.",5,""],["Travel words","Learn useful words for a short trip.",7,""],["Lena’s first weekend in York","Read about a trip that started a little late.",8,""],["At the hotel","Listen for a name, a time and a place.",7,""],["Yesterday and tomorrow","Practise Past Simple and going to.",7,""],["At the ticket office","Ask for a ticket and check the details.",7,""],["Your weekend plan","Talk about a short trip.",5,""],["Ready to go?","Review useful phrases and open homework.",3,""]];
function area(id,placeholder,rows=3){return '<textarea data-answer="'+id+'" aria-label="'+esc(placeholder)+'" rows="'+rows+'" placeholder="'+esc(placeholder)+'">'+esc(state.answers[id]||'')+'</textarea>';}
function card(title,body){return '<article class="card"><h2>'+title+'</h2>'+body+'</article>';}
function promptBox(title,text){return '<div class="prompt"><h3>'+title+'</h3><p>'+text+'</p></div>';}
function b2mc(group,qs){return qs.map((q,i)=>{const id='q'+group+'-'+i;return '<div class="question"><p>'+(i+1)+'. '+esc(q[0])+'</p><div class="options">'+q[1].map((v,j)=>'<label class="option"><input type="radio" name="'+id+'" data-q="'+group+':'+i+'" value="'+j+'" '+(Number(state.answers[id])===j&&state.answers[id]!==undefined?'checked':'')+'><span>'+esc(v)+'</span></label>').join('')+'</div><div class="feedback" id="fb-'+id+'" role="status"></div></div>';}).join('');}
function feedWelcome(){return card("Pack your bag","<div class=\"hero\"><span class=\"eyebrow\">TRAVEL · A2+</span><h2>A weekend away</h2><p>Buy a ticket, find your train and check in at a hotel.</p></div>")+card("Let’s talk","<ul><li>Do you like travelling by train or by plane?</li><li>What do you always put in your bag?</li><li>Where would you like to go for two days?</li></ul><p>I prefer… · I always take… · I’d like to visit…</p>");}
const VOCAB_GAPS=[["coll0","The train leaves from ___ four.","platform"],["coll1","I have a ___ for two nights.","booking"],["coll2","Can we check ___ now?","in"],["coll3","Is there a café ___?","nearby"]];
function feedWords(){return card('Language for a better argument','<div class="word-grid">'+words.map((w,i)=>'<article class="word"><strong>'+esc(w[0])+'</strong><p>'+esc(w[2])+'</p><details><summary>Meaning · перевод</summary><p>'+esc(w[1])+'</p></details><button type="button" class="small-button" data-speak-word>🔊 Прослушать</button><button class="small-button" data-add="'+i+'">♥ В словарь</button></article>').join('')+'</div>')+card('Complete the collocations',VOCAB_GAPS.map(g=>'<div class="gap"><label for="'+g[0]+'">'+esc(g[1])+'</label><input type="text" id="'+g[0]+'" data-answer="'+g[0]+'" data-gap="'+g[2]+'" enterkeyhint="done" autocapitalize="none" autocomplete="off" value="'+esc(state.answers[g[0]]||'')+'"><div class="feedback" id="fb-'+g[0]+'" role="status"></div></div>').join('')+'<p class="muted">Use Enter or leave a field to check it.</p>');}
function feedReading(){return card("Lena’s first weekend in York","<p>Last Saturday, Lena went to York for the weekend. She bought a return ticket online and packed a small suitcase. At the station, she checked the screen. Her train was leaving from platform four.</p><p>The train was twenty minutes late. Lena called her hotel and said, “I have a booking for two nights. I’m going to arrive after six.” The receptionist said, “No problem. You can check in until ten.”</p><p>At the hotel, Lena left her suitcase in her room and walked to a café nearby. On Sunday, she is going to walk by the river and take some photos. She has a map, but she doesn’t want to plan every minute.</p>")+card('Choose the answer',b2mc(1,CLIPS[1].qs));}

function addWord(en,ru){en=en.trim();ru=ru.trim();if(/[а-яё]/i.test(en)&&/[a-z]/i.test(ru)&&!/[а-яё]/i.test(ru)){[en,ru]=[ru,en];}if(!en||!ru){notify('Add a word and its translation.');return false;}const old=state.words.find(w=>norm(w.en)===norm(en));if(old)old.ru=ru;else state.words.push({en,ru});save();notify(old?'Translation updated.':'Word saved ✓');return true;}

let lookupVersion=0;
function localTranslation(text){const n=norm(text);if(!/[а-яё]/i.test(n))return glossary[n]||'';const aliases={'загран паспорт':'passport','загранпаспорт':'passport','заграничный паспорт':'passport','посадочный талон':'boarding pass','ручная кладь':'hand luggage','место у окна':'window seat','место у прохода':'aisle seat'};if(aliases[n])return aliases[n];const found=Object.entries(glossary).find(([en,ru])=>ru.split(';').some(part=>norm(part)===n));return found?found[0]:'';}
async function online(text){if(new TextEncoder().encode(text).length>450)throw Error('Выделите более короткую фразу (до 450 байт).');const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);try{const response=await fetch('https://api.mymemory.translated.net/get?'+new URLSearchParams({q:text,langpair:/[а-яё]/i.test(text)?'ru|en':'en|ru'}),{signal:controller.signal,credentials:'omit',referrerPolicy:'no-referrer'});if(!response.ok)throw Error('Сервис временно недоступен. Введите перевод вручную.');const d=await response.json();if(Number(d.responseStatus)!==200||!d.responseData?.translatedText)throw Error('Перевод недоступен. Возможно, исчерпан лимит. Введите перевод вручную.');const doc=new DOMParser().parseFromString(d.responseData.translatedText,'text/html');return doc.documentElement.textContent;}finally{clearTimeout(timeout);}}

const manualWord = $('#newWord');
const manualMeaning = $('#newMeaning');
const manualStatus = $('#dictStatus');
const manualCache = new Map();
let manualVersion = 0;
let manualTimer;
manualMeaning.addEventListener('input', () => {
  manualVersion++;
  clearTimeout(manualTimer);
  manualStatus.textContent = '';
});
function translateWhileTyping(event) {
  clearTimeout(manualTimer);
  const version = ++manualVersion;
  const query = manualWord.value.trim();
  manualMeaning.value = '';
  manualStatus.textContent = '';
  if (!query || event?.isComposing) return;
  const russian = /[а-яё]/i.test(query);
  const pair = state.words.find(word => norm(russian ? word.ru : word.en) === norm(query));
  const saved = russian ? pair?.en : pair?.ru;
  const immediate = saved || localTranslation(query) || manualCache.get(norm(query));
  if (immediate) {
    manualMeaning.value = immediate;
    return;
  }
  manualStatus.textContent = 'Переводим…';
  manualTimer = setTimeout(async () => {
    try {
      const result = await online(query);
      if (version !== manualVersion || manualWord.value.trim() !== query) return;
      manualCache.set(norm(query), result);
      manualMeaning.value = result;
      manualStatus.textContent = 'Перевод готов. Можно исправить перед сохранением.';
    } catch {
      if (version === manualVersion && manualWord.value.trim() === query) {
        manualStatus.textContent = 'Перевод недоступен. Можно ввести его вручную.';
      }
    }
  }, 300);
}
manualWord.addEventListener('input', translateWhileTyping);
manualWord.addEventListener('compositionend', translateWhileTyping);
$('#wordForm').addEventListener('reset', () => {
  manualVersion++;
  clearTimeout(manualTimer);
  manualStatus.textContent = '';
});

const CONTEXT_PHRASES = Object.entries(glossary);

const SENTENCE_TRANSLATIONS={};
function lessonMeaning(text,context){const n=norm(text).replace(/[.!?,;:]+$/,'');const phrase=CONTEXT_PHRASES.find(([en])=>en===n);if(phrase)return phrase[1];if(SENTENCE_TRANSLATIONS[norm(text)+'.']||SENTENCE_TRANSLATIONS[norm(text)])return SENTENCE_TRANSLATIONS[norm(text)+'.']||SENTENCE_TRANSLATIONS[norm(text)];if(CONTEXT_WORDS[n]){if(n==='water'&&!/flower|garden|plant/i.test(context))return '';if(n==='pick'&&!/apple|fruit/i.test(context))return '';if((n==='have'||n==='had')&&!/lunch/i.test(context))return '';return CONTEXT_WORDS[n];}return localTranslation(text);}
