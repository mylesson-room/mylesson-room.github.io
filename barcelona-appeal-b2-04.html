<script type="application/json" id="lesson-data">{"title":"The Appeal Window · Barcelona Race 04","hero":"The Appeal Window","cabinet":"student-sports-b2.html","course":"sports-b2","level":"B2 · Travel & Sport","key":"gostudy-sports-b2-barcelona-04-v1","wordsKey":"gostudy-vocabulary-sports-b2-v1","preserve":"cloud","durationMinutes":50,"overview":{"title":"The Appeal Window","level":"B2","duration":50,"format":"Individual speaking lesson","goal":"Evaluate evidence, use past modals to distinguish certainty from speculation, negotiate a fair remedy and deliver an evidence-based public statement."},"lessonWords":[{"en":"file an appeal","ru":"подать апелляцию"},{"en":"overturn a decision","ru":"отменить ранее принятое решение"},{"en":"a discrepancy","ru":"несоответствие"},{"en":"corroborate a claim","ru":"подтвердить утверждение доказательствами"},{"en":"under scrutiny","ru":"под пристальным вниманием"},{"en":"a plausible explanation","ru":"правдоподобное объяснение"},{"en":"rule out","ru":"исключить"},{"en":"restore trust","ru":"восстановить доверие"}],"steps":[{"id":"appeal-04-lead","minutes":5,"title":"01 · A correct result. An unfair outcome?","instruction":"Recap the previous Barcelona case in 30 seconds. The organisers corrected both runners' times. Does that automatically make the situation fair for everyone?","visual":{"kind":"cards","cards":[["🏃","Leila Bennett","Bib 314 · 45:20","Her time was eventually credited to her name."],["🏃‍♀️","Leila Benítez","Bib 341 · 52:10","She wasn't responsible for the envelopes either."],["📱","Online attention","The first results spread","A screenshot circulated before the correction."]]},"source":["PAIR DISCUSSION · What exactly was corrected, and what damage might remain after the results are fixed?","Imagine you are the runner who was publicly associated with a time that wasn't yours. What would you expect the organisers to do?","Choose the stronger principle and defend it: 'Accuracy must come first' or 'Fairness also includes how people are treated'.","Teacher challenge: Is a sincere apology enough when an error has already gone public?"],"teacherNotes":"5 min. Student speaks at least three minutes. The setting and athletes continue the fictional Barcelona Race Lesson 03. Avoid implying that the runners deliberately swapped their bibs."},{"id":"appeal-04-words","minutes":7,"title":"02 · Eight expressions under pressure","instruction":"Match eight phrases to their meanings. Then use three of them to explain what the organisers should do next.","visual":{"kind":"cards","cards":[["⚖️","Challenge a result","file an appeal","A formal request for review."],["🧩","Check the story","corroborate a claim","Use evidence from another source."],["🤝","Repair the damage","restore trust","Actions, not just words."]]},"source":["Quick retrieval: what was the discrepancy between the bib numbers and the runners' actual identities?","Use at least three phrases to give advice. Don't read out the definitions in your reply."],"type":"match","items":[["file an appeal",["formally request a review","announce a prize","publish a photograph"],0,"An appeal asks an authority to review a decision."],["overturn a decision",["delay a race","officially reverse a decision","refuse a meeting"],1,"Overturn means change an existing decision."],["a discrepancy",["an unexpected difference between records","a signed agreement","a sporting achievement"],0,"Two records that should match do not."],["corroborate a claim",["repeat an opinion loudly","hide a mistake","support a claim with independent evidence"],2,"Evidence from another source can corroborate a statement."],["under scrutiny",["available for sale","being carefully examined","already forgotten"],1,"Public decisions can come under scrutiny."],["a plausible explanation",["an explanation that fits the facts","a proven legal verdict","a deliberate distraction"],0,"Plausible is not the same as certain."],["rule out",["encourage speculation","write a new rule","eliminate a possible explanation"],2,"Rule out a theory after checking evidence."],["restore trust",["rebuild confidence after a mistake","stop publishing updates","award the wrong prize"],0,"Trust requires credible follow-up actions."]],"teacherNotes":"7 min. 4 min retrieval and checks, 3 min original spoken advice. Eight active units; do not add extra vocabulary targets."},{"id":"appeal-04-reading","minutes":8,"title":"03 · The letter that changed the discussion","instruction":"Read an original fictional follow-up to The Wrong Bib. Identify what the appeal is actually asking for, and what it is NOT asking for.","visual":{"kind":"cards","cards":[["✉️","Two days later","An appeal arrives","A request for an explanation and correction notice."],["📸","Original evidence","Two photos + registration forms","The corrected times remain supported."],["🗞️","Public impact","A screenshot went viral","A misleading interpretation is still circulating."]]},"source":["Two days after the 10K, the corrected Barcelona results were online. Leila Bennett's 45:20 appeared beside her real name; Leila Benítez was correctly listed at 52:10. Both women accepted that the official times were now accurate.","But Benítez filed an appeal. 'I am not asking you to give me someone else's time,' she wrote. 'I am asking why the organisers published a correction naming me without speaking to me first. A screenshot from the first results board is still being shared with comments suggesting that I cheated.'","Coordinator Clara reviewed the original registration forms, start-line photographs and timing records again. The evidence corroborated the corrected times. Mateo's account of the rushed envelope handover also offered a plausible explanation for the initial mix-up. There was no evidence that either runner had acted dishonestly.","Clara's team faced a communication problem rather than a timing problem. Their first press update said only: 'The results have been amended.' It did not explain that both athletes had received the wrong envelopes through an administrative mistake. Without that detail, social-media users drew their own conclusions.","The committee had 48 hours to respond. It could publish a detailed statement, contact both runners privately, or do both. It could not promise to remove every screenshot already posted. Clara knew the original mistake was fixed, but the organisers still had to decide how to restore trust.","AFTER READING · Explain the difference between correcting a record and repairing reputational harm. Give one fact, one inference and one recommendation."],"type":"choice","items":[["What is Benítez's central request?",["To receive Bennett's 45:20","To address how the correction was communicated and the reputational damage","To cancel the whole race"],1,"She accepts the corrected time but challenges how the organisers handled the public update."],["What do the photos and registration forms corroborate?",["The corrected identification of both runners","That Benítez deliberately switched bibs","That no photographer attended the race"],0,"Independent evidence supports the corrected identities and times."],["Why did the first public update cause problems?",["It made a false accusation","It never appeared online","It gave too little context, leaving room for speculation"],2,"A vague statement did not explain the administrative mistake."],["What can the organisers NOT guarantee?",["A detailed explanation","Deleting every previously shared screenshot","Speaking privately to both athletes"],1,"The committee cannot control every third-party repost."]],"teacherNotes":"8 min. 2.5 min reading, 2 min answers, 3.5 min discussion. Check student distinguishes facts from interpretations. All people/events are fictional."},{"id":"appeal-04-evidence","minutes":7,"title":"04 · The evidence board","instruction":"Choose the conclusions that are justified by the information. Give the strength AND the limitation of each piece of evidence.","visual":{"kind":"cards","cards":[["📷","Photo A","At the starting line","Bennett visibly wears 314; this connects a person to the bib."],["🕒","Chip log","45:20 for bib 314","Shows when the chip crossed, not who wore it."],["🧾","Registration records","Both names and numbers","Supports the corrected identification when combined with photos."],["📣","Public comments","Some accuse Benítez","Statements online are not independent evidence of cheating."]]},"source":["EVIDENCE CHALLENGE · Name one source that helps establish who wore bib 314, and one source that cannot establish that on its own.","Debate whether the organisers can rule out deliberate cheating or should use the more careful phrase 'We found no evidence of dishonesty'.","Your teacher will claim: 'The timing chip proves who ran the race.' Respond using one new phrase and a specific limitation."],"type":"choice","items":[["What can the chip log show by itself?",["The runner's full identity","The registered chip's finish time","The volunteer's reason for making a mistake"],1,"Chip data measures the chip, not the wearer's identity."],["Which combination best corroborates Bennett's identity?",["A viral comment and one screenshot","Only the chip time","The start/finish photos plus the registration records"],2,"Independent records work together."],["Which statement is best supported?",["The evidence supports the corrected times, but the public response is still a separate issue.","Benítez intentionally swapped bibs.","All online accusations have now disappeared."],0,"The evidence does not support dishonesty or guarantee an end to misinformation."]],"teacherNotes":"7 min. Probe source reliability. Never teach the simplistic equation 'absence of evidence = proof of innocence' as absolute certainty."},{"id":"appeal-04-grammar","minutes":7,"title":"05 · What must have happened?","instruction":"Use must have / might have / can't have / should have + past participle to express deduction, possibility, impossibility and regret about the past.","visual":{"kind":"cards","cards":[["🔎","strong deduction","must have + V3","The volunteers must have mixed up the envelopes."],["🟡","possibility","might have + V3","The vague update might have increased speculation."],["🚫","impossibility","can't have + V3","The chip can't have identified the runner on its own."],["↩️","past advice","should have + V3","The organisers should have explained the mistake."]]},"source":["FORM CHECK · must have done (not must had done); might have caused (not might caused); should have contacted (not should contacted).","DISCUSS · Which of the statements is certain, which is only likely and which expresses criticism of a past decision?","TRANSFER · Make one deduction, one cautious possibility and one past recommendation about a non-sport situation."],"type":"choice","items":[["The full names were not checked. The volunteers ___ the envelopes during registration.",["must have mixed up","must have mix","must mixed up"],0,"Must have + past participle for a strong deduction supported by evidence."],["The vague statement ___ the online speculation, but we cannot know exactly how much.",["must causing","might have increased","should increased"],1,"Might have + past participle shows possibility, not certainty."],["The chip recorded a time only. It ___ the athlete's identity by itself.",["can't have confirmed","can't confirmed","should have confirm"],0,"Can't have + past participle expresses a conclusion that the evidence rules out."],["Clara regrets not contacting both athletes before the update. She ___ them first.",["should contact","might have contacts","should have consulted"],2,"Should have + past participle for past advice or regret."],["There is no evidence of intentional swapping. A careful speaker says:",["Benítez must have cheated.","She might have cheated, so it is proven.","We cannot conclude that either runner cheated."],2,"Do not present unsupported accusations as established fact."]],"teacherNotes":"7 min. Key distinction: evidence-based certainty vs possibility; regret should have. Ask for student-generated examples, not only selecting options."},{"id":"appeal-04-panel","minutes":9,"title":"06 · The appeal hearing","instruction":"Role-play a short hearing. You are the committee's adviser; your teacher is Benítez. You have 2 minutes to prepare and 5 minutes to negotiate before delivering your decision.","visual":{"kind":"cards","cards":[["🅰️","Option A","Private apology","Fast and respectful; little public correction."],["🅱️","Option B","Detailed public statement","Addresses misinformation; could draw more attention."],["🅲️","Option C","Both + named contact","Talk to both runners first, then publish agreed factual wording."]]},"source":["NON-NEGOTIABLE FACTS · The corrected times remain 45:20 for Bennett and 52:10 for Benítez. No runner acted dishonestly on available evidence. The team cannot delete third-party screenshots.","ROUND 1 · Recommend an option. Give two evidence-based reasons and one drawback.","ROUND 2 · Your teacher challenges you: 'Why should I trust the same organisers who caused the problem?' Respond without making a promise you cannot keep.","ROUND 3 · New constraint: both runners want to see the statement before it is published, but the committee has only 48 hours. Create a practical timeline.","DECISION · Give a 45-second closing recommendation using file an appeal, under scrutiny and restore trust."],"type":"write","teacherNotes":"9 min. 2 min preparation notes, 5 min role-play, 2 min final response and feedback. Evaluate substantiation, concession, realistic remedies; no single morally prescribed option."},{"id":"appeal-04-press","minutes":5,"title":"07 · The 60-word press statement","instruction":"Write a short factual statement (45–65 words). Your goal is to correct the story without blaming either athlete. Then read it aloud as a spokesperson.","visual":{"kind":"cards","cards":[["✅","Must include","A clear fact","The registration error affected both runners."],["✅","Must include","An appropriate response","Corrected results plus contact with both athletes."],["🚫","Avoid","Unsupported accusations","Do not imply either athlete cheated."]]},"source":["Write 45–65 words. Include one confirmed fact, what has been corrected, an apology, and one practical next step.","Optional opening: 'We have reviewed the Barcelona 10K registration records and photographs. The evidence confirms ...'","Peer-review checklist: Is every claim supported? Could any sentence imply deliberate cheating? Is the follow-up action specific?","Your teacher plays a reporter and asks: 'Why should anyone trust your results now?' Answer in two sentences."],"type":"write","teacherNotes":"5 min. Two minutes writing, 1 min aloud, 2 min reporter question and actionable feedback. Grade clarity, factual accuracy and diplomatic tone."},{"id":"appeal-04-wrap","minutes":2,"title":"08 · Verdict: fair, accurate, credible","instruction":"Give your one-sentence verdict. Then name two phrases you can use outside sport.","visual":{"kind":"cards","cards":[["⚖️","Accuracy","Correct the result","Was this achieved?"],["🤝","Fairness","Treat the athletes respectfully","What else was needed?"],["🛡️","Trust","Prevent a similar mistake","What would you change?"]]},"source":["EXIT TICKET · Finish: 'A fair appeal process should ..., because ...'.","Recall two B2 expressions from memory and say one new sentence using a past modal (must have, might have or should have).","HOMEWORK · Write a persuasive response to the organisers. The task is in your personal dashboard."],"teacherNotes":"2 min. Collect one clear principle, two retrieved expressions and one accurate past-modal sentence. Homework extends the case rather than repeating the worksheet."}]}</script>
