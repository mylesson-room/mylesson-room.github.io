<script type="application/json" id="lesson-data">{"title":"Inside the World's Football Academies","hero":"How Champions Are Made","cabinet":"student-sports-b2.html","course":"sports-b2","level":"B2 · Football & Education","key":"gostudy-sports-b2-football-academies-04-v1","wordsKey":"gostudy-vocabulary-sports-b2-v1","preserve":"cloud","durationMinutes":50,"overview":{"goal":"Compare football development models in Spain, the Netherlands, Portugal and Ghana. Argue with evidence and design a realistic football academy.","speakingTarget":"At least 25 minutes of learner production","activeVocab":8},"lessonWords":[{"en":"talent pathway","ru":"путь развития таланта"},{"en":"scouting network","ru":"скаутская сеть"},{"en":"first-team breakthrough","ru":"прорыв в основной состав"},{"en":"holistic development","ru":"всестороннее развитие"},{"en":"playing philosophy","ru":"игровая философия"},{"en":"grassroots football","ru":"массовый детский футбол"},{"en":"long-term investment","ru":"долгосрочные инвестиции"},{"en":"balance academics and training","ru":"совмещать учёбу и тренировки"}],"steps":[{"id":"academy-04-opener","title":"01 · Where do future stars come from?","minutes":5,"photo":{"src":"https://coaching.southamptonfc.com/images/checkusoutnew1.jpg","caption":"A youth coach explains a tactical idea on the pitch","credit":"Southampton FC · coaching photograph","source":"https://coaching.southamptonfc.com/courses/courses.htm","alt":"Real coach with young footballers and tactics board","prompt":"LOOK & THINK · What visible detail suggests these young players are being coached, not simply playing? What cannot be judged from a single photo?"},"instruction":"Quick debate. Do great football players depend more on raw talent or on the schools that develop them?","visual":{"kind":"cards","cards":[["🧠","A great coach","Builds technique and game intelligence","Does a famous name guarantee results?"],["🧑‍🎓","A healthy childhood","Protects education and family life","Who supports pupils who will not go pro?"],["🪜","A real opportunity","Offers chances with stronger teams","How many young stars actually get promoted?"]]},"source":["RANKING · Put coaching, scouting, school support, facilities and first-team opportunities in order of importance. Justify your top two.","SPEAK · Why might a child who dominates at 12 never become a professional? Name at least two reasons.","CHALLENGE · What should a successful academy be judged by: transfers, trophies, graduates' lives, or senior-team players?","LEARNING GOAL · By the end you will compare real academy approaches and pitch a sustainable football academy."],"teacherNotes":"5 min. Record initial position. No predetermined correct answer. Invite counterargument."},{"id":"academy-04-lexis","title":"02 · The vocabulary of a football academy","minutes":7,"photo":{"src":"https://www.ajax.nl/media/2dvfhvj2/jeugd900_4.jpg","caption":"An academy youth team gets instructions from coaching staff","credit":"AFC Ajax · Ajax youth academy","source":"https://www.ajax.nl/artikelen/blik-op-de-toekomst-wisselende-resultaten-voor-ajax-jeugd/","alt":"A real Ajax youth football squad gathered with a coach on the training pitch","prompt":"OBSERVE · Identify two possible examples of a structured talent pathway. Which benefits of schooling would be invisible in this image?"},"instruction":"Eight useful expressions. Match each to its definition, then use at least four to describe a football school.","visual":{"kind":"cards","cards":[["🔍","Before recruitment","scouting network","Finding potential beyond obvious stars."],["🪜","From youth to pros","talent pathway","More than a trophy-winning U15 team."],["🎓","Beyond the ball","holistic development","Sport plus education, character and wellbeing."]]},"source":["SPEAK · Why is a first-team breakthrough such a difficult part of a talent pathway?","EXAMPLE · 'A strong scouting network matters, but holistic development protects children whose careers take another route.'"],"type":"match","items":[["talent pathway",["a route from youth teams towards senior football","a list of match referees","a stadium transport map"],0],["scouting network",["an organisation for identifying and evaluating players","an online fan club","the school's exam department"],0],["first-team breakthrough",["earning a real opportunity at senior-team level","moving to a different classroom","joining an online camp"],0],["holistic development",["education, wellbeing and character alongside sport","only improving sprint speed","training without teachers"],0],["playing philosophy",["shared principles for how the club plays football","the number of spectators at matches","a ticket pricing plan"],0],["grassroots football",["community-level opportunities for children to play","only top-tier professional football","a football television channel"],0],["long-term investment",["money and effort committed for long-term results","a one-day football trial","a refund for unused equipment"],0],["balance academics and training",["protect school learning as well as practice time","replace homework with extra running","make players skip every exam"],0]],"teacherNotes":"7 min. 4 min retrieval and matching, 3 min original B2 examples. Eight active units."},{"id":"academy-04-real-world","title":"03 · Five real academies: how do they work?","minutes":10,"photo":{"src":"https://imageio.forbes.com/specials-images/imageserve/5dbe309ad85e3000079003f5/0x0.jpg?format=jpg&width=1200","caption":"La Masia · Oriol Tort education centre, FC Barcelona","credit":"Forbes · La Masia photograph","source":"https://www.forbes.com/sites/michaellore/2019/11/03/la-masia-celebrates-40-years-of-being-fc-barcelonas-heart/","alt":"Real exterior of La Masia football education centre","prompt":"COMPARE · What does the photograph suggest about facilities and training? Which claim about academic or personal development would need a separate source?"},"instruction":"Read five concise fact-checked profiles. Identify each academy's philosophy and one potential limitation. There is no universal 'best'.","visual":{"kind":"cards","cards":[["🇪🇸","FC Barcelona · La Masia","Identity and education","A sporting, academic and personal development model."],["🇳🇱","Ajax · De Toekomst","Development pathway","Youth teams work within a recognisable club football approach."],["🇵🇹","Benfica · Seixal","Integrated campus","Investment in facilities and youth-player development."],["🇪🇸","Athletic Club · Lezama","Basque identity","Local talent plays a central role due to the club's philosophy."],["🇬🇭","Right to Dream · Ghana","Education + opportunity","Football, schooling and character development."]]},"source":["BARCELONA · FC Barcelona's La Masia is not just a pitch. The club describes a model that combines sporting development with academic and personal support. Important: Barça Academy programmes around the world are not equivalent to admission to La Masia.","AJAX · Ajax's academy operates at De Toekomst, near Amsterdam. Developing young players and moving them towards senior football are central to the club's identity. The challenge is keeping a consistent approach while young players develop at very different rates.","REAL GRADUATE · Lamine Yamal followed the La Masia pathway and made his FC Barcelona senior debut in April 2023 aged 15. An exceptional debut is a case, not a guaranteed outcome for academy students.","BENFICA · Benfica Campus opened in Seixal in 2006. The club presents it as a dedicated training and youth-development project, not just a set of expensive pitches. Infrastructure is valuable, but it cannot guarantee a professional career.","ATHLETIC CLUB · Lezama supports a club policy centred on players developed by academies in the Basque Country or born in specific Basque territories. Unlike a typical global recruitment model, local roots and eligibility are fundamental.","RIGHT TO DREAM · The Ghana academy combines elite football coaching with education and character development. Its mission includes opportunities beyond a professional contract. That changes what 'success' can mean.","INTERPRETATION · The profiles describe documented organisational approaches, not scientific evidence that one academy is superior. Judge them by the criteria you define."],"type":"choice","items":[["Which club makes defined regional eligibility part of its identity?",["Athletic Club","Ajax","Benfica"],0],["What makes Right to Dream's model broader than football-only coaching?",["It guarantees Premier League contracts","It combines sport, education and character development","It only trains senior professionals"],1],["Where is Benfica Campus?",["Seixal, Portugal","Barcelona, Spain","Amsterdam, Netherlands"],0],["Which statement about La Masia is accurate?",["Every worldwide Barça Academy student enters La Masia","Sporting, academic and personal development are part of the La Masia model","It has no educational support"],1],["Which conclusion should a careful analyst reject?",["Academies follow different approaches","Facilities can support training","The academy with the costliest buildings always produces the best players"],2]],"teacherNotes":"10 min: 4 min reading, 3 min evidence checks, 3 min critical comparison. Base claims on official clubs' descriptions and label judgement as judgement.","references":[{"name":"FC Barcelona · The La Masia model","url":"https://www.fcbarcelona.com/en/club/identity/la-masia"},{"name":"FC Barcelona · Lamine Yamal's academy journey","url":"https://www.fcbarcelona.com/en/football/first-team/players/129404"},{"name":"Ajax · Youth academy","url":"https://english.ajax.nl/club/youth-academy"},{"name":"SL Benfica · Benfica Campus","url":"https://www.slbenfica.pt/en-us/futebol-formacao/formacao/bem-vindo"},{"name":"Athletic Club · player philosophy","url":"https://www.athletic-club.eus/en/philosophy/what-is-it/"},{"name":"Right to Dream · Ghana Academy","url":"https://www.righttodream.com/ghana-academy"}]},{"id":"academy-04-ajax","title":"04 · Ajax: the route from academy to first team","minutes":7,"photo":{"src":"https://www.ajax.nl/media/ffrdqq0b/ajaxo151.jpg","caption":"A youth academy coach explains positioning during a training session","credit":"AFC Ajax · Ajax academy training","source":"https://www.ajax.nl/artikelen/toekomst-alert-ajax-o11-o13-1-o13-2-en-o16-winnen-met-dikke-cijfers/","alt":"Ajax youth football coach giving instructions beside training cones and a football pitch","prompt":"INFER · What can a training photo tell you about teamwork? What cannot it prove about this fictional 17-year-old player's readiness?"},"instruction":"Imagine you are Ajax's director deciding whether a 17-year-old is ready to train with the first team. Build an evidence-based plan.","visual":{"kind":"cards","cards":[["⚽","Technical development","Decision-making under pressure","Good skills are not enough on their own."],["📈","Progression","Youth -> older teams -> first-team chances","A pathway needs real transitions."],["🧠","Personal support","Confidence, motivation and wellbeing","A rejected teenager still needs a future."]]},"source":["FACT CHECK · Ajax has long described youth development as a central part of its identity and trains its academy teams at De Toekomst. The scenario below is fictional.","FICTIONAL PLAYER · At 17, Milan is technically brilliant and reads space well. Against older players he struggles physically, and his confidence drops after mistakes.","CHOICE · Would you (A) immediately promote him permanently, (B) arrange supervised first-team exposure while continuing youth development, or (C) keep him at U17 with no new targets?","DEFEND YOUR CHOICE · Set two measurable development goals and one wellbeing safeguard.","COUNTERARGUMENT · Your teacher is the impatient club owner: 'Why invest if he won't help us win next month?' Respond in 40 seconds."],"type":"choice","items":[["Which development strategy best balances opportunity and readiness?",["Permanent promotion with no support","Gradual senior-team exposure with coaching and review","No promotion opportunities until age 22"],1],["Which measure is most informative?",["One goal in one match","A multi-month review of decisions, progress and adaptation","Only how tall the player is"],1]],"teacherNotes":"7 min. Demand explanation of opportunity cost, not mere MCQ. Use 'talent pathway' and 'first-team breakthrough'.","references":[{"name":"Ajax · Youth academy at De Toekomst","url":"https://english.ajax.nl/club/youth-academy"}]},{"id":"academy-04-ghana","title":"05 · Right to Dream: what if a player never goes pro?","minutes":6,"photo":{"src":"https://static.wixstatic.com/media/941d3a_0f0ea80f2c784ba78cf7bb64a8a15eeb~mv2.jpg/v1/fill/w_889%2Ch_500%2Cq_90/941d3a_0f0ea80f2c784ba78cf7bb64a8a15eeb~mv2.jpg","caption":"Students train at Right to Dream Ghana Academy","credit":"Right to Dream · Ghana Academy","source":"https://www.righttodream.com/ghana-academy","alt":"Real teenage football students training on grass in Ghana","prompt":"ETHICAL LENS · What wellbeing or educational support might these trainees need beyond what the camera can show?"},"instruction":"Explore why a football academy might invest in education and character, not only in trophies and transfers.","visual":{"kind":"cards","cards":[["🎓","Academic future","Qualifications and choices","A contract is never guaranteed."],["🫱🏽‍🫲🏾","Personal development","Confidence and responsibility","Sport has effects beyond the pitch."],["⚽","Football excellence","Structured elite training","Ambition and wellbeing can coexist."]]},"source":["DOCUMENTED MODEL · Right to Dream's Ghana academy explicitly combines elite training, education and character development. That does not mean every student becomes a professional footballer.","REAL GRADUATE · Mohammed Kudus developed at Right to Dream Ghana Academy and later represented Ghana at the World Cup. A famous graduate shows one possible talent pathway, not the odds of success for every child.","FICTIONAL DILEMMA · At 16, Kojo is a talented midfielder. His family wants academic qualifications, but an overseas club offers him a trial during exams.","SPEAK · Design a responsible response involving the player, his family and the academy.","FOLLOW-UP · Name one advantage and one cost of prioritising education. What would 'success' mean if Kojo eventually chooses university?"],"type":"choice","items":[["Which response best follows a holistic development model?",["Drop all classes immediately","Discuss the trial, education plan and risks with the family","Promise a professional deal in Europe"],1],["Which statement is most defensible?",["A great academy must produce only professional players","Player wellbeing and educational options matter even when a pro career does not happen","Academic support makes football training pointless"],1]],"teacherNotes":"6 min. Sensitive cultural discussion. Avoid stereotypes about Africa or implying success is guaranteed. Require one balanced recommendation.","references":[{"name":"Right to Dream · Mohammed Kudus and the 2022 World Cup","url":"https://www.righttodream.com/post/rtd-students-proud-inspired-by-kudus-world-cup-performance"}]},{"id":"academy-04-benfica","title":"06 · Benfica: where would you invest €1 million?","minutes":8,"photo":{"src":"https://activeplanet.com/en/assets/active_cyprus/files/manager_files/sport_objects/13066/dronebenficacampus.jpg","caption":"Benfica Campus in Seixal, Portugal · aerial photograph","credit":"Active Planet · Benfica Campus","source":"https://activeplanet.com/en/sports-facilities/benfica-campus.html","alt":"Aerial view of Benfica football training centre pitches","prompt":"DECIDE · Which visible facility might justify an investment? Name one equally valuable service that would not appear in the photograph."},"instruction":"You are designing a new regional academy. Choose an investment plan, then defend it against a competing proposal.","visual":{"kind":"cards","cards":[["🏟️","Option A · €600k","Facilities + rehabilitation","€250k coaches; €150k school support."],["🕵️","Option B · €400k","Scouting + local clubs","€350k coaches; €250k school support."],["🎓","Option C · €450k","School + wellbeing","€350k coaches; €200k facilities."]]},"source":["REAL-WORLD ANCHOR · Benfica Campus in Seixal opened in 2006. Its official description emphasises the youth-development project, not merely buildings. The budgets below are invented for learning.","REAL GRADUATE · Benfica identifies João Félix as a graduate of Benfica Campus. The example illustrates one first-team pathway; it does not prove that expensive facilities alone cause success.","TASK · You have €1,000,000 to spend over the next year. A: €600k facilities, €250k coaches, €150k education. B: €400k scouting, €350k coaches, €250k education. C: €450k education/wellbeing, €350k coaches, €200k facilities.","ROUND 1 · Choose one plan. Defend the trade-off between immediate recruitment and long-term development.","ROUND 2 · Your teacher challenges you: 'We need three first-team graduates in two years.' Is that a reasonable measure? Propose three fairer indicators.","ROUND 3 · Your local clubs complain that your academy steals their best players. Suggest a partnership that benefits grassroots football."],"type":"write","teacherNotes":"8 min. 2 min budgeting, 4 min challenge/negotiation, 2 min measures. All amounts fictional. Evaluate reasons rather than selecting a prescribed budget.","references":[{"name":"Benfica · João Félix returned to his academy","url":"https://www.slbenfica.pt/en-us/agora/media-list/videos/2021/12/09/futebol-benfica-joao-felix-regressou-ao-benfica-campus"},{"name":"Benfica Campus · official background","url":"https://www.slbenfica.pt/en-us/futebol-formacao/formacao/bem-vindo"}]},{"id":"academy-04-athletic","title":"07 · Athletic Club: local identity vs global scouting","minutes":5,"photo":{"src":"https://cdn.athletic-club.eus/uploads/2023/07/20230705_entrenamientos.jpg","caption":"Lezama · Athletic Club's training ground","credit":"Athletic Club · official photo","source":"https://www.athletic-club.eus/en/news/2023/07/05/athletic-club-training-sessions-begin/","alt":"Real Lezama football training field in the Basque Country","prompt":"COMPARE · Does this picture prove whether the players were recruited locally? What evidence would you require before claiming that?"},"instruction":"Compare Athletic Club's Basque talent philosophy with the open global recruitment model of other clubs.","visual":{"kind":"cards","cards":[["🏔️","Athletic · Basque eligibility","Deep local ties","A distinctive identity shapes recruitment choices."],["🌍","Global model","A worldwide scouting network","More recruitment options, but different trade-offs."],["🧩","Your solution","Strong local partnerships","Can the two approaches share useful lessons?"]]},"source":["FACT · Athletic Club's policy is based on players developed in the Basque football system or born in its defined Basque territories. It is not accurately described as 'only players born in Bilbao'.","REAL GRADUATE · Nico Williams joined Athletic's Lezama academy as a child and later became a first-team footballer. Ask whether it is realistic to build a policy around local identity in a country with a very different football history.","USEFUL STRUCTURES · 'Whereas ...', 'Unlike ...', 'Despite ...', 'Rather than ...'","YOUR TURN · Produce three accurate contrast sentences using two of those linkers and at least two target expressions.","MINI-DEBATE · Which approach would help a small football nation most: a local talent pathway or an international scouting network? Why?"],"type":"gap","items":[["Athletic's philosophy emphasises Basque ties, ___ other clubs may recruit globally.",["whereas","despite","rather than"],0],["___ Athletic's specific regional eligibility approach, Ajax focuses on a different development context.",["Despite","Unlike","Rather than"],1],["Academies should measure children's long-term progress ___ only counting trophies.",["rather than","unlike","whereas"],0]],"teacherNotes":"5 min. Grammar for meaningful comparisons. Ask for original examples and guard against oversimplifying Athletic's eligibility rules.","references":[{"name":"Athletic Club · Nico Williams and Lezama","url":"https://www.athletic-club.eus/en/players/nicholas-williams-arthuer/"},{"name":"Athletic Club · Academy at Lezama","url":"https://www.athletic-club.eus/en/teams/lezama/"}]},{"id":"academy-04-final","title":"08 · Pitch your world-class football school","minutes":2,"photo":{"src":"https://commons.wikimedia.org/wiki/Special:FilePath/Youth_training_at_a_football_field_26.jpg?width=900","caption":"Grassroots youth football training · Unity Football Academy","credit":"Alameen khalid200 · CC BY-SA 4.0","source":"https://commons.wikimedia.org/wiki/File:Youth_training_at_a_football_field_26.jpg","alt":"Real youth football training at Unity Football Academy","prompt":"EXIT PITCH · Choose one image detail as the starting point for a responsible academy principle; avoid claiming the photo proves a player's future."},"instruction":"Deliver a 45-second pitch for a football academy. Use two target expressions and one evidence-based comparison.","visual":{"kind":"cards","cards":[["🎯","Define success","Beyond trophies","Name one measure of player and life development."],["🤝","Make a trade-off","Choose priorities","Admit one limitation honestly."],["🌍","Learn from real academies","Use one club as evidence","Do not pretend its model guarantees success."]]},"source":["EXIT CHALLENGE · 'Our academy would borrow ___ from ___, because ___. However, we would change ___ to protect ___.'","RETRIEVAL · Say two of today's eight expressions without looking.","HOMEWORK · Write a proposal comparing real academy models and your own. Open it from your GoStudy cabinet."],"teacherNotes":"2 min: one 45-second pitch, quick feedback on evidence, comparison and vocabulary. Homework extends the lesson."}]}</script>
