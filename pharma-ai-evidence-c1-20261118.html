<script type="application/json" id="lesson-data">{"title":"Can AI Really Invent New Medicines?","hero":"Can AI Really Invent New Medicines?","cabinet":"student-pharma.html","footer":"GoStudy · Pharma C1 · 50 minutes · No homework assigned","key":"gostudy-pharma-c1-ai-evidence-20261118-v1","wordsKey":"gostudy-pharma-c1-v1","preserve":"cloud","followStudent":false,"course":"pharma-c1","durationMinutes":50,"lessonWords":[{"en":"clinical validation","ru":"клиническая валидация"},{"en":"surrogate endpoint","ru":"суррогатная конечная точка"},{"en":"generalizability","ru":"обобщаемость результатов"},{"en":"risk of bias","ru":"риск систематической ошибки"},{"en":"regulatory clearance","ru":"регуляторный допуск"},{"en":"overstate the findings","ru":"преувеличивать результаты исследования"},{"en":"real-world evidence","ru":"данные реальной клинической практики"},{"en":"post-market surveillance","ru":"пострегистрационный мониторинг"},{"en":"placebo-controlled","ru":"плацебо-контролируемый"},{"en":"primary endpoint","ru":"первичная конечная точка"},{"en":"adverse events","ru":"нежелательные явления"},{"en":"secondary endpoint","ru":"вторичная конечная точка"},{"en":"drug candidate","ru":"кандидат в лекарственные препараты"},{"en":"preclinical evidence","ru":"доклинические данные"},{"en":"drug-resistant strains","ru":"устойчивые к антибиотикам штаммы"},{"en":"screen compounds","ru":"проводить скрининг химических соединений"},{"en":"in vitro","ru":"в лабораторных условиях, вне организма"},{"en":"drug-development pipeline","ru":"процесс разработки лекарств"}],"sources":[{"title":"Rentosertib phase 2a, Nature Medicine (2025)","url":"https://www.nature.com/articles/s41591-025-03743-2"},{"title":"AI-designed antibiotics, Cell (2025)","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12790861/"},{"title":"PBS NewsHour antibiotic research (2026)","url":"https://www.pbs.org/video/ai-medecine-1779917660/"},{"title":"MIT News research summary","url":"https://news.mit.edu/2025/using-generative-ai-researchers-design-compounds-kill-drug-resistant-bacteria-0814"}],"steps":[{"id":"ai-warmup","title":"01 · AI or hype?","minutes":4,"label":"AI or hype? · 4 min","html":"\u003cp class=\"lead\"\u003eThree possible headlines about AI-powered medicine. Which one would attract attention? Which could a medical affairs team approve?\u003c/p\u003e\u003cdiv class=\"case-column\"\u003e\u003csection class=\"material-card\"\u003e\u003cstrong\u003eA\u003c/strong\u003e\u003cp\u003eScientists create a drug using artificial intelligence.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"material-card\"\u003e\u003cstrong\u003eB\u003c/strong\u003e\u003cp\u003eAI-designed medicine could transform the treatment of lung disease.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"material-card\"\u003e\u003cstrong\u003eC\u003c/strong\u003e\u003cp\u003eArtificial intelligence has finally found a cure for deadly diseases.\u003c/p\u003e\u003c/section\u003e\u003c/div\u003e\u003cdiv class=\"tip\"\u003e\u003cstrong\u003eDiscuss\u003c/strong\u003e\u003cp\u003eWhich headline would you approve, reject or rewrite? What evidence would be needed before using each claim in a pharmaceutical campaign?\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"question-item\"\u003e\u003cstrong\u003eYour initial opinion (speaking notes)\u003c/strong\u003e\u003ctextarea data-exercise-field=\"aiLeadReason\" rows=\"3\" maxlength=\"3500\" placeholder=\"I would question headline … because …\"\u003e\u003c/textarea\u003e\u003c/div\u003e","teacherNotes":"4 min oral warm-up. Do not judge the headlines until evidence is examined."},{"id":"ai-rentosertib","title":"02 · An AI-discovered drug reaches clinical trials","minutes":8,"label":"An AI-discovered drug reaches clinical trials · 8 min","html":"\u003cdiv class=\"p-label\"\u003eRESEARCH CASE 1 · NATURE MEDICINE · 2025\u003c/div\u003e\u003cfigure class=\"p-figure\"\u003e\u003cimg src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Medical_Laboratory_Scientist_US_NIH.jpg?width=950\" loading=\"lazy\" alt=\"Medical laboratory scientist with pipettes at a research bench\"\u003e\u003cfigcaption\u003e\u003ca href=\"https://commons.wikimedia.org/wiki/File:Medical_Laboratory_Scientist_US_NIH.jpg\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eNIH / Wikimedia Commons · public domain photo\u003c/a\u003e\u003c/figcaption\u003e\u003c/figure\u003e\u003cdiv class=\"article\"\u003e\u003ch3\u003eA drug designed with AI shows early promise\u003c/h3\u003e\u003cp\u003eDeveloping new medicines can involve years of costly experiments and clinical trials. Generative AI may help researchers find promising molecules much earlier, but finding a molecule is not the same as proving that a treatment benefits patients.\u003c/p\u003e\u003cp\u003eIn 2025, scientists published results from a randomized, \u003cstrong\u003eplacebo-controlled Phase 2a trial\u003c/strong\u003e of rentosertib, a medicine discovered and designed with AI for idiopathic pulmonary fibrosis, a disease that progressively damages the lungs.\u003c/p\u003e\u003cp\u003eThe study enrolled \u003cstrong\u003e71 patients\u003c/strong\u003e over 12 weeks. Its \u003cstrong\u003eprimary endpoint\u003c/strong\u003e concerned safety, including treatment-emergent \u003cstrong\u003eadverse events\u003c/strong\u003e. Lung function was measured as a \u003cstrong\u003esecondary endpoint\u003c/strong\u003e.\u003c/p\u003e\u003cp\u003eIn the highest-dose group, average forced vital capacity increased by \u003cstrong\u003e98.4 mL\u003c/strong\u003e, compared with a decrease of \u003cstrong\u003e20.3 mL\u003c/strong\u003e in the placebo group. These results were encouraging, but the study was small and short. Longer, larger trials are needed before stronger clinical conclusions can be drawn.\u003c/p\u003e\u003cp\u003eFor pharmaceutical marketers, an early positive signal is not equivalent to proof of long-term effectiveness.\u003c/p\u003e\u003cp class=\"p-source\"\u003eOriginal, adapted teaching summary · \u003ca href=\"https://www.nature.com/articles/s41591-025-03743-2\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eNature Medicine Phase 2a study\u003c/a\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"p-stats\"\u003e\u003cdiv\u003e\u003cb\u003e71\u003c/b\u003e\u003csmall\u003epatients\u003c/small\u003e\u003c/div\u003e\u003cdiv\u003e\u003cb\u003e12 weeks\u003c/b\u003e\u003csmall\u003estudy duration\u003c/small\u003e\u003c/div\u003e\u003cdiv\u003e\u003cb\u003ePhase 2a\u003c/b\u003e\u003csmall\u003eearly human trial\u003c/small\u003e\u003c/div\u003e\u003c/div\u003e\u003ch3\u003eExercise 1 · Evidence check\u003c/h3\u003e\u003cdiv class=\"gap-item p-choice\" data-answer-row\u003e\u003clabel class=\"p-prompt\" for=\"aiRead1\"\u003eWhat makes rentosertib unusual? A. Already approved worldwide · B. Designed using generative AI · C. Tested exclusively on animals\u003c/label\u003e\u003cselect id=\"aiRead1\" data-gap=\"B\" aria-label=\"What makes rentosertib unusual? A. Already approved worldwide · B. Designed using generative AI · C. Tested exclusively on animals\"\u003e\u003coption value=\"\"\u003eChoose…\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003c/select\u003e\u003csmall class=\"feedback\" data-grade\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"gap-item p-choice\" data-answer-row\u003e\u003clabel class=\"p-prompt\" for=\"aiRead2\"\u003eWhat was the primary focus? A. Safety and adverse events · B. Marketing reach · C. Long-term patient survival\u003c/label\u003e\u003cselect id=\"aiRead2\" data-gap=\"A\" aria-label=\"What was the primary focus? A. Safety and adverse events · B. Marketing reach · C. Long-term patient survival\"\u003e\u003coption value=\"\"\u003eChoose…\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003c/select\u003e\u003csmall class=\"feedback\" data-grade\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"gap-item p-choice\" data-answer-row\u003e\u003clabel class=\"p-prompt\" for=\"aiRead3\"\u003eWhat conclusion is supported? A. A cure is proven · B. Human trials are unnecessary · C. Further research is needed\u003c/label\u003e\u003cselect id=\"aiRead3\" data-gap=\"C\" aria-label=\"What conclusion is supported? A. A cure is proven · B. Human trials are unnecessary · C. Further research is needed\"\u003e\u003coption value=\"\"\u003eChoose…\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003c/select\u003e\u003csmall class=\"feedback\" data-grade\u003e\u003c/small\u003e\u003c/div\u003e\u003ch3\u003eExercise 2 · Discuss\u003c/h3\u003e\u003cp\u003eWhat is the difference between a promising change in lung function and a proven benefit for patients?\u003c/p\u003e\u003cdiv class=\"question-item\"\u003e\u003cstrong\u003eWrite one scientifically cautious sentence\u003c/strong\u003e\u003ctextarea data-exercise-field=\"aiReadEvidence\" rows=\"3\" maxlength=\"3500\" placeholder=\"The preliminary findings suggest …; however …\"\u003e\u003c/textarea\u003e\u003c/div\u003e","teacherNotes":"Facts verified against Nature Medicine 2025: 71, 12 weeks, primary TEAEs and observed FVC change +98.4 mL vs −20.3 mL. Answers B/A/C. No claim of proven long-term benefit."},{"id":"ai-antibiotics","title":"03 · Antibiotics created from scratch","minutes":5,"label":"Antibiotics created from scratch · 5 min","html":"\u003cdiv class=\"p-label\"\u003eRESEARCH CASE 2 · CELL · 2025\u003c/div\u003e\u003cfigure class=\"p-figure\"\u003e\u003cimg src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Biology_Lab_Equipment_%2846805967884%29.jpg?width=950\" loading=\"lazy\" alt=\"Biology laboratory equipment used in research\"\u003e\u003cfigcaption\u003e\u003ca href=\"https://commons.wikimedia.org/wiki/File:Biology_Lab_Equipment_(46805967884).jpg\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eNIH / Wikimedia Commons · public domain photo\u003c/a\u003e\u003c/figcaption\u003e\u003c/figure\u003e\u003cdiv class=\"article\"\u003e\u003ch3\u003eCan AI fight superbugs?\u003c/h3\u003e\u003cp\u003eIn another study, researchers at MIT used generative AI to design new antibiotic molecules instead of relying only on existing chemical libraries. Their algorithms explored huge numbers of possible molecular structures.\u003c/p\u003e\u003cp\u003eTwo \u003cstrong\u003edrug candidates\u003c/strong\u003e, NG1 and DN1, showed activity against antibiotic-resistant bacteria. NG1 demonstrated promising results against \u003cem\u003eNeisseria gonorrhoeae\u003c/em\u003e, while DN1 was active against MRSA, including in mouse infection models.\u003c/p\u003e\u003cp\u003eThese results are \u003cstrong\u003epreclinical evidence\u003c/strong\u003e: the molecules were tested in laboratory and animal experiments, not shown to improve outcomes in human patients. Drug discovery is a beginning, not a marketing claim of proven efficacy.\u003c/p\u003e\u003cp class=\"p-source\"\u003eStudy summary · \u003ca href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC12790861/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eCell (2025) research paper\u003c/a\u003e · \u003ca href=\"https://news.mit.edu/2025/using-generative-ai-researchers-design-compounds-kill-drug-resistant-bacteria-0814\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eMIT research overview\u003c/a\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"p-ladder\" aria-label=\"Evidence stages\"\u003e\u003cspan class=\"ready\"\u003eAI molecule design\u003c/span\u003e\u003cspan class=\"ready\"\u003eLaboratory tests\u003c/span\u003e\u003cspan class=\"ready\"\u003eMouse studies\u003c/span\u003e\u003cspan\u003eHuman clinical trials\u003c/span\u003e\u003cspan\u003eApproved medicine\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"tip\"\u003e\u003cstrong\u003eDiscuss\u003c/strong\u003e\u003cp\u003eWhich of the two projects provides evidence from human participants? Why is that distinction important to a pharmaceutical marketing team?\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"question-item\"\u003e\u003cstrong\u003eCompare the strength of evidence\u003c/strong\u003e\u003ctextarea data-exercise-field=\"aiAntibioticCompare\" rows=\"3\" maxlength=\"3500\" placeholder=\"Rentosertib has been studied in …, whereas NG1 and DN1 …\"\u003e\u003c/textarea\u003e\u003c/div\u003e","teacherNotes":"Based on Cell 2025 and MIT coverage. NG1 and DN1 reached animal studies but have not established safety or efficacy in humans."},{"id":"ai-reading-vocab","title":"04 · Vocabulary lab: words from the texts","minutes":7,"label":"Vocabulary lab: words from the texts · 7 min","html":"\u003cdiv class=\"p-label\"\u003eSIX ACTIVE EXPRESSIONS\u003c/div\u003e\u003cp\u003eFind each phrase in the readings, explore the meaning and use ＋ to save it.\u003c/p\u003e\u003cdiv class=\"vocab\"\u003e\u003carticle\u003e\u003cb\u003eplacebo-controlled\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"8\" aria-label=\"Save placebo-controlled to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003ea study with an inactive comparison treatment\u003c/p\u003e\u003cspan class=\"tiny\"\u003eRentosertib was studied in a placebo-controlled trial.\u003c/span\u003e\u003c/article\u003e\u003carticle\u003e\u003cb\u003eprimary endpoint\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"9\" aria-label=\"Save primary endpoint to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003ethe main outcome a study is designed to evaluate\u003c/p\u003e\u003cspan class=\"tiny\"\u003eSafety was the primary endpoint.\u003c/span\u003e\u003c/article\u003e\u003carticle\u003e\u003cb\u003eadverse events\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"10\" aria-label=\"Save adverse events to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003eunwanted medical events that happen during a trial\u003c/p\u003e\u003cspan class=\"tiny\"\u003eResearchers monitored adverse events.\u003c/span\u003e\u003c/article\u003e\u003carticle\u003e\u003cb\u003esecondary endpoint\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"11\" aria-label=\"Save secondary endpoint to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003ean additional study outcome beyond the primary one\u003c/p\u003e\u003cspan class=\"tiny\"\u003eLung function was a secondary endpoint.\u003c/span\u003e\u003c/article\u003e\u003carticle\u003e\u003cb\u003edrug candidate\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"12\" aria-label=\"Save drug candidate to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003ea potential medicine still being investigated\u003c/p\u003e\u003cspan class=\"tiny\"\u003eNG1 is a drug candidate, not an approved antibiotic.\u003c/span\u003e\u003c/article\u003e\u003carticle\u003e\u003cb\u003epreclinical evidence\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"13\" aria-label=\"Save preclinical evidence to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003eresults from studies before human clinical trials\u003c/p\u003e\u003cspan class=\"tiny\"\u003eMouse experiments provide preclinical evidence.\u003c/span\u003e\u003c/article\u003e\u003c/div\u003e\u003ch3\u003eExercise 3 · Match each term to its meaning\u003c/h3\u003e\u003cdiv class=\"p-defs\"\u003e\u003cp\u003e\u003cb\u003eA\u003c/b\u003e · An additional measured study outcome\u003c/p\u003e\u003cp\u003e\u003cb\u003eB\u003c/b\u003e · An investigational medicine\u003c/p\u003e\u003cp\u003e\u003cb\u003eC\u003c/b\u003e · A study using an inactive comparison treatment\u003c/p\u003e\u003cp\u003e\u003cb\u003eD\u003c/b\u003e · The main outcome a study is designed to assess\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"gap-item p-choice\" data-answer-row\u003e\u003clabel class=\"p-prompt\" for=\"aiMatch1\"\u003eplacebo-controlled\u003c/label\u003e\u003cselect id=\"aiMatch1\" data-gap=\"C\" aria-label=\"placebo-controlled\"\u003e\u003coption value=\"\"\u003eChoose…\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\u003c/select\u003e\u003csmall class=\"feedback\" data-grade\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"gap-item p-choice\" data-answer-row\u003e\u003clabel class=\"p-prompt\" for=\"aiMatch2\"\u003eprimary endpoint\u003c/label\u003e\u003cselect id=\"aiMatch2\" data-gap=\"D\" aria-label=\"primary endpoint\"\u003e\u003coption value=\"\"\u003eChoose…\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\u003c/select\u003e\u003csmall class=\"feedback\" data-grade\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"gap-item p-choice\" data-answer-row\u003e\u003clabel class=\"p-prompt\" for=\"aiMatch3\"\u003esecondary endpoint\u003c/label\u003e\u003cselect id=\"aiMatch3\" data-gap=\"A\" aria-label=\"secondary endpoint\"\u003e\u003coption value=\"\"\u003eChoose…\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\u003c/select\u003e\u003csmall class=\"feedback\" data-grade\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"gap-item p-choice\" data-answer-row\u003e\u003clabel class=\"p-prompt\" for=\"aiMatch4\"\u003edrug candidate\u003c/label\u003e\u003cselect id=\"aiMatch4\" data-gap=\"B\" aria-label=\"drug candidate\"\u003e\u003coption value=\"\"\u003eChoose…\u003c/option\u003e\u003coption valu ng\u003e\u003cp\u003eThe video describes several research projects. \u003cstrong\u003eHalicin\u003c/strong\u003e was found through screening a library of 6,000 compounds. The later \u003cstrong\u003eNG1 and DN1\u003c/strong\u003e work generated new structures. These are different discoveries.\u003c/p\u003e\u003c/div\u003e\u003ch3\u003eExercise 5 · Watch and answer\u003c/h3\u003e\u003cdiv class=\"gap-item p-choice\" data-answer-row\u003e\u003clabel class=\"p-prompt\" for=\"aiVideo1\"\u003eWhy is AI useful? A. It removes the need for experiments · B. It can screen huge numbers of molecules · C. It prevents resistance\u003c/label\u003e\u003cselect id=\"aiVideo1\" data-gap=\"B\" aria-label=\"Why is AI useful? A. It removes the need for experiments · B. It can screen huge numbers of molecules · C. It prevents resistance\"\u003e\u003coption value=\"\"\u003eChoose…\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003c/select\u003e\u003csmall class=\"feedback\" data-grade\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"gap-item p-choice\" data-answer-row\u003e\u003clabel class=\"p-prompt\" for=\"aiVideo2\"\u003eIn the earlier halicin project, what resulted from screening 6,000 compounds? A. One met all three criteria · B. All became approved antibiotics · C. A cure for all infections\u003c/label\u003e\u003cselect id=\"aiVideo2\" data-gap=\"A\" aria-label=\"In the earlier halicin project, what resulted from screening 6,000 compounds? A. One met all three criteria · B. All became approved antibiotics · C. A cure for all infections\"\u003e\u003coption value=\"\"\u003eChoose…\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003c/select\u003e\u003csmall class=\"feedback\" data-grade\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"gap-item p-choice\" data-answer-row\u003e\u003clabel class=\"p-prompt\" for=\"aiVideo3\"\u003eWhat challenges remain? A. No theoretical molecules exist · B. Clinical trial timelines and commercial incentives · C. Computers cannot analyse chemistry\u003c/label\u003e\u003cselect id=\"aiVideo3\" data-gap=\"B\" aria-label=\"What challenges remain? A. No theoretical molecules exist · B. Clinical trial timelines and commercial incentives · C. Computers cannot analyse chemistry\"\u003e\u003coption value=\"\"\u003eChoose…\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003c/select\u003e\u003csmall class=\"feedback\" data-grade\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"tip\"\u003e\u003cstrong\u003eDiscuss\u003c/strong\u003e\u003cp\u003eDoes a faster search for candidate molecules mean patients will receive new medicines sooner? Which stages should not be accelerated?\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"question-item\"\u003e\u003cstrong\u003eYour takeaway (speaking notes)\u003c/strong\u003e\u003ctextarea data-exercise-field=\"aiVideoTakeaway\" rows=\"3\" maxlength=\"3500\" placeholder=\"AI can accelerate discovery, but …\"\u003e\u003c/textarea\u003e\u003c/div\u003e","teacherNotes":"Verified PBS/YouTube 2026 video. View 7:31, discuss 4 min. The older halicin example is not identical to the NG1/DN1 study. Correct B/A/B."},{"id":"ai-video-vocab","title":"07 · Vocabulary from the video","minutes":6,"label":"Vocabulary from the video · 6 min","html":"\u003cdiv class=\"p-label\"\u003eFOUR EXPRESSIONS FROM THE VIDEO CONTEXT\u003c/div\u003e\u003cdiv class=\"vocab\"\u003e\u003carticle\u003e\u003cb\u003edrug-resistant strains\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"14\" aria-label=\"Save drug-resistant strains to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003ebacteria that survive treatment with ce "New antibiotics are needed for ______.\"\u003e\u003coption value=\"\"\u003eChoose…\u003c/option\u003e\u003coption value=\"in vitro\"\u003ein vitro\u003c/option\u003e\u003coption value=\"screen compounds\"\u003escreen compounds\u003c/option\u003e\u003coption value=\"drug-resistant strains\"\u003edrug-resistant strains\u003c/option\u003e\u003c/select\u003e\u003csmall class=\"feedback\" data-grade\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"gap-item p-choice\" data-answer-row\u003e\u003clabel class=\"p-prompt\" for=\"aiVideoGap4\"\u003eA discovery may enter the ______ without reaching the market.\u003c/label\u003e\u003cselect id=\"aiVideoGap4\" data-gap=\"drug-development pipeline\" aria-label=\"A discovery may enter the ______ without reaching the market.\"\u003e\u003coption value=\"\"\u003eChoose…\u003c/option\u003e\u003coption value=\"drug-development pipeline\"\u003edrug-development pipeline\u003c/option\u003e\u003coption value=\"in vitro\"\u003ein vitro\u003c/option\u003e\u003coption value=\"screen compounds\"\u003escreen compounds\u003c/option\u003e\u003c/select\u003e\u003csmall class=\"feedback\" data-grade\u003e\u003c/small\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003eSpeaking:\u003c/strong\u003e Use two phrases to explain the gap between discovery and patient benefit.\u003c/p\u003e","teacherNotes":"Matching B/A/D/C. Four gap answers correspond to expressions; video collocations are adapted for teaching, not claimed as direct quotes."},{"id":"ai-marketing","title":"08 · The pharmaceutical marketing challenge","minutes":6,"label":"The pharmaceutical marketing challenge · 6 min","html":"\u003cdiv class=\"p-label\"\u003ePROFESSIONAL C1 · MEDICAL AFFAIRS × MARKETING\u003c/div\u003e\u003ch3\u003eWould you approve this campaign?\u003c/h3\u003e\u003cp\u003eYour pharmaceutical company plans an investor presentation. The marketing team proposes:\u003c/p\u003e\u003cblockquote class=\"p-claim\"\u003e“Artificial intelligence has developed revolutionary new medicines that are proven safe and effective. AI-generated antibiotics are ready to transform patient care.”\u003c/blockquote\u003e\u003cp\u003e\u003cstrong\u003eYour task:\u003c/strong\u003e Rewrite the first two claims using cautious, commercially appealing language. The third is an optional stretch.\u003c/p\u003e\u003ch3\u003eExercise 8 · Rewrite the claims\u003c/h3\u003e\u003cdiv class=\"question-item\"\u003e\u003cstrong\u003e1. “AI has proved that rentosertib works.”\u003c/strong\u003e\u003ctextarea data-exercise-field=\"aiClaim1\" rows=\"3\" maxlength=\"3500\" placeholder=\"Preliminary Phase 2a findings suggest …, although …\"\u003e\u003c/textarea\u003e\u003c/div\u003e\u003cdiv class=\"question-item\"\u003e\u003cstrong\u003e2. “These new antibiotics will save millions of lives.”\u003c/strong\u003e\u003ctextarea data-exercise-field=\"aiClaim2\" rows=\"3\" maxlength=\"3500\" placeholder=\"The candidates have demonstrated … in preclinical …, but …\"\u003e\u003c/textarea\u003e\u003c/div\u003e\u003cdiv class=\"question-item\"\u003e\u003cstrong\u003e3. Stretch: “AI will make drug development fast and cheap.”\u003c/strong\u003e\u003ctextarea data-exercise-field=\"aiClaim3\" rows=\"3\" maxlength=\"3500\" placeholder=\"AI may accelerate early discovery, while …\"\u003e\u003c/textarea\u003e\u003c/div\u003e\u003cdiv class=\"tip\"\u003e\u003cstrong\u003eUseful C1 language\u003c/strong\u003e\u003cp\u003eThe findings suggest that… / Although the results are encouraging… / It would be premature to conclude that… / Further trials would be required to establish… / The evidence is promising, albeit preliminary.\u003c/p\u003e\u003c/div\u003e\u003cdetails class=\"p-examples\"\u003e\u003csummary\u003eSample wording for teacher discussion\u003c/summary\u003e\u003cp\u003e“Early Phase 2a findings for rentosertib are encouraging, but larger, longer studies are needed to establish clinical benefit.”\u003c/p\u003e\u003cp\u003e“AI-generated antibiotic candidates have shown activity in laboratory and mouse studies; effectiveness and safety in patients remain unproven.”\u003c/p\u003e\u003c/details\u003e\u003cp\u003e\u003cstrong\u003eFinal discussion:\u003c/strong\u003e Which revised statement would be persuasive and scientifically accurate? Reconsider the original three headlines.\u003c/p\u003e","teacherNotes":"Six minutes; no ninth task or presentation. First two rewrites are essential, third optional. Assess hedging, evidence limitations, precise claims."}]}</script>
