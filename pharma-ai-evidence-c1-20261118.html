<script type="application/json" id="lesson-data">{"title":"AI in Medicine: Evidence, Hype & the Marketing Line","hero":"AI in Medicine: Evidence, Hype & the Marketing Line","cabinet":"student-pharma.html","footer":"GoStudy · Pharma C1 · 50 minutes · No homework assigned · Research through November 2026","key":"gostudy-pharma-c1-ai-evidence-20261118-v1","wordsKey":"gostudy-pharma-c1-v1","preserve":"cloud","followStudent":false,"course":"pharma-c1","durationMinutes":50,"lessonWords":[{"en":"clinical validation","ru":"клиническая валидация"},{"en":"surrogate endpoint","ru":"суррогатная конечная точка"},{"en":"generalizability","ru":"обобщаемость результатов"},{"en":"risk of bias","ru":"риск систематической ошибки"},{"en":"regulatory clearance","ru":"регуляторный допуск"},{"en":"overstate the findings","ru":"преувеличивать результаты исследования"},{"en":"real-world evidence","ru":"данные реальной клинической практики"},{"en":"post-market surveillance","ru":"пострегистрационный мониторинг"}],"sources":[{"title":"Goh et al., Nature Medicine (2025)","url":"https://www.nature.com/articles/s41591-024-03456-y"},{"title":"Ren et al., JAMA Network Open (2026)","url":"https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2850190"},{"title":"FDA list of AI-enabled medical devices","url":"https://www.fda.gov/medical-devices/artificial-intelligence-enabled-medical-devices/list-artificial-intelligence-enabled-medical-devices"}],"steps":[{"id":"brief","title":"01 · Would you approve this headline?","minutes":6,"label":"Lead-in · 6 min","teacherNotes":"Ask for precise evidence, not a gut reaction. Ideal argument: a performance improvement in an exercise is not proof of better patient outcomes. Use learner's pharma-marketing experience. Revisit at exit.","html":"\u003cdiv class=\"tip\">\u003cstrong>Boardroom challenge\u003c/strong>\u003cp>You are the medical marketing lead. The team wants to announce a new AI assistant for doctors. Three possible headlines are on the table:\u003c/p>\u003c/div>\u003cdiv class=\"case-column\">\u003csection class=\"material-card\">\u003cstrong>A\u003c/strong>\u003cp>“AI makes doctors better at treating patients.”\u003c/p>\u003c/section>\u003csection class=\"material-card\">\u003cstrong>B\u003c/strong>\u003cp>“In a simulated trial, doctors assisted by AI scored higher on clinical management tasks.”\u003c/p>\u003c/section>\u003csection class=\"material-card\">\u003cstrong>C\u003c/strong>\u003cp>“The end of medical uncertainty is here.”\u003c/p>\u003c/section>\u003c/div>\u003cdiv class=\"question-item\">\u003cstrong>1. Which claim would you approve, reject or rewrite? Why?\u003c/strong>\u003ctextarea data-exercise-field=\"lead1\" maxlength=\"3500\" placeholder=\"I would reject... because the evidence...\">\u003c/textarea>\u003c/div>\u003cdiv class=\"question-item\">\u003cstrong>2. What is the difference between improving a test score and improving patients' health?\u003c/strong>\u003ctextarea data-exercise-field=\"lead2\" maxlength=\"3500\" placeholder=\"A test score measures..., whereas...\">\u003c/textarea>\u003c/div>"},{"id":"lexis","title":"02 · The language of cautious claims","minutes":8,"label":"Vocabulary · 8 min","teacherNotes":"8 lexical units; ask for learner-generated paraphrases. Key distinction: regulatory clearance is not automatically proof of improved clinical outcomes. Example: 'Results may not generalize beyond a simulated setting.'","html":"\u003cp>Build the toolkit you need to defend an evidence-based healthcare claim. Save useful expressions with the ＋ buttons.\u003c/p>\u003cdiv class=\"vocab\">\u003carticle>\u003cb>clinical validation\u003c/b> \u003cbutton type=\"button\" data-lesson-word=\"0\" aria-label=\"Save clinical validation to vocabulary\">＋ Save word\u003c/button>\u003cp>testing an AI tool's performance in a relevant clinical setting\u003c/p>\u003cspan class=\"tiny\">Before a launch, clinical validation matters more than an impressive demo.\u003c/span>\u003c/article>\u003carticle>\u003cb>surrogate endpoint\u003c/b> \u003cbutton type=\"button\" data-lesson-word=\"1\" aria-label=\"Save surrogate endpoint to vocabulary\">＋ Save word\u003c/button>\u003cp>a measured outcome used instead of a direct patient benefit\u003c/p>\u003cspan class=\"tiny\">A faster report is not necessarily a better patient outcome.\u003c/span>\u003c/article>\u003carticle>\u003cb>generalizability\u003c/b> \u003cbutton type=\"button\" data-lesson-word=\"2\" aria-label=\"Save generalizability to vocabulary\">＋ Save word\u003c/button>\u003cp>how well results apply beyond the original study\u003c/p>\u003cspan class=\"tiny\">Findings from five simulated cases may have limited generalizability.\u003c/span>\u003c/article>\u003carticle>\u003cb>risk of bias\u003c/b> \u003cbutton type=\"button\" data-lesson-word=\"3\" aria-label=\"Save risk of bias to vocabulary\">＋ Save word\u003c/button>\u003cp>the possibility that flaws in a study distort its results\u003c/p>\u003cspan class=\"tiny\">A narrow dataset can create a risk of bias.\u003c/span>\u003c/article>\u003carticle>\u003cb>regulatory clearance\u003c/b> \u003cbutton type=\"button\" data-lesson-word=\"4\" aria-label=\"Save regulatory clearance to vocabulary\">＋ Save word\u003c/button>\u003cp>a regulatory route that allows a device to be marketed for its intended use\u003c/p>\u003cspan class=\"tiny\">Regulatory clearance is not a universal promise of clinical benefit.\u003c/span>\u003c/article>\u003carticle>\u003cb>overstate the findings\u003c/b> \u003cbutton type=\"button\" data-lesson-word=\"5\" aria-label=\"Save overstate the findings to vocabulary\">＋ Save word\u003c/button>\u003cp>describe research results as stronger than the evidence supports\u003c/p>\u003cspan class=\"tiny\">Marketers should not overstate the findings of a small trial.\u003c/span>\u003c/article>\u003carticle>\u003cb>real-world evidence\u003c/b> \u003cbutton type=\"button\" data-lesson-word=\"6\" aria-label=\"Save real-world evidence to vocabulary\">＋ Save word\u003c/button>\u003cp>evidence collected during routine healthcare rather than a controlled simulation\u003c/p>\u003cspan class=\"tiny\">Real-world evidence can reveal how a tool performs in daily use.\u003c/span>\u003c/article>\u003carticle>\u003cb>post-market surveillance\u003c/b> \u003cbutton type=\"button\" data-lesson-word=\"7\" aria-label=\"Save post-market surveillance to vocabulary\">＋ Save word\u003c/button>\u003cp>ongoing monitoring of safety after a product enters the market\u003c/p>\u003cspan class=\"tiny\">Post-market surveillance can detect problems that early studies missed.\u003c/span>\u003c/article>\u003c/div>\u003cdiv class=\"question-item\">\u003cstrong>Use any three expressions to challenge an exaggerated claim.\u003c/strong>\u003ctextarea data-exercise-field=\"lexisWrite\" maxlength=\"3500\" placeholder=\"Before making this claim, we need to consider...\">\u003c/textarea>\u003c/div>"},{"id":"trial","title":"03 · The AI experiment that raised more questions","minutes":10,"label":"Research case · 10 min","teacherNotes":"Original pedagogical summary of Goh et al., Nature Medicine (2025). Verify facts: 92 physicians, 5 simulated cases; +6.5 percentage points (95% CI 2.7–10.2) and +119.3 s/case; no real patient outcome measured. Open-ended prompts: weakness = simulated environment / small number of cases; benefit = higher assessment scores; time cost = slower.","html":"\u003cdiv class=\"article\">\u003cp>\u003cstrong>Study brief · Nature Medicine, February 2025 · paraphrased for class\u003c/strong>\u003c/p>\u003ch3>When AI helps doctors reason, what exactly improves?\u003c/h3>\u003cp>A randomized controlled trial tested a question that matters to both clinicians and marketers: does access to GPT-4 make doctors better at reasoning through complicated management decisions? Ninety-two practising physicians were randomly assigned to one of two groups. One group could use GPT-4 as well as conventional resources; the other relied on conventional resources alone. Each participant worked through five simulated patient scenarios rather than treating patients in hospital.\u003c/p>\u003cp>The AI-assisted physicians achieved higher scores on an expert-developed rubric: the average difference was \u003cstrong>6.5 percentage points\u003c/strong> (95% confidence interval: 2.7–10.2). However, the AI-assisted group also spent an average of \u003cstrong>119.3 more seconds per case\u003c/strong>. There was no statistically significant difference between the AI-assisted doctors and GPT-4 used alone on the study's scoring measure.\u003c/p>\u003cp>These are meaningful findings, but they have boundaries. Better scores on simulated management tasks do not, by themselves, demonstrate fewer complications, shorter hospital stays, or better long-term patient outcomes. The authors called for validation in real clinical practice.\u003c/p>\u003cp>\u003ca href=\"https://www.nature.com/articles/s41591-024-03456-y\" target=\"_blank\" rel=\"noopener noreferrer\">Original randomized trial · Nature Medicine\u003c/a>\u003c/p>\u003c/div>\u003cdiv class=\"question-item\">\u003cstrong>What could a responsible marketing team say, and what would it have to leave unsaid?\u003c/strong>\u003ctextarea data-exercise-field=\"trialDiscuss\" maxlength=\"3500\" placeholder=\"The randomized trial suggests... However...\">\u003c/textarea>\u003c/div>"},{"id":"interpret","title":"04 · Evidence or overclaim?","minutes":7,"label":"Critical reading · 7 min","type":"choice","instruction":"Choose the only interpretation that is sufficiently supported by the study. Explain why the alternatives go too far.","teacherNotes":"Answer key (0-based): [1,2,0,2,1]. Deliberate focus on inference; ask learner to point out the missing evidence in each distractor.","items":[["Which claim is directly supported by the 2025 trial?",["AI improved survival rates in hospitals.","AI-assisted physicians scored higher on five simulated management tasks.","Doctors became faster in every clinical decision."],1],["The extra 119.3 seconds per case is best described as…",["evidence that the AI harmed patients.","a 119.3% increase in time.","a trade-off that the marketing message should acknowledge."],2],["Why can't this trial prove that AI improves patient outcomes?",["The outcome was performance on simulated cases, not patients' health.","The trial was not randomized.","The study included only one physician."],0],["What does the 95% confidence interval of 2.7–10.2 percentage points relate to?",["The number of patients who benefited.","The approval rate of the AI tool.","Uncertainty around the estimated difference in scores."],2],["Which follow-up would best test generalizability?",["A bigger social media launch.","A prospective study of patient-relevant outcomes in different hospitals.","An additional language-model benchmark with no clinicians."],1]]},{"id":"recalls","title":"05 · A 2026 safety warning — read the small print","minutes":7,"label":"Evidence scrutiny · 7 min","teacherNotes":"Original summary of Ren et al. JAMA Network Open (11 June 2026), n=903 FDA-authorized devices through 2024, 43 recalls (4.8%). HR 1.39 (95% credible interval 0.84–3.52), crosses 1 so not definitive. Strong message: evidence gaps and post-market surveillance matter; do not claim causality or guaranteed safety.","html":"\u003cdiv class=\"article\">\u003cp>\u003cstrong>Research update · JAMA Network Open, June 2026 · original teaching summary\u003c/strong>\u003c/p>\u003ch3>Regulatory authorization is not the end of the evidence story.\u003c/h3>\u003cp>Researchers examined \u003cstrong>903 FDA-authorized AI-enabled medical devices\u003c/strong> and followed records up to August 2024. They identified \u003cstrong>43 recalled devices (4.8%)\u003c/strong>. Among devices with missing publicly reported clinical study information, the estimated recall hazard was higher than for those with published clinical studies (hazard ratio \u003cstrong>1.39\u003c/strong>; 95% credible interval \u003cstrong>0.84–3.52\u003c/strong>).\u003c/p>\u003cp>The estimate suggests a potential association, but its uncertainty interval includes 1. This result does \u003cstrong>not\u003c/strong> establish a statistically clear difference, and the observational study cannot demonstrate that missing published evidence causes recalls. The researchers emphasised clinical validation, transparency and post-market monitoring.\u003c/p>\u003cp>\u003ca href=\"https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2850190\" target=\"_blank\" rel=\"noopener noreferrer\">Original research · JAMA Network Open (2026)\u003c/a> · \u003ca href=\"https://www.fda.gov/medical-devices/artificial-intelligence-enabled-medical-devices/list-artificial-intelligence-enabled-medical-devices\" target=\"_blank\" rel=\"noopener noreferrer\">FDA list of AI-enabled medical devices\u003c/a>\u003c/p>\u003c/div>\u003cdiv class=\"question-item\">\u003cstrong>Evaluate the line: “A 2026 study proves unvalidated AI devices are 39% more likely to be recalled.” Identify at least TWO problems.\u003c/strong>\u003ctextarea data-exercise-field=\"safetyCritique\" maxlength=\"3500\" placeholder=\"Firstly, the interval... Secondly, ...\">\u003c/textarea>\u003c/div>\u003cdiv class=\"question-item\">\u003cstrong>Rewrite the claim for an internal evidence review (35–50 words).\u003c/strong>\u003ctextarea data-exercise-field=\"safetyRewrite\" maxlength=\"3500\" placeholder=\"A retrospective study found... The estimate was uncertain...\">\u003c/textarea>\u003c/div>"},{"id":"lab","title":"06 · The medical–marketing approval meeting","minutes":7,"label":"Role-play · 7 min","teacherNotes":"Teacher = medical affairs lead; student = marketer. Challenge 3 claims; require approved wording, trial design, target population, intended use and next validation. Sample: 'In a randomized simulated-case study of 92 physicians, AI assistance was associated with higher rubric scores; further real-world testing is needed.'","html":"\u003cdiv class=\"tip\">\u003cstrong>Scenario\u003c/strong>\u003cp>Your company wants to promote an AI clinical decision-support tool to hospital buyers. You are responsible for the first professional campaign. Your colleague insists on three bold statements.\u003c/p>\u003c/div>\u003cdiv class=\"case-column\">\u003csection class=\"material-card\">\u003cstrong>Claim 1\u003c/strong>\u003cp>“Proven to deliver better patient care.”\u003c/p>\u003c/section>\u003csection class=\"material-card\">\u003cstrong>Claim 2\u003c/strong>\u003cp>“FDA authorization means our AI is clinically superior.”\u003c/p>\u003c/section>\u003csection class=\"material-card\">\u003cstrong>Claim 3\u003c/strong>\u003cp>“Faster, safer and more accurate than doctors.”\u003c/p>\u003c/section>\u003c/div>\u003cdiv class=\"question-item\">\u003cstrong>1. Draft one precise replacement headline (maximum 22 words).\u003c/strong>\u003ctextarea data-exercise-field=\"labHeadline\" maxlength=\"3500\" placeholder=\"In a simulated study...\">\u003c/textarea>\u003c/div>\u003cdiv class=\"question-item\">\u003cstrong>2. State two essential caveats that must appear in the supporting copy.\u003c/strong>\u003ctextarea data-exercise-field=\"labCaveats\" maxlength=\"3500\" placeholder=\"This study did not... Further research...\">\u003c/textarea>\u003c/div>\u003cdiv class=\"question-item\">\u003cstrong>3. What evidence would you request before making a stronger product claim?\u003c/strong>\u003ctextarea data-exercise-field=\"labEvidence\" maxlength=\"3500\" placeholder=\"We would need data on...\">\u003c/textarea>\u003c/div>\u003cp>\u003cstrong>Discuss:\u003c/strong> Can a deliberately cautious message still be commercially persuasive? How would you explain it to a sales director?\u003c/p>"},{"id":"pitch","title":"07 · Defend your launch decision","minutes":5,"label":"Boardroom pitch · 5 min","teacherNotes":"One-minute pitch + 2–3 minutes of hostile questions + 1-minute recap. Success: accurate evidence, acknowledges uncertainty, risk monitoring, audience-specific wording, ≥4 target expressions. No homework.","html":"\u003cdiv class=\"tip\">\u003cstrong>Final decision\u003c/strong>\u003cp>You are presenting to the executive committee. Recommend one of these options: \u003cstrong>launch with cautious wording\u003c/strong>, \u003cstrong>pilot only\u003c/strong>, or \u003cstrong>delay the campaign\u003c/strong>. Defend your choice with evidence, uncertainty and a plan for monitoring.\u003c/p>\u003c/div>\u003cdiv class=\"question-item\">\u003cstrong>Your 60-second executive brief\u003c/strong>\u003ctextarea data-exercise-field=\"pitchBrief\" maxlength=\"3500\" placeholder=\"Although the findings suggest..., they do not yet demonstrate...\">\u003c/textarea>\u003c/div>\u003cp>\u003cstrong>Board challenges:\u003c/strong> “Our competitors are moving faster. Why shouldn't we?” / “What does regulatory clearance allow us to say?” / “Which patient-relevant outcomes would change your decision?”\u003c/p>\u003cdiv class=\"question-item\">\u003cstrong>Exit ticket: Complete the sentence with a nuanced conclusion.\u003c/strong>\u003ctextarea data-exercise-field=\"exit\" maxlength=\"3500\" placeholder=\"AI in medicine has promise, provided that...\">\u003c/textarea>\u003c/div>\u003cp>\u003cstrong>Self-check:\u003c/strong> use at least four target expressions, distinguish evidence from interpretation, and state one limitation without overstating it.\u003c/p>"}]}</script>
