<script>

const CLIPS=[{"qs":[["Why is the positive feedback limited?",["The participants were paid to agree.","It mainly describes an already engaged group.","The agency changed the scores."],1],["What role does the isolated interview play?",["It proves the whole audience wants a checklist.","It should replace the survey.","It raises a testable question without establishing its scale."],2],["Why combine interviews and navigation data?",["To challenge interpretations using different sources.","To make the sample statistically representative.","To establish clinical outcomes."],0],["What answers the concern about endless research?",["An immediate national rollout.","A bounded test with an owner and a review date.","Removing dissenting participants."],1]]},{"qs":[["Why might satisfaction scores mislead the team?",["Most came from people who completed the session.","They measured the wrong country.","No one had attended."],0],["What does the speaker concede?",["The follow-up guarantees an accurate forecast.","The follow-up will still not make the sample representative.","Early departures have nothing useful to say."],1],["What was agreed?",["Cancel every resource.","Scale immediately.","Delay the redesign briefly and define evidence for changing priorities."],2]]}];
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key='gostudy-pharma-c1-02-v1';let state={page:0,answers:{},words:[],dark:false};let storage=true;
try{const s=JSON.parse(GoStudyStorage.getItem(key)||'null');if(s&&typeof s==='object'){state={...state,...s};state.answers=s.answers&&typeof s.answers==='object'?s.answers:{};state.words=Array.isArray(s.words)?s.words.filter(w=>w&&typeof w.en==='string'&&typeof w.ru==='string'):[];}}catch(e){storage=false;}

  try {
    const shared = JSON.parse(GoStudyStorage.getItem(sharedWordKey) || '{}');
    if(Array.isArray(shared.words)) state.words = shared.words.filter(w=>w&&typeof w.en==='string'&&typeof w.ru==='string');
  } catch {}

readSharedWords();
window.addEventListener('pageshow',()=>{readSharedWords();$('#wordCount').textContent=state.words.length;if($('#dictionary').open)renderWords();});

  if(currentWords!==lastWords){
    const shared = JSON.parse(GoStudyStorage.getItem(sharedWordKey)||'{}');
    shared.words=state.words;

  }
  GoStudyStorage.setItem(key,JSON.stringify(state));}catch(e){storage=false;$('#storageNote').hidden=false;$('#storageNote').textContent='Saving unavailable. Export your answers and vocabulary before closing.';}$('#wordCount').textContent=state.words.length;}
let toastTimer;function notify(s){$('#toast').textContent=s;$('#toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),3200);}
const words=[["actionable insight","вывод, на основе которого можно действовать","An interesting comment is not automatically an actionable insight."],["selection bias","систематическое смещение из-за отбора","Voluntary responses may introduce selection bias."],["an unmet need","неудовлетворённая потребность","The feedback suggests an unmet information need."],["a blind spot","слепая зона; упущенный аспект","Early departures may reveal a blind spot."],["triangulate","сопоставлять несколько источников","We should triangulate interviews with behavioural data."],["a trade-off","компромисс между преимуществами и потерями","The trade-off is speed versus depth."],["a dissenting view","несогласная точка зрения","We should examine the dissenting view."],["a working hypothesis","рабочая гипотеза","Treat this as a working hypothesis."],["disconfirming evidence","данные, опровергающие гипотезу","What would count as disconfirming evidence?"],["a decision threshold","критерий для принятия решения","Agree on a decision threshold before the pilot."],["scope creep","неконтролируемое расширение объёма работ","A narrow pilot helps prevent scope creep."],["follow through","довести до конца","Assign an owner who will follow through."]];
const glossary={"actionable insight":"вывод, на основе которого можно действовать","selection bias":"систематическое смещение из-за отбора","an unmet need":"неудовлетворённая потребность","a blind spot":"слепая зона; упущенный аспект","triangulate":"сопоставлять несколько источников","a trade-off":"компромисс между преимуществами и потерями","a dissenting view":"несогласная точка зрения","a working hypothesis":"рабочая гипотеза","disconfirming evidence":"данные, опровергающие гипотезу","a decision threshold":"критерий для принятия решения","scope creep":"неконтролируемое расширение объёма работ","follow through":"довести до конца"};
const norm=s=>s.toLowerCase().replace(/[’]/g,"'").replace(/^[\s.,!?;:]+|[\s.,!?;:]+$/g,'').replace(/\s+/g,' ');

const pages=[["From feedback to strategy","Pharma C1 · Lesson 02 · A fictional professional case",5,"Compare popularity and usefulness."],["The language of insight","Question an interpretation without dismissing a colleague.",8,"Ask for examples and paraphrases."],["The voices missing from the room","Read for assumptions, selection and competing explanations.",12,"Distinguish observations from interpretations."],["An uncomfortable comment","Listen for stance and qualified recommendations.",8,"Ask what the follow-up can and cannot establish."],["How certain are you?","Hedging, concessions and conditional recommendations.",8,"Compare certainty and meaning, not just grammar."],["The prioritisation meeting","Allocate a limited budget and defend your trade-offs.",10,"Challenge costs, feasibility and success criteria."],["Handle the pushback","Negotiate a decision without pretending the uncertainty has disappeared.",10,"Require a response to the strongest counterargument."],["A decision worth revisiting","Deliver a briefing and define what would change your mind.",4,"Give feedback on evidence, structure and language."]];

function feedWords(){return card('Precision without paralysis','<div class="word-grid">'+words.map((w,i)=>'<article class="word"><strong>'+esc(w[0])+'</strong><p>'+esc(w[2])+'</p><details><summary>Meaning · перевод</summary><p>'+esc(w[1])+'</p></details><button type="button" class="small-button" data-speak-word>🔊 Прослушать слово</button> <button class="small-button" data-add="'+i+'">♥ В словарь</button></article>').join('')+'</div><p>Choose four expressions. Use them to challenge this statement: “Our regular participants are happy, so we know what the whole audience needs.”</p>');}
function feedReading(){return card('The voices missing from the room',"<p class=\"muted\">Original fictional case · no clinical efficacy claims or real company data.</p><p>Following the Meridian launch review, the fictional team commissioned interviews to understand what its audience needed next. The brief sounded straightforward: turn feedback into a more relevant communication programme. Yet the first presentation offered a familiar comfort. Eighty-six per cent of respondents rated the sessions positively, and several enthusiastic speakers requested more of the same. The agency recommended a larger series.</p><p>The insight lead, Nadia, asked who had been invited to respond. All twenty-eight respondents had attended at least two sessions; most were already active participants. People who had registered but never joined, or left early, were absent. This did not invalidate what the respondents said. It limited whose experience the findings could describe. The team had gathered useful feedback from an engaged group, then quietly treated that group as a picture of the wider audience.</p><p>One dissenting interview complicated the story. A clinician said the resource was clear but difficult to use during a short consultation. The commercial lead regarded the comment as too isolated to drive investment. Nadia agreed that a single interview could not establish the scale of a need. However, she argued that it could identify a question worth testing. Neither ignoring the comment nor redesigning the entire programme around it would be proportionate.</p><p>The team separated observations from interpretations. Short visits to a resource were observable. The explanation that clinicians lacked interest was not. They might have found an answer quickly, struggled with navigation, or been interrupted. Similarly, a request for a checklist did not establish that a checklist was the best solution. It could be a way of expressing a need for quicker access to existing information. The proposed format and the underlying problem had to be examined separately.</p><p>Nadia suggested combining a small number of follow-up interviews with a review of navigation patterns. The interviews would include both repeat participants and people who had disengaged. This purposive selection would still not produce a representative sample, and the navigation data would not explain motives on their own. Together, however, the sources might challenge an explanation that either source alone made attractive. Any patient examples would be fictional; the exercise required no identifiable case information.</p><p>The argument then shifted from interpretation to resources. The agency could deliver a larger webinar series within six weeks. Investigating the consultation problem would delay production and might reveal that no new asset was needed. The commercial lead worried that another research phase would become an excuse not to decide. Nadia therefore proposed a bounded test: one audience segment, one question, a named owner and a review date. Before starting, the team would record what findings would support, weaken or overturn its working hypothesis.</p><p>The final agreement was deliberately conditional. They would test whether users could locate a specified piece of existing information more easily with a revised navigation route. They would not describe that result as improved clinical decision-making. If the route failed, the team would revisit the problem rather than merely polish the design. The decision was commercially uncomfortable because it left room for a negative answer. That was also what made it useful.</p>"+b2mc(0,CLIPS[0].qs))+card('Read beyond the headline','<ol><li>Find one observation and two possible interpretations of it.</li><li>Why is “useful but limited” more accurate than “invalid”?</li><li>What is the strongest argument against Nadia’s proposal?</li><li>Which finding would make you abandon the navigation hypothesis?</li></ol>');}

const FEED_ITEMS=[['🛹','Skateboard tricks in slow motion','sport'],['🔭','Why stars have different colours','science'],['🎧','An artist you have never heard of','music'],['🥘','A recipe using three ingredients','food'],['📷','Street photography without expensive equipment','art'],['⚽','How a team practises a difficult move','sport'],['🌱','A tiny garden on a balcony','science'],['🎸','The same song, five different versions','music'],['🎬','Making a film with paper characters','art']];
function labPicks(){return Array.isArray(state.answers.feedPicks)?state.answers.feedPicks.filter(n=>Number.isInteger(n)&&n>=0&&n<FEED_ITEMS.length).slice(0,3):[];}
function feedLab(){return card('Calibrate the claim','<p>Choose the wording that matches the evidence.</p><p>Only repeat participants responded. The survey '+hwChoice('g1','may overrepresent',['proves that everyone prefers','may overrepresent','eliminates'])+' highly engaged users.</p><p>We cannot estimate the scale of the problem. '+hwChoice('g2','Nevertheless',['Consequently it is certain that','Nevertheless','Because'])+', it is worth testing the explanation.</p><p>'+hwChoice('g3','Had we included',['Had we included','Would we include','Have we included'])+' early departures, we might have identified the issue sooner.</p><p>We recommend a pilot, '+hwChoice('g4','provided that',['despite','provided that','whereas'])+' an owner and review date are agreed in advance.</p>')+card('Repair the overclaim','<ol><li>“Three interviews prove that clinicians need an app.”</li><li>“Short visits show that the content is irrelevant.”</li><li>“A better navigation score means better patient outcomes.”</li></ol><p>Rephrase each statement orally. Preserve what the evidence supports, identify a competing explanation and suggest the next question.</p><details><summary>Language support</summary><p>The findings are consistent with…, although… · This may reflect… rather than… · We cannot infer… solely from…</p></details>');}
function feedDebate(){return card('Allocate 80 units in four weeks',"<p>Fictional planning exercise. Choose no more than two options, or a staged sequence that fits the budget.</p><div class=\"word-grid\"><article class=\"word\"><h3>A · Repeat webinar series</h3><p>60 units; ready in four weeks. Strong satisfaction among repeat attendees; limited evidence about absent users.</p></article><article class=\"word\"><h3>B · Follow-up interviews</h3><p>25 units; two weeks. Eight purposively selected people, including early departures. Explore explanations; do not estimate prevalence.</p></article><article class=\"word\"><h3>C · Navigation prototype</h3><p>50 units; three weeks. Test five users on a specified task. Existing content only; the problem is not yet confirmed.</p></article><article class=\"word\"><h3>D · Access-question mapping</h3><p>30 units; two weeks. Categorise anonymised, non-patient-specific questions already received. May miss people who never contacted the team.</p></article></div><p><b>Student — insight lead:</b> protect learning quality. <b>Teacher — commercial lead:</b> demand a visible output in four weeks.</p><p>Agree on a choice, opportunity cost, owner and review date. Define one success criterion and one reason to stop. If choosing B before C, explain how the timeline works.</p><details><summary>Challenge</summary><p>Your budget drops to 55 units. What do you keep, cut or postpone?</p></details>");}
function feedWriting(){return card('The meeting gets difficult',"<p>Respond to each challenge in 30–45 seconds. Acknowledge the concern, challenge one assumption and offer a specific next step.</p><ol><li>“We have enough feedback. More interviews are just delaying delivery.”</li><li>“The customer asked for an app. Why are we arguing with the customer?”</li><li>“If we mention every limitation, leadership will never invest.”</li></ol><p><b>Round 2:</b> swap roles. The teacher must now defend the proposal while the student challenges it.</p><details><summary>A response structure</summary><p>I take your point about… · What I would question is… · A proportionate next step would be… · We would reconsider if…</p></details>" )+card('A concise recommendation','<p>Optional in-class notes: capture the decision in 60–80 words, or deliver it orally. Include evidence, limitation, action and review trigger.</p>'+area('recommendation','Based on… we recommend… The main limitation is… We would revisit this if…',4));}
function hwChoice(id,answer,options){return '<select id="'+id+'" data-gap="'+answer+'" data-answer="'+id+'" aria-label="Пропуск '+id.replace('hw','')+'"><option value="">Выберите…</option>'+options.map(v=>'<option value="'+esc(v)+'" '+(state.answers[id]===v?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select><span class="feedback" id="fb-'+id+'" role="status"></span>';}
function feedFinish(){return card('Your 60-second leadership briefing','<p>State the problem, distinguish an observation from an interpretation, recommend a bounded next step and specify what would change your mind.</p><p><b>Self-check:</b> Have I identified whose voice is missing? Have I explained the trade-off? Is my recommendation testable?</p><p><a class="primary" href="pharma-c1-02-homework.html">Открыть домашнюю работу →</a></p><p><a href="student-pharma.html">← Личный кабинет</a></p>');}
function installGapChecks(){function check(el){const v=el.value.trim(),ok=norm(v)===norm(el.dataset.gap);el.classList.toggle('correct',!!v&&ok);el.classList.toggle('incorrect',!!v&&!ok);$('#fb-'+el.id).textContent=!v?'':ok?'✓ Верно!':'Попробуйте ещё раз.';}$$('[data-gap]').forEach(el=>{el.addEventListener('blur',()=>check(el));el.addEventListener('change',()=>{state.answers[el.dataset.answer]=el.value;save();check(el);});el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();check(el);}});el.addEventListener('input',()=>{el.classList.remove('correct','incorrect');$('#fb-'+el.id).textContent='';});if(el.value.trim())check(el);});}
function installLesson(){installGapChecks();$$('[data-position]').forEach(b=>b.onclick=()=>{state.answers.position=Number(b.dataset.position);save();render();});$$('[data-feed-pick]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.feedPick),p=labPicks(),at=p.indexOf(i);if(at>=0)p.splice(at,1);else if(p.length<3)p.push(i);else{notify('Выберите не больше трёх видео. Можно снять выделение с другого.');return;}state.answers.feedPicks=p;save();const y=scrollY;render();scrollTo(0,y);});if($('#toggleExplore'))$('#toggleExplore').onclick=()=>{state.answers.explore=!state.answers.explore;save();const y=scrollY;render();scrollTo(0,y);};if($('#resetFeed'))$('#resetFeed').onclick=()=>{state.answers.feedPicks=[];state.answers.explore=false;save();render();};$('#exportBtn').hidden=true;}

function feedback(ci,qi){const id=`q${ci}-${qi}`,v=state.answers[id];if(v===undefined)return;const ok=Number(v)===CLIPS[ci].qs[qi][2];$('#fb-'+id).textContent=ok?'✓ Верно!':'Попробуйте ещё раз. Вернитесь к тексту или аудио.';$$(`[name="${id}"]`).forEach(el=>{el.closest('label').classList.toggle('correct',el.checked&&ok);el.closest('label').classList.toggle('incorrect',el.checked&&!ok);});}

let manualVersion = 0;

  manualVersion++;

function translateWhileTyping(event) {
  clearTimeout(manualTimer);
  const version = ++manualVersion;
  const query = manualWord.value.trim();
  manualMeaning.value = '';
  manualStatus.textContent = '';
  if (!query || event?.isComposing) return;
  const russian = /[а-яё]/i.test(query);
  const pair = state.words.find(word => norm(russian ? word.ru : word.en) === norm(query));
  const saved = russian ? pair?.en : pair?.ru;
  const immediate = saved || localTranslation(query) || manualCache.get(norm(query));
  if (immediate) {
    manualMeaning.value = immediate;
    return;
  }
  manualStatus.textContent = 'Переводим…';
  manualTimer = setTimeout(async () => {
    try {
      const result = await online(query);
      if (version !== manualVersion || manualWord.value.trim() !== query) return;
      manualCache.set(norm(query), result);
      manualMeaning.value = result;
      manualStatus.textContent = 'Перевод готов. Можно исправить перед сохранением.';
    } catch {
      if (version === manualVersion && manualWord.value.trim() === query) {
        manualStatus.textContent = 'Перевод недоступен. Можно ввести его вручную.';
      }
    }
  }, 300);
}
manualWord.addEventListener('input', translateWhileTyping);

$('#wordForm').addEventListener('reset', () => {
  manualVersion++;
  clearTimeout(manualTimer);

});
