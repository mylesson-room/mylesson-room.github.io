<script type="application/json" id="lesson-data">{"cabinet":"student-travel-b2.html","title":"The Last Connection · Homework","level":"Travel English · B2","key":"gostudy-travel-b2-04-homework-new-v1","steps":[{"title":"01 · A new complication","id":"homework-new-0","instruction":"READ · 4 min. Read the follow-up message, then check the most important details.","type":"choice","source":["STATION FOLLOW-UP · 22:12 · The replacement coach lift is out of service tonight. Station staff can pre-approve a shared taxi, but the standard reimbursement cap is £60 PER VEHICLE. A taxi company quotes £84, arriving at the hotel around 23:25. The agent cannot guarantee reimbursement above the cap without a supervisor's written exception.","THINK · What would you do before confirming the taxi? What can the operator promise, and what remains uncertain?"],"items":[["How much could remain an out-of-pocket expense without an exception?",["£24","£60","£84"],0,"£84 minus £60 = £24."],["What is essential before booking a taxi?",["A written approval or confirmed exception","A new train ticket","A review of the hotel"],0,"Seek advance approval and keep the written details."],["Which statement is accurate?",["The full £84 is guaranteed","The coach lift is available","An exception above £60 requires supervisor approval"],2,"The agent cannot promise an exception."]]},{"title":"02 · Use the six expressions","id":"homework-new-1","instruction":"VOCABULARY · 5 min. Complete the sentences and say them aloud. Choose expressions in a realistic context.","type":"gap","source":["TARGET WORDS · reroute · reimburse · step-free access · out-of-pocket expense · advance approval · miss a connection"],"items":[["Because of the delay, we may ___ in Harbor City.",["miss a connection","pay a platform","lose a luggage"],0],["We need ___ because my companion cannot use stairs.",["a boarding seat","step-free access","an upgrade ticket"],1],["The operator may ___ us through a different station.",["reroute","review","revenue"],0],["Could you ___ the taxi cost up to the stated limit?",["reimburse","reserve","replace"],0],["We should obtain ___ before booking another service.",["the cheapest ticket","advance approval","a delay report tomorrow"],1],["The extra £24 could become an ___ if the limit is not increased.",["additional timetable","arrival window","out-of-pocket expense"],2]]},{"title":"03 · Write to the operator","id":"homework-new-2","instruction":"WRITING · 7 min. Write 100–130 words in a polite but firm tone. Use at least four of the six target expressions.","type":"write","source":["EMAIL TASK · Your companion needs step-free travel. The coach lift is unavailable and the taxi costs £84. Ask the operator to approve the taxi or clarify how to request an exception to the £60 cap.","INCLUDE · (1) What happened. (2) Why the coach is unsuitable. (3) Your proposed solution. (4) One question about reimbursement. (5) A request for written confirmation.","USEFUL OPENING · 'Thank you for your update. Unfortunately, the replacement coach is not accessible for one of us…'","CHECKLIST · Professional tone; two polite requests; correct facts; clear next action."]},{"title":"04 · Be ready to explain","id":"homework-new-3","instruction":"SPEAKING TRANSFER · 2 min. Prepare two short responses for the beginning of your next lesson.","source":["(1) Your train is 48 minutes late, you miss a connection, and your companion needs step-free access. Give a clear 30-second explanation.","(2) The agent refuses reimbursement over £60. Ask one polite follow-up question and suggest a compromise.","SELF-CHECK · Can you use 'advance approval', 'out-of-pocket expense' and 'reimburse' without reading?"],"teacherNotes":"Next lesson opening: ask for a 60-second oral response and give targeted feedback on the two polite requests."}],"version":"methodology-2026-11-17","durationMinutes":18}</script><script src="assets/gostudy-sync.js?v=114c8b497efb"></script><script src="assets/gostudy-vimbox-workbook.js?v=53258c671103"></script><script src="assets/gostudy-current-courses.js?v=ce1df270d0e5" defer></script><script src="assets/gostudy-glass-vocabulary.js?v=9c384a3e224e" defer></script></body></html>
