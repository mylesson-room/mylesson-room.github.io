<script type="application/json" id="lesson-data">{"title":"Korean Wave: Who Influences Whom?","hero":"Korean Wave: Who Influences Whom?","cabinet":"student-feed-b2.html","footer":"GoStudy · Teen B2 · 50 minutes · Video discussion, visuals and interactive practice · No homework assigned","key":"gostudy-feed-b2-korean-wave-20261118-v1","wordsKey":"gostudy-feed-b2-v1","preserve":"cloud","followStudent":false,"lessonWords":[{"en":"cultural export","ru":"культурный экспорт"},{"en":"break into the mainstream","ru":"стать частью массовой культуры"},{"en":"global fanbase","ru":"международная аудитория поклонников"},{"en":"adapt for an audience","ru":"адаптировать для аудитории"},{"en":"challenge a stereotype","ru":"бросить вызов стереотипу"},{"en":"cultural exchange","ru":"культурный обмен"},{"en":"authenticity","ru":"подлинность"},{"en":"soft power","ru":"мягкая сила"}],"steps":[{"id":"opening","title":"01 · The Korean Wave in pictures","label":"Visual warm-up · 5 min","minutes":5,"teacherNotes":"Ask the learner to compare concrete images, rather than list celebrities. Photo credits included under images. Target speaking: whereas, compared with, because. Existing warm1/warm2 fields remain stable.","html":"\u003cp class=\"kw-kicker\">See · compare · discuss\u003c/p>\u003cp class=\"kw-lead\">Three photos, three different ways a culture can travel. Which one do you know most about—and which one would you explore?\u003c/p>\n\u003cdiv class=\"kw-gallery\">\n\u003cfigure class=\"kw-picture\">\u003cspan class=\"kw-tag\">01 · MUSIC\u003c/span>\u003cimg src=\"https://upload.wikimedia.org/wikipedia/commons/3/39/BTS_in_concert_at_Wembley_Stadium%2C_2_June_2019_02.jpg\" alt=\"BTS performing at Wembley Stadium in 2019\" loading=\"eager\" width=\"640\" height=\"360\">\u003cfigcaption>\u003cb>A concert beyond Korea\u003c/b>Music connects a global fanbase.\u003c/figcaption>\u003c/figure>\n\u003cfigure class=\"kw-picture\">\u003cspan class=\"kw-tag\">02 · FOOD\u003c/span>\u003cimg src=\"https://upload.wikimedia.org/wikipedia/commons/2/2f/Tteokbokki_Bunsik_Korean_food_01.jpg\" alt=\"A plate of Korean tteokbokki rice cakes\" loading=\"eager\" width=\"467\" height=\"600\">\u003cfigcaption>\u003cb>A local taste goes global\u003c/b>Would you try tteokbokki?\u003c/figcaption>\u003c/figure>\n\u003cfigure class=\"kw-picture\">\u003cspan class=\"kw-tag\">03 · CITY\u003c/span>\u003cimg src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/Hongdae_Street.jpg/640px-Hongdae_Street.jpg\" alt=\"Crowded Hongdae street in Seoul\" loading=\"eager\" width=\"640\" height=\"411\">\u003cfigcaption>\u003cb>Everyday life in Seoul\u003c/b>What can we learn beyond pop culture?\u003c/figcaption>\u003c/figure>\n\u003c/div>\n\u003cdiv class=\"kw-think\">\u003cstrong>Talk it through\u003c/strong>\u003cp>Which photo best represents Korea's cultural influence? How might someone discover Korean culture without ever visiting the country?\u003c/p>\u003c/div>\n\u003cdiv class=\"kw-question\">\u003cstrong>1. Your first encounter with Korean culture\u003c/strong>\u003ctextarea data-exercise-field=\"kwphoto1\" placeholder=\"I first discovered… / What caught my attention was…\">\u003c/textarea>\u003c/div>\n\u003cdiv class=\"kw-question\">\u003cstrong>2. Compare two of the pictures using whereas, although or unlike.\u003c/strong>\u003ctextarea data-exercise-field=\"kwphoto2\" placeholder=\"Unlike…, … / Although both…, …\">\u003c/textarea>\u003c/div>\u003cdetails class=\"kw-credits\">\u003csummary>Photo credits &amp; licences\u003c/summary>\u003cp>\u003ca href=\"https://commons.wikimedia.org/wiki/File:BTS_in_concert_at_Wembley_Stadium,_2_June_2019_02.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">BTS at Wembley · NenehTrainer · CC BY 3.0\u003c/a> (no changes apart from browser cropping); \u003ca href=\"https://commons.wikimedia.org/wiki/File:Tteokbokki_Bunsik_Korean_food_01.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Tteokbokki · Hankook12 · CC0\u003c/a>; \u003ca href=\"https://commons.wikimedia.org/wiki/File:Hongdae_Street.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Hongdae · Minseong Kim · CC BY-SA 4.0\u003c/a> (browser crop only). \u003ca href=\"https://creativecommons.org/licenses/by/3.0/\" target=\"_blank\" rel=\"noopener noreferrer\">BY 3.0\u003c/a> · \u003ca href=\"https://creativecommons.org/licenses/by-sa/4.0/\" target=\"_blank\" rel=\"noopener noreferrer\">BY-SA 4.0\u003c/a>.\u003c/p>\u003c/details>"},{"id":"language","title":"02 · Watch the Korean Wave, then discuss","label":"Video discussion · 10 min","minutes":10,"teacherNotes":"5m39s PBS NewsHour official video (2024). Watch first, then discuss 2-3 prompts. This is NOT an audio-comprehension or transcription test. Video may require access to YouTube; fallback opens same official clip.","html":"\u003cp class=\"kw-kicker\">Real video · PBS NewsHour · 5:39\u003c/p>\u003cp class=\"kw-lead\">From K-pop concerts to skincare and cinema, a museum exhibit shows how Korean culture became visible around the world. Watch the video and think about its images and ideas. \u003cb>No note-taking test.\u003c/b>\u003c/p>\n\u003cdiv class=\"kw-video-frame\">\u003ciframe title=\"PBS NewsHour — From K-pop to skin care, exhibit explores global influence of South Korean culture\" src=\"https://www.youtube-nocookie.com/embed/s48XhclvQBs?rel=0\" allow=\"accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\" loading=\"eager\">\u003c/iframe>\u003c/div>\n\u003cp class=\"kw-video-link\">If the player is unavailable, \u003ca href=\"https://www.youtube.com/watch?v=s48XhclvQBs\" target=\"_blank\" rel=\"noopener noreferrer\">watch the same video on YouTube\u003c/a> or \u003ca href=\"https://www.pbs.org/video/korean-wave-canvas-1721940924/\" target=\"_blank\" rel=\"noopener noreferrer\">open it on PBS\u003c/a>.\u003c/p>\n\u003cdiv class=\"kw-think\">\u003cstrong>Discussion, not a listening test\u003c/strong>\u003col class=\"kw-prompt-list\">\u003cli>Which part of the exhibition would you visit first? Explain why.\u003c/li>\u003cli>Does putting pop culture in a museum make it more meaningful—or turn it into a product?\u003c/li>\u003cli>Can a cultural trend help people understand a country, or can it create new stereotypes?\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"kw-question\">\u003cstrong>My most surprising moment was…\u003c/strong>\u003ctextarea data-exercise-field=\"video1\" placeholder=\"One image/idea that stood out was… because…\">\u003c/textarea>\u003c/div>\n\u003cdiv class=\"kw-question\">\u003cstrong>Something I would ask a visitor / curator…\u003c/strong>\u003ctextarea data-exercise-field=\"video2\" placeholder=\"How could…? / Do you think…?\">\u003c/textarea>\u003c/div>\n\u003cp class=\"kw-source\">Video: \u003ca href=\"https://www.pbs.org/newshour/show/from-k-pop-to-skin-care-art-exhibit-explores-global-influence-of-south-korean-culture\" target=\"_blank\" rel=\"noopener noreferrer\">PBS NewsHour · 25 July 2024\u003c/a>. Report and video are linked, not copied or re-hosted.\u003c/p>"},{"id":"vocabcheck","title":"03 · Say it better: vocabulary in context","label":"Vocabulary · 9 min","minutes":9,"teacherNotes":"8 active expressions. Read example, infer meaning and save. Matching via shared option-picker, answers: kw-mainstream=break into the mainstream, kw-fanbase=global fanbase, kw-authentic=authenticity, kw-stereotype=challenge a stereotype. Ask for one fresh sentence with two expressions.","html":"\u003cp class=\"kw-kicker\">8 useful expressions · word saving + matching\u003c/p>\u003cp class=\"kw-lead\">These words help explain the ideas in the video and the research text that follows. Look at the examples, save unfamiliar expressions, then complete the sentences.\u003c/p>\n\u003cdiv class=\"kw-word-grid\">\u003carticle class=\"kw-word\">\u003cstrong>cultural export\u003c/strong> \u003cbutton type=\"button\" data-lesson-word=\"0\" aria-label=\"Save cultural export to vocabulary\">＋ Save word\u003c/button>\u003cp>music, film or another cultural product enjoyed outside its home country\u003c/p>\u003csmall>A series can become a cultural export.\u003c/small>\u003c/article>\u003carticle class=\"kw-word\">\u003cstrong>break into the mainstream\u003c/strong> \u003cbutton type=\"button\" data-lesson-word=\"1\" aria-label=\"Save break into the mainstream to vocabulary\">＋ Save word\u003c/button>\u003cp>become popular beyond a small group of dedicated fans\u003c/p>\u003csmall>A niche artist can break into the mainstream.\u003c/small>\u003c/article>\u003carticle class=\"kw-word\">\u003cstrong>global fanbase\u003c/strong> \u003cbutton type=\"button\" data-lesson-word=\"2\" aria-label=\"Save global fanbase to vocabulary\">＋ Save word\u003c/button>\u003cp>fans from many different countries\u003c/p>\u003csmall>Streaming helped the band reach a global fanbase.\u003c/small>\u003c/article>\u003carticle class=\"kw-word\">\u003cstrong>adapt for an audience\u003c/strong> \u003cbutton type=\"button\" data-lesson-word=\"3\" aria-label=\"Save adapt for an audience to vocabulary\">＋ Save word\u003c/button>\u003cp>change a work to suit the needs of a particular group\u003c/p>\u003csmall>A studio may adapt a joke for an international audience.\u003c/small>\u003c/article>\u003carticle class=\"kw-word\">\u003cstrong>challenge a stereotype\u003c/strong> \u003cbutton type=\"button\" data-lesson-word=\"4\" aria-label=\"Save challenge a stereotype to vocabulary\">＋ Save word\u003c/button>\u003cp>question an oversimplified belief about a group\u003c/p>\u003csmall>A film can challenge a stereotype about teenagers.\u003c/small>\u003c/article>\u003carticle class=\"kw-word\">\u003cstrong>cultural exchange\u003c/strong> \u003cbutton type=\"button\" data-lesson-word=\"5\" aria-label=\"Save cultural exchange to vocabulary\">＋ Save word\u003c/button>\u003cp>the sharing of cultural ideas in more than one direction\u003c/p>\u003csmall>Collaboration can create cultural exchange.\u003c/small>\u003c/article>\u003carticle class=\"kw-word\">\u003cstrong>authenticity\u003c/strong> \u003cbutton type=\"button\" data-lesson-word=\"6\" aria-label=\"Save authenticity to vocabulary\">＋ Save word\u003c/button>\u003cp>the quality of feeling genuine and true to its origins\u003c/p>\u003csmall>Some fans worry that an adaptation may lose authenticity.\u003c/small>\u003c/article>\u003carticle class=\"kw-word\">\u003cstrong>soft power\u003c/strong> \u003cbutton type=\"button\" data-lesson-word=\"7\" aria-label=\"Save soft power to vocabulary\">＋ Save word\u003c/button>\u003cp>a country's ability to influence others through culture or attraction\u003c/p>\u003csmall>Popular music can become a form of soft power.\u003c/small>\u003c/article>\u003c/div>\n\u003cdiv class=\"kw-think\">\u003cstrong>Match the expressions to the situations.\u003c/strong>\u003cp>Choose the best phrase; your answers are checked automatically.\u003c/p>\u003c/div>\n\u003cdiv class=\"kw-gapline\" data-answer-row>\u003cp>When a song moves beyond a small fandom, it may \u003cselect id=\"kw-mainstream\" data-gap=\"break into the mainstream\" aria-label=\"When a song moves beyond a small fandom, it may\">\u003coption value=\"\">Choose…\u003c/option>\u003coption value=\"challenge a stereotype\">challenge a stereotype\u003c/option>\u003coption value=\"break into the mainstream\">break into the mainstream\u003c/option>\u003coption value=\"adapt for an audience\">adapt for an audience\u003c/option>\u003c/select> \u003c/p>\u003csmall class=\"feedback\" data-grade>\u003c/small>\u003c/div>\u003cdiv class=\"kw-gapline\" data-answer-row>\u003cp>A community of listeners across many countries is a \u003cselect id=\"kw-fanbase\" data-gap=\"global fanbase\" aria-label=\"A community of listeners across many countries is a\">\u003coption value=\"\">Choose…\u003c/option>\u003coption value=\"global fanbase\">global fanbase\u003c/option>\u003coption value=\"soft power\">soft power\u003c/option>\u003coption value=\"cultural exchange\">cultural exchange\u003c/option>\u003c/select> \u003c/p>\u003csmall class=\"feedback\" data-grade>\u003c/small>\u003c/div>\u003cdiv class=\"kw-gapline\" data-answer-row>\u003cp>A series that keeps its local voice may protect its \u003cselect id=\"kw-authentic\" data-gap=\"authenticity\" aria-label=\"A series that keeps its local voice may protect its\">\u003coption value=\"\">Choose…\u003c/option>\u003coption value=\"authenticity\">authenticity\u003c/option>\u003coption value=\"cultural export\">cultural export\u003c/option>\u003coption value=\"soft power\">soft power\u003c/option>\u003c/select> \u003c/p>\u003csmall class=\"feedback\" data-grade>\u003c/small>\u003c/div>\u003cdiv class=\"kw-gapline\" data-answer-row>\u003cp>A story with complex characters can \u003cselect id=\"kw-stereotype\" data-gap=\"challenge a stereotype\" aria-label=\"A story with complex characters can\">\u003coption value=\"\">Choose…\u003c/option>\u003coption value=\"adapt for an audience\">adapt for an audience\u003c/option>\u003coption value=\"challenge a stereotype\">challenge a stereotype\u003c/option>\u003coption value=\"cultural exchange\">cultural exchange\u003c/option>\u003c/select> \u003c/p>\u003csmall class=\"feedback\" data-grade>\u003c/small>\u003c/div>\n\u003cp>\u003cstrong>Speak:\u003c/strong> Explain how a Korean series could \u003cem>break into the mainstream\u003c/em> while keeping its \u003cem>authenticity\u003c/em>.\u003c/p>"},{"id":"reading","title":"04 · Why did Korean culture go global?","label":"Reading · 9 min","minutes":9,"teacherNotes":"Original accessible B2 text based on verified 2026 Yonhap coverage, Georgetown scholarly perspective and V&A history. Do not imply coverage equals number of fans/sales. Focus on fact vs interpretation. Target ~250 words, then 2-minute compare.","html":"\u003cp class=\"kw-kicker\">Real-world research · teen-friendly original text\u003c/p>\n\u003cdiv class=\"kw-case-article\">\u003cfigure class=\"kw-case-photo\">\u003cimg src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/Hongdae_Street.jpg/640px-Hongdae_Street.jpg\" loading=\"lazy\" alt=\"Young people and shoppers on a Seoul street\">\u003cfigcaption>A glimpse of Seoul beyond K-pop · Minseong Kim, CC BY-SA 4.0\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"kw-case-body\">\u003ch3>From BTS to KPop Demon Hunters: Who Shapes the Trend?\u003c/h3>\n\u003cp>Imagine watching an animated movie about a fictional K-pop group, then discovering Korean food, learning a few Korean words, and sharing the soundtrack with friends on the other side of the world. That's how a cultural trend can become a starting point for something much bigger.\u003c/p>\n\u003cp>In February 2026, a South Korean government report examined around \u003cstrong>1.5 million media reports and social posts\u003c/strong> from 30 countries. K-pop attracted more media attention than any other Korean cultural category in every region studied. The report also highlighted \u003cem>KPop Demon Hunters\u003c/em>, an animated hit that mixes K-pop energy with elements of Korean folklore.\u003c/p>\n\u003cp>But attention doesn't automatically mean understanding. A famous series can become a \u003cstrong>cultural export\u003c/strong> and reach a \u003cstrong>global fanbase\u003c/strong>; it cannot show every side of a country. Scholars also warn that expecting one hit to represent an entire culture can reinforce stereotypes instead of challenging them.\u003c/p>\n\u003cp>Influence is rarely one-way. Korean artists have drawn on international hip-hop, pop and cinema, then adapted those influences to local stories and styles. Global fans, in turn, share edits, create dances and develop new communities around them. That's \u003cstrong>cultural exchange\u003c/strong>, not simple copying.\u003c/p>\n\u003cp>The real challenge is balancing international success with \u003cstrong>authenticity\u003c/strong>. How can creators adapt a story for a new audience without making it less distinctive?\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"kw-fact-strip\">\u003cdiv class=\"kw-fact\">\u003cstrong>30 countries\u003c/strong>\u003csmall>covered in the 2025 Korean Wave media report\u003c/small>\u003c/div>\u003cdiv class=\"kw-fact\">\u003cstrong>~1.5m mentions\u003c/strong>\u003csmall>media reports + social posts analysed, not individual fans\u003c/small>\u003c/div>\u003c/div>\n\u003cp class=\"kw-source\">Original learning text adapted from \u003ca href=\"https://en.yna.co.kr/view/AEN20260225002900315\" target=\"_blank\" rel=\"noopener noreferrer\">Yonhap (25 Feb 2026)\u003c/a>, \u003ca href=\"https://www.georgetown.edu/news/how-korean-culture-found-its-way-to-more-screens-and-entered-a-k-pop-golden-era/\" target=\"_blank\" rel=\"noopener noreferrer\">Georgetown University (19 Mar 2026)\u003c/a> and \u003ca href=\"https://www.vam.ac.uk/articles/the-hallyu-origin-story\" target=\"_blank\" rel=\"noopener noreferrer\">V&amp;A Museum\u003c/a>. Statistics represent media attention, not audience size.\u003c/p>\n\u003cdiv class=\"kw-question\">\u003cstrong>What is more important: global reach or authenticity? Give one example from the text.\u003c/strong>\u003ctextarea data-exercise-field=\"readingthought\" placeholder=\"Although…, I believe… because the article mentions…\">\u003c/textarea>\u003c/div>"},{"id":"readingdeep","title":"05 · Read between the lines","label":"Critical reading · 6 min","minutes":6,"type":"choice","instruction":"Select the strongest interpretation of the text. Some distractors sound plausible but are not fully supported. Defend one choice with evidence.","items":[["What can we reasonably conclude from the 1.5 million media posts?",["K-pop gained a large share of international media attention.","Exactly 1.5 million people became K-pop fans.","Most teenagers in all 30 countries watched the same Korean film."],0],["Why does the author describe KPop Demon Hunters and local Korean traditions together?",["To suggest overseas success always destroys traditional culture.","To show a familiar global format can carry locally rooted ideas.","To argue animated films are more authentic than live-action films."],1],["What is the key concern about a single global hit representing a country?",["It may lead people to mistake a small part for the whole culture.","It makes all international collaboration impossible.","It means smaller artists do not exist in Korea."],0],["Which example best supports the article's claim that influence works in both directions?",["An artist using only one country's style and refusing all collaboration.","An overseas viewer purchasing a single poster.","A Korean artist combining global hip-hop influences with a local story and inspiring new fan creations."],2]],"teacherNotes":"Key [0,1,0,2]. Challenge overgeneralizations. Note 1.5m mentions ≠ 1.5m fans. Ask learner to underline one sentence of evidence from reading for each answer."},{"id":"film","title":"06 · Sound more B2: contrast & nuance","label":"Language focus · 6 min","minutes":6,"type":"gap","instruction":"Choose the linking expression that makes each argument accurate and grammatically natural. Then say one new sentence about Korean culture.","items":[["___ Korean series have a global audience, they can still tell distinctly local stories.",["Although","Despite","Because of"],0],["___ its international popularity, a single show cannot represent all Korean people.",["Although","Despite","Whereas"],1],["Korean artists may borrow global styles, ___ they often reshape them for local audiences.",["therefore","whereas","yet"],2],["Music can attract new fans; ___, it does not automatically teach them everything about a country.",["however","despite","unless"],0]],"teacherNotes":"Answers [0,1,2,0]. Discuss Although + clause vs Despite + noun. Ask for natural spoken contrast, not a memorized rule."},{"id":"finish","title":"07 · Choose your Korean culture night","label":"Creative choice · 5 min","minutes":5,"teacherNotes":"This is a choice and a brief reason, NOT a 60-second presentation or long written project. Student must use two vocabulary items and one contrast linker. Verify prior field values are preserved under existing progress key.","html":"\u003cp class=\"kw-kicker\">Quick decision · creative speaking\u003c/p>\u003cp class=\"kw-lead\">Your school is planning a Korean culture night for students who have never explored Korean culture before. You can choose \u003cstrong>one main activity\u003c/strong>. Which will create real cultural exchange rather than just clicks?\u003c/p>\n\u003cdiv class=\"kw-lineup\">\n\u003cdiv class=\"kw-lineup-card\">\u003cimg src=\"https://upload.wikimedia.org/wikipedia/commons/3/39/BTS_in_concert_at_Wembley_Stadium%2C_2_June_2019_02.jpg\" loading=\"lazy\" alt=\"BTS concert stage\">\u003cdiv>\u003cstrong>A · Music &amp; dance\u003c/strong>\u003cp>A concert-inspired showcase with fan-made dance performances.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"kw-lineup-card\">\u003cimg src=\"https://upload.wikimedia.org/wikipedia/commons/2/2f/Tteokbokki_Bunsik_Korean_food_01.jpg\" loading=\"lazy\" alt=\"Korean tteokbokki dish\">\u003cdiv>\u003cstrong>B · Food &amp; stories\u003c/strong>\u003cp>A street-food tasting with the stories behind each dish.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"kw-lineup-card\">\u003cimg src=\"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/Hongdae_Street.jpg/640px-Hongdae_Street.jpg\" loading=\"lazy\" alt=\"Seoul street scene\">\u003cdiv>\u003cstrong>C · Culture beyond trends\u003c/strong>\u003cp>Short film clips, neighbourhood stories and a Q&amp;A with young people in Korea.\u003c/p>\u003c/div>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"kw-question\">\u003cstrong>Which would you choose?\u003c/strong>\u003cselect data-exercise-field=\"kwfestivalchoice\" aria-label=\"Choose your cultural event\">\u003coption value=\"\">Choose A, B or C…\u003c/option>\u003coption value=\"A\">A · Music &amp; dance\u003c/option>\u003coption value=\"B\">B · Food &amp; stories\u003c/option>\u003coption value=\"C\">C · Culture beyond trends\u003c/option>\u003c/select>\u003c/div>\n\u003cdiv class=\"kw-question\">\u003cstrong>Defend your choice: two target expressions + one contrast linker.\u003c/strong>\u003ctextarea data-exercise-field=\"kwfestivalwhy\" placeholder=\"Although option A might attract a global fanbase, I would choose… because…\">\u003c/textarea>\u003c/div>\n\u003cdiv class=\"kw-expression\">\u003cspan>Although…\u003c/span>\u003cspan>Whereas…\u003c/span>\u003cspan>What makes it authentic is…\u003c/span>\u003cspan>It could challenge the stereotype that…\u003c/span>\u003c/div>\n\u003cdiv class=\"kw-think\">\u003cstrong>Exit question\u003c/strong>\u003cp>Is the Korean Wave mostly about cultural exports or cultural exchange? Give one example from today's video or reading.\u003c/p>\u003c/div>\n\u003cdetails class=\"kw-credits\">\u003csummary>Photo credits &amp; licences\u003c/summary>\u003cp>\u003ca href=\"https://commons.wikimedia.org/wiki/File:BTS_in_concert_at_Wembley_Stadium,_2_June_2019_02.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">BTS at Wembley · NenehTrainer · CC BY 3.0\u003c/a> (no changes apart from browser cropping); \u003ca href=\"https://commons.wikimedia.org/wiki/File:Tteokbokki_Bunsik_Korean_food_01.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Tteokbokki · Hankook12 · CC0\u003c/a>; \u003ca href=\"https://commons.wikimedia.org/wiki/File:Hongdae_Street.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Hongdae · Minseong Kim · CC BY-SA 4.0\u003c/a> (browser crop only). \u003ca href=\"https://creativecommons.org/licenses/by/3.0/\" target=\"_blank\" rel=\"noopener noreferrer\">BY 3.0\u003c/a> · \u003ca href=\"https://creativecommons.org/licenses/by-sa/4.0/\" target=\"_blank\" rel=\"noopener noreferrer\">BY-SA 4.0\u003c/a>.\u003c/p>\u003c/details>"}],"durationMinutes":50}</script>
<script src="assets/gostudy-v1-lesson.js"></script><script src="assets/gostudy-sync.js"></script><script src="assets/gostudy-v1-exercises.js"></script><script src="assets/gostudy-v1-workbook.js"></script></body></html>
