      "html": "<p class=\"lead\">Look at both photos. What clues show how music and food might travel? By the end of the lesson, you’ll use two examples to defend a choice about sharing culture.</p><div class=\"kw-photos\"><figure><img src=\"assets/korean-wave/incheon-concert.jpg\" alt=\"Two Red Velvet performers singing under blue lights on a concert stage\"><figcaption><strong>A · Red Velvet at Incheon K-pop Concert, South Korea</strong><br><small><a href=\"https://commons.wikimedia.org/wiki/File:160924_Incheon_Kpop_Concert.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">사요미 / Wikimedia Commons</a> · <a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" rel=\"noopener noreferrer\">CC BY 4.0</a> · resized</small></figcaption></figure><figure><img src=\"assets/korean-wave/korean-corn-dog.jpg\" alt=\"A breaded Korean-style corn dog on a wooden stick\"><figcaption><strong>B · A Korean-style corn dog photographed in the Philippines</strong><br><small><a href=\"https://commons.wikimedia.org/wiki/File:Korean_corn_dog_on_stick.jpg\" target=\"_blank\" rel=\"noopener noreferrer\">Aerous / Wikimedia Commons</a> · <a href=\"https://creativecommons.org/licenses/by-sa/4.0/\" target=\"_blank\" rel=\"noopener noreferrer\">CC BY-SA 4.0</a> · resized</small></figcaption></figure></div><div class=\"question-item\"><label class=\"field-label\" for=\"warm1\">A. Can you enjoy this performance without understanding the lyrics? Which visual clue supports your answer?</label><textarea id=\"warm1\" data-exercise-field=\"warm1\" rows=\"2\" placeholder=\"I think… because I can see…\"></textarea></div><div class=\"question-item\"><label class=\"field-label\" for=\"warm2\">B. What would get you to try this snack first: a friend, a video or a film? Why?</label><textarea id=\"warm2\" data-exercise-field=\"warm2\" rows=\"2\" placeholder=\"For me…\"></textarea></div><details><summary>One more idea to discuss</summary><div class=\"question-item\"><label class=\"field-label\       "html": "<p class=\"lead\">Watch the first 3 minutes of Netflix’s English featurette. Turn on CC if useful. Notice a creative choice you’d keep or change if you were making the film.</p><iframe class=\"kw-video\" src=\"https://www.youtube-nocookie.com/embed/UTAKCFPYdOo?end=180\" title=\"KPop Demon Hunters: Behind the Lore, Songs &amp; K-Culture — Netflix\" loading=\"lazy\" referrerpolicy=\"strict-origin-when-cross-origin\" allow=\"encrypted-media; picture-in-picture; fullscreen\" allowfullscreen></iframe><p><a href=\"https://www.youtube.com/watch?v=UTAKCFPYdOo\" target=\"_blank\" rel=\"noopener noreferrer\">Open the official video on YouTube</a> · Stop at 3:00 there.</p><ol><li>Would the film lose some of its identity if it used generic fantasy creatures instead of Korean folklore? Why?</li><li>What would draw a teen who has never heard K-pop into this film: the music, the humour or the fantasy? Defend your choice.</li><li>If the producers wanted to reach more viewers abroad, what detail should they protect and what could they adapt?</li></ol><div class=\"question-item\"><label class=\"field-label\" for=\"video-opinion\">Pick two questions to discuss. Jot down your strongest reason.</label><textarea id=\"video-opinion\" data-exercise-field=\"video-opinion\" rows=\"2\" placeholder=\"I’d keep… because…\"></textarea></div><details><summary>Discussion starter if the video is unavailable</summary><p>The film combines a K-pop girl group, an animated fantasy adventure and ideas from Korean folklore. Imagine a studio pitching that mix to a friend who rarely watches K-pop videos.</p><p><a href=\"https://about.netflix.com/en/news/creative-asia-biff-2025\" target=\"_blank\" rel=\"noopener noreferrer\">Read about Maggie Kang’s creative choices on Netflix</a></p></details>",

      "teacherNotes": "Allow 4 minutes to read. Ask which detail is local and which device opens the story to outsiders. Use the remaining time for matching and two transfer gaps. Secure meaning, then let the learner save personally useful words.",
      "html": "<p class=\"lead\">Read the three short sections. Find one choice that helps a story travel and one detail that keeps it rooted in a place.</p><article class=\"article\"><h3>A · A Korean story on a global stage</h3><p>At the 2020 Oscars, Bong Joon Ho’s Parasite won Best Picture. The film follows two families in Seoul whose lives are shaped by very different levels of wealth. Details such as a basement flat and a house high above the street make that gap visible. Viewers elsewhere might recognise the inequality even if the city is unfamiliar. Subtitles help the dialogue travel while viewers still hear the original performances.</p><h3>B · A film that mixes traditions</h3><p>KPop Demon Hunters starts with a different kind of exchange. The animated film combines the world of K-pop idols with Korean folklore. The team worked with K-pop producers and choreographers to build convincing performances. An international audience may enter through the music or comedy, while Korean details give the fantasy its own personality. The original soundtrack gives fans something they can share even before a friend sees the film.</p><h3>C · When the audience joins in</h3><p>Imagine a teen sharing a dance cover and teaching a friend one Korean phrase from the song. The artist has a new listener and the teen has created a version of the dance for their own community. That can become cultural exchange. Still, a global fanbase can create pressure to appeal to everyone. A helpful subtitle can open a door, whereas replacing every unfamiliar detail might leave little to discover. A hit can challenge a stereotype, but one story can only represent part of a country.</p></article><p class=\"tiny\">Original classroom reading. Sources: <a href=\"https://www.oscars.org/oscars/ceremonies/2020\" target=\"_blank\" rel=\"noopener noreferrer\">Academy Awards</a> · <a href=\"https://about.netflix.com/en/news/creative-asia-biff-2025\" target=\"_blank\" rel=\"noopener noreferrer\">Netflix creator interview</a>.</p><h3>Match the phrase to its meaning</h3><p>Use each phrase once. Then complete the two new examples.</p><div class=\"gap-item unified-gap\"><label for=\"match-folklore\">Traditional stories and beliefs</label> <select id=\"match-folklore\" aria-label=\"Traditional stories and beliefs\" data-gap=\"folklore\"><option value=\"\">Choose…</option><option>global fanbase</option><option>folklore</option><option>cultural exchange</option><option>original soundtrack</option></select><small class=\"feedback\"></small></div><div class=\"gap-item unified-gap\"><label for=\"match-soundtrack\">Music written for a film</label> <select id=\"match-soundtrack\" aria-label=\"Music written for a film\" data-gap=\"original soundtrack\"><option value=\"\">Choose…</option><option>global fanbase</option><option>folklore</option><option>cultural exchange</option><option>original soundtrack</option></select><small class=\"feedback\"></small></div><div class=\"gap-item unified-gap\"><label for=\"match-fanbase\">Supporters in many countries</label> <select id=\"match-fanbase\" aria-label=\"Supporters in many countries\" data-gap=\"global fanbase\"><option value=\"\">Choose…</option><option>global fanbase</option><option>folklore</option><option>cultural exchange</option><option>original soundtrack</option></select><small class=\"feedback\"></small></div><div class=\"gap-item unified-gap\"><label for=\"match-exchange\">Ideas and practices shared in both directions</label> <select id=\"match-exchange\" aria-label=\"Ideas and practices shared in both directions\" data-gap=\"cultural exchange\"><option value=\"\">Choose…</option><option>global fanbase</option><option>folklore</option><option>cultural exchange</option><option>original soundtrack</option></select><small class=\"feedback\"></small></div><div class=\"gap-item unified-gap\"><label for=\"gap-folklore\">The tiger in the animated story was inspired by ___.</label> <select id=\"gap-folklore\" aria-label=\"The tiger in the animated story was inspired by ___.\" data-gap=\"folklore\"><option value=\"\">Choose…</option><option>global fanbase</option><option>folklore</option><option>cultural exchange</option><option>original soundtrack</option></select><small class=\"feedback\"></small></div><div class=\"gap-item unified-gap\"><label for=\"gap-soundtrack\">She downloaded the film’s ___ to hear the songs again.</label> <select id=\"gap-soundtrack\" aria-label=\"She downloaded the film’s ___ to hear the songs again.\" data-gap=\"original soundtrack\"><option value=\"\">Choose…</option><option>global fanbase</option><option>folklore</option><option>cultural exchange</option><option>original soundtrack</option></select><small class=\"feedback\"></small></div><details><summary>Word bank · save phrases to your dictionary</summary><div class=\"vocab\"><article><b>cultural export</b> <button type=\"button\" data-lesson-word=\"0\" aria-label=\"Save cultural export to vocabulary\">＋ Save word</button><p>a film, song or trend that becomes popular outside its home country</p><span class=\"tiny\">Korean dramas are a major cultural export.</span></article><article><b>break into the mainstream</b> <button type=\"button\" data-lesson-word=\"1\" aria-label=\"Save break into the mainstream to vocabulary\">＋ Save word</button><p>become popular with the general public</p><span class=\"tiny\">A niche series can break into the mainstream.</span></article><article><b>global fanbase</b> <button type=\"button\" data-lesson-word=\"2\" aria-label=\"Save global fanbase to vocabulary\">＋ Save word</button><p>fans from many different countries</p><span class=\"tiny\">A global fanbase can make a local artist famous.</span></article><article><b>adapt for an audience</b> <button type=\"button\" data-lesson-word=\"3\" aria-label=\"Save adapt for an audience to vocabulary\">＋ Save word</button><p>change something to suit a particular group</p><span class=\"tiny\">Studios sometimes adapt for an audience.</span></article><article><b>challenge a stereotype</b> <button type=\"button\" data-lesson-word=\"4\" aria-label=\"Save challenge a stereotype to vocabulary\">＋ Save word</button><p>question an oversimplified belief about a group</p><span class=\"tiny\">The film may challenge a stereotype.</span></article><article><b>cultural exchange</b> <button type=\"button\" data-lesson-word=\"5\" aria-label=\"Save cultural exchange to vocabulary\">＋ Save word</button><p>a two-way sharing of ideas and traditions</p><span class=\"tiny\">Cultural exchange works in both directions.</span></article><article><b>authenticity</b> <button type=\"button\" data-lesson-word=\"6\" aria-label=\"Save authenticity to vocabulary\">＋ Save word</button><p>the quality of feeling genuine rather than artificially created</p><span class=\"tiny\">Fans often value a singer's authenticity.</span></article><article><b>influence</b> <button type=\"button\" data-lesson-word=\"7\" aria-label=\"Save influence to vocabulary\">＋ Save word</button><p>an effect on the way people think or act</p><span class=\"tiny\">Social media has a strong influence on trends.</span></article><article><b>folklore</b> <button type=\"button\" data-lesson-word=\"8\" aria-label=\"Save folklore to vocabulary\">＋ Save word</button><p>traditional stories and beliefs passed down in a community</p><span class=\"tiny\">The creators draw on Korean folklore.</span></article><article><b>original soundtrack</b> <button type=\"button\" data-lesson-word=\"9\" aria-label=\"Save original soundtrack to vocabulary\">＋ Save word</button><p>music created for a film or show</p><span class=\"tiny\">The original soundtrack mixes pop and film music.</span></article></div></details>"

      "html": "<p class=\"lead\">Give the other side a fair point before defending your own.</p><div class=\"tip\"><p><strong>Although + clause:</strong> Although a title can be hard to translate, keeping its original wording can start a conversation.</p><p><strong>Whereas + clause:</strong> A dub changes what we hear, whereas subtitles let us hear the original actors.</p><p><strong>From my perspective, …</strong> introduces a position. <strong>I see your point. However, …</strong> responds to a different view.</p></div><div class=\"gap-item unified-gap\"><label for=\"contrast-linker\">___ dubbing can help younger viewers, I would keep the original voices for this event.</label> <select id=\"contrast-linker\" aria-label=\"___ dubbing can help younger viewers, I would keep the original voices for this event.\" data-gap=\"Although\"><option value=\"\">Choose…</option><option>Although</option><option>However</option><option>In my view</option></select><small class=\"feedback\"></small></div><div class=\"question-item\"><label class=\"field-label\" for=\"contrast-rewrite\">Join these ideas using whereas: A dance cover is easy to share. Its cultural references may be harder to explain.</label><textarea id=\"contrast-rewrite\" data-exercise-field=\"contrast-rewrite\" rows=\"2\" placeholder=\"A dance cover…, whereas…\"></textarea></div><p>Say your sentence. Your partner disagrees. Respond with “I see your point. However, …”.</p>",

      "html": "<div class=\"tip\"><strong>You run your school’s Korean film night.</strong><p>You can screen only one fictional film. The sponsor offers to promote it if you cut a scene that might confuse viewers unfamiliar with Korea. Do you accept, refuse or negotiate a different edit?</p></div><div class=\"case-column\"><section class=\"material-card\"><strong>Option A · Seoul After Dark</strong><p>A glossy music drama with a global pop soundtrack. Easy to follow; a familiar story.</p></section><section class=\"material-card\"><strong>Option B · Our Grandmother's Recipe</strong><p>A quieter family story full of Korean traditions. It may require more cultural context.</p></section><section class=\"material-card\"><strong>Option C · Two Cities</strong><p>A Korean–international co-production about friendship and identity. Several languages and cultures appear.</p></section></div><div class=\"question-item\"><strong>1. Which film would you choose, and who is your target audience?</strong><select data-exercise-field=\"filmchoice\"><option value=\"\">Choose a film</option><option value=\"A\">A · Seoul After Dark</option><option value=\"B\">B · Our Grandmother's Recipe</option><option value=\"C\">C · Two Cities</option></select><textarea data-exercise-field=\"filmwhy\" placeholder=\"I would choose… because…\"></textarea></div><div class=\"question-item\"><strong>2. What might be lost or gained by adapting it for international viewers?</strong><textarea data-exercise-field=\"filmtradeoff\" placeholder=\"We could gain… but lose…\"></textarea></div><p>Make a 45-second case. Name your film and your decision, use one contrast structure and two target expressions, and support your point with a detail from the video or reading.</p><p><strong>Challenge:</strong> Your partner argues that your choice will cost the event viewers. Respond and offer one way to give the audience context.</p><details><summary>Optional pitch notes and earlier drafts</summary><div class=\"question-item\"><label class=\"field-label\" for=\"pitch1\">What is the title and format of the project?</label><textarea id=\"pitch1\" data-exercise-field=\"pitch1\" rows=\"2\" placeholder=\"My project is called…\"></textarea></div><div class=\"question-item\"><label class=\"field-label\" for=\"pitch2\">What makes it culturally authentic?</label><textarea id=\"pitch2\" data-exercise-field=\"pitch2\" rows=\"2\" placeholder=\"It would reflect…\"></textarea></div><div class=\"question-item\"><label class=\"field-label\" for=\"pitch3\">Which global influence would you include and why?</label><textarea id=\"pitch3\" data-exercise-field=\"pitch3\" rows=\"2\" placeholder=\"I would include… so that…\"></textarea></div><div class=\"question-item\"><label class=\"field-label\" for=\"pitch4\">Which stereotype could it challenge?</label><textarea id=\"pitch4\" data-exercise-field=\"pitch4\" rows=\"2\" placeholder=\"It could challenge…\"></textarea></div></details><div class=\"question-item\"><label class=\"field-label\" for=\"exit\">Exit ticket: Is the Korean Wave more about exporting culture or exchanging ideas? Give one reason.</label><textarea id=\"exit\" data-exercise-field=\"exit\" rows=\"2\" placeholder=\"In my view…\"></textarea></div>",

      "id": "kpop-russia",
      "title": "From Seoul to Russia: K-pop beyond the music",
      "label": "Extended reading, questions & vocabulary · 15 min",
      "html": "<div class=\"article\"><p class=\"lead\"><strong>Reading · Beyond the music:</strong> How does K-pop travel from South Korea to Russia—and what changes along the way?</p><h3>From Seoul to Russia: what fans make of the Korean Wave</h3><p>K-pop is often described as a musical genre, but the Korean Wave is much bigger than a playlist. For many young fans, discovering a group is the beginning of a journey into language, food, fashion, television and online communities. A song may last three minutes, whereas the relationships and interests it creates can continue for years.</p><p>One reason K-pop travels so easily is that fans do not simply consume it: they participate. They make dance covers, translate interviews, explain cultural references and recommend songs to friends. Social media allows a performance filmed in Seoul to reach viewers thousands of kilometres away within hours. However, global popularity does not mean that everyone experiences the music in exactly the same way.</p><p>Russia provides an interesting example. Russian-speaking fans have built online communities in which they discuss new releases, share translations and practise choreography. In some cities, dance-cover teams and fan-organised events offer a way to meet people with similar interests. Korean music can also spark curiosity about learning Korean, trying Korean food or watching Korean dramas. Yet it would be misleading to suggest that all Russian teenagers are K-pop fans: tastes vary widely across regions, ages and social groups.</p><p>The cultural influence also moves in more than one direction. Russian fans interpret lyrics through their own experiences, create local choreography videos and combine Korean pop aesthetics with their personal style. This is cultural exchange rather than a simple copy of another country’s trends. At the same time, some observers worry about unrealistic beauty standards, the pressure to buy merchandise and the intense expectations placed on idols. Admirers may answer that K-pop encourages creativity, discipline and a sense of belonging. Both arguments deserve consideration.</p><p>Perhaps the most interesting question is what happens after the excitement of a viral hit fades. Some listeners move on to a different trend, while others continue studying the language or making friends through fan communities. A global cultural movement matters not only because of how many people watch it, but also because of what they choose to create, question and learn from it.</p></div><section class=\"material-card\"><h3>Reading comprehension · Think and explain</h3><p>Answer in 2–3 sentences. Use details from the text rather than copying whole sentences.</p><div class=\"question-item\"><label class=\"field-label\" for=\"russia-q1\">1. Why does the writer argue that fans are participants rather than passive consumers? Give two examples.</label><textarea id=\"russia-q1\" data-exercise-field=\"russia-q1\" rows=\"3\" maxlength=\"2000\" placeholder=\"Write your answer…\"></textarea></div><div class=\"question-item\"><label class=\"field-label\" for=\"russia-q2\">2. What are two ways K-pop has influenced some Russian-speaking fans?</label><textarea id=\"russia-q2\" data-exercise-field=\"russia-q2\" rows=\"3\" maxlength=\"2000\" placeholder=\"Write your answer…\"></textarea></div><div class=\"question-item\"><label class=\"field-label\" for=\"russia-q3\">3. Why does the text warn against assuming that every Russian teenager follows K-pop?</label><textarea id=\"russia-q3\" data-exercise-field=\"russia-q3\" rows=\"3\" maxlength=\"2000\" placeholder=\"Write your answer…\"></textarea></div><div class=\"question-item\"><label class=\"field-label\" for=\"russia-q4\">4. Explain the difference between cultural export and cultural exchange using an example from the text.</label><textarea id=\"russia-q4\" data-exercise-field=\"russia-q4\" rows=\"3\" maxlength=\"2000\" placeholder=\"Write your answer…\"></textarea></div><div class=\"question-item\"><label class=\"field-label\" for=\"russia-q5\">5. Which concern about K-pop seems most serious to you, and how might a fan respond?</label><textarea id=\"russia-q5\" data-exercise-field=\"russia-q5\" rows=\"3\" maxlength=\"2000\" placeholder=\"Write your answer…\"></textarea></div></section><section class=\"material-card\"><h3>Vocabulary in context · Choose the best word</h3><p>Complete all six sentences. Notice how the vocabulary works in a real cultural context.</p><div class=\"gap-item unified-gap\"><label for=\"russia-gap1\">1. Dance-cover groups can create a sense of ___ among fans.</label> <select id=\"russia-gap1\" data-gap=\"belonging\" aria-label=\"Dance-cover groups can create a sense of ___ among fans.\"><option value=\"\">Choose…</option><option>belonging</option><option>merchandise</option><option>standards</option></select><small class=\"feedback\"></small></div><div class=\"gap-item unified-gap\"><label for=\"russia-gap2\">2. Fans often ___ interviews so more people can understand them.</label> <select id=\"russia-gap2\" data-gap=\"translate\" aria-label=\"Fans often ___ interviews so more people can understand them.\"><option value=\"\">Choose…</option><option>translate</option><option>consume</option><option>fade</option></select><small class=\"feedback\"></small></div><div class=\"gap-item unified-gap\"><label for=\"russia-gap3\">3. A ___ performance can become popular around the world in a few days.</label> <select id=\"russia-gap3\" data-gap=\"viral\" aria-label=\"A ___ performance can become popular around the world in a few days.\"><option value=\"\">Choose…</option><option>viral</option><option>misleading</option><option>passive</option></select><small class=\"feedback\"></small></div><div class=\"gap-item unified-gap\"><label for=\"russia-gap4\">4. Some people worry that idols promote unrealistic beauty ___.</label> <select id=\"russia-gap4\" data-gap=\"standards\" aria-label=\"Some people worry that idols promote unrealistic beauty ___.\"><option value=\"\">Choose…</option><option>standards</option><option>regions</option><option>lyrics</option></select><small class=\"feedback\"></small></div><div class=\"gap-item unified-gap\"><label for=\"russia-gap5\">5. Fans may ___ Korean fashion with their own local styles.</label> <select id=\"russia-gap5\" data-gap=\"combine\" aria-label=\"Fans may ___ Korean fashion with their own local styles.\"><option value=\"\">Choose…</option><option>combine</option><option>pressure</option><option>observe</option></select><small class=\"feedback\"></small></div><div class=\"gap-item unified-gap\"><label for=\"russia-gap6\">6. A fan community can ___ curiosity about another language.</label> <select id=\"russia-gap6\" data-gap=\"spark\" aria-label=\"A fan community can ___ curiosity about another language.\"><option value=\"\">Choose…</option><option>spark</option><option>fade</option><option>copy</option></select><small class=\"feedback\"></small></div></section><div class=\"question-item\"><label class=\"field-label\" for=\"russia-final\">Speaking challenge: Imagine you are organising a Korean culture day in Russia. What would you include to celebrate Korean culture without simply copying it? Use <strong>cultural exchange</strong>, <strong>belonging</strong> and one contrast linker (although / whereas).</label><textarea id=\"russia-final\" data-exercise-field=\"russia-final\" rows=\"3\" maxlength=\"2000\" placeholder=\"I would organise…\"></textarea></div>",
