<body data-finance-live data-preserve-workbook-progress data-classroom-course="feed-b2" data-classroom-lesson="korean-wave-b2-20261118.html" data-vocabulary-import-sources="gostudy-feed-b2-v1 gostudy-feed-b2-02-v1 gostudy-feed-b2-03-v1 gostudy-feed-b2-04-v1" data-translate-engine="google-web-pilot" data-live-script="assets/gostudy-finance-live.js">
<script type="application/json" id="lesson-data">{"title":"Korean Wave: Who Influences Whom?","hero":"Korean Wave: Who Influences Whom?","cabinet":"student-feed-b2.html","footer":"GoStudy · Teen B2 · 50 minutes · No homework assigned","key":"gostudy-feed-b2-korean-wave-20261118-v1","wordsKey":"gostudy-feed-b2-v1","preserve":"cloud","followStudent":false,"lessonWords":[{"en":"cultural export","ru":"культурный экспорт"},{"en":"break into the mainstream","ru":"стать частью массовой культуры"},{"en":"global fanbase","ru":"международная аудитория поклонников"},{"en":"adapt for an audience","ru":"адаптировать для аудитории"},{"en":"challenge a stereotype","ru":"бросить вызов стереотипу"},{"en":"cultural exchange","ru":"культурный обмен"},{"en":"authenticity","ru":"подлинность"},{"en":"influence","ru":"влияние"}],"steps":[{"id":"opening","title":"The Korean wave: what has reached you?","label":"Warm-up · 6 min","html":"\u003cdiv class=\"tip\">\u003cstrong>Quick poll\u003c/strong>\u003cp>Choose one: Korean films, K-pop, K-dramas, food, fashion, gaming or none. What was your first encounter with Korean culture?\u003c/p>\u003c/div>\u003cdiv class=\"question-item\">\u003cstrong>1. Is it possible to enjoy a song without understanding the lyrics? Why?\u003c/strong>\u003ctextarea data-exercise-field=\"warm1\" placeholder=\"I think… because…\">\u003c/textarea>\u003c/div>\u003cdiv class=\"question-item\">\u003cstrong>2. What has more influence on teenagers: friends, social media or films?\u003c/strong>\u003ctextarea data-exercise-field=\"warm2\" placeholder=\"For me…\">\u003c/textarea>\u003c/div>\u003cdiv class=\"question-item\">\u003cstrong>3. Imagine a Korean movie studio invites you to create a film for an international audience. What would you keep distinctly Korean?\u003c/strong>\u003ctextarea data-exercise-field=\"warm3\" placeholder=\"I would keep…\">\u003c/textarea>\u003c/div>"},{"id":"language","title":"8 expressions to talk about culture","label":"Vocabulary · 9 min","html":"\u003cp>Read the expressions. Give your own example using at least three of them.\u003c/p>\u003cdiv class=\"vocab\">\u003carticle>\u003cb>cultural export\u003c/b>\u003cp>a film, song or trend that becomes popular outside its home country\u003c/p>\u003cspan class=\"tiny\">Korean dramas are a major cultural export.\u003c/span>\u003c/article>\u003carticle>\u003cb>break into the mainstream\u003c/b>\u003cp>become popular with the general public\u003c/p>\u003cspan class=\"tiny\">A niche series can break into the mainstream.\u003c/span>\u003c/article>\u003carticle>\u003cb>global fanbase\u003c/b>\u003cp>fans from many different countries\u003c/p>\u003cspan class=\"tiny\">A global fanbase can make a local artist famous.\u003c/span>\u003c/article>\u003carticle>\u003cb>adapt for an audience\u003c/b>\u003cp>change something to suit a particular group\u003c/p>\u003cspan class=\"tiny\">Studios sometimes adapt for an audience.\u003c/span>\u003c/article>\u003carticle>\u003cb>challenge a stereotype\u003c/b>\u003cp>question an oversimplified belief about a group\u003c/p>\u003cspan class=\"tiny\">The film may challenge a stereotype.\u003c/span>\u003c/article>\u003carticle>\u003cb>cultural exchange\u003c/b>\u003cp>a two-way sharing of ideas and traditions\u003c/p>\u003cspan class=\"tiny\">Cultural exchange works in both directions.\u003c/span>\u003c/article>\u003carticle>\u003cb>authenticity\u003c/b>\u003cp>the quality of feeling genuine rather than artificially created\u003c/p>\u003cspan class=\"tiny\">Fans often value a singer's authenticity.\u003c/span>\u003c/article>\u003carticle>\u003cb>influence\u003c/b>\u003cp>an effect on the way people think or act\u003c/p>\u003cspan class=\"tiny\">Social media has a strong influence on trends.\u003c/span>\u003c/article>\u003c/div>\u003cdiv class=\"tip\">\u003cstrong>Language challenge\u003c/strong>\u003cp>What's the difference between cultural exchange and copying another culture? Can an adaptation remain authentic?\u003c/p>\u003c/div>"},{"id":"vocabcheck","title":"Vocabulary in context","label":"Practice · 5 min","type":"gap","instruction":"Choose the expression that best completes each sentence.","items":[["When music becomes popular with people who do not usually follow that genre, it can ___ .",["break into the mainstream","challenge a stereotype","cultural exchange"],0],["A worldwide community of supporters is a ___ .",["cultural export","global fanbase","stereotype"],1],["A filmmaker may change cultural references to ___ .",["adapt for an audience","break into the mainstream","challenge a stereotype"],0],["A story can ___ by showing characters who are more complex than people expect.",["challenge a stereotype","cultural exchange","global fanbase"],0]]},{"id":"reading","title":"Who influences whom?","label":"Reading · 10 min","source":["THE KOREAN WAVE: A TWO-WAY STREET (original classroom text)","Imagine a student in Brazil watching a Korean drama with Portuguese subtitles. A few hours later, a teenager in Seoul shares a dance video inspired by an American hip-hop artist. These two moments tell the same story: culture travels in more than one direction.","South Korean music, television and cinema have found audiences around the world. Online platforms and fan communities make it easier to discover new artists, discuss plot twists and recommend films. Some viewers begin learning Korean; others try foods or explore the history they see on screen. Yet not everyone experiences the same content in the same way.","International success can change the creative industry too. Producers may add subtitles, collaborate with overseas artists or consider what makes a story understandable to viewers with different backgrounds. Some fans welcome these changes; others worry that adapting too much might weaken a work's authenticity.","The influence goes the other way as well. Korean musicians and filmmakers have long interacted with global genres, techniques and storytelling traditions, combining them with local experiences. Calling a successful song or movie either completely 'Korean' or completely 'foreign' misses this exchange.","Popularity does not mean that every Korean teenager likes the same music, or that every Korean film is about the same themes. The most interesting question is not who copied whom. It is how creators transform ideas and what audiences learn when cultures meet."]},{"id":"readingcheck","title":"Read between the lines","label":"Comprehension · 6 min","type":"choice","instruction":"Choose the best answer. Explain your choice before checking.","items":[["What is the central argument?",["Only Korean culture influences the rest of the world.","Cultural influence moves in both directions.","Every Korean artist is influenced by one global genre."],1],["Why do some fans worry about adaptations?",["They might reduce a work's authenticity.","They always make subtitles disappear.","They prevent people from discovering Korean culture."],0],["Which example best illustrates cultural exchange?",["A studio refusing to use subtitles.","An artist combining local storytelling with global musical influences.","Someone assuming all Koreans have the same tastes."],1],["Why does the author mention stereotypes?",["To argue that all Korean entertainment is alike.","To show popularity does not represent an entire country.","To suggest teenagers dislike mainstream culture."],1]]},{"id":"film","title":"A film festival dilemma","label":"Decision lab · 7 min","html":"\u003cdiv class=\"tip\">\u003cstrong>Your mission\u003c/strong>\u003cp>You curate a Korean film night for international students. You can show ONE fictional film. The goal is to spark a meaningful discussion about culture—not just attract clicks.\u003c/p>\u003c/div>\u003cdiv class=\"case-column\">\u003csection class=\"material-card\">\u003cstrong>Option A · Seoul After Dark\u003c/strong>\u003cp>A glossy music drama with a global pop soundtrack. Easy to follow; a familiar story.\u003c/p>\u003c/section>\u003csection class=\"material-card\">\u003cstrong>Option B · Our Grandmother's Recipe\u003c/strong>\u003cp>A quieter family story full of Korean traditions. It may require more cultural context.\u003c/p>\u003c/section>\u003csection class=\"material-card\">\u003cstrong>Option C · Two Cities\u003c/strong>\u003cp>A Korean–international co-production about friendship and identity. Several languages and cultures appear.\u003c/p>\u003c/section>\u003c/div>\u003cdiv class=\"question-item\">\u003cstrong>1. Which film would you choose, and who is your target audience?\u003c/strong>\u003cselect data-exercise-field=\"filmchoice\">\u003coption value=\"\">Choose a film\u003c/option>\u003coption value=\"A\">A · Seoul After Dark\u003c/option>\u003coption value=\"B\">B · Our Grandmother's Recipe\u003c/option>\u003coption value=\"C\">C · Two Cities\u003c/option>\u003c/select>\u003ctextarea data-exercise-field=\"filmwhy\" placeholder=\"I would choose… because…\">\u003c/textarea>\u003c/div>\u003cdiv class=\"question-item\">\u003cstrong>2. What might be lost or gained by adapting it for international viewers?\u003c/strong>\u003ctextarea data-exercise-field=\"filmtradeoff\" placeholder=\"We could gain… but lose…\">\u003c/textarea>\u003c/div>\u003cp>Discuss: Should a film festival focus on entertainment, authenticity or cultural exchange?\u003c/p>"},{"id":"finish","title":"Design the next global hit","label":"Creative pitch · 7 min","html":"\u003cdiv class=\"tip\">\u003cstrong>Final task\u003c/strong>\u003cp>Create a 60-second pitch for a Korean-inspired film, series or music project that would also appeal to teenagers elsewhere. Make the cultural exchange two-way.\u003c/p>\u003c/div>\u003cdiv class=\"question-item\">\u003cstrong>1. Title and format\u003c/strong>\u003ctextarea data-exercise-field=\"pitch1\" placeholder=\"My project is called…\">\u003c/textarea>\u003c/div>\u003cdiv class=\"question-item\">\u003cstrong>2. What makes it culturally authentic?\u003c/strong>\u003ctextarea data-exercise-field=\"pitch2\" placeholder=\"It would reflect…\">\u003c/textarea>\u003c/div>\u003cdiv class=\"question-item\">\u003cstrong>3. Which global influence would you include—and why?\u003c/strong>\u003ctextarea data-exercise-field=\"pitch3\" placeholder=\"I would include… so that…\">\u003c/textarea>\u003c/div>\u003cdiv class=\"question-item\">\u003cstrong>4. Which stereotype could your project challenge?\u003c/strong>\u003ctextarea data-exercise-field=\"pitch4\" placeholder=\"It could challenge…\">\u003c/textarea>\u003c/div>\u003cdiv class=\"tip\">\u003cstrong>Speaking support\u003c/strong>\u003cp>On the one hand… / What makes it stand out is… / I wouldn't want to sacrifice… / My target audience would… / Unlike a typical…\u003c/p>\u003c/div>\u003cp>\u003cstrong>Exit ticket:\u003c/strong> Is the Korean wave more about exporting a culture or exchanging ideas? Use at least three expressions from today's vocabulary.\u003c/p>\u003ctextarea data-exercise-field=\"exit\" placeholder=\"In my view…\">\u003c/textarea>"}]}</script>
