<script type="application/json" id="lesson-data">{"title":"Your First Full Day in Stockholm","cabinet":"student-sweden.html","course":"sweden-a2","level":"Travel in Sweden · A2","key":"gostudy-sweden-a2-02-michael-v1","wordsKey":"gostudy-vocabulary-sweden-a2-v1","preserve":"cloud","durationMinutes":50,"hero":"Your First Full Day in Stockholm","subtitle":"Sweden · Lesson 02","footer":"Travel in Sweden · Lesson 02 · A2","steps":[{"id":"sweden-02-v1-0","title":"01 · Your first morning","minutes":5,"instruction":"SPEAK · 5 min. Tell your teacher about arriving in Sweden. Ask and answer questions in the past and future.","source":["YOU'RE IN STOCKHOLM · It is your first full day. You have your hotel key, a little time and a plan to explore.","SAY · How was your journey? What did you do when you arrived? What are you going to see today?","SUPPORT · Yesterday I… / The weather was… / Today I'm going to…"],"teacherNotes":"5 min. A2 warm-up: elicit two past simple sentences and one 'going to' plan; rephrase naturally."},{"id":"sweden-02-v1-1","title":"02 · Six useful expressions","minutes":7,"instruction":"VOCABULARY · 7 min. Match six phrases and practise them in travel situations.","source":["ACTIVE WORDS · eat in · take away · a receipt · an entrance · around the corner · a forecast","SAY · Can we eat in? / Could I get a receipt, please? / Where's the entrance? / Let's check the forecast."],"type":"match","items":[["eat in",["have food in a café","collect food to go","make dinner at home"],0],["take away",["sit and eat here","buy food to eat somewhere else","book a room"],1],["a receipt",["a paper or digital record of payment","a café entrance","a menu"],0],["an entrance",["a way into a building","a bus ticket","a table by the window"],0],["around the corner",["nearby, after the next turn","on the other side of the city","downstairs"],0],["a forecast",["information about likely weather","a list of café dishes","a city map"],0]],"teacherNotes":"7 min. Six target items, with practical cafe, navigation and weather meanings. Avoid loading extra active words."},{"id":"sweden-02-v1-2","title":"03 · Find your café","minutes":6,"instruction":"READ · 6 min. Read the two options and choose one. Explain your choice.","source":["OPTION A · Fika Corner. It is around the corner from the hotel. You can eat in or take away. Sandwich: 65 SEK. Tea: 30 SEK. The entrance is next to the bookshop.","OPTION B · City Coffee. It is near the museum, 15 minutes away. You can eat in. Sandwich: 80 SEK. Tea: 35 SEK. The entrance is opposite the tram stop.","YOU HAVE 100 SEK AND 40 MINUTES · Which café would you choose? Why? If it starts to rain, does your choice change?"],"type":"choice","items":[["Which café is near the hotel?",["City Coffee","Fika Corner","Both are 15 minutes away"],1],["Where is Fika Corner's entrance?",["Opposite a tram stop","Inside the museum","Next to a bookshop"],2],["Which option includes a sandwich and tea for less than 100 SEK?",["Fika Corner","City Coffee","Neither"],0]],"teacherNotes":"6 min. Three factual checks and a personal choice. Both cafés and prices are fictional for practice."},{"id":"sweden-02-v1-3","title":"04 · A day yesterday, a plan today","minutes":7,"instruction":"GRAMMAR · 7 min. Notice the contrast between Past Simple and 'going to'. Choose the correct forms.","source":["YESTERDAY · I arrived in Stockholm. I walked to the hotel. I had a sandwich.","TODAY · I'm going to visit a museum. We're going to check the weather forecast.","RULE · Past Simple: a finished action in the past. Going to: an intention or plan for the future.","YOUR TURN · Say two things you did yesterday and two things you're going to do today."],"type":"gap","items":[["Yesterday I ___ at the hotel at six.",["arrived","am going to arrive","arrive"],0],["Today I ___ the weather forecast before I go out.",["checked yesterday","am going to check","check yesterday"],1],["She ___ a coffee in the café yesterday.",["has","is going to have","had"],2],["We ___ in the old town this afternoon.",["are going to walk","walked yesterday","was walk"],0]],"teacherNotes":"7 min. Explain form and meaning; avoid teaching exceptions. One pair of personal sentences after practice."},{"id":"sweden-02-v1-4","title":"05 · Listen at the café","minutes":6,"instruction":"LISTENING · 6 min. Listen first without the transcript. Then answer, read the transcript and repeat the polite expressions.","source":["A traveller arrives at Fika Corner, asks to eat in, buys a sandwich and tea, asks for a receipt, then asks about the museum.","LISTEN FOR · Does the traveller eat in or take away? What do they buy? Where is the museum?","AFTER LISTENING · Say three short sentences about what happened. Use Past Simple."],"type":"choice","items":[["Does the traveller eat in?",["Yes","No","The café is closed"],0],["What does the traveller order?",["Soup and juice","A sandwich and tea","Cake and water"],1],["Where is the museum?",["Around the corner","At the station","Inside the hotel"],0]],"teacherNotes":"6 min. Two listens (global gist and details), then short retell. Transcript available after listening via dedicated audio panel."},{"id":"sweden-02-v1-5","title":"06 · At the café: two rounds","minutes":10,"instruction":"ROLEPLAY · 10 min. Order politely, manage a small change and ask for directions. Switch roles.","source":["ROUND 1 · You are a traveller. Ask whether you can eat in, order a sandwich and tea, ask for a receipt and ask where the museum entrance is.","THE TEACHER is the café assistant. Answer clearly. Say the museum entrance is around the corner.","ROUND 2 · Bad news: the café has no sandwiches left. Ask about another option and decide whether to eat in or take away.","USE · Could I…? / Can I…? / I'd like… / Excuse me… / Thanks for your help.","SUCCESS · At least three requests/questions, one response to a problem and a clear final decision."],"teacherNotes":"10 min. 3 min demo and round one, 4 min round two, 3 min feedback and redo. Prioritise independent speaking."},{"id":"sweden-02-v1-6","title":"07 · Plan around the weather","minutes":6,"instruction":"INTEGRATION · 6 min. You have two possible plans. Choose one after checking a fictional weather forecast.","source":["STOCKHOLM FORECAST (fictional) · Morning: rain, 9°C. Afternoon: sunshine, 13°C.","RAIN PLAN · Visit a museum and eat in at a café.","SUNNY PLAN · Walk along the water and take away a drink.","WRITE 3–4 SENTENCES · 'Yesterday I… Today I'm going to… First I'll… If it rains, I'll…'","DISCUSS · Why is your plan good? Ask your teacher one follow-up question."],"type":"write","teacherNotes":"6 min. Check that the learner combines at least two target words and future plans while explaining a choice."},{"id":"sweden-02-v1-7","title":"08 · Can you do it?","minutes":3,"instruction":"WRAP-UP · 3 min. Speak without notes and reflect on one achievement.","source":["FINAL CHALLENGE · 'Yesterday I… Today I'm going to… I can ask for… The café is…'","SELF-CHECK · Can you order and ask for a receipt? Can you explain where a place is? Can you tell a short past story and a future plan?","HOMEWORK · Review the six expressions, read a short city message, and write a café-and-weather plan."],"teacherNotes":"3 min. Assess: request, small problem, directions, 2 past forms, 2 future forms, at least 4 of six target phrases."}]}</script>
