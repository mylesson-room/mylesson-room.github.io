g><p>I suggest using a lighter colour.</p><details><summary>Перевод</summary><p>предлагать; советовать</p></details><button data-add=\"8\" class=\"small-button\">＋ В словарь</button></article><article class=\"word\"><strong>improve</strong><p>How could I improve the composition?</p><details><summary>Перевод</summary><p>улучшать</p></details><button data-add=\"9\" class=\"small-button\">＋ В словарь</button></article><article class=\"word\"><strong>inspired by</strong><p>The design was inspired by a garden.</p><details><summary>Перевод</summary><p>вдохновлённый чем-либо</p></details><button data-add=\"10\" class=\"small-button\">＋ В словарь</button></article><article class=\"word\"><strong>an exhibition</strong><p>Our exhibition opens on Friday.</p><details><summary>Перевод</summary><p>выставка</p></details><button data-add=\"11\" class=\"small-button\">＋ В словарь</button></article></div>")+card("Describe the effect","<p>The red boat attracts your attention first. It is… "+hwChoice("v1","the focal point",["the background","the focal point","a label"])+"</p>"+"<p>The mountains are far behind the people. They are in… "+hwChoice("v2","the background",["the foreground","the background","the label"])+"</p>"+"<p>A bright shape against dark blue will… "+hwChoice("v3","stand out",["stand out","display","suggest"])+"</p>");}
function feedReading(){return card("A picture beside the window","<p>Alex’s art group was preparing an exhibition in a café. Alex wanted to display a mosaic of a fish beside the front window. The small glass pieces looked bright in the morning light, and he thought visitors would notice them immediately.</p><p>His friend Jo had brought a painting of a rainy street. Its dark buildings stood against a pale sky. Jo wanted the window space too because she hoped people walking past would see her painting. The group had one good space and two different ideas.</p><p>Instead of voting immediately, their teacher asked them to move both works around the room. Beside the window, the mosaic caught the light. On the opposite wall, the painting was easier to see from the café tables. Jo realised that a quieter space could encourage people to look at the painting for longer.</p><p>They displayed the mosaic near the window and the painting on the opposite wall. Each artist added a label explaining the idea behind the work. During the exhibition, Jo heard a visitor talking about the street in her painting. She was pleased: the person had noticed the story, not only the colours.</p>")+card("Find the reason","<p>Why did both artists want the window space? "+hwChoice("r1","They wanted people to notice their work",["The other wall was broken","They wanted people to notice their work","The teacher told them to"])+"</p>"+"<p>What helped them decide? "+hwChoice("r2","Trying different positions",["Voting without looking","Making new works","Trying different positions"])+"</p>"+"<p>Why was Jo pleased in the end? "+hwChoice("r3","A visitor noticed the story",["She sold every painting","A visitor noticed the story","Her work replaced the mosaic"])+"</p>");}

function labPicks(){return Array.isArray(state.answers.feedPicks)?state.answers.feedPicks.filter(n=>Number.isInteger(n)&&n>=0&&n<FEED_ITEMS.length).slice(0,3):[];}
function feedLab(){return card("Give helpful feedback","<p><b>Suggestion + -ing:</b> I suggest making the sky lighter.</p><p><b>Why don’t you + verb?</b> Why don’t you move the label?</p><p><b>Comparison:</b> The lighter sky makes the buildings clearer.</p><p>Try giving feedback in three steps: say what works, suggest one change, explain its effect.</p>")+card("Choose the useful sentence","<p>I suggest ___ a shorter title. "+hwChoice("g1","using",["to using","using","use"])+"</p>"+"<p>Why don’t you ___ the mosaic nearer the light? "+hwChoice("g2","move",["moving","moved","move"])+"</p>"+"<p>The new label is ___ to read than the old one. "+hwChoice("g3","easier",["more easier","easiest","easier"])+"</p>"+"<p>Yesterday, Jo ___ her painting to another wall. "+hwChoice("g4","moved",["has move","moved","moving"])+"</p>");}
function feedDebate(){return card("Arrange a mini-gallery","<p>You have three works and three possible places. Discuss the best arrangement.</p><ul><li><b>Glass mosaic:</b> small, colourful and reflective.</li><li><b>Dark street painting:</b> medium-sized, with fine details.</li><li><b>Large paper collage:</b> bright shapes, best seen from a distance.</li></ul><p><b>Places:</b> a bright window, a wall near the tables, and a large wall at the back.</p><p>Give each work a place and a reason. Your partner challenges one choice. Agree on a change.</p><p class='support'>It would work well here because… · I like…, but perhaps… · Why don’t we try…?</p>");}

function installGapChecks(){function check(el){const v=el.value.trim(),ok=norm(v)===norm(el.dataset.gap);el.classList.toggle('correct',!!v&&ok);el.classList.toggle('incorrect',!!v&&!ok);$('#fb-'+el.id).textContent=!v?'':ok?'✓ Верно!':'Попробуйте ещё раз.';}$$('[data-gap]').forEach(el=>{el.addEventListener('blur',()=>check(el));el.addEventListener('change',()=>{state.answers[el.dataset.answer]=el.value;save();check(el);});el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();check(el);}});el.addEventListener('input',()=>{el.classList.remove('correct','incorrect');$('#fb-'+el.id).textContent='';});if(el.value.trim())check(el);});}
function installLesson(){installGapChecks();$$('[data-position]').forEach(b=>b.onclick=()=>{state.answers.position=Number(b.dataset.position);save();render();});$$('[data-feed-pick]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.feedPick),p=labPicks(),at=p.indexOf(i);if(at>=0)p.splice(at,1);else if(p.length<3)p.push(i);else{notify('Выберите не больше трёх видео. Можно снять выделение с другого.');return;}state.answers.feedPicks=p;save();const y=scrollY;render();scrollTo(0,y);});if($('#toggleExplore'))$('#toggleExplore').onclick=()=>{state.answers.explore=!state.answers.explore;save();const y=scrollY;render();scrollTo(0,y);};if($('#resetFeed'))$('#resetFeed').onclick=()=>{state.answers.feedPicks=[];state.answers.explore=false;save();render();};$('#exportBtn').hidden=true;}

function feedback(ci,qi){const id=`q${ci}-${qi}`,v=state.answers[id];if(v===undefined)return;const ok=Number(v)===CLIPS[ci].qs[qi][2];$('#fb-'+id).textContent=ok?'✓ Верно!':'Попробуйте ещё раз. Вернитесь к тексту или аудио.';$$(`[name="${id}"]`).forEach(el=>{el.closest('label').classList.toggle('correct',el.checked&&ok);el.closest('label').classList.toggle('incorrect',el.checked&&!ok);});}

function render(){const p=pages[state.page];$('#pageLabel').textContent=`TRAVEL / ${String(state.page+1).padStart(2,'0')} · ≈ ${p[2]} MIN`;$('#title').textContent=p[0];$('#goal').textContent=p[1];$('#teacherTips').textContent=p[3];$('#counter').textContent=`${state.page+1} / ${pages.length}`;$('#prev').disabled=state.page===0;$('#next').textContent=state.page===7?'Итог ✓':'Далее →';$('#content').innerHTML=[feedWelcome,feedWords,feedReading,feedListening,feedLab,feedDebate,feedWriting,feedFinish][state.page]();$('#nav').innerHTML=pages.map((p,i)=>`<button data-page="${i}" class="${i===state.page?'active':''}"><span>${String(i+1).padStart(2,'0')}</span>${esc(p[0])}</button>`).join('');$$('[data-page]').forEach(b=>b.onclick=()=>go(Number(b.dataset.page)));$$('[data-answer]').forEach(el=>el.oninput=()=>{state.answers[el.dataset.answer]=el.value;save();});$$('[data-can]').forEach(el=>el.onchange=()=>{state.answers[el.dataset.can]=el.checked;save();});$$('[data-add]').forEach(b=>b.onclick=()=>{const w=words[Number(b.dataset.add)];addWord(w[0],w[1]);});$$('[data-q]').forEach(el=>{const [ci,qi]=el.dataset.q.split(':').map(Number);el.onchange=()=>{state.answers[`q${ci}-${qi}`]=Number(el.value);save();feedback(ci,qi);};feedback(ci,qi);});if($('#checkGaps'))$('#checkGaps').onclick=()=>$$('[data-gap]').forEach(el=>{const ok=norm(el.value)===norm(el.dataset.gap);el.classList.toggle('correct',ok);el.classList.toggle('incorrect',!ok);$('#fb-'+el.id).textContent=ok?'✓ Correct.':'Попробуйте ещё раз. Можно открыть таблицу-подсказку.';});if($('#speed'))$('#speed').onchange=e=>$('#lessonAudio').playbackRate=Number(e.target.value);if($('#lessonAudio'))$('#lessonAudio').onerror=()=>notify('Audio unavailable. Open the script to practise together.');installLesson();document.body.classList.toggle('dark',!!state.dark);save();}

function addWord(en,ru){en=en.trim();ru=ru.trim();if(/[а-яё]/i.test(en)&&/[a-z]/i.test(ru)&&!/[а-яё]/i.test(ru)){[en,ru]=[ru,en];}if(!en||!ru){notify('Add a word and its translation.');return false;}const old=state.words.find(w=>norm(w.en)===norm(en));if(old)old.ru=ru;else state.words.push({en,ru});save();notify(old?'Translation updated.':'Word saved ✓');return true;}
function renderWords(){const list=$('#wordList');list.innerHTML=state.words.length?state.words.map((w,i)=>`<div class="dictrow"><div><strong>${esc(w.en)}</strong><p>${esc(w.ru)}</p></div><div><button type="button" class="small-button" data-speak-word>🔊 Прослушать слово</button> <button class="small-button" data-edit="${i}" aria-label="Edit ${esc(w.en)}">Edit</button> <button class="small-button" data-delete="${i}" aria-label="Delete ${esc(w.en)}">✕</button></div></div>`).join(''):'<p class="muted dict-empty">Пока пусто. Выделите слово в уроке или добавьте его выше.</p>';$$('[data-edit]').forEach(b=>b.onclick=()=>{const w=state.words[Number(b.dataset.edit)];manualVersion++;clearTimeout(manualTimer);manualStatus.textContent='';$('#newWord').value=w.en;$('#newMeaning').value=w.ru;$('#newMeaning').focus();});$$('[data-delete]').forEach(b=>b.onclick=()=>{state.words.splice(Number(b.dataset.delete),1);save();renderWords();});}

let manualVersion = 0;
let manualTimer;

function translateWhileTyping(event) {
  clearTimeout(manualTimer);
  const version = ++manualVersion;
  const query = manualWord.value.trim();
  manualMeaning.value = '';
  manualStatus.textContent = '';
  if (!query || event?.isComposing) return;
  const saved = state.words.find(word => norm(word.en) === norm(query))?.ru;
  const immediate = saved || localTranslation(query) || manualCache.get(norm(query));
  if (immediate) {
    manualMeaning.value = immediate;
    return;
  }
  manualStatus.textContent = 'Переводим…';
  manualTimer = setTimeout(async () => {
    try {
      const result = await online(query);
      if (version !== manualVersion || manualWord.value.trim() !== query) return;
      manualCache.set(norm(query), result);
      manualMeaning.value = result;
      manualStatus.textContent = 'Перевод готов. Можно исправить перед сохранением.';
    } catch {
      if (version === manualVersion && manualWord.value.trim() === query) {
        manualStatus.textContent = 'Перевод недоступен. Можно ввести его вручную.';
      }
    }
  }, 300);
}
manualWord.addEventListener('input', translateWhileTyping);

  manualVersion++;
  clearTimeout(manualTimer);
  manualStatus.textContent = '';
});
