<script type="application/json" id="lesson-data">{"title":"A Room That Wasn’t There","cabinet":"student-travel-b2.html","key":"gostudy-travel-b2-03-v1","steps":[{"title":"Arriving after midnight","instruction":"Discuss what you would check first. Then pick the strongest evidence for your booking.","source":["You arrive at a hotel at 00:20. The receptionist says the hotel is full and your reservation was marked as a no-show."],"type":"choice","items":[["What would you show first?",["A screenshot of a hotel review","Your booking confirmation and the message acknowledging your late arrival","A price from another hotel"],1]],"order":null,"hint":"Which documents show what was agreed for your reservation?","id":"original-0"},{"title":"Compare the alternatives","instruction":"Read the three offers and choose the one that fits the traveller’s priorities.","source":["The traveller needs step-free access and must leave by 06:45. She can pay a deposit but wants to avoid extra transport costs.","Riverside: ten-minute taxi, step-free entrance, shuttle at 07:30. The hotel will cover the room but not the taxi.","Central: five-minute walk, step-free entrance, self-checkout, £30 refundable deposit. The original hotel covers the room.","Old Town: two-minute walk, room upstairs with no lift. No deposit.","The front desk closes its cash drawer at midnight. Central still accepts card deposits and can email the receipt. The traveller has a bank card but wants written confirmation before leaving."],"type":"choice","items":[["Which offer meets all her priorities?",["Riverside","Central","Old Town"],1],["Which detail should she confirm before accepting?",["Whether the deposit is refundable and when it is released","Whether Old Town has more reviews","Whether the shuttle serves the airport after 07:30"],0]],"order":null,"hint":"Check the access, checkout and transport details together.","id":"original-1"},{"title":"Phrase the request","instruction":"Match the situation to the most useful sentence.","source":[],"type":"match","items":[["You want the hotel to pay for the alternative room.",["Could you confirm who will cover the cost of the room?","When will the hold be released?","Could you send me the address?"],0],["You want proof of what the receptionist promised.",["Could I see the menu?","Could you put that in writing, please?","Can I pay by card?"],1],["You want to ask about getting your money back.",["Can you confirm the room number?","Could you move my luggage?","When should I expect the refund to come through?"],2]],"order":null,"hint":"Match the speaker’s goal, not just the vocabulary.","id":"original-2"},{"title":"Complete the conversation","instruction":"Choose the phrase that best fits each gap.","type":"gap","items":[["My booking was marked as a ___, but I told you I’d arrive late.",["no-show","refund","deposit"],0,"A no-show is someone recorded as not arriving."],["Could you ___ the cost of the replacement room?",["cover","release","charge back"],0,"Cover a cost means pay for it."],["Would the new hotel put a temporary ___ on my card?",["shift","hold","receipt"],1,"A hold sets funds aside temporarily."],["Could you put the agreement ___ before I leave?",["in writing","on arrival","out of service"],0,"In writing means documented in a message or letter."]],"source":[],"id":"complete-the-conversation"},{"title":"Put the conversation back together","instruction":"Rebuild the exchange from explaining the issue to confirming the agreement.","source":[],"type":"order","items":["Yes. I’ll email you the address and confirm we’re covering the room.","I have a confirmed booking, and I messaged you about arriving late.","Would you be able to move me to a nearby hotel with step-free access?","I see the message. I’m sorry, but we don’t have any rooms left.","Thank you. Could you include the deposit details in the email as well?"],"order":[1,3,2,0,4],"hint":"Find the sentence that introduces the problem and the one that confirms the agreement.","id":"original-3"},{"title":"Read the confirmation email","instruction":"Check what the hotel actually agreed to.","type":"choice","items":[["Who pays the room charge?",["The guest","Central","The original hotel"],2,"The original hotel says it has already arranged payment."],["Which item might temporarily affect the card balance?",["The room charge","The deposit","Breakfast"],1,"Central puts a £30 hold on the card."],["Does the hotel give an exact release date?",["Yes, after exactly three days","Yes, immediately at checkout","No, bank processing times vary"],2,"The hotel only says Central releases the hold at checkout."]],"source":["We’ve arranged and paid for your room at Central Hotel. Central will place a £30 hold on your card at check-in and release it at checkout. The time it takes to appear in your balance depends on your bank.","You can leave the key in the drop box before 06:45. Please keep this email for your records."],"id":"read-the-confirmation-email"},{"title":"Sound firm and polite","instruction":"Choose a response that keeps the conversation moving.","source":["Receptionist: ‘You’ll have to pay the new hotel yourself and contact the booking site tomorrow.’"],"type":"choice","items":[["Which reply is most effective?",["That’s ridiculous. Fix it.","Could you explain why I’m being asked to pay again? My confirmation shows the original room was prepaid.","Never mind, I’ll sort something out."],1]],"order":null,"hint":"Look for a specific question supported by evidence.","id":"original-4"},{"title":"Write a short confirmation","instruction":"Write three sentences confirming where you’ll stay, who pays, and what you need clarified.","type":"write","items":null,"source":["Start with ‘Thanks for arranging the room.’ Keep the tone polite and specific."],"id":"write-a-short-confirmation"},{"title":"Handle a new complication","instruction":"Pick a response, then say it aloud in your own words.","type":"choice","items":[["Central now asks you to pay for the room as well as the deposit. What do you say?",["You must be wrong.","Could you check the booking note? The original hotel confirmed it would cover the room. I’m happy to pay the refundable deposit.","I’ll pay everything and forget about it."],1,"Separate the room charge from the refundable deposit."],["The new hotel offers a room upstairs. What do you ask?",["Could you check whether there’s a step-free route to the room?","Can I cancel my morning plans?","Is the room cheaper?"],0,"Ask directly about the access requirement."]],"source":[],"id":"handle-a-new-complication"},{"title":"Negotiate a solution","instruction":"Role-play the situation for two minutes. Then swap roles and change one condition.","source":["Traveller: show your late-arrival confirmation, explain two priorities and ask for a written agreement.","Receptionist: offer Central first. If the traveller asks about the deposit, say it is released after checkout. In round two, Central is full and you can offer a taxi voucher to Riverside. Work out the early departure together."],"id":"original-5"}],"cover":"assets/gostudy-hotel-night.png","level":"Travel English · B2"}</script><script src="assets/gostudy-sync.js?v=22"></script><script src="assets/gostudy-lesson-room.js?v=2"></script></body></html>
