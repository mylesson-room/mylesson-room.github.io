<script type="application/json" id="lesson-data">{"title":"A Room That Wasn’t There","cabinet":"student-travel-b2.html","key":"gostudy-travel-b2-03-v1","steps":[["Arriving after midnight","Discuss what you would check first. Then pick the strongest evidence for your booking.",["You arrive at a hotel at 00:20. The receptionist says the hotel is full and your reservation was marked as a no-show."],"choice",[["What would you show first?",["A screenshot of a hotel review","Your booking confirmation and the message acknowledging your late arrival","A price from another hotel"],1]],null,"Which documents show what was agreed for your reservation?"],["Compare the alternatives","Read the three offers and choose the one that fits the traveller’s priorities.",["The traveller needs step-free access and must leave by 06:45. She can pay a deposit but wants to avoid extra transport costs.","Riverside: ten-minute taxi, step-free entrance, shuttle at 07:30. The hotel will cover the room but not the taxi.","Central: five-minute walk, step-free entrance, self-checkout, £30 refundable deposit. The original hotel covers the room.","Old Town: two-minute walk, room upstairs with no lift. No deposit."],"choice",[["Which offer meets all her priorities?",["Riverside","Central","Old Town"],1],["Which detail should she confirm before accepting?",["Whether the deposit is refundable and when it is released","Whether Old Town has more reviews","Whether the shuttle serves the airport after 07:30"],0]],null,"Check the access, checkout and transport details together."],["Phrase the request","Match the situation to the most useful sentence.",[],"match",[["You want the hotel to pay for the alternative room.",["Could you confirm who will cover the cost of the room?","When will the hold be released?","Could you send me the address?"],0],["You want proof of what the receptionist promised.",["Could I see the menu?","Could you put that in writing, please?","Can I pay by card?"],1],["You want to ask about getting your money back.",["Can you confirm the room number?","Could you move my luggage?","When should I expect the refund to come through?"],2]],null,"Match the speaker’s goal, not just the vocabulary."],["Put the conversation back together","Rebuild the exchange from explaining the issue to confirming the agreement.",[],"order",["Yes. I’ll email you the address and confirm we’re covering the room.","I have a confirmed booking, and I messaged you about arriving late.","Would you be able to move me to a nearby hotel with step-free access?","I see the message. I’m sorry, but we don’t have any rooms left.","Thank you. Could you include the deposit details in the email as well?"],[1,3,2,0,4],"Find the sentence that introduces the problem and the one that confirms the agreement."],["Sound firm and polite","Choose a response that keeps the conversation moving.",["Receptionist: ‘You’ll have to pay the new hotel yourself and contact the booking site tomorrow.’"],"choice",[["Which reply is most effective?",["That’s ridiculous. Fix it.","Could you explain why I’m being asked to pay again? My confirmation shows the original room was prepaid.","Never mind, I’ll sort something out."],1]],null,"Look for a specific question supported by evidence."],["Negotiate a solution","Role-play the situation for two minutes. Then swap roles and change one condition.",["Traveller: show your late-arrival confirmation, explain two priorities and ask for a written agreement.","Receptionist: offer Central first. If the traveller asks about the deposit, say it is released after checkout. In round two, Central is full and you can offer a taxi voucher to Riverside. Work out the early departure together."]]]}</script><script src="assets/gostudy-sync.js?v=21"></script><script src="assets/gostudy-lesson-room.js"></script></body></html>
