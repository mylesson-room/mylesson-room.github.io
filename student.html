<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Мои уроки · GoStudy</title>
<link rel="stylesheet" href="assets/gostudy-v1-cabinet.css">
<link rel="stylesheet" href="assets/gostudy-private-access.css">
<style>
[data-unified-cabinet] #gostudyAccessGate {margin:56px auto}
[data-unified-cabinet] #gostudyAccessSignout {margin:0}
[data-unified-cabinet] .unified-lessons {margin-top:30px}
[data-unified-cabinet] .unified-lessons h2 {font:700 24px 'Manrope',Arial,sans-serif;margin-bottom:20px}
[data-unified-cabinet] .unified-lesson-grid {display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:20px}
[data-unified-cabinet] .unified-lesson-grid .card {display:block;padding:25px;min-height:185px}
[data-unified-cabinet] .unified-lesson-grid .card h3 {font:800 23px/1.25 'Manrope',Arial,sans-serif;margin:10px 0}
[data-unified-cabinet] .unified-hint {color:#52657f;font-size:15px;line-height:1.5}
[data-unified-cabinet] .unified-status {padding:18px 22px;border-radius:14px;background:#f2f9ff;color:#274764;margin:26px auto;max-width:750px}
[data-unified-cabinet] .unified-status[hidden] {display:none}
[data-unified-cabinet] #assignment[hidden] {display:none!important}
[data-unified-cabinet] .vocab-feature:disabled {opacity:.62;cursor:not-allowed}
@media(max-width:720px){[data-unified-cabinet] .unified-lesson-grid {grid-template-columns:1fr}}
</style>
</head>
<body data-unified-cabinet>
<div id="gostudyAccessGate" role="region" aria-label="Вход в GoStudy">
<h1>Вход в GoStudy</h1>
<form id="gostudyAccessForm">
<label for="gsEmail">Электронная почта</label><input id="gsEmail" name="email" type="email" autocomplete="username" required>
<label for="gsPassword">Пароль</label><input id="gsPassword" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Войти</button>
</form>
<p id="gostudyAccessMessage" role="status">Проверяем доступ…</p>
</div>
<button id="gostudyAccessSignout" type="button" hidden>Выйти</button>
<p id="unified-status" class="unified-status" role="status" hidden></p>
<script src="assets/gostudy-private-access.js" defer></script>
<script src="assets/gostudy-unified-cabinet.js" defer></script>
</body>
</html>
