function feedLab(){return card("Choose the sentence","<p>Yesterday, Lena ___ the opening times. "+hwChoice("g1","didn’t check",["didn’t checked","didn’t check","doesn’t checked"])+"</p>"+"<p>The phone was ___ her jacket. "+hwChoice("g2","under",["across","straight","under"])+"</p>"+"<p>Tomorrow, she ___ her day before leaving. "+hwChoice("g3","is going to plan",["planned","is going to plan","plan yesterday"])+"</p>"+"<p>The museum is ___ the road from the café. "+hwChoice("g4","across",["under","across","in"])+"</p>")+card("Tell it in two times","<p>Say what you did yesterday, then what you’re going to do tomorrow. Use <i>went, bought, asked</i> and <i>going to</i>.</p>");}
function feedDebate(){return card("From the hotel to the museum","<svg viewBox=\"0 0 900 260\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"План улицы с отелем, кафе и музеем\" style=\"display:block;width:100%;border-radius:18px;margin-bottom:20px\"><rect width=\"900\" height=\"260\" fill=\"#e6f2f6\"/><path d=\"M0 156h900v66H0Z\" fill=\"#a4b7c6\"/><path d=\"M450 0v260\" stroke=\"#a4b7c6\" stroke-width=\"70\"/><path d=\"M0 189h900M450 0v260\" stroke=\"#fff\" stroke-width=\"3\" stroke-dasharray=\"14 12\"/><rect x=\"120\" y=\"57\" width=\"130\" height=\"94\" rx=\"8\" fill=\"#6f9bbb\"/><rect x=\"601\" y=\"57\" width=\"130\" height=\"94\" rx=\"8\" fill=\"#d99f76\"/><path d=\"m570 58 97-42 97 42Z\" fill=\"#517a90\"/><rect x=\"299\" y=\"62\" width=\"84\" height=\"89\" rx=\"5\" fill=\"#ddae59\"/><path d=\"M292 62h98l-12-22h-73Z\" fill=\"#a97261\"/><g fill=\"#fff1c7\"><path d=\"M140 77h28v24h-28zm43 0h28v24h-28zm-43 39h28v24h-28zm43 0h28v24h-28z\"/><rect x=\"619\" y=\"77\" width=\"15\" height=\"74\"/><rect x=\"661\" y=\"77\" width=\"15\" height=\"74\"/><rect x=\"704\" y=\"77\" width=\"15\" height=\"74\"/><rect x=\"314\" y=\"79\" width=\"53\" height=\"45\"/></g><path d=\"m67 125 26 25m-26 0 26-25\" stroke=\"#ef8067\" stroke-width=\"7\" stroke-linecap=\"round\"/><text x=\"126\" y=\"242\" fill=\"#315573\" font-size=\"18\" font-family=\"sans-serif\">HOTEL</text><text x=\"296\" y=\"242\" fill=\"#315573\" font-size=\"18\" font-family=\"sans-serif\">CAFÉ</text><text x=\"608\" y=\"242\" fill=\"#315573\" font-size=\"18\" font-family=\"sans-serif\">MUSEUM</text></svg><p>Use the map. You are at the red cross. Explain how to reach the museum. Your partner repeats the directions to check.</p><p class=\"support\">Go straight on. · Cross the road. · It’s on the left/right. · So, I turn… Is that right?</p><p>Round two: ask how to get to the café. Then change roles.</p>");}
function feedWriting(){return card("Lunch and a missing bag","<div class='word-grid'><div class='word'><h3>Customer</h3><p>Order a cheese sandwich and water. Then explain that you cannot find your bag. Describe where you were sitting.</p></div><div class='word'><h3>Waiter</h3><p>Practice prices: sandwich £5, water £1. Ask where the customer last saw the bag. It is under the table by the window.</p></div></div><p class='support'>Could I have…? · How much is that? · I’m looking for… · I was sitting… · Is this yours?</p>");}

function installGapChecks(){function check(el){const v=el.value.trim(),ok=norm(v)===norm(el.dataset.gap);el.classList.toggle('correct',!!v&&ok);el.classList.toggle('incorrect',!!v&&!ok);$('#fb-'+el.id).textContent=!v?'':ok?'✓ Верно!':'Попробуйте ещё раз.';}$$('[data-gap]').forEach(el=>{el.addEventListener('blur',()=>check(el));el.addEventListener('change',()=>{state.answers[el.dataset.answer]=el.value;save();check(el);});el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();check(el);}});el.addEventListener('input',()=>{el.classList.remove('correct','incorrect');$('#fb-'+el.id).textContent='';});if(el.value.trim())check(el);});}
function installLesson(){installGapChecks();$$('[data-position]').forEach(b=>b.onclick=()=>{state.answers.position=Number(b.dataset.position);save();render();});$$('[data-feed-pick]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.feedPick),p=labPicks(),at=p.indexOf(i);if(at>=0)p.splice(at,1);else if(p.length<3)p.push(i);else{notify('Выберите не больше трёх видео. Можно снять выделение с другого.');return;}state.answers.feedPicks=p;save();const y=scrollY;render();scrollTo(0,y);});if($('#toggleExplore'))$('#toggleExplore').onclick=()=>{state.answers.explore=!state.answers.explore;save();const y=scrollY;render();scrollTo(0,y);};if($('#resetFeed'))$('#resetFeed').onclick=()=>{state.answers.feedPicks=[];state.answers.explore=false;save();render();};$('#exportBtn').hidden=true;}

const manualWord = $('#newWord');

const manualCache = new Map();
let manualVersion = 0;
let manualTimer;
manualMeaning.addEventListener('input', () => {
  manualVersion++;

function translateWhileTyping(event) {
  clearTimeout(manualTimer);
  const version = ++manualVersion;
  const query = manualWord.value.trim();
  manualMeaning.value = '';
  manualStatus.textContent = '';
  if (!query || event?.isComposing) return;
  const russian = /[а-яё]/i.test(query);
  const pair = state.words.find(word => norm(russian ? word.ru : word.en) === norm(query));
  const saved = russian ? pair?.en : pair?.ru;
  const immediate = saved || localTranslation(query) || manualCache.get(norm(query));
  if (immediate) {
    manualMeaning.value = immediate;
    return;
  }
  manualStatus.textContent = 'Переводим…';
  manualTimer = setTimeout(async () => {
    try {
      const result = await online(query);
      if (version !== manualVersion || manualWord.value.trim() !== query) return;
      manualCache.set(norm(query), result);
      manualMeaning.value = result;
      manualStatus.textContent = 'Перевод готов. Можно исправить перед сохранением.';
    } catch {
      if (version === manualVersion && manualWord.value.trim() === query) {
        manualStatus.textContent = 'Перевод недоступен. Можно ввести его вручную.';
      }
    }
  }, 300);
}
manualWord.addEventListener('input', translateWhileTyping);
manualWord.addEventListener('compositionend', translateWhileTyping);
$('#wordForm').addEventListener('reset', () => {
  manualVersion++;
  clearTimeout(manualTimer);
  manualStatus.textContent = '';
});
