oud.\u003c/p\u003e\u003col class=\"vnm-questions\"\u003e\u003cli\u003eMy name is…\u003c/li\u003e\u003cli\u003eI am … years old.\u003c/li\u003e\u003cli\u003eI live in…\u003c/li\u003e\u003cli\u003eI work as a…\u003c/li\u003e\u003cli\u003eI have…\u003c/li\u003e\u003cli\u003eMy family is…\u003c/li\u003e\u003cli\u003eIn my free time, I like…\u003c/li\u003e\u003cli\u003eI usually spend my weekends…\u003c/li\u003e\u003cli\u003eMy favourite food is…\u003c/li\u003e\u003cli\u003eI want to visit Vietnam because…\u003c/li\u003e\u003c/ol\u003e\u003cdiv class=\"question-item vnm-write\"\u003e\u003clabel for=\"vnm-intro\"\u003eWrite a short introduction, then say it aloud\u003c/label\u003e\u003ctextarea id=\"vnm-intro\" data-exercise-field=\"vnm-intro\" rows=\"4\" placeholder=\"My name is … I live in …\"\u003e\u003c/textarea\u003e\u003c/div\u003e\u003cdiv class=\"tip\"\u003e\u003cstrong\u003eFollow-up questions\u003c/strong\u003e\u003cp\u003eWhat do you like about your job? · What do you usually do in the evening? · What does your daughter do? · How often do you talk to your daughter? · What do you like doing together?\u003c/p\u003e\u003c/div\u003e\u003ch3\u003eKey words to save\u003c/h3\u003e\u003cdiv class=\"vocab\"\u003e\u003carticle\u003e\u003cb\u003etravel\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"0\" aria-label=\"Save travel to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003eпутешествовать\u003c/p\u003e\u003c/article\u003e\u003carticle\u003e\u003cb\u003eto meet people\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"1\" aria-label=\"Save to meet people to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003eзнакомиться с людьми\u003c/p\u003e\u003c/article\u003e\u003carticle\u003e\u003cb\u003eto spend time\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"2\" aria-label=\"Save to spend time to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003eпроводить время\u003c/p\u003e\u003c/article\u003e\u003carticle\u003e\u003cb\u003efree time\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"3\" aria-label=\"Save free time to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003eсвободное время\u003c/p\u003e\u003c/article\u003e\u003carticle\u003e\u003cb\u003eI am interested in\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"4\" aria-label=\"Save I am interested in to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003eя интересуюсь\u003c/p\u003e\u003c/article\u003e\u003carticle\u003e\u003cb\u003eonce or twice a year\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"5\" aria-label=\"Save once or twice a year to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003eодин или два раза в год\u003c/p\u003e\u003c/article\u003e\u003c/div\u003e"},{"id":"present-simple","title":"03 · Grammar stop: Present Simple","minutes":12,"teacherNotes":"Auto-graded teacher key sourced directly from PDF pp. 10–11. Correct after student finishes speech, not mid-sentence. 8 and 9 require both auxiliary and base verb.","html":"\u003cdiv class=\"vnm-eyebrow\"\u003ePRESENT SIMPLE · FACTS, HABITS AND ROUTINES\u003c/div\u003e\u003cdiv class=\"vnm-grammar\"\u003e\u003cdiv\u003e\u003cb\u003ePositive\u003c/b\u003e\u003cp\u003eI/you/we/they + verb\u003cbr\u003eHe/she/it + verb-s\u003c/p\u003e\u003cp\u003e\u003cem\u003eI live in Russia. She lives in Vietnam.\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cb\u003eNegative\u003c/b\u003e\u003cp\u003eI/you/we/they + don’t + verb\u003cbr\u003eHe/she/it + doesn’t + verb\u003c/p\u003e\u003cp\u003e\u003cem\u003eI don’t travel every month. She doesn’t live in Russia.\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cb\u003eQuestion\u003c/b\u003e\u003cp\u003eDo + I/you/we/they + verb?\u003cbr\u003eDoes + he/she/it + verb?\u003c/p\u003e\u003cp\u003e\u003cem\u003eDo you like travelling? Does your daughter work?\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"tip\"\u003e\u003cstrong\u003eRemember\u003c/strong\u003e\u003cp\u003eAfter \u003cb\u003edoes\u003c/b\u003e and \u003cb\u003edoesn’t\u003c/b\u003e, use the base form: “Does she work?” — not “works”. Frequency: always, usually, often, sometimes, rarely, never; every day, at weekends.\u003c/p\u003e\u003c/div\u003e\u003ch3\u003eExercise 1 · Fill in the gaps (10 sentences)\u003c/h3\u003e\u003cdiv class=\"gap-item vnm-gap\" data-answer-row\u003e\u003clabel for=\"vnm-g1-0\"\u003e1. I usually ______ (get up) at 7 o’clock.\u003c/label\u003e\u003cinput id=\"vnm-g1-0\" data-exercise-field=\"vnm-g1-0\" data-expected=\"get up\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Type the missing word(s)\"\u003e\u003csmall data-grade class=\"feedback\"\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"gap-item vnm-gap\" data-answer-row\u003e\u003clabel for=\"vnm-g1-1\"\u003e2. My daughter ______ (live) in Vietnam.\u003c/label\u003e\u003cinput id=\"vnm-g1-1\" data-exercise-field=\"vnm-g1-1\" data-expected=\"lives\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Type the missing word(s)\"\u003e\u003csmall data-grade class=\"feedback\"\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"gap-item vnm-gap\" data-answer-row\u003e\u003clabel for=\"vnm-g1-2\"\u003e3. I ______ (like) travelling.\u003c/label\u003e\u003cinput id=\"vnm-g1-2\" data-exercise-field=\"vnm-g1-2\" data-expected=\"like\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Type the missing word(s)\"\u003e\u003csmall data-grade class=\"feedback\"\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"gap-item vnm-gap\" data-answer-row\u003e\u003clabel for=\"vnm-g1-3\"\u003e4. She ______ (work) five days a week.\u003c/label\u003e\u003cinput id=\"vnm-g1-3\" data-exercise-field=\"vnm-g1-3\" data-expected=\"works\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Type the missing word(s)\"\u003e\u003csmall data-grade class=\"feedback\"\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"gap-item vnm-gap\" data-answer-row\u003e\u003clabel for=\"vnm-g1-4\"\u003e5. We ______ (talk) on the phone every day.\u003c/label\u003e\u003cinput id=\"vnm-g1-4\" data-exercise-field=\"vnm-g1-4\" data-expected=\"talk\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Type the missing word(s)\"\u003e\u003csmall data-grade class=\"feedback\"\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"gap-item vnm-gap\" data-answer-row\u003e\u003clabel for=\"vnm-g1-5\"\u003e6. My daughter ______ (not / speak) Russian at work.\u003c/label\u003e\u003cinput id=\"vnm-g1-5\" data-exercise-field=\"vnm-g1-5\" data-expected=\"doesnundefinedt speak\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Type the missing word(s)\"\u003e\u003csmall data-grade class=\"feedback\"\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"gap-item vnm-gap\" data-answer-row\u003e\u003clabel for=\"vnm-g1-6\"\u003e7. I ______ (not / travel) very often.\u003c/label\u003e\u003cinput id=\"vnm-g1-6\" data-exercise-field=\"vnm-g1-6\" data-expected=\"donundefinedt travel\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Type the missing word(s)\"\u003e\u003csmall data-grade class=\"feedback\"\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"gap-item vnm-gap\" data-answer-row\u003e\u003clabel for=\"vnm-g1-7\"\u003e8a. ______ you … (like) Asian food? (auxiliary verb)\u003c/label\u003e\u003cinput id=\"vnm-g1-7\" data-exercise-field=\"vnm-g1-7\" data-expected=\"Do\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Type the missing word(s)\"\u003e\u003csmall data-grade class=\"feedback\"\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"gap-item vnm-gap\" data-answer-row\u003e\u003clabel for=\"vnm-g1-8\"\u003e8b. Do you ______ (like) Asian food? (main verb)\u003c/label\u003e\u003cinput id=\"vnm-g1-8\" data-exercise-field=\"vnm-g1-8\" data-expected=\"like\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Type the missing word(s)\"\u003e\u003csmall data-grade class=\"feedback\"\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"gap-item vnm-gap\" data-answer-row\u003e\u003clabel for=\"vnm-g1-9\"\u003e9a. ______ your daughter … (live) near the sea? (auxiliary verb)\u003c/label\u003e\u003cinput id=\"vnm-g1-9\" data-exercise-field=\"vnm-g1-9\" data-expected=\"Does\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Type the missing word(s)\"\u003e\u003csmall data-grade class=\"feedback\"\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"gap-item vnm-gap\" data-answer-row\u003e\u003clabel for=\"vnm-g1-10\"\u003e9b. Does your daughter ______ (live) near the sea? (main verb)\u003c/label\u003e\u003cinput id=\"vnm-g1-10\" data-exercise-field=\"vnm-g1-10\" data-expected=\"live\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Type the missing word(s)\"\u003e\u003csmall data-grade class=\"feedback\"\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"gap-item vnm-gap\" data-answer-row\u003e\u003clabel for=\"vnm-g1-11\"\u003e10. She ______ (enjoy) spending time with friends.\u003c/label\u003e\u003cinput id=\"vnm-g1-11\" data-exercise-field=\"vnm-g1-11\" data-expected=\"enjoys\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Type the missing word(s)\"\u003e\u003csmall data-grade class=\"feedback\"\u003e\u003c/small\u003e\u003c/div\u003e\u003ch3\u003eExercise 2 · Make negative sentences\u003c/h3\u003e\u003cdiv class=\"gap-item vnm-gap\" data-answer-row\u003e\u003clabel for=\"vnm-g2-0\"\u003e1. I work at weekends.\u003c/label\u003e\u003cinput id=\"vnm-g2-0\" data-exercise-field=\"vnm-g2-0\" data-expected=\"I donundefinedt work at weekends.\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Type the missing word(s)\"\u003e\u003csmall data-grade class=\"feedback\"\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"gap-item vnm-gap\" data-answer-row\u003e\u003clabel for=\"vnm-g2-1\"\u003e2. My daughter lives in Moscow.\u003c/label\u003e\u003cinput id=\"vnm-g2-1\" data-exercise-field=\"vnm-g2-1\" data-expected=\"My daughter doesnundefinedt live in Moscow.\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Type the missing word(s)\"\u003e\u003csmall data-grade class=\"feedback\"\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"gap-item vnm-gap\" data-answer-row\u003e\u003clabel for=\"vnm-g2-2\"\u003e3. I like cold weather.\u003c/label\u003e\u003cinput id=\"vnm-g2-2\" data-exercise-field=\"vnm-g2-2\" data-expected=\"I donundefinedt like cold weather.\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Type the missing word(s)\"\u003e\u003csmall data-grade class=\"feedback\"\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"gap-item vnm-gap\" data-answer-row\u003e\u003clabel for=\"vnm-g2-3\"\u003e4. She travels every month.\u003c/label\u003e\u003cinput id=\"vnm-g2-3\" data-exercise-field=\"vnm-g2-3\" data-expected=\"She doesnundefinedt travel every month.\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Type the missing word(s)\"\u003e\u003csmall data-grade class=\"feedback\"\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"gap-item vnm-gap\" data-answer-row\u003e\u003clabel for=\"vnm-g2-4\"\u003e5. We eat breakfast at 8 o’clock.\u003c/label\u003e\u003cinput id=\"vnm-g2-4\" data-exercise-field=\"vnm-g2-4\" data-expected=\"We donundefinedt eat breakfast at 8 oundefinedclock.\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Type the missing word(s)\"\u003e\u003csmall data-grade class=\"feedback\"\u003e\u003c/small\u003e\u003c/div\u003e\u003ch3\u003eExercise 3 · Make questions\u003c/h3\u003e\u003cp\u003eExample: You like coffee. → Do you like coffee?\u003c/p\u003e\u003cdiv class=\"gap-item vnm-gap\" data-answer-row\u003e\u003clabel for=\"vnm-g3-0\"\u003e1. You work every day.\u003c/label\u003e\u003cinput id=\"vnm-g3-0\" data-exercise-field=\"vnm-g3-0\" data-expected=\"Do you work every day?\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Type the missing word(s)\"\u003e\u003csmall data-grade class=\"feedback\"\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"gap-item vnm-gap\" data-answer-row\u003e\u003clabel for=\"vnm-g3-1\"\u003e2. Your daughter lives in Vietnam.\u003c/label\u003e\u003cinput id=\"vnm-g3-1\" data-exercise-field=\"vnm-g3-1\" data-expected=\"Does your daughter live in Vietnam?\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Type the missing word(s)\"\u003e\u003csmall data-grade class=\"feedback\"\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"gap-item vnm-gap\" data-answer-row\u003e\u003clabel for=\"vnm-g3-2\"\u003e3. You enjoy travelling.\u003c/label\u003e\u003cinput id=\"vnm-g3-2\" data-exercise-field=\"vnm-g3-2\" data-expected=\"Do you enjoy travelling?\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Type the missing word(s)\"\u003e\u003csmall data-grade class=\"feedback\"\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"gap-item vnm-gap\" data-answer-row\u003e\u003clabel for=\"vnm-g3-3\"\u003e4. Your daughter speaks English.\u003c/label\u003e\u003cinput id=\"vnm-g3-3\" data-exercise-field=\"vnm-g3-3\" data-expected=\"Does your daughter speak English?\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Type the missing word(s)\"\u003e\u003csmall data-grade class=\"feedback\"\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"gap-item vnm-gap\" data-answer-row\u003e\u003clabel for=\"vnm-g3-4\"\u003e5. You usually cook dinner.\u003c/label\u003e\u003cinput id=\"vnm-g3-4\" data-exercise-field=\"vnm-g3-4\" data-expected=\"Do you usually cook dinner?\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Type the missing word(s)\"\u003e\u003csmall data-grade class=\"feedback\"\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"gap-item vnm-gap\" data-answer-row\u003e\u003clabel for=\"vnm-g3-5\"\u003e6. You visit your family often.\u003c/label\u003e\u003cinput id=\"vnm-g3-5\" data-exercise-field=\"vnm-g3-5\" data-expected=\"Do you visit your family often?\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Type the missing word(s)\"\u003e\u003csmall data-grade class=\"feedback\"\u003e\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"vnm-check-actions\"\u003e\u003cbutton class=\"primary\" type=\"button\" data-check-section\u003eCheck answers\u003c/button\u003e\u003cp data-section-score role=\"status\"\u003e\u003c/p\u003e\u003c/div\u003e"},{"id":"on-the-plane","title":"04 · On the plane: Let’s talk!","minutes":10,"teacherNotes":"The PDF contains a teacher-read dialogue but NO audio file. Read the exact script twice (gist then detail); reveal text only after answers. Answer key in teacher notes from PDF: Vietnam / to visit daughter / in Vietnam / once or twice a year / reading, walking, films, cooking / no / Vietnamese.","html":"\u003cdiv class=\"vnm-eyebrow\"\u003eLISTENING + SPEAKING · TEACHER READS THE TEXT TWICE\u003c/div\u003e\u003ch3\u003eAnswer the questions\u003c/h3\u003e\u003cdiv class=\"question-item vnm-write\"\u003e\u003clabel for=\"vnm-listen-0\"\u003e1. Where is the woman travelling?\u003c/label\u003e\u003ctextarea id=\"vnm-listen-0\" data-exercise-field=\"vnm-listen-0\" rows=\"1\" placeholder=\"Your answer…\"\u003e\u003c/textarea\u003e\u003c/div\u003e\u003cdiv class=\"question-item vnm-write\"\u003e\u003clabel for=\"vnm-listen-1\"\u003e2. Why is she going to Vietnam?\u003c/label\u003e\u003ctextarea id=\"vnm-listen-1\" data-exercise-field=\"vnm-listen-1\" rows=\"1\" placeholder=\"Your answer…\"\u003e\u003c/textarea\u003e\u003c/div\u003e\u003cdiv class=\"question-item vnm-write\"\u003e\u003clabel for=\"vnm-listen-2\"\u003e3. Where does her daughter live?\u003c/label\u003e\u003ctextarea id=\"vnm-listen-2\" data-exercise-field=\"vnm-listen-2\" rows=\"1\" placeholder=\"Your answer…\"\u003e\u003c/textarea\u003e\u003c/div\u003e\u003cdiv class=\"question-item vnm-write\"\u003e\u003clabel for=\"vnm-listen-3\"\u003e4. How often does she visit her daughter?\u003c/label\u003e\u003ctextarea id=\"vnm-listen-3\" data-exercise-field=\"vnm-listen-3\" rows=\"1\" placeholder=\"Your answer…\"\u003e\u003c/textarea\u003e\u003c/div\u003e\u003cdiv class=\"question-item vnm-write\"\u003e\u003clabel for=\"vnm-listen-4\"\u003e5. What does she do in her free time?\u003c/label\u003e\u003ctextarea id=\"vnm-listen-4\" data-exercise-field=\"vnm-listen-4\" rows=\"1\" placeholder=\"Your answer…\"\u003e\u003c/textarea\u003e\u003c/div\u003e\u003cdiv class=\"question-item vnm-write\"\u003e\u003clabel for=\"vnm-listen-5\"\u003e6. Does she speak Vietnamese?\u003c/label\u003e\u003ctextarea id=\"vnm-listen-5\" data-exercise-field=\"vnm-listen-5\" rows=\"1\" placeholder=\"Your answer…\"\u003e\u003c/textarea\u003e\u003c/div\u003e\u003cdiv class=\"question-item vnm-write\"\u003e\u003clabel for=\"vnm-listen-6\"\u003e7. What language does she want to learn?\u003c/label\u003e\u003ctextarea id=\"vnm-listen-6\" data-exercise-field=\"vnm-listen-6\" rows=\"1\" placeholder=\"Your answer…\"\u003e\u003c/textarea\u003e\u003c/div\u003e\u003cdetails class=\"vnm-dialogue\"\u003e\u003csummary\u003eConversation script · Open after listening\u003c/summary\u003e\u003cp\u003e\u003cb\u003ePassenger:\u003c/b\u003e Hello! Is this seat free?\u003c/p\u003e\u003cp\u003e\u003cb\u003eWoman:\u003c/b\u003e Yes, of course!\u003c/p\u003e\u003cp\u003e\u003cb\u003ePassenger:\u003c/b\u003e Thank you! Are you travelling to Vietnam?\u003c/p\u003e\u003cp\u003e\u003cb\u003eWoman:\u003c/b\u003e Yes, I am. My daughter lives there, and I want to visit her.\u003c/p\u003e\u003cp\u003e\u003cb\u003ePassenger:\u003c/b\u003e That’s nice! Do you travel to Vietnam often?\u003c/p\u003e\u003cp\u003e\u003cb\u003eWoman:\u003c/b\u003e Not very often. I usually visit her once or twice a year.\u003c/p\u003e\u003cp\u003e\u003cb\u003ePassenger:\u003c/b\u003e What do you do in your free time?\u003c/p\u003e\u003cp\u003e\u003cb\u003eWoman:\u003c/b\u003e I enjoy reading books, walking and watching films. I also like cooking.\u003c/p\u003e\u003cp\u003e\u003cb\u003ePassenger:\u003c/b\u003e That’s interesting! Do you speak Vietnamese?\u003c/p\u003e\u003cp\u003e\u003cb\u003eWoman:\u003c/b\u003e No, I don’t. But I want to learn some Vietnamese words!\u003c/p\u003e\u003cp\u003e\u003cb\u003ePassenger:\u003c/b\u003e I’m sure you’ll enjoy your trip!\u003c/p\u003e\u003c/details\u003e\u003ch3\u003eSpeaking · Let’s discuss\u003c/h3\u003e\u003col class=\"vnm-questions\"\u003e\u003cli\u003eHow often do you travel?\u003c/li\u003e\u003cli\u003eWho do you usually travel with?\u003c/li\u003e\u003cli\u003eWhat do you usually do on a plane?\u003c/li\u003e\u003cli\u003eDo you like talking to strangers?\u003c/li\u003e\u003cli\u003eWhat do you usually do when you visit your family?\u003c/li\u003e\u003cli\u003eWhat foreign languages do you speak?\u003c/li\u003e\u003cli\u003eWhat countries would you like to visit?\u003c/li\u003e\u003c/ol\u003e"},{"id":"daily-routine","title":"05 · My daily life","minutes":10,"teacherNotes":"The source asks for ten sentence completions and an eight-sentence spoken routine, using usually, often, sometimes.","html":"\u003cdiv class=\"vnm-eyebrow\"\u003eDAILY ROUTINE · TALK ABOUT YOUR DAY\u003c/div\u003e\u003cdiv class=\"vnm-card-grid\"\u003e\u003carticle class=\"material-card\"\u003e\u003cstrong\u003ewake up / get up\u003c/strong\u003e\u003cp\u003eпросыпаться / вставать\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"material-card\"\u003e\u003cstrong\u003ehave breakfast / go to work\u003c/strong\u003e\u003cp\u003eзавтракать / идти на работу\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"material-card\"\u003e\u003cstrong\u003ecome home / cook dinner\u003c/strong\u003e\u003cp\u003eвозвращаться домой / готовить ужин\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"material-card\"\u003e\u003cstrong\u003ewatch TV / read a book\u003c/strong\u003e\u003cp\u003eсмотреть телевизор / читать книгу\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"material-card\"\u003e\u003cstrong\u003ego shopping / go for a walk\u003c/strong\u003e\u003cp\u003eходить за покупками / гулять\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"material-card\"\u003e\u003cstrong\u003ego to bed / spend time with family\u003c/strong\u003e\u003cp\u003eложиться спать / проводить время с семьёй\u003c/p\u003e\u003c/article\u003e\u003c/div\u003e\u003ch3\u003eComplete the sentences orally\u003c/h3\u003e\u003col class=\"vnm-questions\"\u003e\u003cli\u003eI usually wake up at…\u003c/li\u003e\u003cli\u003eI have breakfast at…\u003c/li\u003e\u003cli\u003eI go to work…\u003c/li\u003e\u003cli\u003eI usually have lunch…\u003c/li\u003e\u003cli\u003eAfter work, I…\u003c/li\u003e\u003cli\u003eIn the evening, I…\u003c/li\u003e\u003cli\u003eAt weekends, I…\u003c/li\u003e\u003cli\u003eI never…\u003c/li\u003e\u003cli\u003eI often…\u003c/li\u003e\u003cli\u003eI sometimes…\u003c/li\u003e\u003c/ol\u003e\u003cdiv class=\"question-item vnm-write\"\u003e\u003clabel for=\"vnm-routine\"\u003eDescribe a typical day in at least eight sentences\u003c/label\u003e\u003ctextarea id=\"vnm-routine\" data-exercise-field=\"vnm-routine\" rows=\"5\" placeholder=\"I usually wake up at 7 o’clock. I have breakfast …\"\u003e\u003c/textarea\u003e\u003c/div\u003e\u003cdiv class=\"tip\"\u003e\u003cstrong\u003eSpeaking challenge\u003c/strong\u003e\u003cp\u003eTell your teacher about your typical day. Use \u003cem\u003eusually, often\u003c/em\u003e and \u003cem\u003esometimes\u003c/em\u003e.\u003c/p\u003e\u003cp\u003e\u003cem\u003eModel: I usually wake up at 7 o’clock. I have breakfast and drink coffee. Then I go to work. I work from Monday to Friday. After work, I come home and cook dinner. In the evening, I watch TV or read a book. At weekends, I meet my friends and spend time with my family. I usually go to bed at 11 o’clock.\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\u003ch3\u003eSave useful routine expressions\u003c/h3\u003e\u003cdiv class=\"vocab\"\u003e\u003carticle\u003e\u003cb\u003ewake up\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"6\" aria-label=\"Save wake up to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003eпросыпаться\u003c/p\u003e\u003c/article\u003e\u003carticle\u003e\u003cb\u003eget up\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"7\" aria-label=\"Save get up to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003eвставать\u003c/p\u003e\u003c/article\u003e\u003carticle\u003e\u003cb\u003ehave breakfast\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"8\" aria-label=\"Save have breakfast to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003eзавтракать\u003c/p\u003e\u003c/article\u003e\u003carticle\u003e\u003cb\u003ego for a walk\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"9\" aria-label=\"Save go for a walk to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003eидти гулять\u003c/p\u003e\u003c/article\u003e\u003carticle\u003e\u003cb\u003ego shopping\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"10\" aria-label=\"Save go shopping to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003eходить за покупками\u003c/p\u003e\u003c/article\u003e\u003carticle\u003e\u003cb\u003espend time with family\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"11\" aria-label=\"Save spend time with family to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003eпроводить время с семьёй\u003c/p\u003e\u003c/article\u003e\u003c/div\u003e"},{"id":"family-and-plans","title":"06 · At the destination: Family and plans","minutes":8,"teacherNotes":"Allow honest personal details to be shared voluntarily. Oral follow-ups about family/daughter.","html":"\u003cdiv class=\"vnm-eyebrow\"\u003eIN VIETNAM · FAMILY AND PLANS\u003c/div\u003e\u003cdiv class=\"vnm-card-grid\"\u003e\u003carticle class=\"material-card\"\u003e\u003cstrong\u003edaughter / son\u003c/strong\u003e\u003cp\u003eдочь / сын\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"material-card\"\u003e\u003cstrong\u003ehusband / wife\u003c/strong\u003e\u003cp\u003eмуж / жена\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"material-card\"\u003e\u003cstrong\u003eparents / grandchildren\u003c/strong\u003e\u003cp\u003eродители / внуки\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"material-card\"\u003e\u003cstrong\u003erelatives / family member\u003c/strong\u003e\u003cp\u003eродственники / член семьи\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"material-card\"\u003e\u003cstrong\u003eclose family / spend time together\u003c/strong\u003e\u003cp\u003eблизкие родственники / проводить время вместе\u003c/p\u003e\u003c/article\u003e\u003c/div\u003e\u003ch3\u003eComplete the sentences\u003c/h3\u003e\u003col class=\"vnm-questions\"\u003e\u003cli\u003eI have … children.\u003c/li\u003e\u003cli\u003eMy daughter lives…\u003c/li\u003e\u003cli\u003eMy daughter works…\u003c/li\u003e\u003cli\u003eWe usually talk…\u003c/li\u003e\u003cli\u003eWe like spending time…\u003c/li\u003e\u003cli\u003eMy family enjoys…\u003c/li\u003e\u003cli\u003eI often visit…\u003c/li\u003e\u003cli\u003eI am happy when…\u003c/li\u003e\u003c/ol\u003e\u003cdiv class=\"question-item vnm-write\"\u003e\u003clabel for=\"vnm-family-note\"\u003eComplete several sentences about your family\u003c/label\u003e\u003ctextarea id=\"vnm-family-note\" data-exercise-field=\"vnm-family-note\" rows=\"3\" placeholder=\"My family … We usually …\"\u003e\u003c/textarea\u003e\u003c/div\u003e\u003ch3\u003eDiscuss\u003c/h3\u003e\u003col class=\"vnm-questions\"\u003e\u003cli\u003eIs family important to you?\u003c/li\u003e\u003cli\u003eHow often do you see your family?\u003c/li\u003e\u003cli\u003eDo you usually celebrate holidays together?\u003c/li\u003e\u003cli\u003eWhat do you like doing with your daughter?\u003c/li\u003e\u003cli\u003eWhat do you usually talk about?\u003c/li\u003e\u003cli\u003eWhat would you like to do together in Vietnam?\u003c/li\u003e\u003c/ol\u003e\u003ch3\u003eSave family words\u003c/h3\u003e\u003cdiv class=\"vocab\"\u003e\u003carticle\u003e\u003cb\u003erelatives\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"12\" aria-label=\"Save relatives to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003eродственники\u003c/p\u003e\u003c/article\u003e\u003carticle\u003e\u003cb\u003egrandchildren\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"13\" aria-label=\"Save grandchildren to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003eвнуки\u003c/p\u003e\u003c/article\u003e\u003carticle\u003e\u003cb\u003eat weekends\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"14\" aria-label=\"Save at weekends to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003eпо выходным\u003c/p\u003e\u003c/article\u003e\u003carticle\u003e\u003cb\u003eusually\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"15\" aria-label=\"Save usually to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003eобычно\u003c/p\u003e\u003c/article\u003e\u003c/div\u003e"},{"id":"final-speaking","title":"07 · Final speaking: My introduction","minutes":5,"teacherNotes":"Student gives 1–2-minute introduction with 10 sentences, then practices at least five questions and answers. Optional games from source may be used if time allows.","html":"\u003cdiv class=\"vnm-eyebrow\"\u003eFINAL ROLE-PLAY · TALK TO A NEW PERSON IN VIETNAM\u003c/div\u003e\u003cp\u003eImagine you meet a new person in Vietnam. Introduce yourself and have a short conversation.\u003c/p\u003e\u003cdiv class=\"tip\"\u003e\u003cstrong\u003eMini-presentation (1–2 minutes)\u003c/strong\u003e\u003cp\u003eInclude your name and age, where you live, your work, family, daily routine, hobbies, why you travel to Vietnam, and what you like about travelling. Say at least \u003cb\u003eten sentences\u003c/b\u003e and practise \u003cb\u003efive questions and answers\u003c/b\u003e.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"question-item vnm-write\"\u003e\u003clabel for=\"vnm-final-note\"\u003eMake brief speaking notes\u003c/label\u003e\u003ctextarea id=\"vnm-final-note\" data-exercise-field=\"vnm-final-note\" rows=\"3\" placeholder=\"My name is … I live … I usually …\"\u003e\u003c/textarea\u003e\u003c/div\u003e\u003ch3\u003eReflection\u003c/h3\u003e\u003cp\u003eHow do you feel about your English today? What was easy or difficult? Do you feel more confident speaking English?\u003c/p\u003e\u003cdiv class=\"question-item vnm-write\"\u003e\u003clabel for=\"vnm-reflection\"\u003eYour reflection (optional)\u003c/label\u003e\u003ctextarea id=\"vnm-reflection\" data-exercise-field=\"vnm-reflection\" rows=\"2\" placeholder=\"Today I …\"\u003e\u003c/textarea\u003e\u003c/div\u003e\u003cdetails class=\"vnm-optional\"\u003e\u003csummary\u003eOptional speaking games from the PDF (if time allows)\u003c/summary\u003e\u003ch3\u003eGame 1 · Guess the sound (2–3 min)\u003c/h3\u003e\u003cp\u003eThe teacher may play airport, airplane or ocean sounds. What can you hear? Where are we? What do you like doing at the beach? (No audio tracks are supplied in the source.)\u003c/p\u003e\u003ch3\u003eGame 2 · Answer in 5 seconds! (3 min)\u003c/h3\u003e\u003col\u003e\u003cli\u003eDo you like coffee?\u003c/li\u003e\u003cli\u003eDo you cook every day?\u003c/li\u003e\u003cli\u003eDoes your daughter speak English?\u003c/li\u003e\u003cli\u003eDo you watch films in English?\u003c/li\u003e\u003cli\u003eDo you usually get up early?\u003c/li\u003e\u003cli\u003eDoes your family live near you?\u003c/li\u003e\u003cli\u003eDo you like hot weather?\u003c/li\u003e\u003cli\u003eWhat do you usually eat for breakfast?\u003c/li\u003e\u003cli\u003eWhere do you s
