<script type="application/json" id="lesson-data">{"cabinet":"student-travel-b2.html","title":"The Last Connection","level":"Travel English · B2","key":"gostudy-travel-b2-04-v1","cover":"assets/travel-b2-04-cover.png","coverAlt":"Travellers waiting on a railway platform","steps":[{"title":"01 · The last connection","instruction":"WARM-UP · 5 min. Discuss before you look at the solutions. Give reasons, not one-word answers.","type":null,"items":null,"source":["SCENARIO · Your train reaches East Junction 48 minutes late. You have missed your last connection to Harbor City. Your hotel closes check-in at 23:45, and your companion needs step-free access.","DISCUSS · (1) What would you do in the first 60 seconds? (2) Which is non-negotiable: arrival time, accessibility, cost, or written proof? (3) Would you pay more to reduce risk? Why?","OUTCOME · Agree on your top two priorities. Explain one compromise you could accept and one you would refuse."],"id":"original-0","visual":{"kind":"route","label":"Your route","stops":[["🚆","East Junction","48 min late"],["⏱️","Connection","Departed"],["🏨","Harbor City","Check in by 23:45"]]},"teacherNotes":"5 min. Elicit a short personal example of a travel disruption. Do not reveal the best route yet. Listen for prioritising and justifying decisions."},{"title":"02 · What does the operator promise?","instruction":"READING · 7 min. Read the service notice. Separate confirmed facts from things you still need to check.","type":"choice","items":[["Which fact is already confirmed?",["The coach departs at 22:20","The coach lift works tonight","The taxi fare will be refunded in full"],0,"The coach timetable is given; the lift and taxi still need confirmation."],["What must happen before taking a reimbursable taxi?",["The hotel must approve it","Station staff must approve it","The taxi driver must send a quote by email"],1,"Ask for approval BEFORE departure."],["What does the £60 reimbursement limit mean?",["£60 for each passenger","£60 per vehicle, not necessarily the full fare","Any amount if you keep the receipt"],1,"A more expensive taxi can leave an out-of-pocket expense."]],"source":["SERVICE UPDATE · East Junction → Harbor City","Your connection has departed. Tickets are valid on the replacement coach departing at 22:20, arriving at Harbor City at 23:30. Please confirm with station staff that the coach lift is available tonight before boarding.","Alternatively, a shared taxi may be approved by station staff BEFORE departure. The operator will reimburse up to £60 PER VEHICLE when you present your receipt. The first train tomorrow departs at 06:40. Keep this notice and all receipts.","SPEAK · Which detail is a guarantee and which is conditional? What two questions would you ask the staff before spending your own money? Explain why 'up to £60 per vehicle' matters."],"style":"memo","id":"original-1","visual":{"kind":"alert","icon":"🚉","title":"Service update","detail":"East Junction → Harbor City"},"teacherNotes":"7 min. Allow 2 min silent reading, 2 min checks, 3 min oral evidence-based questions. Make the learner quote the wording 'please confirm' and 'up to'."},{"title":"03 · Language that gets results","instruction":"VOCABULARY · 7 min. Match the six expressions, then use at least four of them in your own sentences about this journey.","type":"choice","items":[["reroute",["send someone by a different route","give someone a free upgrade","cancel the entire journey"],0],["reimburse",["reserve a seat","pay someone back","charge a second fare"],1],["step-free access",["a platform with several stairs","access only for staff","a route without stairs"],2],["out-of-pocket expense",["money you initially pay yourself","an automatic fare reduction","a travel voucher"],0],["advance approval",["a receipt issued after travel","permission you receive beforehand","a ticket for tomorrow"],1],["miss a connection",["arrive on an earlier train","travel without luggage","arrive too late for the next service"],2]],"source":["FUNCTIONAL LANGUAGE · reroute · reimburse · step-free access · out-of-pocket expense · advance approval · miss a connection","SAY IT YOURSELF · (1) Explain what happened using 'miss a connection' and 'reroute'. (2) Ask about 'step-free access'. (3) Ask whether you need 'advance approval'. (4) Explain what might become an 'out-of-pocket expense'.","CHALLENGE · Instead of saying 'Give me my money back', use 'reimburse' in one polite question."],"metrics":[["23:30","Coach arrival"],["23:15","Estimated taxi arrival"],["£60","Taxi reimbursement cap"]],"id":"original-2","visual":{"kind":"cards","cards":[["🚌","Replacement coach","22:20 → 23:30","Check that the lift works."],["🚕","Shared taxi","Estimated arrival 23:15","Ask staff for approval first."],["🚆","Tomorrow’s train","Departs 06:40","Check-in closes tonight."]]},"teacherNotes":"7 min. Spend about 3 min matching and 4 min eliciting productive examples. Pronunciation: RE-route / ree-ROUTE (both possible); re-im-BURSE. Aim for all six phrases recognised and four used."},{"title":"04 · Choose a route, defend your choice","instruction":"DECISION LAB · 7 min. Compare cost, timing, accessibility and uncertainty. Make a recommendation and defend it.","type":"match","items":[["Which option can meet the deadline if the coach lift is confirmed?",["The coach","Tomorrow's train","Neither"],0],["What must staff do before a taxi is eligible for reimbursement?",["Send a hotel confirmation","Approve the taxi","Pay for dinner"],1],["With a £72 taxi and a £60 reimbursement cap, what is the uncovered amount?",["£72","£60","£12"],2]],"source":["YOUR OPTIONS · The coach arrives at 23:30, then there is a five-minute walk to the hotel; its lift has NOT yet been confirmed. A shared taxi arrives around 23:15 and costs £72; reimbursement is capped at £60 per vehicle and requires advance approval. Tomorrow's first train departs at 06:40. Hotel check-in closes at 23:45.","SPEAK · Recommend the safest option IF the coach lift works. Then change your recommendation IF the lift is unavailable. Include one backup plan.","JUSTIFY · Use at least three expressions from the previous stage. Finish with 'I would choose …, provided that …' and 'If …, I would …'.","REALITY CHECK · The taxi is estimated at £72: even with approved reimbursement, £12 is not guaranteed to be covered."],"id":"original-3","visual":{"kind":"alert","icon":"🧳","title":"At the station desk","detail":"Match the phrases you might hear."},"teacherNotes":"7 min: 2 min scan prices, 2 min three checks, 3 min free recommendation and counterargument. Do not accept a route without addressing accessibility and the refund conditions."},{"title":"05 · Ask firmly, stay polite","instruction":"LANGUAGE FOCUS · 6 min. Practise polite requests and realistic conditions, then turn them into spoken questions.","type":"gap","items":[["Could you ___ whether the coach has step-free access tonight?",["confirm","promise me","confirmed"],0,"Use 'Could you confirm whether…?' to verify a fact."],["Would it be possible ___ a shared taxi instead?",["arranging","to arrange","arranged"],1,"'Would it be possible to…?' makes a polite request."],["If the lift is unavailable, ___ you approve a taxi?",["could","did","have"],0,"Use 'If… , could you…?' for a conditional request."],["Could you put the approval ___ before we leave?",["in writing","by tomorrow yesterday","to writing"],0,"Ask for proof in writing before incurring costs."],["Just to clarify, does the £60 cap apply ___?",["to each passenger separately","per vehicle","for every journey this month"],1,"The operator's notice says 'per vehicle'."]],"source":["USEFUL PATTERNS · 'Could you confirm whether …?' · 'Would it be possible to …?' · 'If the lift is unavailable, could you …?' · 'Before we book, could you put that in writing?'","NOTICE · These forms help you ask for information, request action and set conditions without sounding aggressive.","SPEAK · Ask the station agent three questions: one about accessibility, one about the reimbursement cap and one about written confirmation. Your partner should give an incomplete answer once; ask a follow-up."],"id":"original-4","visual":{"kind":"alert","icon":"💬","title":"Explain the delay","detail":"Complete the sentences before speaking."},"teacherNotes":"6 min. Focus on 2 reusable polite structures and conditional requests; do not introduce unrelated grammar. Follow the checks with oral reformulations and a follow-up question."},{"title":"06 · Build a successful exchange","instruction":"MODEL DIALOGUE · 5 min. Put the conversation in order, read it aloud and notice how the traveller moves from a problem to written confirmation.","type":"order","items":["Could you put the approval in writing before we book?","Our connection has left, and one of us needs step-free access.","Certainly. I'll email the confirmation now. Please keep your receipt.","If the lift is unavailable, would it be possible to approve a shared taxi?","I understand. The replacement coach is due at 22:20, but I'll check whether its lift is working.","The lift is out of service, so I can approve a taxi up to £60 per vehicle."],"source":["AFTER CHECKING · Perform the exchange twice. On the second run, close the model and paraphrase the traveller's requests.","NOTICE · The traveller explains the problem → checks a condition → requests an alternative → confirms the limit → asks for written proof."],"order":[1,4,3,5,0,2],"id":"original-5","visual":{"kind":"alert","icon":"🎫","title":"From missed connection to written approval","detail":"Rebuild the conversation at the station desk."},"teacherNotes":"5 min. The initial display is intentionally in correct order? Shuffle manually using move arrows before the learner begins, or ask learner to reconstruct from the sequence labels. Evaluate a natural follow-up question."},{"title":"07 · Live negotiation: two rounds","instruction":"SPEAKING CHALLENGE · 10 min. Negotiate a realistic solution. Do not simply read the prompts; ask follow-up questions and get an agreement.","type":"write","items":null,"source":["TRAVELLER · You need step-free travel and must reach the hotel before 23:45. Start by explaining the missed connection. Check the lift, the earliest arrival, any out-of-pocket expense and the reimbursement policy. Ask for written confirmation.","STATION AGENT — ROUND 1 · The 22:20 coach is available, but you must verify that its lift works. There are only two seats left. You may approve a shared taxi up to £60 per vehicle, but only before it is booked.","NEW INFORMATION — ROUND 2 · The coach lift fails. The taxi quote rises to £80, while the standard reimbursement cap remains £60. The supervisor may authorise an exception, but you cannot promise one yet. Negotiate a practical next step.","SUCCESS CRITERIA · (1) Explain the problem clearly. (2) Ask at least three precise, polite questions. (3) Use four target expressions. (4) Negotiate a backup. (5) Say what is and is not guaranteed.","REFLECTION · Which one of your questions changed the outcome? What would you say differently next time?"],"style":"writing-brief","id":"original-6","visual":{"kind":"cards","cards":[["🧍","Traveller","Ask for a step-free route","Check cost and arrival time."],["🎧","Station agent","Confirm what you can offer","Give a different option in round two."]]},"teacherNotes":"10 min: 1 min plan, 3 min round 1, 3 min twist/round 2, 3 min targeted feedback. Note two effective utterances and one improved phrase; avoid interrupting fluency."},{"title":"08 · Confirm the solution","instruction":"WRITING & REVIEW · 3 min. Send a concise message to the hotel, then review the outcome.","type":"write","items":null,"source":["Write 45–65 words to reception. Explain the missed connection, state your expected arrival, and ask whether late check-in is possible if the approved transport is delayed.","SELF-CHECK · Is the message clear and polite? Does it contain a concrete arrival estimate and one specific question?","HOMEWORK · Practise today's six expressions, read a new operator message and write a longer response. Open the homework from your dashboard."],"style":"writing-brief","id":"original-7","visual":{"kind":"cards","cards":[["🧍","Traveller","Ask for a step-free route","Check cost and arrival time."],["🎧","Station agent","Confirm what you can offer","Give a different option in round two."]]},"teacherNotes":"3 min. Start the message in class; the longer writing and vocabulary recycling happen in the matching homework. Praise clarity rather than length."}],"version":"methodology-2026-11-17","durationMinutes":50}</script><script src="assets/gostudy-sync.js?v=114c8b497efb"></script><script src="assets/gostudy-vimbox-workbook.js?v=53258c671103"></script><script src="assets/gostudy-current-courses.js?v=ce1df270d0e5" defer></script><script src="assets/gostudy-glass-vocabulary.js?v=9c384a3e224e" defer></script></body></html>
