<script type="application/json" id="lesson-data">{"key":"gostudy-general-english-b1-stories-01-v1","title":"Would You Live Here? · A New Place to Call Home","level":"B1 · General English · 50 minutes","cabinet":"student-general-english-b1-stories.html","course":"general-english-b1-stories","contentVersion":"would-you-live-here-b1-20261120-v1","cover":"assets/gostudy-b1-would-you-live-here.svg","coverAlt":"Three colourful places to live: Porto, Da Nang, and Kyoto","overview":{"title":"Would You Live Here?","level":"B1 · intermediate","duration":50,"format":"1-to-1 speaking lesson","goal":"Talk about living abroad, understand two stories and a real video, use six travel-and-home expressions, compare used to and get used to, and recommend a place to live."},"vocabulary":[["settle in","start to feel comfortable in a new place","освоиться"],["feel at home","feel relaxed and comfortable in a place","чувствовать себя как дома"],["get used to","become familiar with a new situation","привыкнуть"],["make friends","get to know people and become friends","заводить друзей"],["miss home","feel sad because you are away from home","скучать по дому"],["give it a try","try something new to see if you like it","попробовать"]],"steps":[{"id":"newhome-warmup","title":"01 · Three places. One new life","minutes":5,"instruction":"A company offers a free apartment for one month while you work remotely. Choose a city and explain the reasons. Is it the same place you would choose for a two-week holiday?","visual":{"kind":"cards","cards":[["🇵🇹","Porto · Portugal","Cosy cafés","Slow mornings, beautiful streets and neighbourhood life"],["🇻🇳","Da Nang · Vietnam","Beach life","Sunshine, swimming and an outdoor lifestyle"],["🇯🇵","Kyoto · Japan","A new culture","Gardens, traditions and interesting places"]]},"source":["Choose ONE place and give two reasons. Then explain one difficulty you might have during the first week.","What is more important for a new home: nice weather, friendly people or interesting activities?","How long does it take to feel comfortable in a new city?","Can a place be perfect for a holiday but not very practical for everyday life?"],"teacherNotes":"5 min. Aim for at least 3–4 minutes of student talk. Do not force a correct answer; build comparisons and follow-up questions. Tell the student the cities are real, but today's situations are fictional.","cityChoices":["Porto","Da Nang","Kyoto"]},{"id":"newhome-nora","title":"02 · The Friday Table","minutes":8,"instruction":"Read Nora's story. Find out why she decides to return to Porto. Then imagine what happens after six months.","visual":{"kind":"cards","cards":[["☕","Porto café","A new routine","One small café next to a bookshop"],["🎲","Friday dinner","The new friends","Music, chess and board games"],["🏡","A return ticket","A new home?","A longer stay in Portugal"]]},"source":["Nora was a graphic designer from Warsaw. She had a busy job, a comfortable flat and a nice group of friends. But she felt that every week was exactly the same.","She decided to spend ten days in Porto. On her second day, she found a small café next to a bookshop. The owner, Miguel, was preparing a poster for a neighbourhood event. Nora offered to help. After all, making posters was her job.","Miguel loved her design and invited her to a dinner with his friends on Friday. At the dinner, people talked, laughed and played board games. Nora was terrible at chess, but she enjoyed the evening so much that she forgot to check her phone.","The next Friday, everyone asked where she was. She had already returned to Warsaw. Nora was surprised by how much she missed these new friends. She realised that the best part of Porto wasn't the beautiful buildings or the delicious food. It was feeling part of something.","Three months later, she arranged to work remotely and returned to Porto for a longer stay. Her friend asked, 'So, did you move for the weather?' 'No,' Nora replied. 'I moved because I'm finally good at losing at chess.'","AFTER READING · Imagine Nora has lived in Porto for six months. What is her new daily routine? What might she miss about Warsaw? Will she stay another year? Give the story a film title."],"type":"choice","items":[["Why did Nora want to return to Porto?",["She found a better-paid job.","She enjoyed the friendships and community.","She wanted to become a chess champion."],1,"Nora missed the people and the feeling of belonging."],["What did Nora do for Miguel?",["She designed a poster.","She cooked dinner.","She helped him move house."],0,"Miguel was preparing a poster, and Nora offered to help."],["Which title is the best fit?",["A Very Expensive Holiday","My New Friends in Porto","How to Win at Chess"],1,"The new friendships made the biggest difference to Nora."]],"teacherNotes":"8 min. 3 min reading, 2 min answers, 3 min open speaking. Ask why friendship can change someone's impression of a city."},{"id":"newhome-vocab","title":"03 · Six phrases for a new life","minutes":7,"instruction":"Learn six useful expressions. Match each phrase to the right meaning. Then make two original sentences.","visual":{"kind":"cards","cards":[["🌱","Settle in","Освоиться","It took Nora a few weeks to settle in."],["💛","Feel at home","Чувствовать себя дома","The friendly people made her feel at home."],["🔁","Get used to","Привыкнуть","She's getting used to speaking Portuguese."],["🤝","Make friends","Заводить друзей","She made friends at the Friday dinners."],["💌","Miss home","Скучать по дому","Sometimes people miss home when they live abroad."],["✨","Give it a try","Попробовать","Living abroad sounds exciting. Why not give it a try?"]]},"source":["Read the examples and explain the meanings in your own words.","Important: get used to + a noun or -ing: get used to the weather / get used to speaking another language.","SPEAKING · Invent two sentences: one using 'make friends' and one using 'miss home'. Try to use 'give it a try' in a third sentence."],"type":"match","items":[["settle in",["start to feel comfortable in a new place","buy a flat","pack a suitcase"],0,"Settle in = become comfortable in your new environment."],["feel at home",["feel completely alone","feel relaxed in a place","leave immediately"],1,"Feel at home = feel comfortable and welcome."],["get used to",["forget your plans","return home","become familiar with something new"],2,"Use get used to + a noun or -ing."],["make friends",["get to know people and become friends","meet a teacher for one lesson","book an apartment"],0,"Making friends can help you settle in."],["miss home",["forget your family","wish you were with familiar people or places","travel every weekend"],1,"Miss home means you feel homesick."],["give it a try",["refuse without thinking","make a final decision forever","try something to see if you like it"],2,"Give it a try = try something without promising to continue forever."]],"teacherNotes":"7 min. Match swiftly in 3 min, then practise 3–4 sentences without looking. Ensure all six phrases are recalled; especially get used to + -ing.","vocabularyActions":true},{"id":"newhome-leo","title":"04 · Two homes, one life","minutes":6,"instruction":"Read Leo's story. Compare his decision with Nora's and discuss whether someone can feel at home in two places.","visual":{"kind":"cards","cards":[["🏖️","Da Nang","New mornings","Walks by the beach and outdoor cafés"],["👩‍🍳","Tuesday club","New friends","Cooking together after work"],["🏠","Manchester","Family connection","Sunday lunch with his sister"]]},"source":["Leo lived in Manchester and worked as a website designer. One winter, he decided to spend a month in Da Nang.","At first, he did everything tourists do: walked along the beach, tried different foods and took hundreds of photos. After a week, he started working normal hours again. His new life wasn't exciting every minute. Some days he just sat at his laptop for eight hours.","But something interesting happened. He joined a small cooking class and made friends with people from different countries. Every Tuesday, the group met to cook dinner together. Leo discovered that he loved these evenings even more than the beach. He started to feel at home.","However, he also missed Sunday lunches with his sister in Manchester. He didn't want to leave his family behind forever.","So he made a different plan. Instead of moving abroad permanently, he decided to spend part of each year in Vietnam and the rest closer to his family, when his work and travel arrangements allowed it.","When someone asked where he wanted to live, Leo smiled. 'Can I choose two places?'","LET'S TALK · Whose decision is easier to understand: Nora's or Leo's? Why doesn't Leo want to move permanently? Is having two homes a good idea?","ONE-SENTENCE CHALLENGE · Finish in three different ways: 'A place feels like home when ...'"],"type":"choice","items":[["What did Leo enjoy most about living in Da Nang?",["Buying new technology.","His Tuesday cooking group.","Working eight hours every day."],1,"The cooking group gave Leo a regular social activity."],["Why did Leo choose to divide his time between two countries?",["He disliked Vietnam.","He couldn't work remotely.","He enjoyed his new life but missed his family."],2,"Leo wanted to stay connected to his sister in Manchester."],["How are Leo's and Nora's decisions different?",["Nora returned for a longer stay in one city; Leo chose to divide his time.","They both wanted to stay in Vietnam permanently.","Neither of them made any friends."],0,"Their goals were different, even though friends mattered to both."]],"teacherNotes":"6 min. Short reading and two minutes of comparisons. Avoid discussing immigration regulations; the story is fictional and says 'when work and travel arrangements allowed it'."},{"id":"newhome-video","title":"05 · Video: Flathunting","minutes":9,"instruction":"Watch a real British Council video: Ashlie and Stephen look for a better flat. Decide which home is best and why. The video source is linked below if embedding is blocked.","video":{"siteUrl":"https://learnenglish.britishcouncil.org/free-resources/general/video-series/wots/flathunting/flathunting-scene-1","title":"British Council · Flathunting Scene 1","description":"Word on the Street · B1/B2 · official transcript and video"},"source":["BEFORE WATCHING · What three things matter most in an apartment: location, a quiet street, a large kitchen, good transport, rent or a nice view? Rank three.","WATCH · Ashlie dislikes her current flat and asks her brother Stephen for help. Pay attention to the three flats they visit.","AFTER WATCHING · The first flat has a bed that also works as a sofa. The second is bigger but near a busy train station. The third has a beautiful kitchen and a peaceful street.","ROLE-PLAY · One person is an estate agent; the other wants to move. Recommend one of the flats, explain one advantage and one disadvantage. Change roles after one minute.","USEFUL LANGUAGE · This place looks more spacious. It's close to the station. I prefer a quiet neighbourhood. I'd choose this one because ..."],"type":"match","items":[["First flat",["A tiny flat with a sofa bed","A flat next to the station","A peaceful flat with a large kitchen"],0,"The estate agent shows a bed that can also be a sofa."],["Second flat",["A flat in an old castle","A bigger flat near a station","A tiny flat with a sofa bed"],1,"It has more space, but trains arrive frequently."],["Third flat",["A tiny pink flat","A noisy flat above a supermarket","A spacious flat on a peaceful street"],2,"Ashlie likes the spacious kitchen and peaceful location."]],"teacherNotes":"9 min. Play the official British Council scene; if embedded player is blocked, open its official page via the clearly visible link. The transcript confirms all three descriptions. Budget 4–5 min video + 2 min checks + 2 min agent role-play."},{"id":"newhome-grammar","title":"06 · Then and now","minutes":5,"instruction":"Compare used to + verb (past habit) with get used to + noun / -ing (become familiar with something new). Choose the correct expression.","visual":{"kind":"cards","cards":[["🕰️","used to + verb","Past routine","Nora used to live in Warsaw."],["🔄","get used to + -ing","New situation","She's getting used to speaking Portuguese."]]},"source":["USED TO + VERB = a past habit or situation which is no longer true. 'I used to live in Warsaw.'","GET USED TO + A NOUN OR -ING = start feeling comfortable with something new. 'I'm getting used to living in Porto.'","SPEAKING · Make two sentences about someone moving to another country. One describes their old life, the other what they are getting used to now."],"type":"choice","items":[["Before the move, Nora ___ work in an office in Warsaw.",["used to","is getting used to","use to"],0,"Used to + verb describes a former situation."],["Nora is ___ speaking a little Portuguese every day.",["used to","getting used to","used"],1,"Getting used to + -ing describes a changing habit."],["Before the trip, Leo ___ have Sunday lunch with his sister every week.",["used to","getting used to","get used to"],0,"Used to + verb for a past routine."],["Leo is getting used to ___ by the sea.",["live","lived","living"],2,"After get used to, use a noun or -ing."]],"teacherNotes":"5 min. Keep explanation short; practise two contrasts orally. Avoid adding other past tenses today."},{"id":"newhome-relocation","title":"07 · The relocation game","minutes":8,"instruction":"Clara is 32 and works remotely. Help her choose a city for six months. She loves cafés, wants new friends, and needs a comfortable place to work. Maximum rent: €900 per month.","visual":{"kind":"cards","cards":[["🇵🇹","Porto","€820 / month","Small flat near cafés; one friend already lives nearby; less space to work."],["🇻🇳","Da Nang","€700 / month","Bright flat near the beach; good home office; she doesn't know anyone yet."],["🇯🇵","Kyoto","€950 / month","Quiet flat near a language school and art workshops; slightly over budget."]]},"source":["These rent prices are FICTIONAL for the game, not real market prices.","ROUND 1 · Choose one place and give three reasons. Explain one disadvantage.","ROUND 2 · NEW INFORMATION: Clara's closest friend has accepted a job in Kyoto and would love to live nearby. Her rent budget is still €900. Change your decision or defend it.","ROUND 3 · Your teacher is Clara. Answer: Why is this the best choice for me? How will I make friends? What should I do in my first week? What if I miss home? Is it worth the money?","FINAL CHALLENGE · Give a 30-second recommendation starting with 'I think Clara should choose ... because ...'. Use at least THREE new phrases."],"type":"write","teacherNotes":"8 min. Treat writing box as two-line planning notes, NOT a lengthy essay. 2 min choose, 2 min twist, 3 min role-play, 1 min final pitch. The twist is revealed after the first recommendation. Fictional prices.","cityChoices":["Porto","Da Nang","Kyoto"],"cityChoicesKey":"newhome-relocation-city","cityChoicesLabel":"🏡 Choose Clara’s new home","cityTwist":"Clara’s closest friend has accepted a job in Kyoto and would love to live nearby. Clara’s budget is still €900/month. Would you change your recommendation?"},{"id":"newhome-wrap","title":"08 · What feels like home?","minutes":2,"instruction":"Finish the lesson with one personal idea about what makes a place feel like home. Choose one sentence and support it with a reason.","visual":{"kind":"cards","cards":[["👨‍👩‍👧","People","My favourite people","Home is where my favourite people are."],["🫶","Comfort","Feeling safe","Home is where I feel comfortable."],["🌏","More than one place","Two homes","Home can be more than one place."]]},"source":["Choose one statement and give one reason. Then name TWO expressions from the lesson that would be useful in a real conversation.","OPTIONAL HOMEWORK · A Postcard From a New Home (80–100 words). The homework is on a separate page and does not require a video call."],"teacherNotes":"2 min. One natural final answer, then identify two new expressions. The homework is separate; do not ask for 100 written words during the lesson."}],"wordsKey":"gostudy-vocabulary-general-english-b1-stories-v1","preserve":"cloud","legacyWords":["gostudy-vocabulary-general-english-b1-stories-v1","gostudy-general-english-b1-stories-01-v1"],"lessonWords":[{"en":"settle in","ru":"освоиться"},{"en":"feel at home","ru":"чувствовать себя как дома"},{"en":"get used to","ru":"привыкнуть"},{"en":"make friends","ru":"заводить друзей"},{"en":"miss home","ru":"скучать по дому"},{"en":"give it a try","ru":"попробовать"}]}</script>
