<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf3fc"><title>Homework · Sweden A2 · Lesson 02 · GoStudy</title><link rel="stylesheet" href="assets/gostudy-v1-lesson.css"><link rel="stylesheet" href="assets/gostudy-michael-feed.css?v=4"><link rel="stylesheet" href="assets/gostudy-michael-chat.css?v=1"><link rel="stylesheet" href="assets/gostudy-design2-homework.css?v=1"></head><body data-cloud-vocabulary="sweden-a2" data-premium-feed="michael-v1" data-translate-engine="google-web-pilot" data-design2-homework data-finance-live data-classroom-course="sweden-a2" data-classroom-lesson="sweden-a2-02-michael.html" data-preserve-workbook-progress data-live-script="assets/gostudy-finance-live.js"><script type="application/json" id="lesson-data">{"title":"Your First Full Day in Stockholm · Homework","cabinet":"student-sweden.html","course":"sweden-a2","level":"Travel in Sweden · A2","key":"gostudy-sweden-a2-02-michael-homework-v1","wordsKey":"gostudy-vocabulary-sweden-a2-v1","preserve":"cloud","durationMinutes":18,"steps":[{"id":"sweden-02-hw-0","title":"01 · Six expressions","minutes":5,"instruction":"RETRIEVAL · 5 min. Complete the situations using today's six expressions.","type":"gap","items":[["Can we ___ or must we take our food outside?",["eat in","forecast","receipt"],0],["I want to eat in the park. Can I get it ___?",["around the corner","to take away","an entrance"],1],["Could I have ___, please? I need a record of my payment.",["an entrance","a forecast","a receipt"],2],["The museum ___ is next to the bookshop.",["entrance","forecast","take away"],0],["The café is nearby, just ___.",["a receipt","around the corner","eat in"],1],["Let's check the weather ___ before we go out.",["receipt","entrance","forecast"],2]],"teacherNotes":"5 min. Six target items only; accept two alternative natural forms in discussion; explicit closed options for automatic marking."},{"id":"sweden-02-hw-1","title":"02 · A note from Stockholm","minutes":5,"instruction":"READ · 5 min. Read a short fictional note and answer.","source":["Hi! Yesterday I arrived in Stockholm and walked from the station to my hotel. This morning I had breakfast at Fika Corner. I decided to eat in because it was raining. The café was around the corner, so it was easy to find. The waiter gave me a receipt. This afternoon I'm going to visit a museum. Its entrance is near the bookshop. I'm going to check the weather forecast before I leave."],"type":"choice","items":[["What did the traveller do yesterday?",["Visited a museum","Arrived in Stockholm","Checked tomorrow's weather"],1],["Why did the traveller eat in?",["It was raining","The café was closed","They wanted to travel"],0],["Where is the museum entrance?",["At the station","In the hotel","Near the bookshop"],2],["What are they going to do before leaving?",["Buy a train ticket","Check the forecast","Order another sandwich"],1]],"teacherNotes":"5 min. Recognize yesterday's completed actions and planned activities. Answers are explicit in the text."},{"id":"sweden-02-hw-2","title":"03 · Yesterday or tomorrow?","minutes":3,"instruction":"GRAMMAR · 3 min. Choose a past action or a future plan.","type":"gap","items":[["Yesterday I ___ to the hotel.",["walked","am going to walk","walking"],0],["Tomorrow I ___ the museum.",["visited yesterday","am going to visit","visiting yesterday"],1],["Last night we ___ tea in the room.",["are going to drink","drink tomorrow","drank"],2],["This afternoon she ___ the forecast.",["is going to check","checked last night","check yesterday"],0]],"teacherNotes":"3 min. Compare signal words yesterday/last night and tomorrow/this afternoon."},{"id":"sweden-02-hw-3","title":"04 · Your first-day message","minutes":5,"instruction":"PERSONAL WRITING · 5 min. Write 60–80 words to a friend about your first day in Sweden.","type":"write","source":["Tell your friend TWO things you did yesterday, TWO things you are going to do today and what you plan to do if it rains.","Use at least FOUR target phrases: eat in · take away · a receipt · an entrance · around the corner · a forecast.","MODEL START · 'Hi! Yesterday I arrived in Stockholm and… Today I'm going to…'","CHECK · Are your past verbs correct? Do you use 'going to' with an infinitive? Is your message easy to understand?"],"teacherNotes":"5 min. Evaluate clarity and concrete actions, not sophisticated grammatical range. Homework reinforces Lesson 02."}]}</script><script src="assets/gostudy-v1-lesson.js"></script><script src="assets/gostudy-michael-chat.js?v=1"></script><script src="assets/gostudy-sync.js?v=unified-112"></script><script src="assets/gostudy-sweden-cloud-words.js?v=1"></script><script src="assets/gostudy-v1-exercises.js"></script><script src="assets/gostudy-v1-workbook.js"></script></body></html>
