<script type="application/json" id="lesson-data">{"title":"From Discovery to Value: The Follow-Up That Wins Trust","hero":"From Discovery to Value: The Follow-Up That Wins Trust","cabinet":"student-first-sales.html","footer":"GoStudy · First Sales C1 · 50 minutes · No homework assigned","key":"gostudy-first-sales-c1-03-v1","wordsKey":"gostudy-first-sales-shared-v1","preserve":"cloud","followStudent":false,"course":"first-sales","durationMinutes":50,"lessonWords":[{"en":"qualification criteria","ru":"критерии квалификации потенциального клиента"},{"en":"decision-maker","ru":"лицо, принимающее решение"},{"en":"business impact","ru":"влияние на бизнес"},{"en":"value proposition","ru":"ценностное предложение"},{"en":"proof of concept","ru":"проверка концепции на практике"},{"en":"overpromise","ru":"давать чрезмерные обещания"},{"en":"trade-off","ru":"компромисс между альтернативами"},{"en":"next steps","ru":"следующие шаги"}],"steps":[{"id":"fs3-recap","title":"01 · After the discovery call","label":"After the discovery call · 5 min","minutes":5,"teacherNotes":"Bridge from lesson 2. Do not promise a quantified return; ask for evidence and a calm opening.","html":"\n\u003cdiv class=\"fs3-eyebrow\"\u003eLESSON 3 · FROM DISCOVERY TO A RECOMMENDATION\u003c/div\u003e\u003ch3\u003eWhat did we learn about Jordan?\u003c/h3\u003e\u003cp\u003eIn the previous lesson you practised a discovery call with Jordan, who manages a two-location physiotherapy clinic. Now you must turn that information into a \u003cstrong\u003ecredible recommendation\u003c/strong\u003e — without inventing facts or promising guaranteed results.\u003c/p\u003e\n\u003cdiv class=\"fs3-card-grid\"\u003e\u003csection class=\"material-card\"\u003e\u003cstrong\u003eThe current process\u003c/strong\u003e\u003cp\u003eTwo receptionists send reminders manually.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"material-card\"\u003e\u003cstrong\u003ePossible problem\u003c/strong\u003e\u003cp\u003ePatients sometimes miss appointments.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"material-card\"\u003e\u003cstrong\u003eConcern\u003c/strong\u003e\u003cp\u003eThe team disliked a previous system change.\u003c/p\u003e\u003c/section\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003eDiscuss:\u003c/strong\u003e What do we know for certain? What still needs verification? What would be an irresponsible promise?\u003c/p\u003e\n\u003cdiv class=\"question-item\"\u003e\u003cstrong\u003eOne thing we know and one assumption we must check\u003c/strong\u003e\u003ctextarea rows=\"2\" maxlength=\"3500\" data-exercise-field=\"fs3-recap-note\" aria-label=\"One thing we know and one assumption we must check\" placeholder=\"We know …, but we still need to find out …\"\u003e\u003c/textarea\u003e\u003c/div\u003e\n"},{"id":"fs3-brief","title":"02 · Read the follow-up: a buyer who is interested but cautious","label":"Read the follow-up: a buyer who is interested but cautious · 9 min","minutes":9,"teacherNotes":"Use original classroom material, not an external proprietary source. Correct reading answers B,C,A,B. Stress claims are uncertain until measured.","html":"\n\u003cdiv class=\"fs3-eyebrow\"\u003eREADING · ORIGINAL CASE STUDY · LOOPDESK\u003c/div\u003e\n\u003cdiv class=\"fs3-thread\"\u003e\u003cp class=\"fs3-thread-heading\"\u003e\u003cstrong\u003eFrom:\u003c/strong\u003e Jordan, Clinic Owner\u003cbr\u003e\u003cstrong\u003eTo:\u003c/strong\u003e You, LoopDesk trainee\u003cbr\u003e\u003cstrong\u003eSubject:\u003c/strong\u003e Follow-up after our call\u003c/p\u003e\n\u003cp\u003eThanks for listening yesterday. Your questions helped us clarify what's actually happening. We have two receptionists, and each spends around 25 minutes a day sending appointment reminders. On busy weeks, we think we lose six to eight appointments, although our records aren't reliable enough to confirm the exact figure.\u003c/p\u003e\n\u003cp\u003eI'm curious whether LoopDesk could take some of that work off the team's plate. However, the staff had a bad experience when we tried to switch tools last year. I'm not interested in replacing our calendar or disrupting reception just to try another app.\u003c/p\u003e\n\u003cp\u003eIf you can explain how a small trial would work, what it would cost in staff time and how we'd decide whether it was successful, I'd be happy to involve Priya, our operations manager. She would have to approve any pilot.\u003c/p\u003e\u003cp\u003eBest,\u003cbr\u003eJordan\u003c/p\u003e\u003c/div\u003e\n\u003ch3\u003eExercise 1 · Read between the lines\u003c/h3\u003e\n\u003cdiv class=\"fs3-mcq\"\u003e\u003cstrong\u003e1. What is Jordan\u0026#39;s strongest concern?\u003c/strong\u003e\u003cdiv class=\"gap-item fs3-question\" data-answer-row\u003e\u003clabel for=\"fs3-read-1\"\u003eA. No one ever misses appointments / B. A new system could disrupt staff and replace existing tools / C. The business has no decision-maker\u003c/label\u003e\u003cselect id=\"fs3-read-1\" aria-label=\"A. No one ever misses appointments / B. A new system could disrupt staff and replace existing tools / C. The business has no decision-maker\" data-gap=\"B\"\u003e\u003coption value=\"\"\u003eChoose your answer…\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003c/select\u003e\u003cspan class=\"feedback\" data-grade\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"fs3-mcq\"\u003e\u003cstrong\u003e2. Why is a guaranteed revenue claim premature?\u003c/strong\u003e\u003cdiv class=\"gap-item fs3-question\" data-answer-row\u003e\u003clabel for=\"fs3-read-2\"\u003eA. The customer already signed a contract / B. LoopDesk has no customers anywhere / C. The missed-appointment figure is not verified\u003c/label\u003e\u003cselect id=\"fs3-read-2\" aria-label=\"A. The customer already signed a contract / B. LoopDesk has no customers anywhere / C. The missed-appointment figure is not verified\" data-gap=\"C\"\u003e\u003coption value=\"\"\u003eChoose your answer…\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003c/select\u003e\u003cspan class=\"feedback\" data-grade\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"fs3-mcq\"\u003e\u003cstrong\u003e3. Who must approve the trial?\u003c/strong\u003e\u003cdiv class=\"gap-item fs3-question\" data-answer-row\u003e\u003clabel for=\"fs3-read-3\"\u003eA. The operations manager, Priya / B. The two receptionists individually / C. The sales trainee\u003c/label\u003e\u003cselect id=\"fs3-read-3\" aria-label=\"A. The operations manager, Priya / B. The two receptionists individually / C. The sales trainee\" data-gap=\"A\"\u003e\u003coption value=\"\"\u003eChoose your answer…\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003c/select\u003e\u003cspan class=\"feedback\" data-grade\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"fs3-mcq\"\u003e\u003cstrong\u003e4. What would be the most sensible follow-up?\u003c/strong\u003e\u003cdiv class=\"gap-item fs3-question\" data-answer-row\u003e\u003clabel for=\"fs3-read-4\"\u003eA. Send an annual contract immediately / B. Offer a limited pilot with success criteria and minimal disruption / C. Promise to eliminate all missed visits\u003c/label\u003e\u003cselect id=\"fs3-read-4\" aria-label=\"A. Send an annual contract immediately / B. Offer a limited pilot with success criteria and minimal disruption / C. Promise to eliminate all missed visits\" data-gap=\"B\"\u003e\u003coption value=\"\"\u003eChoose your answer…\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003c/select\u003e\u003cspan class=\"feedback\" data-grade\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n\u003ch3\u003eExercise 2 · Identify evidence gaps\u003c/h3\u003e\n\u003cdiv class=\"question-item\"\u003e\u003cstrong\u003eName two facts you would verify before claiming a financial benefit\u003c/strong\u003e\u003ctextarea rows=\"2\" maxlength=\"3500\" data-exercise-field=\"fs3-read-evidence\" aria-label=\"Name two facts you would verify before claiming a financial benefit\" placeholder=\"I\u0026#39;d want to confirm … and …\"\u003e\u003c/textarea\u003e\u003c/div\u003e\n"},{"id":"fs3-vocab","title":"03 · Vocabulary: talk about value precisely","label":"Vocabulary: talk about value precisely · 7 min","minutes":7,"teacherNotes":"8 vocabulary units. Matching: D,B,C,A. Gap: business impact, overpromise, trade-off, next steps. Ask for two original examples.","html":"\n\u003cp\u003eFind the expressions in the context of Jordan's situation. Save new expressions and practise them in two formats.\u003c/p\u003e\u003cdiv class=\"vocab\"\u003e\u003carticle\u003e\u003cb\u003equalification criteria\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"0\" aria-label=\"Save qualification criteria to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003eкритерии квалификации потенциального клиента\u003c/p\u003e\u003cspan class=\"tiny\"\u003eThe next step depends on clear qualification criteria.\u003c/span\u003e\u003c/article\u003e\u003carticle\u003e\u003cb\u003edecision-maker\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"1\" aria-label=\"Save decision-maker to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003eлицо, принимающее решение\u003c/p\u003e\u003cspan class=\"tiny\"\u003eThe operations manager is the decision-maker for this pilot.\u003c/span\u003e\u003c/article\u003e\u003carticle\u003e\u003cb\u003ebusiness impact\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"2\" aria-label=\"Save business impact to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003eвлияние на бизнес\u003c/p\u003e\u003cspan class=\"tiny\"\u003eWe need to establish the business impact before proposing a price.\u003c/span\u003e\u003c/article\u003e\u003carticle\u003e\u003cb\u003evalue proposition\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"3\" aria-label=\"Save value proposition to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003eценностное предложение\u003c/p\u003e\u003cspan class=\"tiny\"\u003eOur value proposition focuses on reducing manual reminders.\u003c/span\u003e\u003c/article\u003e\u003carticle\u003e\u003cb\u003eproof of concept\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"4\" aria-label=\"Save proof of concept to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003eпроверка концепции на практике\u003c/p\u003e\u003cspan class=\"tiny\"\u003eA short proof of concept could show whether reminders work here.\u003c/span\u003e\u003c/article\u003e\u003carticle\u003e\u003cb\u003eoverpromise\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"5\" aria-label=\"Save overpromise to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003eдавать чрезмерные обещания\u003c/p\u003e\u003cspan class=\"tiny\"\u003eWe should avoid overpromising savings without evidence.\u003c/span\u003e\u003c/article\u003e\u003carticle\u003e\u003cb\u003etrade-off\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"6\" aria-label=\"Save trade-off to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003eкомпромисс между альтернативами\u003c/p\u003e\u003cspan class=\"tiny\"\u003eThere is a trade-off between a quick launch and staff training.\u003c/span\u003e\u003c/article\u003e\u003carticle\u003e\u003cb\u003enext steps\u003c/b\u003e \u003cbutton type=\"button\" data-lesson-word=\"7\" aria-label=\"Save next steps to vocabulary\"\u003e＋ Save word\u003c/button\u003e\u003cp\u003eследующие шаги\u003c/p\u003e\u003cspan class=\"tiny\"\u003eLet\u0026#39;s agree on next steps and who should be involved.\u003c/span\u003e\u003c/article\u003e\u003c/div\u003e\n\u003ch3\u003eExercise 3 · Match the concepts\u003c/h3\u003e\u003cdiv class=\"fs3-defs\"\u003e\u003cp\u003e\u003cb\u003eA\u003c/b\u003e · A structured small-scale test to find out if a solution works\u003c/p\u003e\u003cp\u003e\u003cb\u003eB\u003c/b\u003e · A person authorised to approve a purchase or pilot\u003c/p\u003e\u003cp\u003e\u003cb\u003eC\u003c/b\u003e · The benefit a solution promises a customer\u003c/p\u003e\u003cp\u003e\u003cb\u003eD\u003c/b\u003e · Criteria used to decide whether a lead is a good fit\u003c/p\u003e\u003c/div\u003e\n\u003cdiv class=\"gap-item fs3-question\" data-answer-row\u003e\u003clabel for=\"fs3-match-1\"\u003equalification criteria\u003c/label\u003e\u003cselect id=\"fs3-match-1\" aria-label=\"qualification criteria\" data-gap=\"D\"\u003e\u003coption value=\"\"\u003eChoose your answer…\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\u003c/select\u003e\u003cspan class=\"feedback\" data-grade\u003e\u003c/span\u003e\u003c/div\u003e\n\u003cdiv class=\"gap-item fs3-question\" data-answer-row\u003e\u003clabel for=\"fs3-match-2\"\u003edecision-maker\u003c/label\u003e\u003cselect id=\"fs3-match-2\" aria-label=\"decision-maker\" data-gap=\"B\"\u003e\u003coption value=\"\"\u003eChoose your answer…\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\u003c/select\u003e\u003cspan class=\"feedback\" data-grade\u003e\u003c/span\u003e\u003c/div\u003e\n\u003cdiv class=\"gap-item fs3-question\" data-answer-row\u003e\u003clabel for=\"fs3-match-3\"\u003evalue proposition\u003c/label\u003e\u003cselect id=\"fs3-match-3\" aria-label=\"value proposition\" data-gap=\"C\"\u003e\u003coption value=\"\"\u003eChoose your answer…\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\u003c/select\u003e\u003cspan class=\"feedback\" data-grade\u003e\u003c/span\u003e\u003c/div\u003e\n\u003cdiv class=\"gap-item fs3-question\" data-answer-row\u003e\u003clabel for=\"fs3-match-4\"\u003eproof of concept\u003c/label\u003e\u003cselect id=\"fs3-match-4\" aria-label=\"proof of concept\" data-gap=\"A\"\u003e\u003coption value=\"\"\u003eChoose your answer…\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003coption value=\"D\"\u003eD\u003c/option\u003e\u003c/select\u003e\u003cspan class=\"feedback\" data-grade\u003e\u003c/span\u003e\u003c/div\u003e\n\u003ch3\u003eExercise 4 · Complete the sentences\u003c/h3\u003e\n\u003cdiv class=\"gap-item fs3-question\" data-answer-row\u003e\u003clabel for=\"fs3-gap-1\"\u003eBefore discussing ROI, we need to measure the ______.\u003c/label\u003e\u003cselect id=\"fs3-gap-1\" aria-label=\"Before discussing ROI, we need to measure the ______.\" data-gap=\"business impact\"\u003e\u003coption value=\"\"\u003eChoose your answer…\u003c/option\u003e\u003coption value=\"business impact\"\u003ebusiness impact\u003c/option\u003e\u003coption value=\"trade-off\"\u003etrade-off\u003c/option\u003e\u003coption value=\"decision-maker\"\u003edecision-maker\u003c/option\u003e\u003c/select\u003e\u003cspan class=\"feedback\" data-grade\u003e\u003c/span\u003e\u003c/div\u003e\n\u003cdiv class=\"gap-item fs3-question\" data-answer-row\u003e\u003clabel for=\"fs3-gap-2\"\u003eWe shouldn\u0026#39;t ______ when the data isn\u0026#39;t verified.\u003c/label\u003e\u003cselect id=\"fs3-gap-2\" aria-label=\"We shouldn\u0026#39;t ______ when the data isn\u0026#39;t verified.\" data-gap=\"overpromise\"\u003e\u003coption value=\"\"\u003eChoose your answer…\u003c/option\u003e\u003coption value=\"proof of concept\"\u003eproof of concept\u003c/option\u003e\u003coption value=\"overpromise\"\u003eoverpromise\u003c/option\u003e\u003coption value=\"next steps\"\u003enext steps\u003c/option\u003e\u003c/select\u003e\u003cspan class=\"feedback\" data-grade\u003e\u003c/span\u003e\u003c/div\u003e\n\u003cdiv class=\"gap-item fs3-question\" data-answer-row\u003e\u003clabel for=\"fs3-gap-3\"\u003eThere\u0026#39;s a ______ between a fast rollout and additional staff training.\u003c/label\u003e\u003cselect id=\"fs3-gap-3\" aria-label=\"There\u0026#39;s a ______ between a fast rollout and additional staff training.\" data-gap=\"trade-off\"\u003e\u003coption value=\"\"\u003eChoose your answer…\u003c/option\u003e\u003coption value=\"trade-off\"\u003etrade-off\u003c/option\u003e\u003coption value=\"qualification criteria\"\u003equalification criteria\u003c/option\u003e\u003coption value=\"business impact\"\u003ebusiness impact\u003c/option\u003e\u003c/select\u003e\u003cspan class=\"feedback\" data-grade\u003e\u003c/span\u003e\u003c/div\u003e\n\u003cdiv class=\"gap-item fs3-question\" data-answer-row\u003e\u003clabel for=\"fs3-gap-4\"\u003eWe agreed on concrete ______ with Priya for Tuesday.\u003c/label\u003e\u003cselect id=\"fs3-gap-4\" aria-label=\"We agreed on concrete ______ with Priya for Tuesday.\" data-gap=\"next steps\"\u003e\u003coption value=\"\"\u003eChoose your answer…\u003c/option\u003e\u003coption value=\"business impact\"\u003ebusiness impact\u003c/option\u003e\u003coption value=\"next steps\"\u003enext steps\u003c/option\u003e\u003coption value=\"proof of concept\"\u003eproof of concept\u003c/option\u003e\u003c/select\u003e\u003cspan class=\"feedback\" data-grade\u003e\u003c/span\u003e\u003c/div\u003e\n"},{"id":"fs3-language","title":"04 · Language focus: confident, but not overconfident","label":"Language focus: confident, but not overconfident · 7 min","minutes":7,"teacherNotes":"B,A,C correct. Teach hedging as sales precision, not lack of confidence.","html":"\n\u003cdiv class=\"tip\"\u003e\u003cstrong\u003eC1 communication toolkit\u003c/strong\u003e\u003cp\u003eInstead of \u003cem\u003eWe will eliminate missed appointments\u003c/em\u003e, try \u003cstrong\u003eOur pilot could help reduce the number of missed appointments, provided that…\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eUse \u003cstrong\u003emay / could / is likely to / provided that / subject to / would allow us to…\u003c/strong\u003e to distinguish possibilities from guarantees.\u003c/p\u003e\u003c/div\u003e\n\u003ch3\u003eExercise 5 · Choose the more responsible phrasing\u003c/h3\u003e\n\u003cdiv class=\"fs3-mcq\"\u003e\u003cstrong\u003e1. The clinic\u0026#39;s records are incomplete. Choose the best sales claim.\u003c/strong\u003e\u003cdiv class=\"gap-item fs3-question\" data-answer-row\u003e\u003clabel for=\"fs3-hedge-1\"\u003eA. Our platform guarantees 100% fewer no-shows. / B. A short pilot could help us measure the effect on missed appointments. / C. You\u0026#39;ll definitely save thousands every week.\u003c/label\u003e\u003cselect id=\"fs3-hedge-1\" aria-label=\"A. Our platform guarantees 100% fewer no-shows. / B. A short pilot could help us measure the effect on missed appointments. / C. You\u0026#39;ll definitely save thousands every week.\" data-gap=\"B\"\u003e\u003coption value=\"\"\u003eChoose your answer…\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003c/select\u003e\u003cspan class=\"feedback\" data-grade\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"fs3-mcq\"\u003e\u003cstrong\u003e2. You have not tested calendar integration. Choose the best promise.\u003c/strong\u003e\u003cdiv class=\"gap-item fs3-question\" data-answer-row\u003e\u003clabel for=\"fs3-hedge-2\"\u003eA. We\u0026#39;d first need to confirm compatibility with your current calendar. / B. Our system always integrates with anything. / C. We can replace the whole workflow tomorrow.\u003c/label\u003e\u003cselect id=\"fs3-hedge-2\" aria-label=\"A. We\u0026#39;d first need to confirm compatibility with your current calendar. / B. Our system always integrates with anything. / C. We can replace the whole workflow tomorrow.\" data-gap=\"A\"\u003e\u003coption value=\"\"\u003eChoose your answer…\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003c/select\u003e\u003cspan class=\"feedback\" data-grade\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"fs3-mcq\"\u003e\u003cstrong\u003e3. A decision-maker needs evidence. Choose the strongest proposal.\u003c/strong\u003e\u003cdiv class=\"gap-item fs3-question\" data-answer-row\u003e\u003clabel for=\"fs3-hedge-3\"\u003eA. Our product is revolutionary, trust us. / B. You should commit for a year before testing. / C. Let\u0026#39;s agree on a measurable outcome and review it after a limited trial.\u003c/label\u003e\u003cselect id=\"fs3-hedge-3\" aria-label=\"A. Our product is revolutionary, trust us. / B. You should commit for a year before testing. / C. Let\u0026#39;s agree on a measurable outcome and review it after a limited trial.\" data-gap=\"C\"\u003e\u003coption value=\"\"\u003eChoose your answer…\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003c/select\u003e\u003cspan class=\"feedback\" data-grade\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n\u003ch3\u003eExercise 6 · Rewrite one claim\u003c/h3\u003e\n\u003cdiv class=\"question-item\"\u003e\u003cstrong\u003eRewrite: “LoopDesk will definitely cut your costs in half.”\u003c/strong\u003e\u003ctextarea rows=\"2\" maxlength=\"3500\" data-exercise-field=\"fs3-rewrite\" aria-label=\"Rewrite: “LoopDesk will definitely cut your costs in half.”\" placeholder=\"A pilot may help us …, provided that …\"\u003e\u003c/textarea\u003e\u003c/div\u003e\n"},{"id":"fs3-numbers","title":"05 · The value lab: what can we actually calculate?","label":"The value lab: what can we actually calculate? · 8 min","minutes":8,"teacherNotes":"Math: 250 minutes weekly at current estimated effort; savings are hypothetical. Key A,C,B. Support realistic metrics and clear decision rights.","html":"\n\u003cdiv class=\"fs3-eyebrow\"\u003eDATA LAB · CLINIC OPERATIONS\u003c/div\u003e\u003cp\u003eThe figures below come from Jordan's message and are \u003cstrong\u003eillustrative customer-reported estimates\u003c/strong\u003e, not independently verified results.\u003c/p\u003e\n\u003cdiv class=\"fs3-stats\"\u003e\u003cdiv\u003e\u003cb\u003e2\u003c/b\u003e\u003csmall\u003ereceptionists\u003c/small\u003e\u003c/div\u003e\u003cdiv\u003e\u003cb\u003e25 min\u003c/b\u003e\u003csmall\u003eper person per day\u003c/small\u003e\u003c/div\u003e\u003cdiv\u003e\u003cb\u003e5 days\u003c/b\u003e\u003csmall\u003eworking week\u003c/small\u003e\u003c/div\u003e\u003cdiv\u003e\u003cb\u003e6–8\u003c/b\u003e\u003csmall\u003epossible missed visits/week\u003c/small\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"fs3-calculation\"\u003e\u003cp\u003e\u003cstrong\u003eWeekly reminder time:\u003c/strong\u003e 2 × 25 × 5 = \u003cstrong\u003e250 minutes ≈ 4 h 10 min\u003c/strong\u003e\u003c/p\u003e\u003cp\u003eCould automation save this time? Possibly — but the potential saving depends on usage, setup and actual performance.\u003c/p\u003e\u003c/div\u003e\n\u003ch3\u003eExercise 7 · What do the numbers justify?\u003c/h3\u003e\n\u003cdiv class=\"fs3-mcq\"\u003e\u003cstrong\u003e1. How much time does Jordan report spending on reminders per week?\u003c/strong\u003e\u003cdiv class=\"gap-item fs3-question\" data-answer-row\u003e\u003clabel for=\"fs3-calc-1\"\u003eA. 250 minutes / B. 50 minutes / C. 500 minutes\u003c/label\u003e\u003cselect id=\"fs3-calc-1\" aria-label=\"A. 250 minutes / B. 50 minutes / C. 500 minutes\" data-gap=\"A\"\u003e\u003coption value=\"\"\u003eChoose your answer…\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003c/select\u003e\u003cspan class=\"feedback\" data-grade\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"fs3-mcq\"\u003e\u003cstrong\u003e2. What do we need before calculating a reliable financial return?\u003c/strong\u003e\u003cdiv class=\"gap-item fs3-question\" data-answer-row\u003e\u003clabel for=\"fs3-calc-2\"\u003eA. Only the product\u0026#39;s colour scheme / B. A competitor\u0026#39;s advertising slogan / C. Real no-show counts, staff costs and measurable pilot results\u003c/label\u003e\u003cselect id=\"fs3-calc-2\" aria-label=\"A. Only the product\u0026#39;s colour scheme / B. A competitor\u0026#39;s advertising slogan / C. Real no-show counts, staff costs and measurable pilot results\" data-gap=\"C\"\u003e\u003coption value=\"\"\u003eChoose your answer…\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003c/select\u003e\u003cspan class=\"feedback\" data-grade\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"fs3-mcq\"\u003e\u003cstrong\u003e3. What is an appropriate success metric for the pilot?\u003c/strong\u003e\u003cdiv class=\"gap-item fs3-question\" data-answer-row\u003e\u003clabel for=\"fs3-calc-3\"\u003eA. Number of marketing buzzwords / B. Reduction in manual reminder time without disrupting clinic operations / C. A promise of zero missed appointments\u003c/label\u003e\u003cselect id=\"fs3-calc-3\" aria-label=\"A. Number of marketing buzzwords / B. Reduction in manual reminder time without disrupting clinic operations / C. A promise of zero missed appointments\" data-gap=\"B\"\u003e\u003coption value=\"\"\u003eChoose your answer…\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003c/select\u003e\u003cspan class=\"feedback\" data-grade\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n\u003ch3\u003eExercise 8 · Recommend a pilot\u003c/h3\u003e\n\u003cdiv class=\"question-item\"\u003e\u003cstrong\u003eDescribe a two-week pilot: what would you measure and who approves it?\u003c/strong\u003e\u003ctextarea rows=\"3\" maxlength=\"3500\" data-exercise-field=\"fs3-pilot\" aria-label=\"Describe a two-week pilot: what would you measure and who approves it?\" placeholder=\"We could trial … for two weeks, provided that … We would measure … Priya would …\"\u003e\u003c/textarea\u003e\u003c/div\u003e\n"},{"id":"fs3-objections","title":"06 · Objection clinic: keep the conversation open","label":"Objection clinic: keep the conversation open · 6 min","minutes":6,"teacherNotes":"6 min role-play. First teacher plays Priya; second round change objection; focus on natural conversational English. Correct C.","html":"\n\u003cp\u003e\u003cstrong\u003eYour role:\u003c/strong\u003e SDR at LoopDesk. \u003cstrong\u003eTeacher:\u003c/strong\u003e Priya, operations manager, sceptical about software changes. Respond without dismissing the concern.\u003c/p\u003e\n\u003cdiv class=\"fs3-card-grid\"\u003e\u003csection class=\"material-card\"\u003e\u003cstrong\u003eObjection A\u003c/strong\u003e\u003cp\u003e“We tried a new system last year. It was a disaster.”\u003c/p\u003e\u003c/section\u003e\u003csection class=\"material-card\"\u003e\u003cstrong\u003eObjection B\u003c/strong\u003e\u003cp\u003e“How do I know this will actually save money?”\u003c/p\u003e\u003c/section\u003e\u003csection class=\"material-card\"\u003e\u003cstrong\u003eObjection C\u003c/strong\u003e\u003cp\u003e“I don't want my staff to learn a complicated new tool.”\u003c/p\u003e\u003c/section\u003e\u003c/div\u003e\n\u003ch3\u003eExercise 9 · Choose the most effective response\u003c/h3\u003e\n\u003cdiv class=\"fs3-mcq\"\u003e\u003cstrong\u003eWhat should you say to Priya?\u003c/strong\u003e\u003cdiv class=\"gap-item fs3-question\" data-answer-row\u003e\u003clabel for=\"fs3-objection-1\"\u003eA. Then your staff must be bad with technology. / B. No need to worry, every software tool is identical. / C. That sounds frustrating. Could we first understand what went wrong and design a limited trial around those concerns?\u003c/label\u003e\u003cselect id=\"fs3-objection-1\" aria-label=\"A. Then your staff must be bad with technology. / B. No need to worry, every software tool is identical. / C. That sounds frustrating. Could we first understand what went wrong and design a limited trial around those concerns?\" data-gap=\"C\"\u003e\u003coption value=\"\"\u003eChoose your answer…\u003c/option\u003e\u003coption value=\"A\"\u003eA\u003c/option\u003e\u003coption value=\"B\"\u003eB\u003c/option\u003e\u003coption value=\"C\"\u003eC\u003c/option\u003e\u003c/select\u003e\u003cspan class=\"feedback\" data-grade\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"question-item\"\u003e\u003cstrong\u003eWrite one alternative reply using acknowledgement + question + next step\u003c/strong\u003e\u003ctextarea rows=\"3\" maxlength=\"3500\" data-exercise-field=\"fs3-objection-own\" aria-label=\"Write one alternative reply using acknowledgement + question + next step\" placeholder=\"I can understand why … Could you tell me …? If so, we could …\"\u003e\u003c/textarea\u003e\u003c/div\u003e\n\u003cdiv class=\"tip\"\u003e\u003cstrong\u003eTeacher challenge\u003c/strong\u003e\u003cp\u003eChange the objection after the first round. Ask for evidence, rollout impact and who will evaluate success.\u003c/p\u003e\u003c/div\u003e\n"},{"id":"fs3-followup","title":"07 · Write a follow-up the buyer would actually read","label":"Write a follow-up the buyer would actually read · 6 min","minutes":6,"teacherNotes":"Mark for accuracy, professional tone, hedging, measurability. Do not assign as homework; do during class. 50-70 words.","html":"\n\u003cdiv class=\"fs3-eyebrow\"\u003eREAL-WORLD WRITING · 50–70 WORDS\u003c/div\u003e\u003cp\u003eYou finished a helpful discussion with Jordan and Priya. Write a concise follow-up email. No exaggerated ROI claims.\u003c/p\u003e\n\u003cdiv class=\"fs3-checklist\"\u003e\u003cstrong\u003eInclude:\u003c/strong\u003e\u003cul\u003e\u003cli\u003eThe problem they described, in their own terms\u003c/li\u003e\u003cli\u003eA limited pilot, with two measurable success criteria\u003c/li\u003e\u003cli\u003eThe decision-maker and a concrete next step\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\n\u003cdiv class=\"question-item\"\u003e\u003cstrong\u003eDraft your email (50–70 words)\u003c/strong\u003e\u003ctextarea rows=\"5\" maxlength=\"3500\" data-exercise-field=\"fs3-email\" aria-label=\"Draft your email (50–70 words)\" placeholder=\"Hi Jordan and Priya,\nThank you for discussing …\n…\"\u003e\u003c/textarea\u003e\u003c/div\u003e\n\u003cdetails class=\"fs3-model\"\u003e\u003csummary\u003eTeacher's model answer · compare after writing\u003c/summary\u003e\u003cp\u003eHi Jordan and Priya,\u003cbr\u003eThanks for explaining your reminder process and concerns about changing systems. A two-week pilot could help us measure staff time spent on reminders and the number of missed appointments, without committing to a full rollout. We'd first confirm compatibility with your calendar. Could we schedule a 15-minute planning call with Priya next Tuesday?\u003cbr\u003eBest,\u003cbr\u003eAlex\u003c/p\u003e\u003c/details\u003e\n"},{"id":"fs3-exit","title":"08 · What would you say differently next time?","label":"What would you say differently next time? · 2 min","minutes":2,"teacherNotes":"Teacher elicits final 20-30 second answer. Homework is explicitly not assigned.","html":"\n\u003cdiv class=\"tip\"\u003e\u003cstrong\u003eExit ticket — one strong sentence\u003c/strong\u003e\u003cp\u003eComplete the sentence using two target expressions: \u003cem\u003eBefore recommending LoopDesk, I would … because …\u003c/em\u003e\u003c/p\u003e\u003c/div\u003e\n\u003cdiv class=\"question-item\"\u003e\u003cstrong\u003eYour takeaway\u003c/strong\u003e\u003ctextarea rows=\"2\" maxlength=\"3500\" data-exercise-field=\"fs3-exit-note\" aria-label=\"Your takeaway\" placeholder=\"Before recommending LoopDesk, I would …\"\u003e\u003c/textarea\u003e\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003eReflection:\u003c/strong\u003e What changed between Lesson 2 (discovery) and Lesson 3 (recommendation)?\u003c/p\u003e\n"}],"sources":[{"title":"Original GoStudy classroom case continuing Your First Discovery Call","url":"first-sales-c1-02.html"}]}</script>
