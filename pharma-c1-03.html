<script>
'use strict';
const CLIPS=[{"qs":[["What does the speaker suggest before a wider launch?",["A local pilot.","Removing doctors from the process.","Buying the software immediately."],0],["Why might the Swedish results differ at this hospital?",["It would only see patients online.","It may use different machines and serve different patients.","It already knows the outcome."],1],["Which outcomes does the speaker want to track?",["Only the price of the software.","Only how quickly staff log in.","Missed cases and unnecessary follow-up appointments."],2]]},{"qs":[["What changed in the AI-supported group?",["Software helped flag areas and decide how many doctors should read each exam.","Patients took their own X-rays.","Software made the final decision on its own."],0],["What does the 44% figure describe?",["A fall in the number of people attending screening.","A reduction in the number of exam readings.","A reduction in the number of cancer cases."],1],["What could a hospital reasonably ask next?",["Whether the trial proved that every AI tool works.","Whether patients can be screened without medical staff.","Whether the tool gives similar results in its own screening programme."],2]]},{"qs":[["What does 6.4 versus 5.0 per 1,000 show?",["About 1.4 more cancers detected per 1,000 people screened in the AI-supported group.","An increase of 1.4 percentage points in cancer risk.","1,400 extra cancers for every 1,000 women."],0],["Which headline best fits the evidence?",["AI now diagnoses cancer without doctors.","AI-assisted screening detected more cancers in a Swedish trial.","Swedish trial proves that every hospital will save time."],1]]}];
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key='gostudy-pharma-c1-03-v1';let state={page:0,answers:{},words:[],dark:false};let storage=true;
try{const s=JSON.parse(GoStudyStorage.getItem(key)||'null');if(s&&typeof s==='object'){state={...state,...s};state.answers=s.answers&&typeof s.answers==='object'?s.answers:{};state.words=Array.isArray(s.words)?s.words.filter(w=>w&&typeof w.en==='string'&&typeof w.ru==='string'):[];}}catch(e){storage=false;}
const sharedWordKey="gostudy-pharma-c1-v1";
let lastWords = '';
function readSharedWords(){
  try {
    const shared = JSON.parse(GoStudyStorage.getItem(sharedWordKey) || '{}');
    if(Array.isArray(shared.words)) state.words = shared.words.filter(w=>w&&typeof w.en==='string'&&typeof w.ru==='string');
  } catch {}
  lastWords = JSON.stringify(state.words);
}
readSharedWords();
window.addEventListener('pageshow',()=>{readSharedWords();$('#wordCount').textContent=state.words.length;if($('#dictionary').open)renderWords();});
function save(){try{
  const currentWords = JSON.stringify(state.words);
  if(currentWords!==lastWords){
    const shared = JSON.parse(GoStudyStorage.getItem(sharedWordKey)||'{}');
    shared.words=state.words;
    GoStudyStorage.setItem(sharedWordKey,JSON.stringify(shared));
    lastWords=currentWords;
  }
  GoStudyStorage.setItem(key,JSON.stringify(state));}catch(e){storage=false;$('#storageNote').hidden=false;$('#storageNote').textContent='Saving unavailable. Export your answers and vocabulary before closing.';}$('#wordCount').textContent=state.words.length;}
let toastTimer;function notify(s){$('#toast').textContent=s;$('#toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),3200);}
const words=[["screening","скрининг, обследование для раннего выявления","Screening aims to find disease before symptoms appear."],["a mammogram","маммограмма, рентгеновский снимок молочной железы","A radiologist reviews the mammogram."],["to flag a finding","отметить подозрительный участок","The software flags a finding for the doctor to review."],["a false alarm","ложная тревога","A false alarm can lead to extra tests and worry."],["a missed case","пропущенный случай","The team kept track of missed cases."],["reading workload","нагрузка по анализу снимков","The trial measured the reading workload."],["a local pilot","небольшой пробный запуск на месте","The hospital could start with a local pilot."],["to roll out a tool","внедрить инструмент в широкую практику","We should gather more evidence before rolling out the tool."]];
const glossary={"screening":"скрининг, обследование для раннего выявления","a mammogram":"маммограмма, рентгеновский снимок молочной железы","to flag a finding":"отметить подозрительный участок","a false alarm":"ложная тревога","a missed case":"пропущенный случай","reading workload":"нагрузка по анализу снимков","a local pilot":"небольшой пробный запуск на месте","to roll out a tool":"внедрить инструмент в широкую практику"};
const norm=s=>s.toLowerCase().replace(/[’]/g,"'").replace(/^[\s.,!?;:]+|[\s.,!?;:]+$/g,'').replace(/\s+/g,' ');

const pages=[["Can AI help doctors spot cancer?","Pharma C1 · Lesson 3",5,"Start with the warm-up and explain screening in one sentence."],["The words you need","Learn eight expressions for talking about the study.",7,"Ask the learner to explain a false alarm in everyday English."],["Two ways to read a scan","Read a short account of the Swedish MASAI trial.",9,"Discuss what the study counted and what remains unknown."],["Before you buy the software","Listen to a hospital manager think through a pilot.",7,"Play once for the main idea, then again for details."],["What do these numbers tell us?","Explain results in plain English.",8,"Emphasise that the unit is people screened, not percentage points."],["Would your hospital use it?","Weigh the benefits and risks in a short role-play.",10,"Play the hospital manager or patient representative."],["Rewrite the headline","Make a strong claim more accurate.",7,"Offer one language correction and one correction to the claim."],["Your 60-second verdict","Summarise a result, a limit and a next step.",4,"Ask the learner for one decision and one reason."]];
function area(id,placeholder,rows=3){return '<textarea data-answer="'+id+'" aria-label="'+esc(placeholder)+'" rows="'+rows+'" placeholder="'+esc(placeholder)+'">'+esc(state.answers[id]||'')+'</textarea>';}
function card(title,body){return '<article class="card"><h2>'+title+'</h2>'+body+'</article>';}
function promptBox(title,text){return '<div class="prompt"><h3>'+title+'</h3><p>'+text+'</p></div>';}
function b2mc(group,qs){return qs.map((q,i)=>{const id='q'+group+'-'+i;return '<div class="question"><p>'+(i+1)+'. '+esc(q[0])+'</p><div class="options">'+q[1].map((v,j)=>'<span class="option"><input type="radio" aria-labelledby="'+id+'-text-'+j+'" name="'+id+'" data-q="'+group+':'+i+'" value="'+j+'" '+(state.answers[id]===v?'checked':'')+'><span class="option-text" id="'+id+'-text-'+j+'">'+esc(v)+'</span></span>').join('')+'</div><div class="feedback" id="fb-'+id+'" role="status"></div></div>';}).join('');}
function feedWelcome(){return card("A second set of eyes","<img class=\"travel-cover\" src=\"assets/pharma-c1-03-cover.jpg\" width=\"1200\" height=\"800\" alt=\"A radiologist reviewing images in a hospital reading room\"><p>A doctor and an AI tool look at the same X-ray. They disagree. What would you want to happen next?</p><p>In this lesson, you’ll look at a real Swedish study, explain what improved and decide what a hospital should check before introducing the tool.</p><details><summary>Подсказка преподавателю</summary><p>Маммограмма — рентгеновский снимок молочной железы. В исследовании ИИ подсказывал, куда посмотреть и сколько врачей должны прочитать снимок. Решение принимали врачи. В конце сыграйте руководителя больницы и предложите ученице решить, нужен ли пробный запуск.</p></details>");}
const VOCAB_GAPS=[["coll0","Please close the ___ behind you.","gate"],["coll1","I need a ___ when it gets dark.","torch"],["coll2","Can you sweep the ___ before our guests arrive?","floor"],["coll3","Please put ___ the tools before it rains.","away"]];
function feedWords(){return card("Useful language",'<div class="word-grid">'+words.map(([en,ru,ex],i)=>'<div class="vocab-card"><strong>'+esc(en)+'</strong><p>'+esc(ru)+'</p><p>'+esc(ex)+'</p><button class="small-button" data-add="'+i+'">＋ My words</button></div>').join('')+'</div><p>Explain the difference between a missed case and a false alarm in your own words.</p>');}
function feedReading(){return card("What Sweden tested","<p>Imagine two doctors looking at the same X-ray. One spots a small change that the other nearly misses. Now imagine software that can flag an area for a doctor to inspect. Could that extra help make screening more effective?</p><p>A Swedish study called MASAI tested this idea with more than 105,000 women. In one group, two radiologists routinely read each mammogram. In the other group, software flagged areas that might need attention and helped decide whether one or two radiologists should read each exam. Radiologists still made the decisions.</p><p>At screening, the AI-supported group found 6.4 cancers per 1,000 women. The standard group found 5.0 per 1,000. The researchers also counted roughly 44% fewer readings in the AI group. That measures how many times a doctor read an exam. It does not measure the time each reading took.</p><p>The team followed the women to see how often cancers were diagnosed between screening visits. The AI-supported approach met the trial’s criterion for being no worse than standard screening on that measure. The study offers useful evidence about screening. To know whether the results would hold in another hospital, you would still want evidence from its own equipment, staff and patients.</p><p class=\"study-sources\"><a href=\"https://lup.lub.lu.se/search/publication/b86e819c-27f5-4865-a125-5d6fa8214156\">MASAI · 2025 results</a><a href=\"https://portal.research.lu.se/en/publications/interval-cancer-sensitivity-and-specificity-comparing-ai-supporte/\">MASAI · 2026 follow-up</a></p>")+card("Check the evidence",""+b2mc(1,CLIPS[1].qs));}
function feedListening(){return card("Before you roll it out","<p>Listen to a fictional hospital manager. What would they check before buying the tool?</p><div class=\"audio-box\"><div class=\"audio-top\"><strong>What would we check first?</strong><span>0:44 · English</span></div><audio id=\"lessonAudio\" controls preload=\"metadata\" src=\"assets/pharma-c1-03-listening.mp3\"></audio><details class=\"transcript\"><summary>Показать текст аудио</summary><p>Imagine you run a hospital screening programme. You hear that a Swedish team found more cancers at screening with support from AI. You also learn that radiologists had fewer images to read a second time. Both results sound encouraging. But your hospital uses different machines and may serve a different population. So before rolling out the tool, you ask for a local pilot. A pilot is a small trial before a wider launch. You keep doctors responsible for decisions, and you track missed cases and unnecessary follow-up appointments. You also ask staff what happens when a computer flags an image they think looks normal. At the end, the question is simple: did the tool help our team and our patients in practice?</p></details></div>"+b2mc(0,CLIPS[0].qs));}
const FEED_ITEMS=[['🛹','Skateboard tricks in slow motion','sport'],['🔭','Why stars have different colours','science'],['🎧','An artist you have never heard of','music'],['🥘','A recipe using three ingredients','food'],['📷','Street photography without expensive equipment','art'],['⚽','How a team practises a difficult move','sport'],['🌱','A tiny garden on a balcony','science'],['🎸','The same song, five different versions','music'],['🎬','Making a film with paper characters','art']];
function labPicks(){return Array.isArray(state.answers.feedPicks)?state.answers.feedPicks.filter(n=>Number.isInteger(n)&&n>=0&&n<FEED_ITEMS.length).slice(0,3):[];}
function feedLab(){return card("Three numbers, three meanings","<div class=\"study-numbers\"><div class=\"study-stat\"><strong>6.4 per 1,000</strong><p>Cancers detected with AI-supported reading</p></div><div class=\"study-stat\"><strong>5.0 per 1,000</strong><p>Cancers detected with standard reading</p></div><div class=\"study-stat\"><strong>44% fewer</strong><p>Exam readings in the AI-supported group</p></div></div><p>Explain one number in a sentence you could say to a friend.</p>"+b2mc(2,CLIPS[2].qs));}
function feedDebate(){return card("A decision for your hospital","<p>Your local hospital is considering the tool. Would you start a small pilot, wait for more evidence or roll it out now? Give one reason and one condition for your decision.</p><div class=\"study-numbers\"><div class=\"study-stat\"><b>Doctor</b><p>What happens when the tool and the doctor disagree?</p></div><div class=\"study-stat\"><b>Patient</b><p>Could a false alarm lead to extra tests or worry? Who can see my scans?</p></div><div class=\"study-stat\"><b>Hospital manager</b><p>Will it work on our scanners and across different patient groups?</p></div></div><details><summary>Подсказка преподавателю</summary><p>Выбери одну роль и задай один вопрос. Например: если врач и ИИ не согласны, кто отвечает за итоговое решение? Попроси ученицу предложить конкретный способ проверки.</p></details>"+area('pharmaPilot','Your decision, one reason and one condition',3));}

function localTranslation(text){const n=norm(text);if(!/[а-яё]/i.test(n))return glossary[n]||'';const aliases={'загран паспорт':'passport','загранпаспорт':'passport','заграничный паспорт':'passport','посадочный талон':'boarding pass','ручная кладь':'hand luggage','место у окна':'window seat','место у прохода':'aisle seat'};if(aliases[n])return aliases[n];const found=Object.entries(glossary).find(([en,ru])=>ru.split(';').some(part=>norm(part)===n));return found?found[0]:'';}
async function online(text){if(new TextEncoder().encode(text).length>450)throw Error('Выделите более короткую фразу (до 450 байт).');const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);try{const response=await fetch('https://api.mymemory.translated.net/get?'+new URLSearchParams({q:text,langpair:/[а-яё]/i.test(text)?'ru|en':'en|ru'}),{signal:controller.signal,credentials:'omit',referrerPolicy:'no-referrer'});if(!response.ok)throw Error('Сервис временно недоступен. Введите перевод вручную.');const d=await response.json();if(Number(d.responseStatus)!==200||!d.responseData?.translatedText)throw Error('Перевод недоступен. Возможно, исчерпан лимит. Введите перевод вручную.');const doc=new DOMParser().parseFromString(d.responseData.translatedText,'text/html');return doc.documentElement.textContent;}finally{clearTimeout(timeout);}}

const manualWord = $('#newWord');
const manualMeaning = $('#newMeaning');
const manualStatus = $('#dictStatus');
const manualCache = new Map();
let manualVersion = 0;
let manualTimer;
manualMeaning.addEventListener('input', () => {
  manualVersion++;
  clearTimeout(manualTimer);
  manualStatus.textContent = '';
});
function translateWhileTyping(event) {
  clearTimeout(manualTimer);
  const version = ++manualVersion;
  const query = manualWord.value.trim();
  manualMeaning.value = '';
  manualStatus.textContent = '';
  if (!query || event?.isComposing) return;
  const saved = state.words.find(word => norm(word.en) === norm(query))?.ru;
  const immediate = saved || localTranslation(query) || manualCache.get(norm(query));
  if (immediate) {
    manualMeaning.value = immediate;
    return;
  }
  manualStatus.textContent = 'Переводим…';
  manualTimer = setTimeout(async () => {
    try {
      const result = await online(query);
      if (version !== manualVersion || manualWord.value.trim() !== query) return;
      manualCache.set(norm(query), result);
      manualMeaning.value = result;
      manualStatus.textContent = 'Перевод готов. Можно исправить перед сохранением.';
    } catch {
      if (version === manualVersion && manualWord.value.trim() === query) {
        manualStatus.textContent = 'Перевод недоступен. Можно ввести его вручную.';
      }
    }
  }, 300);
}
manualWord.addEventListener('input', translateWhileTyping);
manualWord.addEventListener('compositionend', translateWhileTyping);
$('#wordForm').addEventListener('reset', () => {
  manualVersion++;
  clearTimeout(manualTimer);
  manualStatus.textContent = '';
});

function renderTraining(){const t=training,entry=t.queue[t.index];if(!entry){const known=t.remembered.size;$('#trainingBody').innerHTML='<h3>Тренировка завершена ✓</h3><p>Слов в тренировке: <b>'+t.list.length+'</b></p><p>Вспомнил с первой попытки: <b>'+known+'</b></p><p>Потребовали повторения: <b>'+t.missed.size+'</b></p><p class="muted">Сложные слова были показаны повторно. Это самооценка, а не автоматическая проверка.</p><div class="dict-actions"><button class="primary" id="againTraining">Ещё тренировка</button><button class="small-button" id="returnDictionary">В словарь</button></div>';$('#againTraining').onclick=trainingSetup;$('#returnDictionary').onclick=()=>{$('#trainingDialog').close();openDict();};return;}const w=entry.w;$('#trainingBody').innerHTML='<p class="muted">'+(entry.review?'Повторение сложного слова':'Слово '+(t.index+1)+' из '+t.list.length)+'</p><div class="training-card"><h2>'+esc(t.direction==='en'?w.en:w.ru)+'</h2><p id="trainingAnswer" hidden>'+esc(t.direction==='en'?w.ru:w.en)+'</p><button class="primary" id="revealTraining">Показать перевод</button></div><div id="trainingGrade" class="dict-actions" hidden><button class="primary" id="rememberTraining">✓ Вспомнил</button><button class="small-button" id="repeatTraining">↻ Ещё повторить</button></div>';$('#revealTraining').onclick=()=>{$('#trainingAnswer').hidden=false;$('#revealTraining').hidden=true;$('#trainingGrade').hidden=false;};function grade(remember){if(!entry.review){if(remember)t.remembered.add(norm(w.en));else{t.missed.add(norm(w.en));t.queue.push({w,review:true});}}else if(!remember){t.queue.push({w,review:true});}t.index++;renderTraining();}$('#rememberTraining').onclick=()=>grade(true);$('#repeatTraining').onclick=()=>grade(false);}



$('#content').addEventListener('click', event => {

  if (!row || event.target.closest('input,button') || event.detail > 1) return;
  const selection = window.getSelection();
  if (selection && !selection.isCollapsed) return;
  const radio = row.querySelector('input[type="radio"]');
  if (radio && !radio.checked) radio.click();
});

(()=>{
const fmt=n=>Number.isFinite(n)?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'0:00';
function enhance(){const audio=document.getElementById('lessonAudio');if(!audio||audio.dataset.styled)return;audio.dataset.styled='1';audio.controls=false;audio.hidden=true;
const player=document.createElement('div');player.className='audio-player';player.innerHTML='<button type="button" class="audio-play" aria-label="Воспроизвести аудио">▶</button><div class="audio-track"><input type="range" min="0" max="100" step="0.1" value="0" aria-label="Позиция воспроизведения"><div class="audio-times"><span class="elapsed">0:00</span><span class="duration">0:49</span></div></div>';audio.after(player);
const button=player.querySelector('button'),range=player.querySelector('input');
const sync=()=>{button.textContent=audio.paused?'▶':'Ⅱ';button.setAttribute('aria-label',audio.paused?'Воспроизвести аудио':'Пауза');range.value=audio.duration?audio.currentTime/audio.duration*100:0;player.querySelector('.elapsed').textContent=fmt(audio.currentTime);if(Number.isFinite(audio.duration))player.querySelector('.duration').textContent=fmt(audio.duration);};
button.onclick=()=>{if(audio.paused)audio.play().catch(()=>{audio.hidden=false;audio.controls=true;player.hidden=true;});else audio.pause();};
range.oninput=()=>{if(Number.isFinite(audio.duration))audio.currentTime=Number(range.value)*audio.duration/100;sync();};
['play','pause','ended','timeupdate','loadedmetadata','durationchange'].forEach(e=>audio.addEventListener(e,sync));sync();}
new MutationObserver(enhance).observe(document.getElementById('content'),{childList:true});enhance();
})();
</script><script>
const speakSelected = $('#speakSelected');
speakSelected.disabled = !('speechSynthesis' in window);
speakSelected.addEventListener('click', () => {
  const phrase = $('#selectedWord').textContent.trim();
  if (!phrase || !('speechSynthesis' in window)) return;
  const utterance = new SpeechSynthesisUtterance(phrase);
  utterance.lang = /[а-яё]/i.test(phrase) ? 'ru-RU' : 'en-GB';
  utterance.rate = 0.88;
  speechSynthesis.cancel();
  speechSynthesis.speak(utterance);
});
</script></body></html>
