<script type="application/json" id="lesson-data">{"key":"gostudy-general-english-b1-stories-01-homework-v1","title":"Homework · Settling Into Life Abroad","level":"B1 · General English · Homework · 25 minutes","cabinet":"student-general-english-b1-stories.html","course":"general-english-b1-stories","contentVersion":"settling-in-used-to-20261124-v1","overview":{"title":"Settling Into Life Abroad","level":"B1","duration":25,"format":"Homework","goal":"Describe past habits, familiar routines and adaptation; revise a friendly email."},"steps":[{"id":"settling-hw-grammar-20261124","title":"01 · Three ways to talk about habits","minutes":5,"instruction":"Read the examples. Choose the meaning of each sentence.","source":["USED TO + base verb: a past habit or state that is no longer true. I used to live in Moscow, but now I live abroad.","BE USED TO + noun / verb-ing: something is familiar now. I am used to the hot weather. I am used to working remotely.","GET USED TO + noun / verb-ing: the process of becoming familiar. I am getting used to the heat. It took me a week to get used to waking up early.","Negative: I didn't use to swim. I'm not used to the traffic yet. Note: after be/get used to, use -ing or a noun."],"type":"choice","items":[["I used to take the bus to work.",["It was a past habit that has changed.","It is a familiar routine now.","I am adapting to it."],0,"Used to + base verb describes a former habit."],["I'm used to working in the evenings.",["I stopped working in the evenings.","Working in the evenings feels normal.","Working in the evenings is still new."],1,"Be used to + -ing describes familiarity."],["I'm getting used to the traffic.",["I no longer experience traffic.","Traffic has always felt normal.","Traffic is becoming more familiar."],2,"Get used to describes adaptation."]],"teacherNotes":"5 min. Ask for one original example for each meaning; check the base verb vs -ing."},{"id":"settling-hw-forms-20261124","title":"02 · Choose the correct form","minutes":7,"instruction":"Complete each sentence with the best option. Read it aloud after checking.","type":"gap","items":[["Before moving abroad, I ___ in an office, but now I work remotely.",["am used to working","used to work","am getting used to working"],1,"A former habit: used to + work."],["After three months here, I ___ the hot weather. It feels normal now.",["am used to","used to","am getting use to"],0,"Be used to + noun."],["I've only been here for a week. I'm still ___ eating dinner later.",["used to eat","get used to","getting used to"],2,"The adaptation is in progress."],["I didn't ___ swim in the sea, but now I do it every day.",["used to","use to","get used to"],1,"Didn't + use to + base verb."],["I'm not used to ___ so early.",["waking up","wake up","woke up"],0,"Be used to + -ing."],["It took me a month to get used to ___ remotely.",["work","worked","working"],2,"Get used to + -ing."],["I ___ the noise now; it doesn't bother me anymore.",["used to","am used to","am used to hear"],1,"Familiarity now: be used to + noun."],["At first, the traffic was stressful, but I gradually ___ it.",["got used to","used to drive","was used to driving"],0,"Got used to = became familiar."]],"teacherNotes":"7 min. Score /8; revisit any confusion about past habit vs process vs state."},{"id":"settling-hw-edit-20261124","title":"03 · Make your English sound natural","minutes":5,"instruction":"Choose the natural correction. Pay attention to spelling, prepositions and verb patterns.","type":"choice","items":[["Describe your new town.",["There is nice here.","It's nice here.","It nice here."],1,"It's nice here: use it + is."],["Describe your work schedule.",["I work six hours a day.","I work six ours in day.","I work six hours in a day every."],0,"Hours; a day."],["Describe a current afternoon habit.",["I used to go to swim in afternoons.","I am use to swim in afternoon.","I usually go swimming in the afternoon."],2,"Usually + present simple for a current habit; go swimming."],["Describe what you enjoy.",["I enjoy to live here.","I enjoy living here.","I injoy living here."],1,"Enjoy + -ing."],["Explain why you like the climate.",["Because of the warm weather.","Because of the warm weaver.","Because warm weather."],0,"Weather is the climate condition; because of + noun phrase."],["End a friendly email.",["Send me a massage.","Send me message.","Send me a message."],2,"Message = a written communication; massage = body treatment."]],"teacherNotes":"5 min. These are targeted language repairs based on previous homework; explain that used to go is correct only when the past habit has stopped."},{"id":"settling-hw-email-20261124","title":"04 · Write an email from your new home","minutes":8,"instruction":"Write a new friendly email to a friend (80–100 words). Describe life abroad now compared with before. Use true or imagined details.","source":["Include: where you live and how long you have been there; a past habit that changed; a routine that feels normal now; one thing you are still adapting to; your future plans and a friendly question.","Use all THREE forms: I used to + base verb; I'm used to + noun / -ing; I'm getting used to + noun / -ing.","Use at least two lesson expressions: settle in, feel at home, make friends, miss home, give it a try.","Check before submitting: hours, weather, message, enjoy + -ing, a day, in the afternoon. Keep the tone friendly."],"type":"write","teacherNotes":"8 min. Mark /10: meaning and coverage 3, three grammar patterns 3, vocabulary 2, accuracy and cohesion 2. Compare with the previous saved letter, without replacing it."}],"wordsKey":"gostudy-vocabulary-general-english-b1-stories-v1","preserve":"cloud","legacyWords":["gostudy-vocabulary-general-english-b1-stories-v1","gostudy-general-english-b1-stories-01-homework-v1"]}</script>
