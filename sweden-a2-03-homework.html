<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf3fc"><title>Homework · Sweden A2 · Lesson 03 · GoStudy</title><link rel="stylesheet" href="assets/gostudy-v1-lesson.css"><link rel="stylesheet" href="assets/gostudy-michael-feed.css?v=4"><link rel="stylesheet" href="assets/gostudy-michael-chat.css?v=1"><link rel="stylesheet" href="assets/gostudy-design2-homework.css?v=1"></head><body data-premium-feed="michael-v1" data-translate-engine="google-web-pilot" data-design2-homework data-finance-live data-classroom-course="sweden-a2" data-classroom-lesson="sweden-a2-03.html" data-preserve-workbook-progress data-live-script="assets/gostudy-finance-live.js"><script type="application/json" id="lesson-data">{"title":"A Day Trip from Stockholm · Homework","cabinet":"student-sweden.html","course":"sweden-a2","level":"Travel in Sweden · A2","key":"gostudy-sweden-a2-03-homework-v1","wordsKey":"gostudy-vocabulary-sweden-a2-v1","preserve":"cloud","durationMinutes":18,"steps":[{"id":"sweden-03-hw-0","title":"01 · Station words","minutes":5,"instruction":"RETRIEVAL · 5 min. Choose the correct station word or phrase in each short situation.","type":"gap","items":[["Check the ___ to see when the train leaves.",["timetable","raincoat","receipt"],0],["The train to Lindby leaves from ___ 4.",["a menu","platform","a window seat"],1],["The 10:20 train is ___. It now leaves at 10:45.",["direct","crowded","delayed"],2],["I need a ___ ticket. I'm not coming back today.",["single","return","boarding"],0],["If there is no direct train, we have to ___ at the next station.",["change trains","take away","eat in"],0]],"teacherNotes":"Check target vocabulary individually; do not reuse the same answer distractor order."},{"id":"sweden-03-hw-1","title":"02 · A message from the station","minutes":5,"instruction":"READING · 5 min. Read a fictional message and answer the questions.","source":["Hi Anna! I'm at the station. My train to Lindby was at 10:20, but it is delayed by 30 minutes. The new departure is 10:50. The platform is still number 4. I have an e-ticket, so I don't have to print anything. The next train leaves at 11:05, but I have to change trains. I think I'll wait for my direct train. See you soon! — Mia"],"type":"choice","items":[["What time is Mia's train leaving now?",["10:20","10:50","11:05"],1],["Which platform does she need?",["Platform 2","Platform 3","Platform 4"],2],["Does Mia have to print her ticket?",["No, she can show it on her phone.","Yes, every traveller must print.","She doesn't have a ticket."],0],["Why does Mia prefer to wait?",["The direct train is cheaper.","She doesn't want to change trains.","She wants to buy lunch."],1]],"teacherNotes":"Answer key: 10:50, platform 4, no print needed, direct train preference."},{"id":"sweden-03-hw-2","title":"03 · Have to or can?","minutes":3,"instruction":"GRAMMAR · 3 min. Complete the sentences. Decide what is necessary and what is possible.","type":"gap","items":[["We ___ check the platform before boarding.",["have to","has to","can to"],0],["You ___ print your ticket if you have an e-ticket.",["have to","don't have to","has to"],1],["My sister ___ buy a ticket for her journey.",["have to","has to","can to"],1],["We ___ ask for help at the information desk.",["can","has to","have"],0]],"teacherNotes":"If wrong, review necessity vs option without penalizing minor errors in oral follow-up."},{"id":"sweden-03-hw-3","title":"04 · Write your travel update","minutes":5,"instruction":"PERSONAL TASK · 5 min. Write 60–80 words to a friend who is waiting for you. Your train is delayed, but you have a plan.","type":"write","source":["Include: the original and new departure times; the platform; what you have to do; something you don't have to do; and your new plan.","Use at least THREE expressions: delayed · platform · departure · timetable · single ticket · change trains.","Model beginning: 'Hi! I'm at the station. My train was going to leave at… but now…'","CHECK · Does your message answer when, where and what next? Read it aloud once."],"teacherNotes":"Review 60–80 words with A2 criteria: meaning is clear, time/platform consistent, one affirmative and one negative 'have to'."}]}</script><script src="assets/gostudy-v1-lesson.js"></script><script src="assets/gostudy-michael-chat.js?v=1"></script><script src="assets/gostudy-sync.js?v=unified-112"></script><script src="assets/gostudy-v1-exercises.js"></script><script src="assets/gostudy-v1-workbook.js"></script></body></html>
