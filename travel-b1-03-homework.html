.mission-art{margin:12px 0 16px;border-radius:20px;overflow:hidden}.mission-art svg{display:block;width:100%;height:auto}</style></head><body><header><div class="brand">Gostudy</div><div class="header-actions"><a class="small-button cabinet-link" href="student-travel-b2.html">← Кабинет</a><button class="small-button" id="dictBtn">My words <span id="wordCount">0</span></button><button class="small-button" id="themeBtn" aria-label="Switch colour theme">◐</button></div></header>
<div class="shell"><main><div class="lesson-bar"><button class="small-button" hidden id="menuBtn" aria-haspopup="dialog" aria-expanded="false">☰ Задания</button></div><div id="pageLabel" hidden></div><h1 id="title" tabindex="-1"></h1><p class="subtitle" id="goal"></p><div id="content"></div><details class="teacher" hidden><summary>Teacher notes · pacing</summary><p id="teacherTips"></p></details><div class="page-controls" hidden><button id="prev" class="small-button">← Назад</button><span id="counter"></span><button id="next" class="primary">Next →</button></div><footer class="footer">Gostudy · Travel · B1 · Lesson 03. Ответы и слова сохраняются в этом браузере.</footer><p class="storage-note" id="storageNote" hidden role="status"></p></main></div>

<script>
'use strict';
const CLIPS=[{"qs":[["Why did Mia contact reception?",["The room was too cold.","The room did not match her booking.","She arrived on the wrong date."],1],["Why did she refuse the first offer?",["The other room was beside a busy road.","It cost more money.","It had no bathroom."],0],["What did they finally agree?",["A different hotel.","A free tour.","A quieter room and a partial refund."],2],["What is the main message?",["The most expensive option is always best.","Explain what matters and check the details.","Never book online."],1]]},{"qs":[["Why did the traveller miss the tour?",["She did not see the message in time.","She lost her ticket.","The bus was full."],0],["What was missing from the taxi price?",["The driver’s lunch.","The journey back.","A market ticket."],1],["What did they finally do?",["Waited at the hotel.","Took the taxi.","Took a bus and explored a market."],2]]}];
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key='gostudy-travel-b1-03-homework-v1';let state={page:0,answers:{},words:[],dark:false};let storage=true;
try{const s=JSON.parse(localStorage.getItem(key)||'null');if(s&&typeof s==='object'){state={...state,...s};state.answers=s.answers&&typeof s.answers==='object'?s.answers:{};state.words=Array.isArray(s.words)?s.words.filter(w=>w&&typeof w.en==='string'&&typeof w.ru==='string'):[];}}catch(e){storage=false;}
const sharedWordKey="gostudy-travel-disruptions-b2-v1";
let lastWords = '';
function readSharedWords(){
  try {
    const shared = JSON.parse(localStorage.getItem(sharedWordKey) || '{}');
    if(Array.isArray(shared.words)) state.words = shared.words.filter(w=>w&&typeof w.en==='string'&&typeof w.ru==='string');
  } catch {}
  lastWords = JSON.stringify(state.words);
}
readSharedWords();
window.addEventListener('pageshow',()=>{readSharedWords();$('#wordCount').textContent=state.words.length;if($('#dictionary').open)renderWords();});
function save(){try{
  const currentWords = JSON.stringify(state.words);
  if(currentWords!==lastWords){
    const shared = JSON.parse(localStorage.getItem(sharedWordKey)||'{}');
    shared.words=state.words;
    localStorage.setItem(sharedWordKey,JSON.stringify(shared));
    lastWords=currentWords;
  }
  localStorage.setItem(key,JSON.stringify(state));}catch(e){storage=false;$('#storageNote').hidden=false;$('#storageNote').textContent='Saving unavailable. Export your answers and vocabulary before closing.';}$('#wordCount').textContent=state.words.length;}
let toastTimer;function notify(s){$('#toast').textContent=s;$('#toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),3200);}
const words=[["a guided tour","экскурсия с гидом","We booked a guided tour."],["a meeting point","место встречи","Where is the meeting point?"],["a return journey","обратная поездка","Does the price include the return journey?"],["an extra charge","дополнительная плата","Is there an extra charge?"],["included","включённый в стоимость","Breakfast is included."],["available","доступный; свободный","Is another room available?"],["a refund","возврат денег","Could I have a refund?"],["a view","вид из окна; пейзаж","We paid for a sea view."],["instead","вместо этого","We took the bus instead."],["sort out","решить; уладить","Can we sort out this problem?"]];
const glossary = {"locker":"камера хранения","a locker":"камера хранения","single ticket":"билет в одну сторону","waiting room":"зал ожидания","refund desk":"стойка возврата"};
const norm=s=>s.toLowerCase().replace(/[’]/g,"'").replace(/^[\s.,!?;:]+|[\s.,!?;:]+$/g,'').replace(/\s+/g,' ');

const pages=[["A better travel plan","Lesson 03 · Travel · B1",5,"Compare comfortable and adventurous holidays."],["Useful travel language","Ask questions before you pay.",7,"Practise the phrases in short exchanges."],["The room with a different view","Read and explain how a problem was solved.",10,"Ask for evidence, then discuss the compromise."],["One extra question","Listen to one traveller’s story.",8,"Listen once for the main idea and again for details."],["What was happening?","Past Simple, Past Continuous and future plans.",8,"Ask why each tense fits."],["Choose your afternoon","Compare three options and agree on a plan.",8,"Both people must explain a preference."],["At reception","Explain a problem and ask for a solution.",10,"Swap roles; ask for details before agreeing."],["Your travel toolkit","Use your new phrases and open homework.",4,"Ask for a short spoken summary."]];
function area(id,placeholder,rows=3){return '<textarea data-answer="'+id+'" aria-label="'+esc(placeholder)+'" rows="'+rows+'" placeholder="'+esc(placeholder)+'">'+esc(state.answers[id]||'')+'</textarea>';}
function card(title,body){return '<article class="card"><h2>'+title+'</h2>'+body+'</article>';}
function promptBox(title,text){return '<div class="prompt"><h3>'+title+'</h3><p>'+text+'</p></div>';}
function b2mc(group,qs){return qs.map((q,i)=>{const id='q'+group+'-'+i;return '<div class="question"><p>'+(i+1)+'. '+esc(q[0])+'</p><div class="options">'+q[1].map((v,j)=>'<label class="option"><input type="radio" name="'+id+'" data-q="'+group+':'+i+'" value="'+j+'" '+(Number(state.answers[id])===j&&state.answers[id]!==undefined?'checked':'')+'><span>'+esc(v)+'</span></label>').join('')+'</div><div class="feedback" id="fb-'+id+'" role="status"></div></div>';}).join('');}
function feedWelcome(){return card("A good trip doesn’t have to be perfect","<img class=\"travel-cover\" style=\"width:100%;max-height:300px;object-fit:cover;border-radius:16px\" src=\"https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?auto=format&fit=crop&w=1400&q=85\" alt=\"Горное озеро и деревня у воды\"><p>You have one free afternoon in a new town. Would you choose a tour, a quiet café or a place without many tourists? Explain why.</p><ol><li>What do you usually check before booking a room?</li><li>Tell your teacher about one small travel problem.</li><li>Which matters more: a good view, a low price or a quiet room?</li></ol><p><b>Today:</b> compare plans, ask about prices and solve a hotel problem.</p>");}
const VOCAB_GAPS=[["coll0","Please close the ___ behind you.","gate"],["coll1","I need a ___ when it gets dark.","torch"],["coll2","Can you sweep the ___ before our guests arrive?","floor"],["coll3","Please put ___ the tools before it rains.","away"]];
function feedWords(){return card('Ask before you agree','<div class="word-grid">'+words.map((w,i)=>'<article class="word"><strong>'+esc(w[0])+'</strong><p>'+esc(w[2])+'</p><details><summary>Перевод</summary><p>'+esc(w[1])+'</p></details><button class="small-button" data-add="'+i+'">♥ В словарь</button></article>').join('')+'</div><p>Choose three phrases. Use each one in a question to a hotel receptionist or tour guide.</p>');}
function feedReading(){return card('The room with a different view',"<p>Mia and Leo arrived at their hotel on Friday evening. They had booked a quiet room with a sea view. However, their window faced a car park, and loud music was coming from the restaurant downstairs. Leo wanted to leave immediately, but Mia suggested speaking to reception first.</p><p>Mia showed the receptionist their booking email. She explained that they had an early start the next day and needed to sleep. The receptionist offered them a room with a sea view on the first floor. Before agreeing, Mia asked one more question: was it quiet? The answer was no — it was beside a busy road.</p><p>There was one other room at the back of the hotel. It had no sea view, but it was quiet. Mia asked whether they could get some money back because it was cheaper than the room they had paid for. The receptionist checked with her manager and agreed to return twenty euros.</p><p>The next morning, Leo admitted that moving hotels would have taken a lot of time. Their solution was not perfect, but they had slept well. They decided to spend the twenty euros on breakfast by the sea. This time, they checked the menu prices before sitting down.</p>"+b2mc(0,CLIPS[0].qs))+card('Discuss','<p>Why was the second room a better choice for them? Would you accept the same offer? Give one reason and one different solution.</p>');}
function feedListening(){return '';}
const FEED_ITEMS=[['🛹','Skateboard tricks in slow motion','sport'],['🔭','Why stars have different colours','science'],['🎧','An artist you have never heard of','music'],['🥘','A recipe using three ingredients','food'],['📷','Street photography without expensive equipment','art'],['⚽','How a team practises a difficult move','sport'],['🌱','A tiny garden on a balcony','science'],['🎸','The same song, five different versions','music'],['🎬','Making a film with paper characters','art']];

function feedLab(){return card('The story in different tenses','<p><b>Past Continuous:</b> a situation in progress. <b>Past Simple:</b> a completed event. <b>Going to:</b> an intention. <b>Will:</b> a decision made now.</p><p>While we '+hwChoice('g1','were waiting',['waited','were waiting','are waiting'])+' outside the hotel, it started to rain.</p><p>The receptionist '+hwChoice('g2','offered',['was offering','offer','offered'])+' us another room yesterday.</p><p>I '+hwChoice('g3','am going to check',['am going to check','checked','was checking'])+' the reviews before our next trip. That is my plan.</p><p>“The tour is full.” “Okay, I '+hwChoice('g4','will visit',['visited','will visit','was visiting'])+' the museum instead.”</p>')+card('Tell the story together','<p>Continue aloud: “We were walking back to the hotel when…” Take turns adding a sentence. Use at least two Past Simple verbs and two Past Continuous phrases.</p>');}

function installGapChecks(){function check(el){const v=el.value.trim(),ok=norm(v)===norm(el.dataset.gap);el.classList.toggle('correct',!!v&&ok);el.classList.toggle('incorrect',!!v&&!ok);$('#fb-'+el.id).textContent=!v?'':ok?'✓ Верно!':'Попробуйте ещё раз.';}$$('[data-gap]').forEach(el=>{el.addEventListener('blur',()=>check(el));el.addEventListener('change',()=>{state.answers[el.dataset.answer]=el.value;save();check(el);});el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();check(el);}});el.addEventListener('input',()=>{el.classList.remove('correct','incorrect');$('#fb-'+el.id).textContent='';});if(el.value.trim())check(el);});}

function addWord(en,ru){en=en.trim();ru=ru.trim();if(/[а-яё]/i.test(en)&&/[a-z]/i.test(ru)&&!/[а-яё]/i.test(ru)){[en,ru]=[ru,en];}if(!en||!ru){notify('Add a word and its translation.');return false;}const old=state.words.find(w=>norm(w.en)===norm(en));if(old)old.ru=ru;else state.words.push({en,ru});save();notify(old?'Translation updated.':'Word saved ✓');return true;}

let lookupVersion=0;
function localTranslation(text){const n=norm(text);if(!/[а-яё]/i.test(n))return glossary[n]||'';const aliases={'загран паспорт':'passport','загранпаспорт':'passport','заграничный паспорт':'passport','посадочный талон':'boarding pass','ручная кладь':'hand luggage','место у окна':'window seat','место у прохода':'aisle seat'};if(aliases[n])return aliases[n];const found=Object.entries(glossary).find(([en,ru])=>ru.split(';').some(part=>norm(part)===n));return found?found[0]:'';}
async function online(text){if(new TextEncoder().encode(text).length>450)throw Error('Выделите более короткую фразу (до 450 байт).');const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);try{const response=await fetch('https://api.mymemory.translated.net/get?'+new URLSearchParams({q:text,langpair:/[а-яё]/i.test(text)?'ru|en':'en|ru'}),{signal:controller.signal,credentials:'omit',referrerPolicy:'no-referrer'});if(!response.ok)throw Error('Сервис временно недоступен. Введите перевод вручную.');const d=await response.json();if(Number(d.responseStatus)!==200||!d.responseData?.translatedText)throw Error('Перевод недоступен. Возможно, исчерпан лимит. Введите перевод вручную.');const doc=new DOMParser().parseFromString(d.responseData.translatedText,'text/html');return doc.documentElement.textContent;}finally{clearTimeout(timeout);}}

const manualWord = $('#newWord');
const manualMeaning = $('#newMeaning');
const manualStatus = $('#dictStatus');
const manualCache = new Map();
let manualVersion = 0;
let manualTimer;
manualMeaning.addEventListener('input', () => {
  manualVersion++;
  clearTimeout(manualTimer);
  manualStatus.textContent = '';
});
function translateWhileTyping(event) {
  clearTimeout(manualTimer);
  const version = ++manualVersion;
  const query = manualWord.value.trim();
  manualMeaning.value = '';
  manualStatus.textContent = '';
  if (!query || event?.isComposing) return;
  const saved = state.words.find(word => norm(word.en) === norm(query))?.ru;
  const immediate = saved || localTranslation(query) || manualCache.get(norm(query));
  if (immediate) {
    manualMeaning.value = immediate;
    return;
  }
  manualStatus.textContent = 'Переводим…';
  manualTimer = setTimeout(async () => {
    try {
      const result = await online(query);
      if (version !== manualVersion || manualWord.value.trim() !== query) return;
      manualCache.set(norm(query), result);
      manualMeaning.value = result;
      manualStatus.textContent = 'Перевод готов. Можно исправить перед сохранением.';
    } catch {
      if (version === manualVersion && manualWord.value.trim() === query) {
        manualStatus.textContent = 'Перевод недоступен. Можно ввести его вручную.';
      }
    }
  }, 300);
}
manualWord.addEventListener('input', translateWhileTyping);
manualWord.addEventListener('compositionend', translateWhileTyping);
$('#wordForm').addEventListener('reset', () => {
  manualVersion++;
  clearTimeout(manualTimer);
  manualStatus.textContent = '';
});

const CONTEXT_PHRASES = Object.entries(glossary);
const CONTEXT_WORDS={};
const SENTENCE_TRANSLATIONS={};
function lessonMeaning(text,context){const n=norm(text).replace(/[.!?,;:]+$/,'');const phrase=CONTEXT_PHRASES.find(([en])=>en===n);if(phrase)return phrase[1];if(SENTENCE_TRANSLATIONS[norm(text)+'.']||SENTENCE_TRANSLATIONS[norm(text)])return SENTENCE_TRANSLATIONS[norm(text)+'.']||SENTENCE_TRANSLATIONS[norm(text)];if(CONTEXT_WORDS[n]){if(n==='water'&&!/flower|garden|plant/i.test(context))return '';if(n==='pick'&&!/apple|fruit/i.test(context))return '';if((n==='have'||n==='had')&&!/lunch/i.test(context))return '';return CONTEXT_WORDS[n];}return localTranslation(text);}

function sentenceNearSelection(el,text){const block=el.closest('p,li,label,h1,h2,h3,.sentence-answer')||el;let t=block.textContent.trim().replace(/^Anna(?=[A-Z])/,'').replace(/\s+/g,' ');const found=t.match(/[^.!?]+[.!?]?/g)||[t];return (found.find(x=>x.toLowerCase().includes(text.toLowerCase()))||t).trim().slice(0,300);}
