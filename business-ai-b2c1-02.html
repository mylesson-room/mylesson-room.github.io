<script type="application/json" id="lesson-data">{"title":"From AI Pilot to Rollout","cabinet":"student-business-ai.html","key":"gostudy-business-ai-b2c1-02-v1","steps":[{"title":"Would you approve the pilot?","instruction":"Discuss the decision before looking at the numbers.","source":["Your company handles 12,000 support tickets a month. A tool can draft replies, but every draft still needs a human sign-off.","What evidence would persuade you to expand the pilot? What would make you stop it?","Start with three things you already know about AI in customer service. Then rank speed, accuracy and customer trust. Which comes first for routine billing? Would you rank them differently for refunds?","In pairs, sketch a pilot: pick one ticket type, one baseline measure and one reason to stop. Compare your choices before reading the memo."],"id":"original-0","visual":{"kind":"cards","cards":[["⏱️","Speed","Handling time","Does drafting actually save time?"],["🎯","Accuracy","Policy checks","What errors could reach customers?"],["🤝","Trust","Customer experience","What evidence would you look for?"]]}},{"title":"Read the pilot review","instruction":"Read the internal memo. Decide what the results support.","source":["TO: Operations and Finance   /   FROM: Northline Support   /   SUBJECT: Four-week pilot review","Over four weeks, Northline tested AI-generated replies on routine billing queries. Median handling time fell from eight minutes to six. Reviewers corrected 11% of drafts, mostly for tone. Two drafts quoted the wrong refund policy and were caught before sending.","The comparison team handled more unusual cases, so the two-minute difference cannot be attributed entirely to the tool. The trial also excluded complaints involving vulnerable customers.","Operations proposes a six-week extension for routine billing only, with mandatory review and weekly checks. Finance wants to know whether the time saved still outweighs the review cost.","Customer satisfaction stayed broadly stable, but the survey response rate was low. The customer support lead asks for separate reporting on routine refunds and escalations. The team will stop the trial if a policy error reaches a customer."],"type":"choice","items":[["What limits the comparison?",["The teams handled different mixes of cases.","No one measured handling time.","Reviewers only checked tone."],0],["Which decision is actually proposed?",["A company-wide launch","A narrower follow-up trial","Removing human review"],1],["What is still uncertain?",["Whether any drafts contained errors","Whether review costs outweigh the savings","Whether the trial lasted four weeks"],1],["What did reviewers correct most often?",["The tone of replies","The length of the ticket queue","The identity of the customer"],0,"Most edits were about tone."],["Which stop condition did the support team set?",["One policy error reaching a customer","A single draft needing a style edit","A lower survey response rate"],0,"The support lead set a customer-facing policy-error threshold."],["Why should the survey result be treated cautiously?",["Only a small share of customers replied","It covered only the comparison team","The survey measured staff rather than customers"],0,"Low response makes the result harder to interpret."],["What separates the two wrong-policy drafts from customer-facing incidents?",["A reviewer caught them before they were sent","They were removed from the data","They were only tone errors"],0]],"order":null,"hint":"Look again at the second and third paragraphs.","id":"original-1","visual":{"kind":"alert","icon":"📄","title":"Pilot memo","detail":"Operations and Finance"}},{"title":"What can we conclude?","instruction":"Classify each statement using the evidence in the memo.","type":"choice","items":[["The median handling time was lower in the pilot.",["Supported","Contradicted","Not established"],0,"The measured median fell from eight minutes to six."],["The tool was tested on complaints involving vulnerable customers.",["Supported","Contradicted","Not established"],1,"The memo explicitly excludes those complaints."],["The tool caused the entire improvement.",["Supported","Contradicted","Not established"],2,"The teams handled different types of tickets."],["No incorrect refund policy reached a customer.",["Supported","Contradicted","Not established"],0,"Both policy errors were caught before sending."],["The comparison team handled the same types of tickets.",["Supported","Contradicted","Not established"],1],["The trial was profitable.",["Supported","Contradicted","Not established"],2],["Operations wants to retain human review during the extension.",["Supported","Contradicted","Not established"],0]],"source":["Use the pilot review from the previous step. After each choice, tell your partner which detail supports your answer or what evidence is missing."],"id":"what-can-we-conclude-","visual":{"kind":"alert","icon":"🔎","title":"Check the evidence","detail":"Supported, contradicted or not established?"}},{"title":"Use precise business language","instruction":"Match each expression to its meaning.","source":[],"type":"match","items":[["roll out",["introduce more widely","calculate the cost","pause a test"],0],["sign off on",["write a draft","formally approve","sort cases by urgency"],1],["outweigh",["be less important than","be checked by","be greater or more important than"],2],["attribute X to Y",["treat Y as the cause of X","compare X and Y","exclude X from the trial"],0],["case mix",["the range of ticket types handled","the total support budget","the order of project milestones"],0],["catch an error",["publish a new policy","spot a mistake before it causes a problem","estimate the cost of a mistake"],1],["run a controlled trial",["replace all existing workflows","review one successful ticket","test under comparable conditions"],2],["scale up",["increase the size of the deployment","reduce the number of measures","send an individual reply"],0]],"order":null,"hint":"Think about how the expressions would work in a decision memo.","id":"original-2","visual":{"kind":"alert","icon":"🗂️","title":"Language for the meeting","detail":"Match the expressions with their meanings."}},{"title":"Write with the right level of certainty","instruction":"Choose the phrase that fits each sentence.","type":"gap","items":[["The pilot ___ that AI may help with routine queries.",["suggests","proves beyond doubt","rules out"],0,"Suggests reflects encouraging but limited evidence."],["The change cannot be fully ___ the tool.",["excluded from","attributed to","signed off on"],1,"Attribute X to Y links a result to a cause."],["The savings are promising, ___ we still need to measure review time.",["therefore","provided that","although"],2,"Although introduces the caveat."],["We can extend the trial ___ human review stays mandatory.",["even though","provided that","in contrast"],1,"Provided that introduces a condition."],["___ the early improvement, the trial does not justify a company-wide rollout.",["Unless","Despite","As a result"],1],["The difference ___ reflect the simpler cases assigned to the pilot team.",["must not","could","cannot possibly"],1],["We should pause the trial ___ an incorrect policy reaches a customer.",["whereas","even though","if"],2],["The comparison groups should be matched ___ ticket type and complexity.",["by","from","against of"],0]],"source":["Example · The data suggests a benefit, provided that review time stays low."],"id":"write-with-the-right-level-of-certainty","visual":{"kind":"alert","icon":"💬","title":"Calibrate your claim","detail":"Choose the phrase that fits the evidence."}},{"title":"Rebuild the recommendation","instruction":"Put the briefing in order: decision, evidence, limitation, next step.","source":["Once you have the sequence, read it aloud as a 30-second briefing. Then replace the limitation with one about customer feedback and explain whether your decision changes."],"type":"order","items":["The test and comparison teams handled different types of tickets.","Run a six-week trial with comparable case mixes and publish the review costs.","I recommend extending the pilot for routine billing only.","Median handling time fell by two minutes during the pilot."],"order":[2,3,0,1],"hint":"Start with what you want the audience to approve.","id":"original-3","visual":{"kind":"alert","icon":"🧩","title":"Build a recommendation","detail":"Put the briefing into a logical order."}},{"title":"Calculate the trade-off","instruction":"Choose what the additional figures imply.","type":"choice","items":[["How much net time is saved per ticket?",["30 seconds","90 seconds","2 minutes"],1,"2 minutes minus 30 seconds is 90 seconds."],["How many hours does that save across 600 tickets?",["10 hours","15 hours","20 hours"],1,"600 × 1.5 minutes = 900 minutes."],["Which number should appear in the finance memo?",["Gross time savings only","Net time savings with the assumptions","A guaranteed percentage for all teams"],1,"Include review time and make the assumptions visible."],["If review rises to 75 seconds per ticket, what is the net saving?",["45 seconds per ticket","75 seconds per ticket","195 seconds per ticket"],0],["What is the net saving across 600 tickets at that higher review time?",["7.5 hours","12.5 hours","20 hours"],0],["Which extra input would let Finance convert the hours into a cost estimate?",["The reviewer and agent cost per hour","The number of lines in each draft","The time of day each ticket arrived"],0]],"source":["In a follow-up sample, reviewers spent an extra 30 seconds per ticket on quality checks. The trial included 600 comparable tickets. Assume drafting saves two minutes before those checks."],"id":"calculate-the-trade-off","metrics":[["2 min","Gross saving / ticket"],["30 sec","Extra review / ticket"],["600","Comparable tickets"]],"visual":{"kind":"alert","icon":"🧮","title":"Compare time and cost","detail":"Use the figures to work out the net saving."}},{"title":"Handle the finance challenge","instruction":"Choose the reply that acknowledges uncertainty and gives a concrete next step.","source":["Finance director: ‘Can we tell the board the tool cuts support costs by 25%?’","Operations lead: ‘What if agents can review drafts only during the morning shift?’","Customer lead: ‘We had two policy errors in the drafts. What would stop the trial?’"],"type":"choice","items":[["Which reply would you give?",["Yes, the time fell by 25%, so the costs did too.","The results are encouraging. We should measure review time and compare similar cases before claiming a cost saving.","No, AI can never reduce support costs."],1],["Which response addresses the staffing constraint?",["Run the pilot only on staffed shifts and compare the same ticket mix.","Remove review for the afternoon shift.","Ignore shift differences in reporting."],0],["Which response turns the risk into a clear rule?",["Stop and investigate if a wrong policy reaches a customer.","Assume two errors is normal.","Stop as soon as any draft needs a grammar edit."],0],["Which question would you ask Finance before committing?",["Can we use your office for the meeting?","Do you want the headline in blue?","What review cost would make this pilot uneconomic?"],2]],"order":null,"hint":"Time per ticket and total cost measure different things.","id":"original-4","visual":{"kind":"alert","icon":"💼","title":"Finance challenges","detail":"Choose how you would respond to each stakeholder."}},{"title":"Prepare a board update","instruction":"Draft a four-sentence update. Include the decision, a number, a caveat and a success criterion.","type":"write","items":null,"source":["Keep the decision specific. Who gets the tool, for how long, and what result would stop the trial?","To: Finance Director  •  Subject: Decision on the billing pilot","Use 90–120 words. Start with your decision. Cite one measured result, qualify it, and propose a clear next step. Read the draft aloud and remove one claim you cannot support."],"id":"prepare-a-board-update","visual":{"kind":"alert","icon":"✍️","title":"Brief the board","detail":"Draft your recommendation."}},{"title":"Pitch your decision","instruction":"Take one minute to prepare, then brief the finance director in 60–90 seconds.","source":["Student: recommend a limited rollout, another trial or a pause. Use one number, one caveat and one measurable condition for revisiting your decision.","Teacher: ask ‘What result would make you change your mind?’ Then ask who owns the final sign-off.","Round 2 · New constraint: budget covers only one reviewer. Keep, narrow or pause the trial. State one trade-off you are prepared to accept.","Finish by agreeing on three things: the trial scope, a stop rule and a date to review the result."],"id":"original-5","visual":{"kind":"cards","cards":[["🎤","Operations","Recommend a decision","Support it with a number and a caveat."],["💬","Finance","Challenge the proposal","Ask what would make the team change course."]]}}],"cover":"assets/gostudy-ai-pilot.png","level":"Business English · B2–C1","coverAlt":"Colleagues reviewing an AI draft on a laptop"}</script><script src="assets/gostudy-sync.js?v=114c8b497efb"></script><script src="assets/gostudy-vimbox-workbook.js?v=53258c671103"></script><script src="assets/gostudy-current-courses.js?v=ce1df270d0e5" defer></script><script src="assets/gostudy-glass-vocabulary.js?v=9c384a3e224e" defer></script></body></html>
