<script type="application/json" id="lesson-data">{"title":"From AI Pilot to Rollout","cabinet":"student-business-ai.html","key":"gostudy-business-ai-b2c1-02-v1","steps":[{"title":"Would you approve the pilot?","instruction":"Discuss the decision before looking at the numbers.","source":["Your company handles 12,000 support tickets a month. A tool can draft replies, but every draft still needs a human sign-off.","What evidence would persuade you to expand the pilot? What would make you stop it?"],"id":"original-0"},{"title":"Read the pilot review","instruction":"Read the internal memo. Decide what the results support.","source":["Over four weeks, Northline tested AI-generated replies on routine billing queries. Median handling time fell from eight minutes to six. Reviewers corrected 11% of drafts, mostly for tone. Two drafts quoted the wrong refund policy and were caught before sending.","The comparison team handled more unusual cases, so the two-minute difference cannot be attributed entirely to the tool. The trial also excluded complaints involving vulnerable customers.","Operations proposes a six-week extension for routine billing only, with mandatory review and weekly checks. Finance wants to know whether the time saved still outweighs the review cost.","Customer satisfaction stayed broadly stable, but the survey response rate was low. The customer support lead asks for separate reporting on routine refunds and escalations. The team will stop the trial if a policy error reaches a customer."],"type":"choice","items":[["What limits the comparison?",["The teams handled different mixes of cases.","No one measured handling time.","Reviewers only checked tone."],0],["Which decision is actually proposed?",["A company-wide launch","A narrower follow-up trial","Removing human review"],1],["What is still uncertain?",["Whether any drafts contained errors","Whether review costs outweigh the savings","Whether the trial lasted four weeks"],1]],"order":null,"hint":"Look again at the second and third paragraphs.","id":"original-1"},{"title":"What can we conclude?","instruction":"Classify each statement using the evidence in the memo.","type":"choice","items":[["The median handling time was lower in the pilot.",["Supported","Contradicted","Not established"],0,"The measured median fell from eight minutes to six."],["The tool was tested on complaints involving vulnerable customers.",["Supported","Contradicted","Not established"],1,"The memo explicitly excludes those complaints."],["The tool caused the entire improvement.",["Supported","Contradicted","Not established"],2,"The teams handled different types of tickets."],["No incorrect refund policy reached a customer.",["Supported","Contradicted","Not established"],0,"Both policy errors were caught before sending."]],"source":["Over four weeks, Northline tested AI-generated replies on routine billing queries. Median handling time fell from eight minutes to six. Reviewers corrected 11% of drafts, mostly for tone. Two drafts quoted the wrong refund policy and were caught before sending.","The comparison team handled more unusual cases, so the two-minute difference cannot be attributed entirely to the tool. The trial also excluded complaints involving vulnerable customers.","Operations proposes a six-week extension for routine billing only, with mandatory review and weekly checks. Finance wants to know whether the time saved still outweighs the review cost.","Customer satisfaction stayed broadly stable, but the survey response rate was low. The customer support lead asks for separate reporting on routine refunds and escalations. The team will stop the trial if a policy error reaches a customer."],"id":"what-can-we-conclude-"},{"title":"Use precise business language","instruction":"Match each expression to its meaning.","source":[],"type":"match","items":[["roll out",["introduce more widely","calculate the cost","pause a test"],0],["sign off on",["write a draft","formally approve","sort cases by urgency"],1],["outweigh",["be less important than","be checked by","be greater or more important than"],2],["attribute X to Y",["treat Y as the cause of X","compare X and Y","exclude X from the trial"],0]],"order":null,"hint":"Think about how the expressions would work in a decision memo.","id":"original-2"},{"title":"Write with the right level of certainty","instruction":"Choose the phrase that fits each sentence.","type":"gap","items":[["The pilot ___ that AI may help with routine queries.",["suggests","proves beyond doubt","rules out"],0,"Suggests reflects encouraging but limited evidence."],["The change cannot be fully ___ the tool.",["excluded from","attributed to","signed off on"],1,"Attribute X to Y links a result to a cause."],["The savings are promising, ___ we still need to measure review time.",["therefore","provided that","although"],2,"Although introduces the caveat."],["We can extend the trial ___ human review stays mandatory.",["even though","provided that","in contrast"],1,"Provided that introduces a condition."]],"source":[],"id":"write-with-the-right-level-of-certainty"},{"title":"Rebuild the recommendation","instruction":"Put the briefing in order: decision, evidence, limitation, next step.","source":[],"type":"order","items":["The test and comparison teams handled different types of tickets.","Run a six-week trial with comparable case mixes and publish the review costs.","I recommend extending the pilot for routine billing only.","Median handling time fell by two minutes during the pilot."],"order":[2,3,0,1],"hint":"Start with what you want the audience to approve.","id":"original-3"},{"title":"Calculate the trade-off","instruction":"Choose what the additional figures imply.","type":"choice","items":[["How much net time is saved per ticket?",["30 seconds","90 seconds","2 minutes"],1,"2 minutes minus 30 seconds is 90 seconds."],["How many hours does that save across 600 tickets?",["10 hours","15 hours","20 hours"],1,"600 × 1.5 minutes = 900 minutes."],["Which number should appear in the finance memo?",["Gross time savings only","Net time savings with the assumptions","A guaranteed percentage for all teams"],1,"Include review time and make the assumptions visible."]],"source":["In a follow-up sample, reviewers spent an extra 30 seconds per ticket on quality checks. The trial included 600 comparable tickets. Assume drafting saves two minutes before those checks."],"id":"calculate-the-trade-off"},{"title":"Handle the finance challenge","instruction":"Choose the reply that acknowledges uncertainty and gives a concrete next step.","source":["Finance director: ‘Can we tell the board the tool cuts support costs by 25%?’"],"type":"choice","items":[["Which reply would you give?",["Yes, the time fell by 25%, so the costs did too.","The results are encouraging. We should measure review time and compare similar cases before claiming a cost saving.","No, AI can never reduce support costs."],1]],"order":null,"hint":"Time per ticket and total cost measure different things.","id":"original-4"},{"title":"Prepare a board update","instruction":"Draft a four-sentence update. Include the decision, a number, a caveat and a success criterion.","type":"write","items":null,"source":["Keep the decision specific. Who gets the tool, for how long, and what result would stop the trial?"],"id":"prepare-a-board-update"},{"title":"Pitch your decision","instruction":"Take one minute to prepare, then brief the finance director in 60–90 seconds.","source":["Student: recommend a limited rollout, another trial or a pause. Use one number, one caveat and one measurable condition for revisiting your decision.","Teacher: ask ‘What result would make you change your mind?’ Then ask who owns the final sign-off."],"id":"original-5"}],"cover":"assets/gostudy-ai-pilot.png","level":"Business English · B2–C1"}</script><script src="assets/gostudy-sync.js?v=21"></script><script src="assets/gostudy-lesson-room.js?v=2"></script></body></html>
