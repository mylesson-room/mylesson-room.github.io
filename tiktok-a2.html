<script type="application/json" id="lesson-data">{"title":"One More Video?","hero":"One More Video?","cabinet":"student-tiktok-a2.html","course":"tiktok-a2","level":"General English · A2","key":"gostudy-tiktok-a2-v1","wordsKey":"gostudy-tiktok-a2-words-v1","preserve":"cloud","durationMinutes":50,"steps":[{"id":"tiktok-a2-section-0","title":"1. What’s on your feed?","html":"\n  \n  \u003cp>Обсудите, какие короткие ролики Вы смотрите. Можно рассказать про любую платформу.\u003c/p>\n  \u003cdiv lang=\"en\">\n    \u003cul>\u003cli>When do you watch short videos?\u003c/li>\u003cli>What do you like more: funny videos or useful videos?\u003c/li>\u003cli>What kind of video do you always skip?\u003c/li>\u003c/ul>\n    \u003cp class=\"example\">I usually watch short videos on the bus. I like travel videos because I get new ideas.\u003c/p>\n  \u003c/div>\n"},{"id":"tiktok-a2-section-1","title":"2. Save it or skip it?","html":"\n  \n  \u003cp>Прочитайте описания двух вымышленных роликов. Какой Вы сохраните, а какой пропустите?\u003c/p>\n  \u003cdiv class=\"grid\" lang=\"en\">\n    \u003carticle class=\"clip\">\u003ch3>A · Pasta in 10 minutes\u003c/h3>\u003cp>Anna shows you how to make lemon pasta. She uses five things you may already have at home. At the end, she shows the recipe on the screen.\u003c/p>\u003c/article>\n    \u003carticle class=\"clip\">\u003ch3>B · The dog with a job\u003c/h3>\u003cp>A small dog sits at a desk. His owner says, “You have a meeting in five minutes.” The dog looks at the camera and goes back to sleep.\u003c/p>\u003c/article>\n  \u003c/div>\n  \u003cdetails>\u003csummary>Слова и фразы\u003c/summary>\u003cp>\u003cstrong>feed\u003c/strong> — лента · \u003cstrong>scroll\u003c/strong> — листать · \u003cstrong>skip\u003c/strong> — пропустить · \u003cstrong>save\u003c/strong> — сохранить · \u003cstrong>follow\u003c/strong> — подписаться · \u003cstrong>share\u003c/strong> — поделиться · \u003cstrong>useful\u003c/strong> — полезный\u003c/p>\u003c/details>\n  \u003cp>Выберите подходящее слово.\u003c/p>\n  \u003cdiv lang=\"en\">\n  \u003clabel class=\"task\" for=\"clip-recipe\">\u003cspan>I want to make this pasta on Friday. I’ll ___ the video.\u003c/span>\u003cselect id=\"clip-recipe\" data-answer=\"clip-recipe\" aria-label=\"I want to make this pasta on Friday. I’ll ___ the video.\" data-correct=\"save\" aria-describedby=\"clip-recipe-feedback\" data-exercise-field=\"clip-recipe\" data-expected=\"save\">\u003coption value=\"\">Выберите ответ\u003c/option>\u003coption>share\u003c/option>\u003coption>save\u003c/option>\u003coption>skip\u003c/option>\u003c/select>\u003cspan id=\"clip-recipe-feedback\" aria-live=\"polite\">\u003c/span>\u003c/label>\n  \u003clabel class=\"task\" for=\"clip-creator\">\u003cspan>I want to see more videos from Anna. I’ll ___ her.\u003c/span>\u003cselect id=\"clip-creator\" data-answer=\"clip-creator\" aria-label=\"I want to see more videos from Anna. I’ll ___ her.\" data-correct=\"follow\" aria-describedby=\"clip-creator-feedback\" data-exercise-field=\"clip-creator\" data-expected=\"follow\">\u003coption value=\"\">Выберите ответ\u003c/option>\u003coption>follow\u003c/option>\u003coption>save\u003c/option>\u003coption>skip\u003c/option>\u003c/select>\u003cspan id=\"clip-creator-feedback\" aria-live=\"polite\">\u003c/span>\u003c/label>\n  \u003clabel class=\"task\" for=\"clip-sister\">\u003cspan>My sister loves dogs. I’ll ___ this video with her.\u003c/span>\u003cselect id=\"clip-sister\" data-answer=\"clip-sister\" aria-label=\"My sister loves dogs. I’ll ___ this video with her.\" data-correct=\"share\" aria-describedby=\"clip-sister-feedback\" data-exercise-field=\"clip-sister\" data-expected=\"share\">\u003coption value=\"\">Выберите ответ\u003c/option>\u003coption>skip\u003c/option>\u003coption>follow\u003c/option>\u003coption>share\u003c/option>\u003c/select>\u003cspan id=\"clip-sister-feedback\" aria-live=\"polite\">\u003c/span>\u003c/label>\n  \u003c/div>\n"},{"id":"tiktok-a2-section-2","title":"3. Just one video","html":"\n  \n  \u003cp>Послушайте Мию. Сначала ответьте на вопросы, затем сверьтесь с текстом.\u003c/p>\n  \u003caudio controls preload=\"metadata\" src=\"assets/tiktok-a2-listening.mp3\" aria-label=\"История Мии\">\u003c/audio>\n  \u003cdiv lang=\"en\">\n  \u003clabel class=\"task\" for=\"listen-first\">\u003cspan>What was the first video about?\u003c/span>\u003cselect id=\"listen-first\" data-answer=\"listen-first\" aria-label=\"What was the first video about?\" data-correct=\"a dog\" aria-describedby=\"listen-first-feedback\" data-exercise-field=\"listen-first\" data-expected=\"a dog\">\u003coption value=\"\">Выберите ответ\u003c/option>\u003coption>A bus\u003c/option>\u003coption>A dog\u003c/option>\u003coption>A recipe\u003c/option>\u003c/select>\u003cspan id=\"listen-first-feedback\" aria-live=\"polite\">\u003c/span>\u003c/label>\n  \u003clabel class=\"task\" for=\"listen-recipe\">\u003cspan>Why did Mia save the pasta video?\u003c/span>\u003cselect id=\"listen-recipe\" data-answer=\"listen-recipe\" aria-label=\"Why did Mia save the pasta video?\" data-correct=\"she wants to try the recipe.\" aria-describedby=\"listen-recipe-feedback\" data-exercise-field=\"listen-recipe\" data-expected=\"she wants to try the recipe.\">\u003coption value=\"\">Выберите ответ\u003c/option>\u003coption>She wants to send it to her sister.\u003c/option>\u003coption>She wants to try the recipe.\u003c/option>\u003coption>She wants to buy a phone.\u003c/option>\u003c/select>\u003cspan id=\"listen-recipe-feedback\" aria-live=\"polite\">\u003c/span>\u003c/label>\n  \u003clabel class=\"task\" for=\"listen-dinner\">\u003cspan>Where will Mia put her phone at dinner?\u003c/span>\u003cselect id=\"listen-dinner\" data-answer=\"listen-dinner\" aria-label=\"Where will Mia put her phone at dinner?\" data-correct=\"in her bag\" aria-describedby=\"listen-dinner-feedback\" data-exercise-field=\"listen-dinner\" data-expected=\"in her bag\">\u003coption value=\"\">Выберите ответ\u003c/option>\u003coption>On the table\u003c/option>\u003coption>In her bag\u003c/option>\u003coption>On the bus\u003c/option>\u003c/select>\u003cspan id=\"listen-dinner-feedback\" aria-live=\"polite\">\u003c/span>\u003c/label>\n  \u003c/div>\n  \u003cdetails>\u003csummary>Текст аудио\u003c/summary>\u003cp lang=\"en\">Hi, I’m Mia. On the bus home, I usually open TikTok. Yesterday, I wanted to watch just one video. The first video was about a dog. It was funny, so I sent it to my sister. Then I saw a quick pasta recipe. I saved it because I want to try it on Friday. After twenty minutes, I was still on my phone. Today, I have a new plan. I can watch videos on the bus, but at dinner, my phone stays in my bag.\u003c/p>\u003c/details>\n"},{"id":"tiktok-a2-section-3","title":"4. How often?","html":"\n  \n  \u003cp>Впишите по одному слову. Используйте \u003cstrong lang=\"en\">usually\u003c/strong>, \u003cstrong lang=\"en\">sometimes\u003c/strong> и \u003cstrong lang=\"en\">never\u003c/strong>.\u003c/p>\n  \u003cdiv lang=\"en\">\n  \u003clabel class=\"task\" for=\"frequency-usually\">\u003cspan>I watch videos on the bus most days. I ___ watch them on the bus.\u003c/span>\u003cinput id=\"frequency-usually\" data-answer=\"frequency-usually\" aria-label=\"I watch videos on the bus most days. I ___ watch them on the bus.\" data-correct=\"usually\" aria-describedby=\"frequency-usually-feedback\" type=\"text\" autocomplete=\"off\" autocapitalize=\"none\" data-exercise-field=\"frequency-usually\" data-expected=\"usually\">\u003cspan id=\"frequency-usually-feedback\" aria-live=\"polite\">\u003c/span>\u003c/label>\n  \u003clabel class=\"task\" for=\"frequency-sometimes\">\u003cspan>I share a video once in a while. I ___ share videos.\u003c/span>\u003cinput id=\"frequency-sometimes\" data-answer=\"frequency-sometimes\" aria-label=\"I share a video once in a while. I ___ share videos.\" data-correct=\"sometimes\" aria-describedby=\"frequency-sometimes-feedback\" type=\"text\" autocomplete=\"off\" autocapitalize=\"none\" data-exercise-field=\"frequency-sometimes\" data-expected=\"sometimes\">\u003cspan id=\"frequency-sometimes-feedback\" aria-live=\"polite\">\u003c/span>\u003c/label>\n  \u003clabel class=\"task\" for=\"frequency-never\">\u003cspan>I don’t watch videos at dinner. I ___ watch them at dinner.\u003c/span>\u003cinput id=\"frequency-never\" data-answer=\"frequency-never\" aria-label=\"I don’t watch videos at dinner. I ___ watch them at dinner.\" data-correct=\"never\" aria-describedby=\"frequency-never-feedback\" type=\"text\" autocomplete=\"off\" autocapitalize=\"none\" data-exercise-field=\"frequency-never\" data-expected=\"never\">\u003cspan id=\"frequency-never-feedback\" aria-live=\"polite\">\u003c/span>\u003c/label>\n  \u003c/div>\n  \u003cdetails>\u003csummary>Подсказка\u003c/summary>\u003cp>\u003cstrong>usually\u003c/strong> — обычно · \u003cstrong>sometimes\u003c/strong> — иногда · \u003cstrong>never\u003c/strong> — никогда. Обычно эти слова стоят перед основным глаголом: \u003cspan lang=\"en\">I sometimes watch travel videos.\u003c/span>\u003c/p>\u003c/details>\n"},{"id":"tiktok-a2-section-4","title":"5. Make a 15-second TikTok","html":"\n  \n  \u003cp>Выберите тему и придумайте ролик на 15 секунд. Запишите первую фразу и два действия для кадра. Затем представьте идею вслух. Преподаватель решит, сохранит ли он ролик, поделится им или пролистает.\u003c/p>\n  \u003cdetails>\u003csummary>Темы и пример\u003c/summary>\u003cdiv lang=\"en\">\u003cp>A quick recipe · A funny pet · One free thing to do in your city\u003c/p>\u003cp class=\"example\">“Do you have ten minutes?” First, I show the pasta. Then, I add lemon.\u003c/p>\u003c/div>\u003c/details>\n  \u003clabel class=\"task\" for=\"video-pitch\">\u003cspan>Your opening line and two things you’ll show\u003c/span>\u003ctextarea id=\"video-pitch\" data-answer=\"video-pitch\" aria-label=\"Your opening line and two things you’ll show\" rows=\"4\" data-exercise-field=\"video-pitch\">\u003c/textarea>\u003c/label>\n"}]}</script>
