<script type="application/json" id="lesson-data">{"title":"One More Video?","hero":"One More Video?","cabinet":"student-tiktok-a2.html","course":"tiktok-a2","level":"General English · A2","key":"gostudy-tiktok-a2-v1","wordsKey":"gostudy-tiktok-a2-words-v1","preserve":"cloud","durationMinutes":50,"steps":[{"id":"tiktok-a2-section-0","title":"1. What’s on your feed?","html":"\n  \n  \u003cp>Обсудите, какие короткие ролики Вы смотрите. Можно рассказать про любую платформу.\u003c/p>\n  \u003cdiv lang=\"en\">\n    \u003cul>\u003cli>When do you watch short videos?\u003c/li>\u003cli>What do you like more: funny videos or useful videos?\u003c/li>\u003cli>What kind of video do you always skip?\u003c/li>\u003c/ul>\n    \u003cp class=\"example\">I usually watch short videos on the bus. I like travel videos because I get new ideas.\u003c/p>\n  \u003c/div>\n"},{"id":"tiktok-a2-section-1","title":"2. Save it or skip it?","html":"\n  \n  \u003cp>Прочитайте описания двух вымышленных роликов. Какой Вы сохраните, а какой пропустите?\u003c/p>\n  \u003cdiv class=\"grid\" lang=\"en\">\n    \u003carticle class=\"clip\">\u003ch3>A · Pasta in 10 minutes\u003c/h3>\u003cp>Anna shows you how to make lemon pasta. She uses five things you may already have at home. At the end, she shows the recipe on the screen.\u003c/p>\u003c/article>\n    \u003carticle class=\"clip\">\u003ch3>B · The dog with a job\u003c/h3>\u003cp>A small dog sits at a desk. His owner says, “You have a meeting in five minutes.” The dog looks at the camera and goes back to sleep.\u003c/p>\u003c/article>\n  \u003c/div>\n  \u003cdetails>\u003csummary>Слова и фразы\u003c/summary>\u003cp>\u003cstrong>feed\u003c/strong> — лента · \u003cstrong>scroll\u003c/strong> — листать · \u003cstrong>skip\u003c/strong> — пропустить · \u003cstrong>save\u003c/strong> — сохранить · \u003cstrong>follow\u003c/strong> — подписаться · \u003cstrong>share\u003c/strong> — поделиться · \u003cstrong>useful\u003c/strong> — полезный\u003c/p>\u003c/details>\n  \u003cp>Выберите подходящее слово.\u003c/p>\n  \u003cdiv lang=\"en\">\n  \u003clabel class=\"task\" data-answer-row for=\"clip-recipe\">\u003cspan>I want to make this pasta on Friday. I’ll ___ the video.\u003c/span>\u003cselect id=\"clip-recipe\" data-answer=\"clip-recipe\" aria-label=\"I want to make this pasta on Friday. I’ll ___ the video.\" data-correct=\"save\" aria-describedby=\"clip-recipe-feedback\" data-exercise-field=\"clip-recipe\" data-expected=\"save\">\u003coption value=\"\">Выберите ответ\u003c/option>\u003coption>share\u003c/option>\u003coption>save\u003c/option>\u003coption>skip\u003c/option>\u003c/select>\u003cspan id=\"clip-recipe-feedback\" aria-live=\"polite\" data-grade>\u003c/span>\u003c/label>\n  \u003clabel class=\"task\" data-answer-row for=\"clip-creator\">\u003cspan>I want to see more videos from Anna. I’ll ___ her.\u003c/span>\u003cselect id=\"clip-creator\" data-answer=\"clip-creator\" aria-label=\"I want to see more videos from Anna. I’ll ___ her.\" data-correct=\"follow\" aria-describedby=\"clip-creator-feedback\" data-exercise-field=\"clip-creator\" data-expected=\"follow\">\u003coption value=\"\">Выберите ответ\u003c/option>\u003coption>follow\u003c/option>\u003coption>save\u003c/option>\u003coption>skip\u003c/option>\u003c/select>\u003cspan id=\"clip-creator-feedback\" aria-live=\"polite\" data-grade>\u003c/span>\u003c/label>\n  \u003clabel class=\"task\" data-answer-row for=\"clip-sister\">\u003cspan>My sister loves dogs. I’ll ___ this video with her.\u003c/span>\u003cselect id=\"clip-sister\" data-answer=\"clip-sister\" aria-label=\"My sister loves dogs. I’ll ___ this video with her.\" data-correct=\"share\" aria-describedby=\"clip-sister-feedback\" data-exercise-field=\"clip-sister\" data-expected=\"share\">\u003coption value=\"\">Выберите ответ\u003c/option>\u003coption>skip\u003c/option>\u003coption>follow\u003c/option>\u003coption>share\u003c/option>\u003c/select>\u003cspan id=\"clip-sister-feedback\" aria-live=\"polite\" data-grade>\u003c/span>\u003c/label>\n  \u003c/div>\n"},{"id":"tiktok-a2-section-2","title":"3. Just one video","html":"\n  \n  \u003cp>Послушайте Мию. Сначала ответьте на вопросы, затем сверьтесь с текстом.\u003c/p>\n  \u003caudio controls preload=\"metadata\" src=\"assets/tiktok-a2-listening.mp3\" aria-label=\"История Мии\">\u003c/audio>\n  \u003cdiv lang=\"en\">\n  \u003clabel class=\"task\" data-answer-row for=\"listen-first\">\u003cspan>What was the first video about?\u003c/span>\u003cselect id=\"listen-first\" data-answer=\"listen-first\" aria-label=\"What was the first video about?\" data-correct=\"a dog\" aria-describedby=\"listen-first-feedback\" data-exercise-field=\"listen-first\" data-expected=\"a dog\">\u003coption value=\"\">Выберите ответ\u003c/option>\u003coption>A bus\u003c/option>\u003coption>A dog\u003c/option>\u003coption>A recipe\u003c/option>\u003c/select>\u003cspan id=\"listen-first-feedback\" aria-live=\"polite\" data-grade>\u003c/span>\u003c/label>\n  \u003clabel class=\"task\" data-answer-row for=\"listen-recipe\">\u003cspan>Why did Mia save the pasta video?\u003c/span>\u003cselect id=\"listen-recipe\" data-answer=\"listen-recipe\" aria-label=\"Why did Mia save the pasta video?\" data-correct=\"she wants to try the recipe.\" aria-describedby=\"listen-recipe-feedback\" data-exercise-field=\"listen-recipe\" data-expected=\"she wants to try the recipe.\">\u003coption value=\"\">Выберите ответ\u003c/option>\u003coption>She wants to send it to her sister.\u003c/option>\u003coption>She wants to try the recipe.\u003c/option>\u003coption>She wants to buy a phone.\u003c/option>\u003c/select>\u003cspan id=\"listen-recipe-feedback\" aria-live=\"polite\" data-grade>\u003c/span>\u003c/label>\n  \u003clabel class=\"task\" data-answer-row for=\"listen-dinner\">\u003cspan>Where will Mia put her phone at dinner?\u003c/span>\u003cselect id=\"listen-dinner\" data-answer=\"listen-dinner\" aria-label=\"Where will Mia put her phone at dinner?\" data-correct=\"in her bag\" aria-describedby=\"listen-dinner-feedback\" data-exercise-field=\"listen-dinner\" data-expected=\"in her bag\">\u003coption value=\"\">Выберите ответ\u003c/option>\u003coption>On the table\u003c/option>\u003coption>In her bag\u003c/option>\u003coption>On the bus\u003c/option>\u003c/select>\u003cspan id=\"listen-dinner-feedback\" aria-live=\"polite\" data-grade>\u003c/span>\u003c/label>\n  \u003c/div>\n  \u003cdetails>\u003csummary>Текст аудио\u003c/summary>\u003cp lang=\"en\">Hi, I’m Mia. On the bus home, I usually open TikTok. Yesterday, I wanted to watch just one video. The first video was about a dog. It was funny, so I sent it to my sister. Then I saw a quick pasta recipe. I saved it because I want to try it on Friday. After twenty minutes, I was still on my phone. Today, I have a new plan. I can watch videos on the bus, but at dinner, my phone stays in my bag.\u003c/p>\u003c/details>\n"},{"id":"tiktok-a2-section-3","title":"4. How often?","html":"\n  \n  \u003cp>Впишите по одному слову. Используйте \u003cstrong lang=\"en\">usually\u003c/strong>, \u003cstrong lang=\"en\">sometimes\u003c/strong> и \u003cstrong lang=\"en\">never\u003c/strong>.\u003c/p>\n  \u003cdiv lang=\"en\">\n  \u003clabel class=\"task\" data-answer-row for=\"frequency-usually\">\u003cspan>I watch videos on the bus most days. I ___ watch them on the bus.\u003c/span>\u003cinput id=\"frequency-usually\" data-answer=\"frequency-usually\" aria-label=\"I watch videos on the bus most days. I ___ watch them on the bus.\" data-correct=\"usually\" aria-describedby=\"frequency-usually-feedback\" type=\"text\" autocomplete=\"off\" autocapitalize=\"none\" data-exercise-field=\"frequency-usually\" data-expected=\"usually\">\u003cspan id=\"frequency-usually-feedback\" aria-live=\"polite\" data-grade>\u003c/span>\u003c/label>\n  \u003clabel class=\"task\" data-answer-row for=\"frequency-sometimes\">\u003cspan>I share a video once in a while. I ___ share videos.\u003c/span>\u003cinput id=\"frequency-sometimes\" data-answer=\"frequency-sometimes\" aria-label=\"I share a video once in a while. I ___ share videos.\" data-correct=\"sometimes\" aria-describedby=\"frequency-sometimes-feedback\" type=\"text\" autocomplete=\"off\" autocapitalize=\"none\" data-exercise-field=\"frequency-sometimes\" data-expected=\"sometimes\">\u003cspan id=\"frequency-sometimes-feedback\" aria-live=\"polite\" data-grade>\u003c/span>\u003c/label>\n  \u003clabel class=\"task\" data-answer-row for=\"frequency-never\">\u003cspan>I don’t watch videos at dinner. I ___ watch them at dinner.\u003c/span>\u003cinput id=\"frequency-never\" data-answer=\"frequency-never\" aria-label=\"I don’t watch videos at dinner. I ___ watch them at dinner.\" data-correct=\"never\" aria-describedby=\"frequency-never-feedback\" type=\"text\" autocomplete=\"off\" autocapitalize=\"none\" data-exercise-field=\"frequency-never\" data-expected=\"never\">\u003cspan id=\"frequency-never-feedback\" aria-live=\"polite\" data-grade>\u003c/span>\u003c/label>\n  \u003c/div>\n  \u003cdetails>\u003csummary>Подсказка\u003c/summary>\u003cp>\u003cstrong>usually\u003c/strong> — обычно · \u003cstrong>sometimes\u003c/strong> — иногда · \u003cstrong>never\u003c/strong> — никогда. Обычно эти слова стоят перед основным глаголом: \u003cspan lang=\"en\">I sometimes watch travel videos.\u003c/span>\u003c/p>\u003c/details>\n"},{"id":"tiktok-a2-section-4","title":"5. Make a 15-second TikTok","html":"\n  \n  \u003cp>Выберите тему и придумайте ролик на 15 секунд. Запишите первую фразу и два действия для кадра. Затем представьте идею вслух. Преподаватель решит, сохранит ли он ролик, поделится им или пролистает.\u003c/p>\n  \u003cdetails>\u003csummary>Темы и пример\u003c/summary>\u003cdiv lang=\"en\">\u003cp>A quick recipe · A funny pet · One free thing to do in your city\u003c/p>\u003cp class=\"example\">“Do you have ten minutes?” First, I show the pasta. Then, I add lemon.\u003c/p>\u003c/div>\u003c/details>\n  \u003clabel class=\"task\" data-answer-row for=\"video-pitch\">\u003cspan>Your opening line and two things you’ll show\u003c/span>\u003ctextarea id=\"video-pitch\" data-answer=\"video-pitch\" aria-label=\"Your opening line and two things you’ll show\" rows=\"4\" data-exercise-field=\"video-pitch\">\u003c/textarea>\u003c/label>\n"},{"id":"tiktok-a2-section-5","title":"6. TikTok — Watch & Learn","html":"\u003cp>\u003cstrong>10–12 минут · A2 с опорами.\u003c/strong> Это реальное видео Yumna / Feel Good Foodie о пасте, популярной в TikTok. Смотрим только \u003cstrong>2:24–3:30\u003c/strong> из ролика The Viral Baked Feta Pasta | Three Versions. Здесь показана версия на плите.\u003c/p>\n\u003ch3>Before you watch · Words in the kitchen\u003c/h3>\u003cp>Прочитайте слова. Сначала выберите ответы в коротких примерах; затем используйте эти слова при просмотре.\u003c/p>\u003cdiv lang=\"en\">\u003cp>\u003cstrong>pan\u003c/strong> — сковорода · \u003cstrong>heat\u003c/strong> — нагрев, огонь · \u003cstrong>cook\u003c/strong> — готовить · \u003cstrong>add\u003c/strong> — добавлять · \u003cstrong>mix\u003c/strong> — смешивать · \u003cstrong>sauce\u003c/strong> — соус · \u003cstrong>garlic\u003c/strong> — чеснок · \u003cstrong>fresh\u003c/strong> — свежий\u003c/p>\u003cdiv class=\"term\" data-answer-row>\u003clabel for=\"tt6-word-pan\">We need a ___ to cook on the stove.\u003c/label>\u003cselect id=\"tt6-word-pan\" data-answer=\"tt6-word-pan\" data-exercise-field=\"tt6-word-pan\" data-expected=\"pan\" aria-label=\"We need a ___ to cook on the stove.\" aria-describedby=\"tt6-word-pan-feedback\">\u003coption value=\"\">Выберите ответ\u003c/option>\u003coption>pan\u003c/option>\u003coption>sauce\u003c/option>\u003coption>garlic\u003c/option>\u003c/select>\u003cspan class=\"feedback\" id=\"tt6-word-pan-feedback\" aria-live=\"polite\" data-grade>\u003c/span>\u003c/div>\u003cdiv class=\"term\" data-answer-row>\u003clabel for=\"tt6-word-heat\">The pan is too hot. Turn down the ___.\u003c/label>\u003cselect id=\"tt6-word-heat\" data-answer=\"tt6-word-heat\" data-exercise-field=\"tt6-word-heat\" data-expected=\"heat\" aria-label=\"The pan is too hot. Turn down the ___.\" aria-describedby=\"tt6-word-heat-feedback\">\u003coption value=\"\">Выберите ответ\u003c/option>\u003coption>sauce\u003c/option>\u003coption>heat\u003c/option>\u003coption>pan\u003c/option>\u003c/select>\u003cspan class=\"feedback\" id=\"tt6-word-heat-feedback\" aria-live=\"polite\" data-grade>\u003c/span>\u003c/div>\u003cdiv class=\"term\" data-answer-row>\u003clabel for=\"tt6-word-cook\">I ___ dinner for my family every evening.\u003c/label>\u003cselect id=\"tt6-word-cook\" data-answer=\"tt6-word-cook\" data-exercise-field=\"tt6-word-cook\" data-expected=\"cook\" aria-label=\"I ___ dinner for my family every evening.\" aria-describedby=\"tt6-word-cook-feedback\">\u003coption value=\"\">Выберите ответ\u003c/option>\u003coption>mix\u003c/option>\u003coption>add\u003c/option>\u003coption>cook\u003c/option>\u003c/select>\u003cspan class=\"feedback\" id=\"tt6-word-cook-feedback\" aria-live=\"polite\" data-grade>\u003c/span>\u003c/div>\u003cdiv class=\"term\" data-answer-row>\u003clabel for=\"tt6-word-add\">Please ___ some salt to the soup.\u003c/label>\u003cselect id=\"tt6-word-add\" data-answer=\"tt6-word-add\" data-exercise-field=\"tt6-word-add\" data-expected=\"add\" aria-label=\"Please ___ some salt to the soup.\" aria-describedby=\"tt6-word-add-feedback\">\u003coption value=\"\">Выберите ответ\u003c/option>\u003coption>add\u003c/option>\u003coption>cook\u003c/option>\u003coption>heat\u003c/option>\u003c/select>\u003cspan class=\"feedback\" id=\"tt6-word-add-feedback\" aria-live=\"polite\" data-grade>\u003c/span>\u003c/div>\u003cdiv class=\"term\" data-answer-row>\u003clabel for=\"tt6-word-mix\">Use a spoon to ___ the tomato and cheese together.\u003c/label>\u003cselect id=\"tt6-word-mix\" data-answer=\"tt6-word-mix\" data-exercise-field=\"tt6-word-mix\" data-expected=\"mix\" aria-label=\"Use a spoon to ___ the tomato and cheese together.\" aria-describedby=\"tt6-word-mix-feedback\">\u003coption value=\"\">Выберите ответ\u003c/option>\u003coption>heat\u003c/option>\u003coption>mix\u003c/option>\u003coption>cook\u003c/option>\u003c/select>\u003cspan class=\"feedback\" id=\"tt6-word-mix-feedback\" aria-live=\"polite\" data-grade>\u003c/span>\u003c/div>\u003cdiv class=\"term\" data-answer-row>\u003clabel for=\"tt6-word-sauce\">The pasta is dry. It needs more ___.\u003c/label>\u003cselect id=\"tt6-word-sauce\" data-answer=\"tt6-word-sauce\" data-exercise-field=\"tt6-word-sauce\" data-expected=\"sauce\" aria-label=\"The pasta is dry. It needs more ___.\" aria-describedby=\"tt6-word-sauce-feedback\">\u003coption value=\"\">Выберите ответ\u003c/option>\u003coption>garlic\u003c/option>\u003coption>pan\u003c/option>\u003coption>sauce\u003c/option>\u003c/select>\u003cspan class=\"feedback\" id=\"tt6-word-sauce-feedback\" aria-live=\"polite\" data-grade>\u003c/span>\u003c/div>\u003cdiv class=\"term\" data-answer-row>\u003clabel for=\"tt6-word-garlic\">This small white ingredient has a strong smell. It is ___.\u003c/label>\u003cselect id=\"tt6-word-garlic\" data-answer=\"tt6-word-garlic\" data-exercise-field=\"tt6-word-garlic\" data-expected=\"garlic\" aria-label=\"This small white ingredient has a strong smell. It is ___.\" aria-describedby=\"tt6-word-garlic-feedback\">\u003coption value=\"\">Выберите ответ\u003c/option>\u003coption>sauce\u003c/option>\u003coption>garlic\u003c/option>\u003coption>heat\u003c/option>\u003c/select>\u003cspan class=\"feedback\" id=\"tt6-word-garlic-feedback\" aria-live=\"polite\" data-grade>\u003c/span>\u003c/div>\u003cdiv class=\"term\" data-answer-row>\u003clabel for=\"tt6-word-fresh\">These tomatoes are from the garden today. They are ___.\u003c/label>\u003cselect id=\"tt6-word-fresh\" data-answer=\"tt6-word-fresh\" data-exercise-field=\"tt6-word-fresh\" data-expected=\"fresh\" aria-label=\"These tomatoes are from the garden today. They are ___.\" aria-describedby=\"tt6-word-fresh-feedback\">\u003coption value=\"\">Выберите ответ\u003c/option>\u003coption>fresh\u003c/option>\u003coption>hot\u003c/option>\u003coption>dry\u003c/option>\u003c/select>\u003cspan class=\"feedback\" id=\"tt6-word-fresh-feedback\" aria-live=\"polite\" data-grade>\u003c/span>\u003c/div>\u003c/div>\u003ch3>Watch twice · What happens?\u003c/h3>\u003cp>Первый раз смотрите весь фрагмент и определите блюдо. Во второй раз включите английские субтитры (CC) и при необходимости скорость 0.75. Делайте паузы: \u003cstrong>2:24–2:47\u003c/strong> — приготовление; \u003cstrong>2:47–3:30\u003c/strong> — добавки и паста. Не нужно понимать каждое слово.\u003c/p>\n\u003cfigure class=\"unified-video\">\u003ciframe loading=\"lazy\" title=\"Feel Good Foodie: TikTok pasta, fragment 2:24–3:30\" src=\"https://www.youtube-nocookie.com/embed/LuroDGsJkMA?start=144&amp;end=210&amp;cc_load_policy=1&amp;cc_lang_pref=en&amp;rel=0\" allow=\"encrypted-media; picture-in-picture; fullscreen\" allowfullscreen>\u003c/iframe>\u003c/figure>\u003cp>\u003ca href=\"https://www.youtube.com/watch?v=LuroDGsJkMA&amp;t=144s\" target=\"_blank\" rel=\"noopener noreferrer\">Открыть оригинал на YouTube с 2:24\u003c/a> · Остановите на 3:30.\u003c/p>\n\u003cp>Если встроенный плеер не открывается, используйте ссылку на оригинал. Текст рецепта и фотографии автора: \u003ca href=\"https://feelgoodfoodie.net/recipe/baked-feta-pasta/\" target=\"_blank\" rel=\"noopener noreferrer\">Feel Good Foodie\u003c/a>. На сайте описана версия для духовки; её время приготовления отличается. Вопросы ниже относятся только к видео.\u003c/p>\n\u003cdetails>\u003csummary>Подсказки для просмотра\u003c/summary>\u003cp>\u003cspan lang=\"en\">stove / stove top\u003c/span> — плита; \u003cspan lang=\"en\">medium heat\u003c/span> — средний огонь; \u003cspan lang=\"en\">basil\u003c/span> — базилик; \u003cspan lang=\"en\">pasta water\u003c/span> — вода после варки пасты; \u003cspan lang=\"en\">any kind\u003c/span> — любой вид. Слова показываются действиями в кадре.\u003c/p>\u003c/details>\u003cdiv lang=\"en\">\u003cp>Choose one answer for each question. Watch again to check.\u003c/p>\u003cdiv class=\"term\" data-answer-row>\u003clabel for=\"tt6-watch-where\">Where does Yumna cook the third version?\u003c/label>\u003cselect id=\"tt6-watch-where\" data-answer=\"tt6-watch-where\" data-exercise-field=\"tt6-watch-where\" data-expected=\"In a pan on the stove\" aria-label=\"Where does Yumna cook the third version?\" aria-describedby=\"tt6-watch-where-feedback\">\u003coption value=\"\">Выберите ответ\u003c/option>\u003coption>In the oven\u003c/option>\u003coption>In a pan on the stove\u003c/option>\u003coption>In a microwave\u003c/option>\u003c/select>\u003cspan class=\"feedback\" id=\"tt6-watch-where-feedback\" aria-live=\"polite\" data-grade>\u003c/span>\u003c/div>\u003cdiv class=\"term\" data-answer-row>\u003clabel for=\"tt6-watch-time\">How long does she cook it on medium heat?\u003c/label>\u003cselect id=\"tt6-watch-time\" data-answer=\"tt6-watch-time\" data-exercise-field=\"tt6-watch-time\" data-expected=\"10 minutes\" aria-label=\"How long does she cook it on medium heat?\" aria-describedby=\"tt6-watch-time-feedback\">\u003coption value=\"\">Выберите ответ\u003c/option>\u003coption>10 minutes\u003c/option>\u003coption>35 minutes\u003c/option>\u003coption>2 minutes\u003c/option>\u003c/select>\u003cspan class=\"feedback\" id=\"tt6-watch-time-feedback\" aria-live=\"polite\" data-grade>\u003c/span>\u003c/div>\u003cdiv class=\"term\" data-answer-row>\u003clabel for=\"tt6-watch-herbs\">What does she add just before mixing the cooked tomatoes and cheese?\u003c/label>\u003cselect id=\"tt6-watch-herbs\" data-answer=\"tt6-watch-herbs\" data-exercise-field=\"tt6-watch-herbs\" data-expected=\"Basil and garlic\" aria-label=\"What does she add just before mixing the cooked tomatoes and cheese?\" aria-describedby=\"tt6-watch-herbs-feedback\">\u003coption value=\"\">Выберите ответ\u003c/option>\u003coption>Sugar and milk\u003c/option>\u003coption>Lemon and rice\u003c/option>\u003coption>Basil and garlic\u003c/option>\u003c/select>\u003cspan class=\"feedback\" id=\"tt6-watch-herbs-feedback\" aria-live=\"polite\" data-grade>\u003c/span>\u003c/div>\u003cdiv class=\"term\" data-answer-row>\u003clabel for=\"tt6-watch-pasta\">What does she say about the kind of pasta?\u003c/label>\u003cselect id=\"tt6-watch-pasta\" data-answer=\"tt6-watch-pasta\" data-exercise-field=\"tt6-watch-pasta\" data-expected=\"You can use any kind\" aria-label=\"What does she say about the kind of pasta?\" aria-describedby=\"tt6-watch-pasta-feedback\">\u003coption value=\"\">Выберите ответ\u003c/option>\u003coption>You can use any kind\u003c/option>\u003coption>Only penne works\u003c/option>\u003coption>You must make fresh pasta\u003c/option>\u003c/select>\u003cspan class=\"feedback\" id=\"tt6-watch-pasta-feedback\" aria-live=\"polite\" data-grade>\u003c/span>\u003c/div>\u003c/div>\u003cdetails>\u003csummary>Ключи и моменты для самопроверки — после ответов\u003c/summary>\u003cp>Лексика: 1 pan; 2 heat; 3 cook; 4 add; 5 mix; 6 sauce; 7 garlic; 8 fresh.\u003c/p>\u003cp>Видео: 1 In a pan on the stove (2:24–2:43); 2 10 minutes (2:41–2:45); 3 Basil and garlic (2:50–2:55); 4 You can use any kind (3:16–3:20). На 3:21–3:27 автор добавляет воду от пасты для соуса.\u003c/p>\u003c/details>"},{"id":"tiktok-a2-section-6","title":"7. TikTok — Watch & Discuss","html":"\u003cp>\u003cstrong>8–10 минут · A2.\u003c/strong> Обсудите тот же фрагмент \u003cstrong>2:24–3:30\u003c/strong>. Сначала запишите ключевые слова, затем ответьте вслух 2–3 предложениями. Для каждого мнения назовите причину и деталь из видео. Здесь возможны разные ответы; их обсуждает преподаватель.\u003c/p>\n\u003cp>\u003ca href=\"https://www.youtube.com/watch?v=LuroDGsJkMA&amp;t=144s\" target=\"_blank\" rel=\"noopener noreferrer\">Ещё раз открыть видео с 2:24\u003c/a>\u003c/p>\n\u003cdiv lang=\"en\">\u003ch3>1 · Easy on screen, easy at home?\u003c/h3>\u003cp>At 2:24–2:47, Yumna cooks the sauce in a pan. You have one pan and 20 minutes after work. Would you try this recipe? What else do you need to know before you start?\u003c/p>\u003clabel class=\"field-label\" data-answer-row for=\"tt7-plan\">\u003cspan>My choice, a reason, and one thing I need to know\u003c/span>\u003ctextarea id=\"tt7-plan\" data-answer=\"tt7-plan\" data-exercise-field=\"tt7-plan\" aria-label=\"My choice, a reason, and one thing I need to know\" rows=\"3\">\u003c/textarea>\u003c/label>\n\u003ch3>2 · What would you change?\u003c/h3>\u003cp>At 2:50–2:55, she adds basil and garlic. Your friend does not like garlic. What would you change? Would the dish still taste good? Explain your idea.\u003c/p>\u003clabel class=\"field-label\" data-answer-row for=\"tt7-change\">\u003cspan>My change and why it could work\u003c/span>\u003ctextarea id=\"tt7-change\" data-answer=\"tt7-change\" data-exercise-field=\"tt7-change\" aria-label=\"My change and why it could work\" rows=\"3\">\u003c/textarea>\u003c/label>\n\u003ch3>3 · Can a short clip teach enough?\u003c/h3>\u003cp>At 3:16–3:27, she adds cooked pasta and pasta water. Imagine a 15-second TikTok shows only the finished dish. Which two steps must you keep so a beginner can make it? Which detail would you leave out? Explain why.\u003c/p>\u003clabel class=\"field-label\" data-answer-row for=\"tt7-edit\">\u003cspan>Two steps to keep, one detail to leave out, and why\u003c/span>\u003ctextarea id=\"tt7-edit\" data-answer=\"tt7-edit\" data-exercise-field=\"tt7-edit\" aria-label=\"Two steps to keep, one detail to leave out, and why\" rows=\"3\">\u003c/textarea>\u003c/label>\n\u003ch3>4 · Save it, share it, or check it first?\u003c/h3>\u003cp>A friend says, “It looks easy. The whole meal takes ten minutes!” In the video, ten minutes is the cooking time for the sauce. What would you ask or check before sharing the video? Would you save it for yourself? Give a reason.\u003c/p>\u003clabel class=\"field-label\" data-answer-row for=\"tt7-share\">\u003cspan>One question for the creator and my save or share decision\u003c/span>\u003ctextarea id=\"tt7-share\" data-answer=\"tt7-share\" data-exercise-field=\"tt7-share\" aria-label=\"One question for the creator and my save or share decision\" rows=\"3\">\u003c/textarea>\u003c/label>\n\u003ch3>Try it together · A 30-second recommendation\u003c/h3>\u003cp>Tell a friend whether to try this TikTok recipe. Mention two details from the video, one change you would make, and one thing to check. Use at least three words: \u003cstrong>pan · heat · cook · add · mix · sauce · garlic · fresh\u003c/strong>. Your teacher asks one follow-up question; then swap roles.\u003c/p>\u003clabel class=\"field-label\" data-answer-row for=\"tt7-recommend\">\u003cspan>My recommendation: details, a change, and a question\u003c/span>\u003ctextarea id=\"tt7-recommend\" data-answer=\"tt7-recommend\" data-exercise-field=\"tt7-recommend\" aria-label=\"My recommendation: details, a change, and a question\" rows=\"3\">\u003c/textarea>\u003c/label>\n\u003cdetails>\u003csummary>Useful language\u003c/summary>\u003cp>I would try it because … / I would add … / I would not use … / First … Then … / The video shows … / We still need to know … / I would save it, but first …\u003c/p>\u003c/details>\u003c/div>\n\u003cdetails>\u003csummary>Как оценить устный ответ\u003c/summary>\u003cp>Проверьте вместе с преподавателем: две точные детали видео; объяснение с because; три слова из списка; один содержательный вопрос. Цель — понятный ответ, а не речь без ошибок. Если чего-то не хватает, попробуйте ещё раз с опорами.\u003c/p>\u003c/details>"}]}</script>
