<script type="application/json" id="lesson-data">{"title":"The Gallery Makeover","cabinet":"student-art-b1.html","course":"art-b1","level":"Art & Mosaics · B1","key":"gostudy-art-b1-03-v1","wordsKey":"gostudy-vocabulary-art-b1-v1","preserve":"cloud","durationMinutes":50,"steps":[{"id":"art-b1-03-0","title":"01 · Which gallery would you visit?","minutes":5,"instruction":"REVISION & LEAD-IN · 5 min. Describe one artwork from the last lesson and say how it made you feel.","source":["Imagine an old community gallery is reopening. Its paintings are beautiful, but visitors often leave after ten minutes.","DISCUSS · Would you prefer a quiet gallery with just a few paintings or a lively interactive exhibition? Why?","TODAY'S GOAL · Recommend changes to a gallery, compare options and politely defend your choices."],"visual":{"kind":"cards","cards":[["🖼️","Room A","Classic exhibition","Paintings in long rows."],["💡","Room B","Modern exhibition","Stories, light and interaction."]]},"teacherNotes":"5 min. Reactivate 'in the foreground / background', texture and atmosphere if available. Invite reasons."},{"id":"art-b1-03-1","title":"02 · Language for a better exhibition","minutes":8,"instruction":"PRE-READING · 8 min. Match six expressions, then make two recommendations about Room A.","type":"match","source":["TARGET EXPRESSIONS · display an artwork · catch someone's eye · arrange by theme · highlight a detail · create an atmosphere · guide visitors"],"items":[["display an artwork",["show a painting or object publicly","buy a work secretly","describe a museum online"],0,""],["catch someone's eye",["make someone feel tired","attract someone's attention","hide an object"],1,""],["arrange by theme",["group objects by shared ideas","sort paintings by price only","remove all labels"],0,""],["highlight a detail",["make something important easier to notice","paint the whole room","move everything outside"],0,""],["create an atmosphere",["change the opening hours","give a place a particular feeling","write a ticket price"],1,""],["guide visitors",["help people find their way and understand an exhibition","check visitors' bags","sell visitors a painting"],0,""]],"teacherNotes":"8 min. Six productive phrases. Elicit one example per phrase; ask 'Which would you use, and why?'."},{"id":"art-b1-03-2","title":"03 · A curator's proposal","minutes":9,"instruction":"WHILE-READING · 9 min. Read the proposal. Decide what matters most and check the evidence.","source":["FROM: Maya, Community Gallery Curator. TO: The Gallery Team.","Last month we asked 60 visitors about their experience. Most enjoyed the paintings, but many said the rooms felt crowded and the labels were difficult to read. Several visitors missed the small mosaic collection near the exit.","I suggest we arrange the artworks by theme rather than by date. This could help people notice connections between older and newer pieces. We should display fewer works in each room and give every painting more space. A short story beside each artwork might guide visitors without telling them exactly what to think.","We also need to highlight the colourful mosaic by the window because it often catches people's eye once they notice it. Warm, gentle lighting could create a calmer atmosphere, although installing new lamps would cost money. I'd like to test the new layout for two weeks before changing the whole gallery.","DISCUSS · What is fact, suggestion, and possible risk in Maya's proposal?"],"type":"choice","items":[["What was a common visitor complaint?",["The gallery was too expensive","The rooms felt crowded","There were no paintings"],1,""],["Why does Maya suggest arranging works by theme?",["To show connections between works","To hide the oldest work","To make paintings cheaper"],0,""],["What would need extra money?",["New lighting","Shorter labels","More space between paintings"],0,""],["Why test the layout first?",["To avoid every visitor","To replace the curator","To learn whether the changes help before expanding"],2,""]],"teacherNotes":"9 min. 2 min prediction, 3 min reading, 2 min checks, 2 min evidence discussion. Avoid translating whole text."},{"id":"art-b1-03-3","title":"04 · Make a suggestion, not a command","minutes":7,"instruction":"LANGUAGE FOCUS · 7 min. Notice how the curator makes polite suggestions.","source":["NOTICE · We should display fewer works. We could arrange them by theme. Why don't we test the lighting? How about adding a short story beside each artwork?","SHOULD = stronger recommendation; COULD = possible option; HOW ABOUT + -ing = friendly suggestion.","SPEAK · Turn 'Move that painting!' and 'Change the lights!' into polite recommendations with reasons."],"type":"gap","items":[["We ___ display fewer paintings to make the room calmer.",["should","were","did"],0,""],["We could ___ the mosaic near the entrance.",["putting","put","puts"],1,""],["How about ___ short stories beside the artworks?",["adding","add","added"],0,""],["Why don't we ___ the layout for two weeks?",["tested","test","testing"],1,""],["A new light ___ help visitors notice the colours.",["might","must to","have"],0,""]],"teacherNotes":"7 min. Contrast recommendation strength (should/could/might); use one form family for communicative aim, not a separate tense lesson."},{"id":"art-b1-03-4","title":"05 · Design within a budget","minutes":6,"instruction":"GUIDED DECISION · 6 min. Your team has €300. Choose the most useful changes and explain your reasoning.","source":["OPTION A · New labels with short stories: €80. OPTION B · Better spotlights for the mosaic: €170. OPTION C · Audio guide: €260. OPTION D · Free rearrangement by theme: €0.","You may combine options, but the total cannot exceed €300. Explain which change will catch visitors' eye and create a better atmosphere.","SPEAK · Use 'We should… because…', 'We could also…', 'However…'."],"type":"choice","items":[["Which combination costs €250?",["Labels + spotlights","Labels + audio guide","Audio guide + spotlights"],0,""],["Which improvement costs nothing?",["Audio guide","Rearrangement by theme","Better lighting"],1,""]],"teacherNotes":"6 min. Use two questions for quick checking; spend at least 4 min discussing the decision."},{"id":"art-b1-03-5","title":"06 · Curator vs museum director","minutes":11,"instruction":"INDEPENDENT SPEAKING · 11 min. Present a gallery makeover. Your teacher is the director who questions the plan.","source":["ROUND 1 · Curator: propose three changes for €300, explain how each will help visitors, and use at least four target expressions.","DIRECTOR · Ask: 'What evidence suggests visitors will benefit?' 'How will you know it worked?' 'What would you remove if we had only €150?'","ROUND 2 · Unexpected problem: the museum can only close one room for renovation. Keep your strongest idea and negotiate a simpler alternative.","SUCCESS · Give a clear recommendation; support two choices with reasons; make two polite suggestions; respond to one objection."],"visual":{"kind":"cards","cards":[["🎨","Curator","Recommend the makeover","Use examples and reasons."],["🏛️","Director","Challenge the plan","Ask for evidence and budget."]]},"teacherNotes":"11 min. Elicit fluent proposal; note suggestions and reasoning. Swap roles briefly if fluent."},{"id":"art-b1-03-6","title":"07 · Write the exhibition pitch","minutes":4,"instruction":"WRAP-UP · 4 min. Write a short 3–4 sentence pitch and share it aloud.","type":"write","source":["We should… because… We could also… That might… I would test…","REFLECT · Which two expressions can you use to discuss art outside the classroom?","HOMEWORK · Write a visitor-friendly gallery proposal and practise the six expressions."],"teacherNotes":"4 min. Student should reuse at least 3 target phrases and two suggestion patterns."}]}</script>
