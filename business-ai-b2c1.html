function feedWords(){return card("Language for an investment decision","<div class=\"word-grid\"><article class=\"word\"><strong>a use case</strong><p>Start with a specific use case.</p><details><summary>Перевод</summary><p>сценарий применения</p></details><button type=\"button\" class=\"small-button\" data-speak-word>🔊 Прослушать слово</button> <button data-add=\"0\" class=\"small-button\">♥ В словарь</button></article><article class=\"word\"><strong>a bottleneck</strong><p>Review time became our bottleneck.</p><details><summary>Перевод</summary><p>узкое место</p></details><button type=\"button\" class=\"small-button\" data-speak-word>🔊 Прослушать слово</button> <button data-add=\"1\" class=\"small-button\">♥ В словарь</button></article><article class=\"word\"><strong>a baseline</strong><p>We need a baseline before the pilot.</p><details><summary>Перевод</summary><p>исходный показатель для сравнения</p></details><button type=\"button\" class=\"small-button\" data-speak-word>🔊 Прослушать слово</button> <button data-add=\"2\" class=\"small-button\">♥ В словарь</button></article><article class=\"word\"><strong>human oversight</strong><p>Sensitive decisions require human oversight.</p><details><summary>Перевод</summary><p>контроль со стороны человека</p></details><button type=\"button\" class=\"small-button\" data-speak-word>🔊 Прослушать слово</button> <button data-add=\"3\" class=\"small-button\">♥ В словарь</button></article><article class=\"word\"><strong>a trade-off</strong><p>There is a trade-off between speed and accuracy.</p><details><summary>Перевод</summary><p>компромисс между преимуществами и потерями</p></details><button type=\"button\" class=\"small-button\" data-speak-word>🔊 Прослушать слово</button> <button data-add=\"4\" class=\"small-button\">♥ В словарь</button></article><article class=\"word\"><strong>a misleading output</strong><p>A fluent answer can still be misleading.</p><details><summary>Перевод</summary><p>вводящий в заблуждение результат</p></details><button type=\"button\" class=\"small-button\" data-speak-word>🔊 Прослушать слово</button> <button data-add=\"5\" class=\"small-button\">♥ В словарь</button></article><article class=\"word\"><strong>accountability</strong><p>Who has accountability for the final reply?</p><details><summary>Перевод</summary><p>ответственность за решения и результат</p></details><button type=\"button\" class=\"small-button\" data-speak-word>🔊 Прослушать слово</button> <button data-add=\"6\" class=\"small-button\">♥ В словарь</button></article><article class=\"word\"><strong>a measurable outcome</strong><p>Define a measurable outcome.</p><details><summary>Перевод</summary><p>измеримый результат</p></details><button type=\"button\" class=\"small-button\" data-speak-word>🔊 Прослушать слово</button> <button data-add=\"7\" class=\"small-button\">♥ В словарь</button></article><article class=\"word\"><strong>roll out</strong><p>We should test before we roll it out.</p><details><summary>Перевод</summary><p>внедрять; запускать масштабно</p></details><button type=\"button\" class=\"small-button\" data-speak-word>🔊 Прослушать слово</button> <button data-add=\"8\" class=\"small-button\">♥ В словарь</button></article><article class=\"word\"><strong>scale up</strong><p>The team wants to scale up the pilot.</p><details><summary>Перевод</summary><p>расширять масштаб</p></details><button type=\"button\" class=\"small-button\" data-speak-word>🔊 Прослушать слово</button> <button data-add=\"9\" class=\"small-button\">♥ В словарь</button></article><article class=\"word\"><strong>a fallback</strong><p>We need a fallback if the tool is unavailable.</p><details><summary>Перевод</summary><p>резервный вариант</p></details><button type=\"button\" class=\"small-button\" data-speak-word>🔊 Прослушать слово</button> <button data-add=\"10\" class=\"small-button\">♥ В словарь</button></article><article class=\"word\"><strong>return on investment</strong><p>The return on investment depends on all the costs.</p><details><summary>Перевод</summary><p>окупаемость инвестиций</p></details><button type=\"button\" class=\"small-button\" data-speak-word>🔊 Прослушать слово</button> <button data-add=\"11\" class=\"small-button\">♥ В словарь</button></article></div>")+card("Match the purpose","<p>Before the pilot, we need to know how long the task takes now. We need… "+hwChoice("v1","a baseline",["a fallback","a baseline","a rollout"])+"</p>"+"<p>If the system fails, staff must be able to continue. We need… "+hwChoice("v2","a fallback",["a fallback","a misleading output","a baseline"])+"</p>"+"<p>We accept more checking work in exchange for faster drafting. This is… "+hwChoice("v3","a trade-off",["a use case","a trade-off","a baseline"])+"</p>");}
function feedReading(){return card("The pilot that looked like a win","<p>Northline, a fictional online retailer, introduced an AI tool to draft customer-service replies. Its first report looked impressive. Drafting time had fallen from eight minutes to three minutes per message. The operations director described this as a major productivity improvement and proposed expanding the tool to every support team.</p><p>However, the pilot report measured only the drafting stage. Experienced agents had also checked each draft. Some replies omitted conditions from the returns policy, while others offered solutions the company could not provide. Agents spent time correcting those details and explaining why the changes mattered.</p><p>The finance manager asked a simple question: had the total time per resolved case actually fallen? The team had no reliable answer. It had measured the tool’s output rather than the whole workflow. The pilot also used relatively straightforward cases, so its results could not automatically be applied to complaints or unusual requests.</p><p>The revised pilot limited the tool to drafting responses for a small set of common questions. Agents retained responsibility for the final message. The team recorded review time, correction rates and whether a customer needed to contact support again. It compared these results with a baseline collected before the pilot.</p><p>The new findings were more modest. The tool saved time on repetitive requests, but the benefit varied by task and by the experience of the agent reviewing the draft. Training and maintenance costs also mattered. A useful draft did not remove the need for someone who understood the policy.</p><p>Northline’s leadership agreed to expand only the use cases that met its quality threshold. They also kept a fallback process and scheduled another review. The question had shifted from ‘Can we produce more text?’ to ‘Can we resolve the right problems with less total effort?’</p>")+card("Interrogate the argument","<p>Why was the first report incomplete? "+hwChoice("r1","It excluded review work",["It measured no time at all","It excluded review work","It included every complaint"])+"</p>"+"<p>What limited how broadly the first results could be applied? "+hwChoice("r2","The pilot used straightforward cases",["The pilot used straightforward cases","Every team refused the tool","There was no returns policy"])+"</p>"+"<p>Which recommendation follows from the final paragraph? "+hwChoice("r3","Expand selected use cases and review the results",["Automate every customer decision","Stop measuring quality","Expand selected use cases and review the results"])+"</p>")+card("Discuss the missing evidence","<p>Which measurement would you prioritise and why? What would you ask the operations director before approving expansion?</p><p class='support'>The report appears to assume… · The evidence supports…, but… · Before attributing the change to AI, I would…</p>");}

e costs"])+"</p>"+"<p>How did the manager describe the later results? "+hwChoice("l3","Less dramatic but more useful",["Completely unsuccessful","Less dramatic but more useful","Exactly the same as before"])+"</p>");}
const FEED_ITEMS=[['🛹','Skateboard tricks in slow motion','sport'],['🔭','Why stars have different colours','science'],['🎧','An artist you have never heard of','music'],['🥘','A recipe using three ingredients','food'],['📷','Street photography without expensive equipment','art'],['⚽','How a team practises a difficult move','sport'],['🌱','A tiny garden on a balcony','science'],['🎸','The same song, five different versions','music'],['🎬','Making a film with paper characters','art']];
function labPicks(){return Array.isArray(state.answers.feedPicks)?state.answers.feedPicks.filter(n=>Number.isInteger(n)&&n>=0&&n<FEED_ITEMS.length).slice(0,3):[];}
function feedLab(){return card("Make the claim defensible","<p>Identify the missing assumption in each statement, then qualify it aloud.</p><ul><li>‘Drafts take less time, so we can reduce the team immediately.’</li><li>‘Employees like the tool, so customers must be getting better service.’</li><li>‘The first team saved time, so every department will save the same amount.’</li></ul><p class='support'>This may indicate… · It does not necessarily follow that… · Provided that… · Had we measured…, we might have…</p>")+card("Choose the careful formulation","<p>The pilot suggests savings, ___ review time is included. "+hwChoice("g1","provided that",["despite","provided that","unless that"])+"</p>"+"<p>If we had tracked corrections, we ___ the problem earlier. "+hwChoice("g2","might have noticed",["might have noticed","will notice","notice"])+"</p>"+"<p>The tool is useful, but it ___ human review. "+hwChoice("g3","does not eliminate the need for",["proves all work is unnecessary after","does not eliminate the need for","guarantees no need for"])+"</p>");}
function feedDebate(){return card("The investment meeting","<div class='word-grid'><div class='word'><h3>Operations director</h3><p>You want a six-week pilot and have 30 budget units. Explain the bottleneck and propose a measurable outcome.</p></div><div class='word'><h3>Finance manager</h3><p>Ask for the baseline, full cost, quality threshold and a stop-or-scale criterion.</p></div><div class='word'><h3>Support team lead</h3><p>Clarify who checks drafts, what training is needed and how staff report problems.</p></div></div><p>Agree on one use case, one owner, two measures and a review date. Change roles halfway through.</p><p class='support'>What would success look like? · Who is accountable for…? · I could support this if… · Let’s define the threshold.</p>");}
function feedWriting(){return card("Choose the next use case","<p>You have a fictional budget of 30 units. Choose one pilot and defend your decision.</p><ul><li><b>A · Internal meeting summaries.</b> Cost 12. Easy to review, but important actions may be missed.</li><li><b>B · Customer-reply drafts.</b> Cost 24. Frequent task, but policy errors create extra work.</li><li><b>C · Product-description drafts.</b> Cost 18. High volume, but factual claims need checking.</li></ul><p>Your partner challenges your choice. Explain the trade-off, name the missing evidence and describe what would make you stop the pilot.</p>");}
function hwChoice(id,answer,options){return '<select id="'+id+'" data-gap="'+answer+'" data-answer="'+id+'" aria-label="Пропуск '+id.replace('hw','')+'"><option value="">Выберите…</option>'+options.map(v=>'<option value="'+esc(v)+'" '+(state.answers[id]===v?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select><span class="feedback" id="fb-'+id+'" role="status"></span>';}
function feedFinish(){return card("Your 90-second recommendation","<p>Brief the leadership team. Explain the problem, the use case, two measures, one limitation and the decision you need.</p><p>Use at least four lesson expressions and one conditional sentence.</p><a href='business-ai-b2c1-homework.html'>Открыть домашнее задание →</a>");}
function installGapChecks(){function check(el){const v=el.value.trim(),ok=norm(v)===norm(el.dataset.gap);el.classList.toggle('correct',!!v&&ok);el.classList.toggle('incorrect',!!v&&!ok);$('#fb-'+el.id).textContent=!v?'':ok?'✓ Верно!':'Попробуйте ещё раз.';}$$('[data-gap]').forEach(el=>{el.addEventListener('blur',()=>check(el));el.addEventListener('change',()=>{state.answers[el.dataset.answer]=el.value;save();check(el);});el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();check(el);}});el.addEventListener('input',()=>{el.classList.remove('correct','incorrect');$('#fb-'+el.id).textContent='';});if(el.value.trim())check(el);});}
function installLesson(){installGapChecks();$$('[data-position]').forEach(b=>b.onclick=()=>{state.answers.position=Number(b.dataset.position);save();render();});$$('[data-feed-pick]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.feedPick),p=labPicks(),at=p.indexOf(i);if(at>=0)p.splice(at,1);else if(p.length<3)p.push(i);else{notify('Выберите не больше трёх видео. Можно снять выделение с другого.');return;}state.answers.feedPicks=p;save();const y=scrollY;render();scrollTo(0,y);});if($('#toggleExplore'))$('#toggleExplore').onclick=()=>{state.answers.explore=!state.answers.explore;save();const y=scrollY;render();scrollTo(0,y);};if($('#resetFeed'))$('#resetFeed').onclick=()=>{state.answers.feedPicks=[];state.answers.explore=false;save();render();};$('#exportBtn').hidden=true;}

function feedback(ci,qi){const id=`q${ci}-${qi}`,v=state.answers[id];if(v===undefined)return;const ok=Number(v)===CLIPS[ci].qs[qi][2];$('#fb-'+id).textContent=ok?'✓ Верно!':'Попробуйте ещё раз. Вернитесь к тексту или аудио.';$$(`[name="${id}"]`).forEach(el=>{el.closest('label').classList.toggle('correct',el.checked&&ok);el.closest('label').classList.toggle('incorrect',el.checked&&!ok);});}

function translateWhileTyping(event) {

        manualStatus.textContent = 'Перевод недоступен. Можно ввести его вручную.';
      }

}

const sync=()=>{button.textContent=audio.paused?'▶':'Ⅱ';button.setAttribute('aria-label',audio.paused?'Воспроизвести аудио':'Пауза');range.value=audio.duration?audio.currentTime/audio.duration*100:0;player.querySelector('.elapsed').textContent=fmt(audio.currentTime);if(Number.isFinite(audio.duration))player.querySelector('.duration').textContent=fmt(audio.duration);};
button.onclick=()=>{if(audio.paused)audio.play().catch(()=>{audio.hidden=false;audio.controls=true;player.hidden=true;});else audio.pause();};
range.oninput=()=>{if(Number.isFinite(audio.duration))audio.currentTime=Number(range.value)*audio.duration/100;sync();};
['play','pause','ended','timeupdate','loadedmetadata','durationchange'].forEach(e=>audio.addEventListener(e,sync));sync();}
new MutationObserver(enhance).observe(document.getElementById('content'),{childList:true});enhance();
})();
</script><script>
const speakSelected = $('#speakSelected');
speakSelected.disabled = !('speechSynthesis' in window);
speakSelected.addEventListener('click', () => {
  const phrase = $('#selectedWord').textContent.trim();
  if (!phrase || !('speechSynthesis' in window)) return;
  const utterance = new SpeechSynthesisUtterance(phrase);
  utterance.lang = /[а-яё]/i.test(phrase) ? 'ru-RU' : 'en-GB';
  utterance.rate = 0.88;
  speechSynthesis.cancel();
  speechSynthesis.speak(utterance);
});

document.addEventListener('click', event => {
