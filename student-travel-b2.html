<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel B2 · Gostudy</title>
<style>
  :root {
    color-scheme: light;
    --page: #f1f7ff;
    --card: #fff;
    --ink: #203853;
    --muted: #516a85;
    --line: #ccdced;
    --accent: #1960ac;
    --soft: #e8f2ff;
    font: 16px/1.45 system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); }
  body.dark {
    color-scheme: dark;
    --page: #142136;
    --card: #1c2c42;
    --ink: #edf5ff;
    --muted: #bdd0e5;
    --line: #3e566e;
    --accent: #9ecbff;
    --soft: #243f60;
  }
  main { width: min(60rem, calc(100% - 2rem)); margin: 0 auto; padding: 1.5rem 0 2rem; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .brand { font-size: 1.125rem; font-weight: 800; }
  h1 { margin: .65rem 0 1rem; font-size: clamp(1.9rem, 5vw, 2.7rem); line-height: 1.1; }
  .lessons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
  .lesson, .tools { background: var(--card); border: 1px solid var(--line); border-radius: 1.1rem; padding: 1rem; }
  .lesson { display: flex; flex-direction: column; }
  .lesson-number { color: var(--muted); font-size: .875rem; font-weight: 700; }
  h2 { margin: .3rem 0 .7rem; font-size: 1.25rem; line-height: 1.25; }
  h2 a { color: inherit; text-underline-offset: .2em; }
  .actions { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: auto; }
  .button { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: .45rem .85rem; border: 1px solid var(--line); border-radius: 999px; color: var(--accent); background: var(--card); font: inherit; font-weight: 650; text-decoration: none; cursor: pointer; }
  .primary { background: var(--soft); }
  .tools { margin-top: .75rem; }
  .tools summary { cursor: pointer; font-weight: 650; }
  .tools p { margin: .75rem 0; color: var(--muted); }
  #wordsList { padding-left: 1.25rem; }
  #nameForm { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin-top: .75rem; }
  #name { min-height: 44px; max-width: 100%; padding: .4rem .55rem; border: 1px solid var(--line); border-radius: .65rem; font: inherit; }
  @media (max-width: 620px) {
    main { padding-top: .75rem; }
    .lessons { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <header class="top">
    <span class="brand">Gostudy</span>
    <button type="button" class="button" id="theme" aria-label="Сменить тему">◐</button>
  </header>
  <h1>Путешествия · B2</h1>
  <section class="lessons" aria-label="Уроки">
    <article class="lesson" id="assignmentCard">
      <div class="lesson-number">Урок 1 · B2</div>
      <h2><a href="travel-disruptions-b2.html">When the trip goes off plan</a></h2>
      <div class="actions">
        <a class="button primary" href="travel-disruptions-b2.html">Открыть урок 1</a>
        <a class="button" href="travel-homework-b2.html">Домашка 1</a>
      </div>
    </article>
    <article class="lesson" id="lesson02">
      <div class="lesson-number">Урок 2 · B2</div>
      <h2><a href="travel-b2-02.html">The case of the missing suitcase</a></h2>
      <div class="actions">
        <a class="button primary" href="travel-b2-02.html">Открыть урок 2</a>
        <a class="button" href="travel-b2-02-homework.html">Домашка 2</a>
      </div>
    </article>
  </section>
  <details class="tools" id="words">
    <summary>Мой словарь <span id="wordsCount"></span></summary>
    <ul id="wordsList"></ul>
    <div class="actions">
      <a class="button" href="travel-disruptions-b2.html#vocabulary">Открыть словарь</a>
      <a class="button" href="travel-disruptions-b2.html#training">Тренировать слова</a>
    </div>
  </details>
  <details class="tools" id="profile">
    <summary id="greeting">Имя в кабинете</summary>
    <form id="nameForm">
      <label for="name">Ваше имя</label>
      <input id="name" maxlength="40" autocomplete="off">
      <button class="button" type="submit">Сохранить</button>
    </form>
  </details>
</main>
<script>
'use strict';
const lessonKey = 'gostudy-travel-disruptions-b2-v1';
const profileKey = 'gostudy-travel-b2-profile-v1';
const $ = id => document.getElementById(id);
function read(key) {
  try { return JSON.parse(localStorage.getItem(key) || '{}') || {}; }
  catch { return {}; }
}
function write(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}
function render() {
  const lesson = read(lessonKey);
  const profile = read(profileKey);
  document.body.classList.toggle('dark', !!lesson.dark);
  $('name').value = typeof profile.name === 'string' ? profile.name : '';
  $('greeting').textContent = $('name').value ? 'Hello, ' + $('name').value + '!' : 'Имя в кабинете';
  const words = Array.isArray(lesson.words) ? lesson.words.filter(word => word && typeof word.en === 'string' && typeof word.ru === 'string') : [];
  $('wordsCount').textContent = '(' + words.length + ')';
  $('wordsList').replaceChildren(...words.map(word => {
    const item = document.createElement('li');
    item.textContent = word.en + ' — ' + word.ru;
    return item;
  }));
}
$('theme').onclick = () => {
  const lesson = read(lessonKey);
  lesson.dark = !document.body.classList.contains('dark');
  document.body.classList.toggle('dark', lesson.dark);
  write(lessonKey, lesson);
};
$('nameForm').onsubmit = event => {
  event.preventDefault();
  write(profileKey, { ...read(profileKey), name: $('name').value.trim() });
  $('profile').open = false;
  render();
};
window.addEventListener('pageshow', render);
window.addEventListener('storage', render);
render();
</script>
</body>
</html>
