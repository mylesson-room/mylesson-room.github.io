<script type="application/json" id="lesson-data">{"cabinet":"student-travel-a2.html","title":"Positive Thinking","level":"General English A2+ · Adults","key":"gostudy-positive-thinking-a2-v1","steps":[{"id":"pt-start","title":"1. Two ways to see one day · 4 min","instruction":"Read the two reactions. Which person has a more helpful way of thinking? Explain why. A positive thinker notices problems but looks for a next step.","source":["Situation: You miss the bus and arrive fifteen minutes late.","Mia: 'Everything always goes wrong. My day is ruined.'","Leo: 'This is annoying, but I can message my colleague and take the next bus.'","Discuss: Who would you rather work with? Why? Have you ever changed your reaction after a difficult morning?","Today you will practise six verb phrases with BACK, talk about future choices and give someone useful advice."],"teacherNotes":"4 мин. Диагностика: попросите 2–3 связных предложения, не исправляйте всё подряд. Positive thinking ≠ ignoring problems. При необходимости предложите: The problem is... / I can... / I will..."},{"id":"pt-vocab","title":"2. Six everyday phrases with back · 8 min","type":"match","instruction":"Match each phrase to its meaning. Then say a natural sentence about your own life with at least four phrases.","source":["Useful phrases: come back · go back · get back · call back · give back · look back.","Notice: come back = return here; go back = return there; get back = return after being away; call back = phone someone again; give back = return an object; look back = think about the past.","Say: What helps you get back to a good mood after a bad day? When did you last call someone back?"],"items":[["come back",["return to this place","phone again","think about the past"],0],["go back",["return an object","return to a different place","feel happier"],1],["get back",["return after being away","promise to help","think about the past"],0],["call back",["phone again","give something away","travel home"],0],["give back",["think about the past","return something to its owner","make a new plan"],1],["look back",["think about the past","turn the music down","return here"],0]],"teacherNotes":"8 мин. Активная лексика — 6 фраз. Не переносить сразу в письменные списки: проговорить с реальными ситуациями. Проверить come back vs go back на двух местах (here / there)."},{"id":"pt-scenarios","title":"3. Back in real life · 5 min","type":"gap","instruction":"Choose the correct BACK phrase to complete each sentence. Read all six sentences aloud and add one original example.","source":["Example: 'I'm busy right now. I'll call you back in ten minutes.'","After checking, change two sentences to describe your own experience."],"items":[["I'll ___ you when the meeting ends.",["call back","look back","give back"],0],["Can you ___ my book tomorrow?",["go back","give back","come back"],1],["After a difficult week, I like to ___ and see what I learnt.",["look back","get back","call back"],0],["When do you usually ___ home from work?",["get back","give back","look back"],0],["Please ___ here when you have finished.",["come back","give back","call back"],0],["I want to ___ to that lovely café one day.",["call back","go back","give back"],1]],"teacherNotes":"5 мин. Проверка контекста и семантических различий. Затем 2 собственных примера; один обязательно в будущем."},{"id":"pt-video","title":"4. Video · Why do we repeat good habits? · 10 min","type":"choice","instruction":"Watch the video about positive and negative reinforcement. First watch for the main idea. Then watch again, pausing to check the examples. The speaker uses some psychology vocabulary: focus on the everyday meaning.","video":{"youtubeId":"Un1Weap2e60","title":"Positive vs. Negative Reinforcement (and Punishment) Clearly Explained"},"source":["Before watching: What would encourage you to exercise regularly — a compliment, an easier routine, or a punishment? Why?","Vocabulary support: reinforcement = something that makes a behaviour more likely; positive reinforcement = adding something pleasant; negative reinforcement = removing something unpleasant. Both make a behaviour more likely.","Important: negative reinforcement is NOT the same as punishment. 'Positive' and 'negative' refer to adding or removing something — not to being optimistic or pessimistic.","Watch twice. After viewing, explain one example from the video in your own words. If YouTube is unavailable, use the short definitions and examples above, then complete the tasks."],"items":[["What is the main purpose of reinforcement?",["To make a behaviour happen more often","To make a behaviour impossible","To make people feel bad"],0],["In positive reinforcement, what happens?",["Something unpleasant is removed","Something is added to encourage behaviour","A new rule is always broken"],1],["In negative reinforcement, what happens?",["Something unpleasant is removed","A reward is always taken away","People are always criticised"],0],["Which example is positive reinforcement?",["Your coach praises you when you practise","An annoying alarm stops when you wake up","You lose your phone for being late"],0],["Which example is negative reinforcement?",["A friend gives you a gift","Your seatbelt alarm stops when you put your belt on","Your boss congratulates you"],1]],"teacherNotes":"10 мин. Источник: Hacking Behavior Analysis, YouTube Un1Weap2e60. Тестировать доступность перед уроком; запасной путь — учитель читает описание и бытовые примеры. Часть вопросов на понятия, а не дословные реплики видео. Не путать negative reinforcement с наказанием."},{"id":"pt-grammar","title":"5. Will or going to? · 8 min","type":"match","instruction":"Choose the sentence that fits each situation. Identify an on-the-spot decision, an offer, a promise, or a plan made earlier.","source":["WILL + base verb: an offer — 'I'll help you'; a promise — 'I won't forget'; a decision made now — 'The phone is ringing. I'll answer it.'","BE GOING TO + base verb: a plan or intention decided before now — 'I've decided. I'm going to start a gratitude journal next week.'","Compare: 'I'll call her back now' (decision at this moment) vs 'I'm going to call her back tonight' (plan already made).","Speak: What are you going to change this week? What will you do if your friend feels worried?"],"items":[["Your friend drops their books. You offer help.",["I'll help you pick them up.","I'm going to help yesterday.","I help you yesterday."],0],["You decided yesterday to sleep earlier.",["I'll decide now to sleep.","I'm going to go to bed at ten tonight.","I slept tomorrow."],1],["You promise not to forget a call.",["I didn't forget tomorrow.","I'm forget you.","I won't forget to call you back."],2],["The phone rings. You decide to answer now.",["I'm going to answer since last week.","I'll get it!","I answering it."],1],["You made a plan to exercise every Tuesday.",["I'm going to exercise every Tuesday.","I'll exercise, I decide right now yesterday.","I exercising on Tuesday."],0],["Your friend feels sad. You offer support.",["I'm sad yesterday.","I'll listen if you want to talk.","You going to happy."],1]],"teacherNotes":"8 мин. Контраст намерение (going to) и решение в момент речи / offer / promise (will). Попросить объяснить не только форму, но и КОГДА принято решение. Отдельно отработать отрицательное won't."},{"id":"pt-choices","title":"6. Helpful actions and future choices · 7 min","type":"choice","instruction":"Read the situations. Choose the most natural reply. After each answer, say a follow-up sentence using one phrase with BACK.","source":["For each situation: say whether WILL is an offer, a promise or an on-the-spot decision, or whether BE GOING TO expresses a plan.","Challenge: replace a negative thought with a realistic helpful action — not an unrealistic 'Everything is perfect'."],"items":[["Your colleague says, 'I can't finish this before five.'",["I'll help you for twenty minutes.","Everything will be easy forever.","I am going to help yesterday."],0],["You booked a class last night. What do you say?",["I decide now, I'll go yesterday.","I'm going to try a yoga class on Thursday.","I go back yesterday tomorrow."],1],["A friend says, 'I'm nervous about my interview.'",["You always fail.","I'll practise with you if you like.","You're going to failed."],1],["Your phone vibrates. You decide now to return a call.",["I'll call her back now.","I'm go back now to call.","I called back tomorrow."],0],["You promised to return your friend's headphones.",["I'll give them back tomorrow. I promise.","I give back them yesterday.","I'm promise giving back."],0],["You've decided to stop checking messages before bed.",["I'll have decided yesterday.","I'm going to put my phone away at nine.","I won't never use a phone."],1]],"teacherNotes":"7 мин. Упражнение не о токсичном позитиве: переформулируем мысли в реалистичные действия. Добиться 3 произнесённых вариантов; учитель даёт одну конкретную правку на форму will / going to."},{"id":"pt-speaking","title":"7. A plan for a more positive week · 8 min","type":"write","instruction":"Discuss the questions aloud, then write a short personal plan (5–7 sentences) in the answer box. Use at least three BACK phrases, two examples of BE GOING TO, and two examples of WILL.","source":["1. When something goes wrong, what is your first thought? Is it usually helpful?","2. Imagine you miss an important call. What will you do immediately? What are you going to change next time?","3. Your friend often thinks 'I can't do anything right.' What will you say or offer? Be kind, but realistic.","4. Think about a time you felt disappointed. When you look back, did you learn something useful?","5. What small habit are you going to try next week? What promise will you make to yourself?","Before you finish, make a mini-plan: (a) a thought you want to change, (b) a helpful action you are going to take, (c) an offer or promise you will make.","Success check: You can describe the difference between reinforcement and punishment, use at least three phrases with BACK, and choose WILL vs BE GOING TO in realistic situations."],"teacherNotes":"8 мин. Коммуникативная задача: 70% времени говорит ученица. Попросите пример негативной мысли и конструктивную альтернативу, не заставляйте говорить, что всё идеально. Итог по CEFR: future intentions, offers/promises and six target verb phrases."}],"overview":{"title":"Positive Thinking","level":"A2+","duration":50,"format":"Individual lesson","goal":"Make realistic positive plans; use will for offers/promises/on-the-spot decisions, be going to for intentions, and verb phrases with back."},"videoSource":"https://www.youtube.com/watch?v=Un1Weap2e60"}</script>
