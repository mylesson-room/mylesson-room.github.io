<script>
'use strict';
const CLIPS=[{"qs":[["What did the partnership involve?",["A loan from a friend","A free bag and commission on some sales","A prize for viewers"],1],["What did the second reviewer test?",["How the zip performed over time","Which discount code was longest","How the video was edited"],0],["Why did Sam wait?",["The shop had closed","The first creator had never used the bag","He wanted to decide whether it suited him"],2]]},{"qs":[["What made the video sound honest at first?",["The creator mentioned a drawback","It contained no links","The lamp was cheap"],0],["What was missing from the demonstration?",["A view of the desk","A comparison with a cheaper model","An example of the lamp working"],1],["What did the speaker decide to do?",["Buy a second lamp","Send the creator a complaint","Keep the lamp she already owned"],2]]}];
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key='gostudy-feed-b2-03-v1';let state={page:0,answers:{},words:[],dark:false};let storage=true;
try{const s=JSON.parse(GoStudyStorage.getItem(key)||'null');if(s&&typeof s==='object'){state={...state,...s};state.answers=s.answers&&typeof s.answers==='object'?s.answers:{};state.words=Array.isArray(s.words)?s.words.filter(w=>w&&typeof w.en==='string'&&typeof w.ru==='string'):[];}}catch(e){storage=false;}
const sharedWordKey="gostudy-feed-b2-v1";
let lastWords = '';
function readSharedWords(){
  try {
    const shared = JSON.parse(GoStudyStorage.getItem(sharedWordKey) || '{}');
    if(Array.isArray(shared.words)) state.words = shared.words.filter(w=>w&&typeof w.en==='string'&&typeof w.ru==='string');
  } catch {}
  lastWords = JSON.stringify(state.words);
}
readSharedWords();
window.addEventListener('pageshow',()=>{readSharedWords();$('#wordCount').textContent=state.words.length;if($('#dictionary').open)renderWords();});
function save(){try{
  const currentWords = JSON.stringify(state.words);
  if(currentWords!==lastWords){
    const shared = JSON.parse(GoStudyStorage.getItem(sharedWordKey)||'{}');
    shared.words=state.words;
    GoStudyStorage.setItem(sharedWordKey,JSON.stringify(shared));
    lastWords=currentWords;
  }
  GoStudyStorage.setItem(key,JSON.stringify(state));}catch(e){storage=false;$('#storageNote').hidden=false;$('#storageNote').textContent='Saving unavailable. Export your answers and vocabulary before closing.';}$('#wordCount').textContent=state.words.length;}

const words=[["sponsored post","рекламная публикация","A sponsored post can still contain useful information."],["disclose","раскрыть информацию","The creator disclosed the partnership at the start."],["earn a commission","получать комиссию","She earns a commission when someone buys through her link."],["affiliate link","партнёрская ссылка","The caption included an affiliate link."],["independent review","независимый обзор","An independent review compared four models."],["a selling point","преимущество товара","The long battery life was the main selling point."],["an incentive","стимул, выгода","A discount gives viewers an incentive to buy quickly."],["compare alternatives","сравнивать альтернативы","I always compare alternatives before I order."],["a trade-off","компромисс","The low price comes with a trade-off: a shorter warranty."],["take something with a pinch of salt","относиться скептически","I take dramatic before-and-after claims with a pinch of salt."]];

function feedReading(){return card("A fifteen per cent deadline","<p>Sam had been saving for a school bag when a creator he followed posted a video called “The only backpack you’ll ever need”. In the first ten seconds, she fitted a laptop, trainers and three books into it. Sam added it to his basket. The code at the bottom of the screen promised fifteen per cent off until midnight.</p><p>Before paying, Sam opened the caption. The creator had received the bag for free and would earn a commission on purchases made through her link. The video had shown the bag’s capacity clearly, but Sam needed a bag he could use on his bike in the rain. He could not remember hearing anything about wet weather.</p><p>A second reviewer had bought the same model and used it for two months. She said the fabric had stayed dry in light rain, but the zip had let water in during a downpour. She also pointed out that the previous model had a covered zip and cost less. Sam removed the new bag from his basket and decided to try both in a shop the next day.</p><p>When a friend asked whether the first review was dishonest, Sam said the video had shown him something useful. His mistake had been treating a convincing demonstration as an answer to a question it had never addressed.</p>"+b2mc(0,CLIPS[0].qs));}

C\"></audio></div><details><summary>Transcript</summary><p>Last month, a creator I follow recommended a lamp for studying. She showed how it lit up her desk, and she even pointed out that the cable was too short. I liked that detail because it sounded honest. Then I opened the caption. Right at the bottom, she said she would earn a commission if anyone used her link. That made me watch the video again. The lamp still looked useful, but I realised she had never compared it with a cheaper one. I checked two independent reviews and decided to keep the lamp I already had. Now, whenever I see a discount code, I ask myself what I would think of the product without the deal.</p></details>"+b2mc(1,CLIPS[1].qs));}
const FEED_ITEMS=[['🛹','Skateboard tricks in slow motion','sport'],['🔭','Why stars have different colours','science'],['🎧','An artist you have never heard of','music'],['🥘','A recipe using three ingredients','food'],['📷','Street photography without expensive equipment','art'],['⚽','How a team practises a difficult move','sport'],['🌱','A tiny garden on a balcony','science'],['🎸','The same song, five different versions','music'],['🎬','Making a film with paper characters','art']];
function labPicks(){return Array.isArray(state.answers.feedPicks)?state.answers.feedPicks.filter(n=>Number.isInteger(n)&&n>=0&&n<FEED_ITEMS.length).slice(0,3):[];}
function feedLab(){return card("Present, past and mixed conditionals",'<p><b>Second:</b> If it were cheaper, I would buy it. <b>Third:</b> If I had read the caption, I would have waited. <b>Mixed:</b> If I had bought it yesterday, I would own it now.</p><p>If the creator hadn’t disclosed the partnership, I '+hwChoice("g1","would have trusted",["would have trusted","will trust","had trusted"])+' the post more.</p><p>If the bag were waterproof, I '+hwChoice("g2","would take",["would have took","will took","would take"])+' it on my bike.</p><p>If Sam had bought the bag straight away, he '+hwChoice("g3","wouldn’t know",["wouldn’t know","won’t have known","hadn’t known"])+' about the zip problem now.</p><p>I would have ordered the lamp if I '+hwChoice("g4","had needed",["would need","had needed","have needed"])+' a new one.</p><p>Tell your teacher one thing you would do differently if you could go back to your last purchase.</p>');}
function feedDebate(){return card("Pick the strongest evidence","<div class=\"word-grid\"><article class=\"word\"><h3>A · First impressions</h3><p>Paid partnership clearly labelled. The creator shows how much the bag holds but has used it only once.</p></article><article class=\"word\"><h3>B · Two months later</h3><p>The reviewer bought the bag and tested it in rain. She describes the zip and compares the previous model.</p></article><article class=\"word\"><h3>C · A viral comment</h3><p>“My friend’s bag broke in a week.” The commenter does not say which model.</p></article></div><ol><li>Which post helps a cyclist most? Which helps someone packing for school?</li><li>Rank the three posts for usefulness. Give a reason and a caveat for each.</li><li>What extra evidence could change your ranking?</li></ol>");}
function feedWriting(){return card("Agree on a fair review","<div class=\"role-grid\"><article class=\"role\"><h3>Student · Creator</h3><p>A company offers you a free backpack and 10% of every sale through your link. You want to test it for two weeks and mention any problems you find.</p></article><article class=\"role\"><h3>Teacher · Brand representative</h3><p>You want the video out by Friday. Suggest putting the disclosure at the end. Ask the creator to explain what would make the deal acceptable.</p></article></div><p>Agree on the test, when viewers see the disclosure, and whether the creator can mention a cheaper alternative.</p><details><summary>Unfold · Useful language</summary><p>I’d consider it provided that… / I’d disclose the deal upfront. / If I found a drawback, I would…</p></details>"+area('agreement','Запишите условия, о которых Вы договорились.'));}
function hwChoice(id,answer,options){return '<select id="'+id+'" data-gap="'+answer+'" data-answer="'+id+'" aria-label="Пропуск '+id.replace('hw','')+'"><option value="">Выберите…</option>'+options.map(v=>'<option value="'+esc(v)+'" '+(state.answers[id]===v?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select><span class="feedback" id="fb-'+id+'" role="status"></span>';}
function feedFinish(){return card("Would you recommend it?","<p>Pick the backpack, the lamp or a product you know. In 45 seconds, explain what the post proves, who benefits from a purchase, what evidence is missing and what you would do next.</p><p><a class=\"primary\" href=\"feed-b2-03-homework.html\">Открыть домашнюю работу →</a></p>");}
function installGapChecks(){function check(el){const v=el.value.trim(),ok=norm(v)===norm(el.dataset.gap);el.classList.toggle('correct',!!v&&ok);el.classList.remove('incorrect');$('#fb-'+el.id).textContent=!v?'':ok?'✓ Верно!':'Попробуйте ещё раз.';}$$('[data-gap]').forEach(el=>{el.addEventListener('blur',()=>check(el));el.addEventListener('change',()=>{state.answers[el.dataset.answer]=el.value;save();check(el);});el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();check(el);}});el.addEventListener('input',()=>{el.classList.remove('correct','incorrect');$('#fb-'+el.id).textContent='';});if(el.value.trim())check(el);});}
function installLesson(){installGapChecks();$$('[data-position]').forEach(b=>b.onclick=()=>{state.answers.position=Number(b.dataset.position);save();render();});$$('[data-feed-pick]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.feedPick),p=labPicks(),at=p.indexOf(i);if(at>=0)p.splice(at,1);else if(p.length<3)p.push(i);else{notify('Выберите не больше трёх видео. Можно снять выделение с другого.');return;}state.answers.feedPicks=p;save();const y=scrollY;render();scrollTo(0,y);});if($('#toggleExplore'))$('#toggleExplore').onclick=()=>{state.answers.explore=!state.answers.explore;save();const y=scrollY;render();scrollTo(0,y);};if($('#resetFeed'))$('#resetFeed').onclick=()=>{state.answers.feedPicks=[];state.answers.explore=false;save();render();};$('#exportBtn').hidden=true;}

function feedback(ci,qi){const id=`q${ci}-${qi}`,v=state.answers[id];if(v===undefined)return;const ok=Number(v)===CLIPS[ci].qs[qi][2];$('#fb-'+id).textContent=ok?'✓ Верно!':'Попробуйте ещё раз. Вернитесь к тексту или аудио.';$$(`[name="${id}"]`).forEach(el=>{el.closest('label').classList.toggle('correct',el.checked&&ok);el.closest('label').classList.remove('incorrect');});}
function stop(){clearPractice();const a=$('#lessonAudio');if(a)a.pause();}
function render(){const p=pages[state.page];$('#pageLabel').textContent=`DIGITAL LIFE / ${String(state.page+1).padStart(2,'0')} · ≈ ${p[2]} MIN`;$('#title').textContent=p[0];$('#goal').textContent=p[1];$('#teacherTips').textContent=p[3];$('#counter').textContent=`${state.page+1} / ${pages.length}`;$('#prev').disabled=state.page===0;$('#next').textContent=state.page===7?'Итог ✓':'Далее →';$('#content').innerHTML=[feedWelcome,feedWords,feedReading,feedListening,feedLab,feedDebate,feedWriting,feedFinish][state.page]();$('#nav').innerHTML=pages.map((p,i)=>`<button data-page="${i}" class="${i===state.page?'active':''}"><span>${String(i+1).padStart(2,'0')}</span>${esc(p[0])}</button>`).join('');$$('[data-page]').forEach(b=>b.onclick=()=>go(Number(b.dataset.page)));$$('[data-answer]').forEach(el=>el.oninput=()=>{state.answers[el.dataset.answer]=el.value;save();});$$('[data-can]').forEach(el=>el.onchange=()=>{state.answers[el.dataset.can]=el.checked;save();});$$('[data-add]').forEach(b=>b.onclick=()=>{const w=words[Number(b.dataset.add)];addWord(w[0],w[1]);});$$('[data-q]').forEach(el=>{const [ci,qi]=el.dataset.q.split(':').map(Number);el.onchange=()=>{state.answers[`q${ci}-${qi}`]=Number(el.value);save();feedback(ci,qi);};feedback(ci,qi);});if($('#checkGaps'))$('#checkGaps').onclick=()=>$$('[data-gap]').forEach(el=>{const ok=norm(el.value)===norm(el.dataset.gap);el.classList.toggle('correct',ok);el.classList.toggle('incorrect',!ok);$('#fb-'+el.id).textContent=ok?'✓ Correct.':'Попробуйте ещё раз. Можно открыть таблицу-подсказку.';});if($('#speed'))$('#speed').onchange=e=>$('#lessonAudio').playbackRate=Number(e.target.value);if($('#lessonAudio'))$('#lessonAudio').onerror=()=>notify('Audio unavailable. Open the script to practise together.');installLesson();document.body.classList.toggle('dark',!!state.dark);}
function go(i){stop();$('#translationPop').hidden=true;if($('#lessonMenu').open)$('#lessonMenu').close();state.page=i;save();render();$('#title').focus({preventScroll:true});window.scrollTo({top:0,behavior:'smooth'});}
$('#prev').onclick=()=>go(Math.max(0,state.page-1));$('#next').onclick=()=>state.page<pages.length-1?go(state.page+1):notify('Урок завершён. Можно вернуться к любому разделу.');$('#themeBtn').onclick=()=>{state.dark=!state.dark;document.body.classList.toggle('dark',state.dark);save();};$('#menuBtn').onclick=()=>{$('#lessonMenu').showModal();$('#menuBtn').setAttribute('aria-expanded','true');};$('#closeMenu').onclick=()=>$('#lessonMenu').close();$('#lessonMenu').onclose=()=>$('#menuBtn').setAttribute('aria-expanded','false');
function addWord(en,ru){en=en.trim();ru=ru.trim();if(/[а-яё]/i.test(en)&&/[a-z]/i.test(ru)&&!/[а-яё]/i.test(ru)){[en,ru]=[ru,en];}if(!en||!ru){notify('Add a word and its translation.');return false;}const old=state.words.find(w=>norm(w.en)===norm(en));if(old)old.ru=ru;else state.words.push({en,ru});save();notify(old?'Translation updated.':'Word saved ✓');return true;}
function renderWords(){const list=$('#wordList');list.innerHTML=state.words.length?state.words.map((w,i)=>`<div class="dictrow"><div><strong>${esc(w.en)}</strong><p>${esc(w.ru)}</p></div><div><button class="small-button" data-edit="${i}" aria-label="Edit ${esc(w.en)}">Edit</button> <button class="small-button" data-delete="${i}" aria-label="Delete ${esc(w.en)}">✕</button></div></div>`).join(''):'<p class="muted dict-empty">Пока пусто. Выделите слово в уроке или добавьте его выше.</p>';$$('[data-edit]').forEach(b=>b.onclick=()=>{const w=state.words[Number(b.dataset.edit)];$('#newWord').value=w.en;$('#newMeaning').value=w.ru;$('#newMeaning').focus();});$$('[data-delete]').forEach(b=>b.onclick=()=>{state.words.splice(Number(b.dataset.delete),1);save();renderWords();});}
function openDict(){window.getSelection()?.removeAllRanges();$('#translationPop').hidden=true;renderWords();$('#dictionary').showModal();}$('#dictBtn').onclick=openDict;$('#closeDict').onclick=()=>$('#dictionary').close();$('#wordForm').onsubmit=e=>{e.preventDefault();if(addWord($('#newWord').value,$('#newMeaning').value)){e.target.reset();renderWords();}};

function translateWhileTyping(event) {
  clearTimeout(manualTimer);
  const version = ++manualVersion;
  const query = manualWord.value.trim();
  manualMeaning.value = '';
  manualStatus.textContent = '';
  if (!query || event?.isComposing) return;
  const saved = state.words.find(word => norm(word.en) === norm(query))?.ru;
  const immediate = saved || localTranslation(query) || manualCache.get(norm(query));
  if (immediate) {
    manualMeaning.value = immediate;
    return;
  }
  manualStatus.textContent = 'Переводим…';
  manualTimer = setTimeout(async () => {
    try {
      const result = await online(query);
      if (version !== manualVersion || manualWord.value.trim() !== query) return;
      manualCache.set(norm(query), result);
      manualMeaning.value = result;
      manualStatus.textContent = 'Перевод готов. Можно исправить перед сохранением.';
    } catch {
      if (version === manualVersion && manualWord.value.trim() === query) {
        manualStatus.textContent = 'Перевод недоступен. Можно ввести его вручную.';
      }
    }
  }, 300);
}
