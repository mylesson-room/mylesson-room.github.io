function feedReading(){return card("The weekend that changed direction","<p>When Elena booked a long weekend in Porto, she planned almost everything: a small guesthouse, a coastal walk and dinner with an old friend. What she had not planned was spending her first evening in an airport café, trying to decide whether an expensive taxi would rescue the trip or simply make a difficult day more expensive.</p><p>Her first flight arrived late, and she missed the final connection. An airline employee offered a seat the following morning. Another traveller suggested a night bus, but the journey involved a change at a station outside the city. Elena had a choice: arrive exhausted before sunrise, or lose half a day and travel with a confirmed booking. She initially treated arriving sooner as the only goal.</p><p>Then her friend asked a useful question: what mattered most about the weekend? Elena realised that she wanted time together, not a perfect record of completing her itinerary. They moved their dinner to the following evening. Before leaving the airport, she asked the airline to explain the available assistance and confirm the new flight in writing. She kept her receipts rather than assuming that every expense would be covered.</p><p>The next problem was smaller but more frustrating. Her guesthouse had not received her message about the delay and had released her room. The owner offered a room in a nearby property at the same price. Elena asked for the address, check-in details and written confirmation that there would be no extra charge. It was less central, but it was close to public transport.</p><p>By Saturday afternoon, Elena had abandoned the coastal walk because of heavy rain. She and her friend visited a small photography exhibition instead. It became the highlight of the weekend, although she would not claim that disruption always leads to something better. She had lost money and time, and some of the stress could have been avoided.</p><p>Afterwards, she changed how she planned trips. She left more time between connections, saved important information offline and kept a modest emergency budget. Her conclusion was not that planning was pointless. A useful plan, she decided, should make it easier to change direction when the original version stops working.</p>")+card('Read for meaning',b2mc(1,CLIPS[1].qs))+card("Between the lines","<ul class='talk-list'><li>Why was arriving sooner not necessarily the best option?</li><li>Which two problems could clearer communication have reduced?</li><li>Does the exhibition justify the disruption? Explain the difference.</li><li>What would you change in Elena’s original plan?</li></ul>");}

const FEED_ITEMS=[['🛹','Skateboard tricks in slow motion','sport'],['🔭','Why stars have different colours','science'],['🎧','An artist you have never heard of','music'],['🥘','A recipe using three ingredients','food'],['📷','Street photography without expensive equipment','art'],['⚽','How a team practises a difficult move','sport'],['🌱','A tiny garden on a balcony','science'],['🎸','The same song, five different versions','music'],['🎬','Making a film with paper characters','art']];
function labPicks(){return Array.isArray(state.answers.feedPicks)?state.answers.feedPicks.filter(n=>Number.isInteger(n)&&n>=0&&n<FEED_ITEMS.length).slice(0,3):[];}
function feedLab(){return card("Your budget: €120. Your energy: low.","<p>You have missed the last connection. Choose a plan for two travellers. These are fictional prices.</p><div class='word-grid'><div class='word'><h3>A · Night bus</h3><p>€60 total. Arrives 05:30. One change at 02:00. No accommodation needed.</p></div><div class='word'><h3>B · Hotel + morning train</h3><p>€115 total. Arrives 11:30. Confirmed room. You miss a prepaid €20 tour.</p></div><div class='word'><h3>C · Shared taxi</h3><p>€120 total. Arrives 23:45. Depends on finding two other passengers.</p></div></div><p>Compare cost, reliability, comfort and safety. Choose a plan and a backup. What would make you change your mind?</p>")+area('travel-plan','We would choose… The main trade-off is… Before booking… If that falls through…',5);}
function feedDebate(){return card("Role-play: a room that no longer exists","<div class='word-grid'><div class='word'><h3>Traveller</h3><p>Your prepaid room is unavailable after your late arrival. You need somewhere to stay tonight. Explain the timeline and request an alternative without an extra charge.</p></div><div class='word'><h3>Receptionist</h3><p>The original room is unavailable. You can offer a room 20 minutes away at the same price. Transport is not included. Clarify the guest’s priorities and agree a practical solution.</p></div></div><p><b>Round 2:</b> the alternative property has no late check-in. Negotiate again.</p><p class='support'>I understand the situation, but… · Could you confirm…? · What alternatives can you offer? · Would it be possible to…? · Just to clarify, does that include…?</p>")+area('role-result','We agreed to… One detail we still need to confirm is…',3);}
function feedWriting(){return card('Choose a helpful response','<p>Discuss each pair with your teacher. Which response is clearer and more constructive? Explain orally.</p><ol><li>“This is ridiculous!” / “Could you explain what alternatives are available?”</li><li>“You must pay for everything.” / “Could you confirm which expenses are covered?”</li><li>“Fix it now.” / “Could you confirm our accommodation before 8 p.m.?”</li></ol><details><summary>Проверить</summary><p>Во всех трёх парах второй вариант: конкретный вопрос или просьба помогают договориться о следующем шаге.</p></details>');}
function hwChoice(id,answer,options){return '<select id="'+id+'" data-gap="'+answer+'" data-answer="'+id+'" aria-label="Пропуск '+id.replace('hw','')+'"><option value="">Выберите…</option>'+options.map(v=>'<option value="'+esc(v)+'" '+(state.answers[id]===v?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select><span class="feedback" id="fb-'+id+'" role="status"></span>';}
function feedFinish(){return card('Your 60-second takeaway','<p>Tell your teacher which travel problem you would find most difficult and why. Compare two possible solutions.</p><p>Use: My priority would be… · The main drawback is… · Before deciding, I would check…</p>')+card('Ready for the next journey','<p>Can you explain a problem, ask for clarification and compare alternatives?</p><a class="primary" href="travel-homework-b2.html" rel="noopener">Открыть домашнее задание ↗</a><p><a class="small-button" href="travel-b2-02.html">Урок 2 · Продолжение истории Елены →</a></p>');}
function installGapChecks(){function check(el){const v=el.value.trim(),ok=norm(v)===norm(el.dataset.gap);el.classList.toggle('correct',!!v&&ok);el.classList.toggle('incorrect',!!v&&!ok);$('#fb-'+el.id).textContent=!v?'':ok?'✓ Верно!':'Попробуйте ещё раз.';}$$('[data-gap]').forEach(el=>{el.addEventListener('blur',()=>check(el));el.addEventListener('change',()=>{state.answers[el.dataset.answer]=el.value;save();check(el);});el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();check(el);}});el.addEventListener('input',()=>{el.classList.remove('correct','incorrect');$('#fb-'+el.id).textContent='';});if(el.value.trim())check(el);});}
function installLesson(){installGapChecks();$$('[data-position]').forEach(b=>b.onclick=()=>{state.answers.position=Number(b.dataset.position);save();render();});$$('[data-feed-pick]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.feedPick),p=labPicks(),at=p.indexOf(i);if(at>=0)p.splice(at,1);else if(p.length<3)p.push(i);else{notify('Выберите не больше трёх видео. Можно снять выделение с другого.');return;}state.answers.feedPicks=p;save();const y=scrollY;render();scrollTo(0,y);});if($('#toggleExplore'))$('#toggleExplore').onclick=()=>{state.answers.explore=!state.answers.explore;save();const y=scrollY;render();scrollTo(0,y);};if($('#resetFeed'))$('#resetFeed').onclick=()=>{state.answers.feedPicks=[];state.answers.explore=false;save();render();};$('#exportBtn').hidden=true;}

function feedback(ci,qi){const id=`q${ci}-${qi}`,v=state.answers[id];if(v===undefined)return;const ok=Number(v)===CLIPS[ci].qs[qi][2];$('#fb-'+id).textContent=ok?'✓ Верно!':'Попробуйте ещё раз. Вернитесь к тексту или аудио.';$$(`[name="${id}"]`).forEach(el=>{el.closest('label').classList.toggle('correct',el.checked&&ok);el.closest('label').classList.toggle('incorrect',el.checked&&!ok);});}

let translationTimer;
let translationVersion = 0;

function cancelWordTranslation() {
  clearTimeout(translationTimer);
  translationVersion++;
  wordStatus.textContent = '';
}

function translateWordInput(event) {
  cancelWordTranslation();
  const version = translationVersion;
  const query = wordInput.value.trim();
  meaningInput.value = '';
  if (event.isComposing || !/[a-zа-яё]/i.test(query)) return;

  const normalized = norm(query);
  const russian = /[а-яё]/i.test(query);
  const saved = state.words.find(word => norm(russian ? word.ru : word.en) === normalized);
  const translation = (russian ? saved?.en : saved?.ru) || localTranslation(query) || translationCache.get(normalized);
  if (translation) {
    meaningInput.value = translation;
    return;
  }

  wordStatus.textContent = 'Переводим…';
  translationTimer = setTimeout(async () => {
    try {
      const result = await online(query);
      if (version !== translationVersion || wordInput.value.trim() !== query) return;
      translationCache.set(normalized, result);
      meaningInput.value = result;
      wordStatus.textContent = '';
    } catch {
      if (version === translationVersion) wordStatus.textContent = 'Перевод недоступен. Можно ввести его вручную.';
    }
  }, 300);
}

function shuffle(list){const a=list.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function trainingSetup(){training=null;$('#trainingBody').innerHTML='<h3>Тренировать мои слова</h3><p class="muted">Вспомните перевод, откройте ответ и отметьте, удалось ли вспомнить. Сложные слова повторим ещё раз.</p>'+(state.words.length?'<p>Слов в словаре: '+state.words.length+'</p><label class="field-label" for="trainingCount">Сколько слов?</label><select id="trainingCount"><option value="5">5 слов'+(state.words.length<5?' (доступно '+state.words.length+')':'')+'</option><option value="10">10 слов'+(state.words.length<10?' (доступно '+state.words.length+')':'')+'</option><option value="all">Все слова</option></select><label class="field-label" for="trainingDirection">Направление</label><select id="trainingDirection"><option value="en">English → Русский</option><option value="ru">Русский → English</option></select><div class="dict-actions"><button class="primary" id="startTraining">Начать тренировку</button></div>':'<p>Сначала добавьте хотя бы одно слово в словарь.</p><button class="primary" id="backToWords">Добавить слова</button>');if($('#startTraining'))$('#startTraining').onclick=()=>{const count=$('#trainingCount').value;const list=shuffle(state.words).slice(0,count==='all'?state.words.length:Number(count));training={list,queue:list.map(w=>({w,review:false})),index:0,direction:$('#trainingDirection').value,remembered:new Set(),missed:new Set(),reviewed:0};renderTraining();};if($('#backToWords'))$('#backToWords').onclick=()=>{$('#trainingDialog').close();openDict();};}
function openTraining(){stop();$('#translationPop').hidden=true;if($('#dictionary').open)$('#dictionary').close();trainingSetup();$('#trainingDialog').showModal();}
function renderTraining(){const t=training,entry=t.queue[t.index];if(!entry){const known=t.remembered.size;$('#trainingBody').innerHTML='<h3>Тренировка завершена ✓</h3><p>Слов в тренировке: <b>'+t.list.length+'</b></p><p>Вспомнил с первой попытки: <b>'+known+'</b></p><p>Потребовали повторения: <b>'+t.missed.size+'</b></p><p class="muted">Сложные слова были показаны повторно. Это самооценка, а не автоматическая проверка.</p><div class="dict-actions"><button class="primary" id="againTraining">Ещё тренировка</button><button class="small-button" id="returnDictionary">В словарь</button></div>';$('#againTraining').onclick=trainingSetup;$('#returnDictionary').onclick=()=>{$('#trainingDialog').close();openDict();};return;}const w=entry.w;$('#trainingBody').innerHTML='<p class="muted">'+(entry.review?'Повторение сложного слова':'Слово '+(t.index+1)+' из '+t.list.length)+'</p><div class="training-card"><h2>'+esc(t.direction==='en'?w.en:w.ru)+'</h2><p id="trainingAnswer" hidden>'+esc(t.direction==='en'?w.ru:w.en)+'</p><button class="primary" id="revealTraining">Показать перевод</button></div><div id="trainingGrade" class="dict-actions" hidden><button class="primary" id="rememberTraining">✓ Вспомнил</button><button class="small-button" id="repeatTraining">↻ Ещё повторить</button></div>';$('#revealTraining').onclick=()=>{$('#trainingAnswer').hidden=false;$('#revealTraining').hidden=true;$('#trainingGrade').hidden=false;};function grade(remember){if(!entry.review){if(remember)t.remembered.add(norm(w.en));else{t.missed.add(norm(w.en));t.queue.push({w,review:true});}}else if(!remember){t.queue.push({w,review:true});}t.index++;renderTraining();}$('#rememberTraining').onclick=()=>grade(true);$('#repeatTraining').onclick=()=>grade(false);}



window.addEventListener('pagehide',stop);if(!Number.isInteger(state.page)||state.page<0||state.page>=pages.length)state.page=0;if(location.hash==='#homework')location.replace('travel-homework-b2.html');render();if(location.hash==='#vocabulary')openDict();if(location.hash==='#training')openTraining();if(!storage){$('#storageNote').hidden=false;$('#storageNote').textContent='Saving unavailable. Export your work before closing.';}
</script><script>
(()=>{
const fmt=n=>Number.isFinite(n)?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'0:00';
function enhance(){const audio=document.getElementById('lessonAudio');if(!audio||audio.dataset.styled)return;audio.dataset.styled='1';audio.controls=false;audio.hidden=true;
const player=document.createElement('div');player.className='audio-player';player.innerHTML='<button type="button" class="audio-play" aria-label="Воспроизвести аудио">▶</button><div class="audio-track"><input type="range" min="0" max="100" step="0.1" value="0" aria-label="Позиция воспроизведения"><div class="audio-times"><span class="elapsed">0:00</span><span class="duration">0:00</span></div></div>';audio.after(player);
const button=player.querySelector('button'),range=player.querySelector('input');
const sync=()=>{button.textContent=audio.paused?'▶':'Ⅱ';button.setAttribute('aria-label',audio.paused?'Воспроизвести аудио':'Пауза');range.value=audio.duration?audio.currentTime/audio.duration*100:0;player.querySelector('.elapsed').textContent=fmt(audio.currentTime);if(Number.isFinite(audio.duration))player.querySelector('.duration').textContent=fmt(audio.duration);};
button.onclick=()=>{if(audio.paused)audio.play().catch(()=>{audio.hidden=false;audio.controls=true;player.hidden=true;});else audio.pause();};
range.oninput=()=>{if(Number.isFinite(audio.duration))audio.currentTime=Number(range.value)*audio.duration/100;sync();};
['play','pause','ended','timeupdate','loadedmetadata','durationchange'].forEach(e=>audio.addEventListener(e,sync));sync();}
new MutationObserver(enhance).observe(document.getElementById('content'),{childList:true});enhance();
})();
</script><script>
function speakTravelTerm(term) {
  if (!term || !('speechSynthesis' in window)) return;
  const utterance = new SpeechSynthesisUtterance(term);
  utterance.lang = /[а-яё]/i.test(term) ? 'ru-RU' : 'en-GB';
  utterance.rate = 0.88;
  speechSynthesis.cancel();
  speechSynthesis.speak(utterance);
}
$('#speakSelected').disabled = !('speechSynthesis' in window);
$('#speakSelected').onclick = () => speakTravelTerm($('#selectedWord').textContent.trim());
document.addEventListener('click', event => {
  const word = event.target.closest('[data-speak-word]')?.closest('.word, .dictrow')?.querySelector('strong');
  if (word) speakTravelTerm(word.textContent.trim());
});
</script></body></html>
