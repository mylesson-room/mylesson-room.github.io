name: Verify and publish GoStudy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gostudy-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/update-shared-assets.py
      - name: Download and verify licensed real Barcelona photos for Savva
        run: python3 scripts/fetch-sports-b2-photos.py
      - run: npm install --no-save --no-package-lock playwright@1.58.2
      - name: Test actual video button click and touch on desktop and mobile
        run: |
          GOSTUDY_CHROME="$(command -v google-chrome)"
          export GOSTUDY_CHROME
          node scripts/check-jaas-browser.cjs
      - name: Test protected B1 video on desktop and mobile
        run: |
          GOSTUDY_CHROME="$(command -v google-chrome)"
          export GOSTUDY_CHROME
          node scripts/check-b1-jaas-browser.cjs
      - name: Daria teacher vocabulary, Google selection and two-role page control
        run: |
          GOSTUDY_CHROME="$(command -v google-chrome)"
          export GOSTUDY_CHROME
          node scripts/check-ielts-collaboration-browser.cjs
      - name: Daria IELTS video signing and role isolation
        run: node scripts/check-jaas-ielts-token.cjs
      - name: Daria IELTS shared video controls on desktop and mobile
        run: |
          GOSTUDY_CHROME="$(command -v google-chrome)"
          export GOSTUDY_CHROME
          node scripts/check-jaas-ielts-browser.cjs
      - name: Test private B1 lesson chat with two roles
        run: |
          GOSTUDY_CHROME="$(command -v google-chrome)"
          export GOSTUDY_CHROME
          node scripts/check-b1-chat-browser.cjs
      - name: Savva Barcelona Race B2 methodology and Michael classroom
        run: |
          GOSTUDY_CHROME="$(command -v google-chrome)"
          export GOSTUDY_CHROME
          node scripts/check-sports-b2.cjs
      - name: Check Irina A2+ lesson quality and legacy-data safety
        run: node scripts/check-irina-a2-travel.cjs
      - name: Test Irina protected JaaS video (teacher, student, mobile)
        run: |
          GOSTUDY_CHROME="$(command -v google-chrome)"
          export GOSTUDY_CHROME
          node scripts/check-irina-jaas-browser.cjs
      - name: Anastasia Art B1 signed video tokens, same room and outsider denial
        run: node scripts/check-jaas-art-b1-token.cjs
      - name: Anastasia video UI two roles, two lessons, desktop and mobile
        run: |
          GOSTUDY_CHROME="$(command -v google-chrome)"
          export GOSTUDY_CHROME
          node scripts/check-jaas-art-b1-browser.cjs
      - name: Olga Sweden signed video tokens, same room and role isolation
        run: node scripts/check-jaas-sweden-token.cjs
      - name: Olga video UI in desktop and mobile Chromium
        run: |
          GOSTUDY_CHROME="$(command -v google-chrome)"
          export GOSTUDY_CHROME
          node scripts/check-olga-sweden02-browser.cjs
          node scripts/check-olga-sweden03-browser.cjs
      - name: Olga real two-browser contexts (synthetic network) and teacher page control
        run: |
          GOSTUDY_CHROME="$(command -v google-chrome)"
          export GOSTUDY_CHROME
          node scripts/check-olga-two-roles-live.cjs
      - name: Michael assignment and private lesson in two browser roles
        run: |
          GOSTUDY_CHROME="$(command -v google-chrome)"
          export GOSTUDY_CHROME
          node scripts/check-michael-assignment-browser.cjs
      - name: Anastasia lesson assignment, private content and shared classroom
        run: |
          GOSTUDY_CHROME="$(command -v google-chrome)"
          export GOSTUDY_CHROME
          node scripts/check-anastasia-assignment-browser.cjs
      - run: node scripts/check-template-contract.cjs
      - run: node scripts/check-positive-thinking-lesson.cjs
      - name: Check GoStudy in the runner's Chrome
        run: |
          GOSTUDY_CHROME="$(command -v google-chrome)"
          export GOSTUDY_CHROME
          node scripts/check-pages.cjs
      - name: Prepare static site
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir _site
          cp -R -- *.html assets .nojekyll _site/
          git ls-files -z | python3 -c 'import sys,shutil,pathlib; root=pathlib.Path("_site"); files=sys.stdin.buffer.read().split(b"\0"); [(root/p).parent.mkdir(parents=True,exist_ok=True) or shutil.copy2(p,root/p) for p in map(lambda x:pathlib.Path(x.decode()),filter(None,files)) if p.suffix.lower() in {".mp3",".wav",".ogg",".m4a",".webp",".jpg",".jpeg",".png",".svg",".gif",".woff",".woff2",".mp4",".vtt"} and p.parts[0]!="assets"]'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
